.attach__lede{margin:var(--row) 0 0;padding-left:1.25rem;max-width:44em;line-height:var(--row)}
.retain{margin:var(--row) 0 0;padding-left:1.25rem}
.retain .sent{margin:0;line-height:var(--row);max-width:38em}
.retain .sent+.sent{margin-top:0}
.retain label{font-family:var(--f-kai);color:var(--red-ink);font-size:.88em;letter-spacing:.05em}
.retain input,.retain select{font:inherit;color:var(--ink);background:transparent;border:0;border-bottom:1.5px solid var(--ink);border-radius:0;height:calc(var(--row) - 6px);line-height:calc(var(--row) - 8px);padding:0 .35em;margin:0 .15em;vertical-align:baseline;max-width:100%}

.retain input[type=tel]{width:8.5em}
.retain input[type=email]{width:12em}
.retain input[type=date]{width:10em}

.retain input:focus-visible,.retain select:focus-visible{outline:var(--focus-ring);outline-offset:2px}
.retain [aria-invalid="true"]{border-bottom-color:var(--red);border-bottom-width:2px}
.retain .err{display:block;margin:0;font-family:var(--f-kai);color:var(--red-ink);line-height:var(--row)}
.retain .err[hidden]{display:none}
.retain .act{margin:var(--row) 0 0;display:flex;flex-wrap:wrap;align-items:center;gap:.5rem 1.5rem;line-height:var(--row)}
.retain button{font:inherit;font-weight:500;letter-spacing:.2em;text-indent:.2em;color:var(--paper);background:var(--ink);border:1.5px solid var(--ink);padding:.15rem 1.3rem;line-height:calc(var(--row) - 8px);cursor:pointer}
.retain button:hover{background:var(--red);border-color:var(--red)}
.retain .done{font-family:var(--f-kai);color:var(--red-ink)}
.retain .done[hidden]{display:none}
.retain .fine{margin:var(--row) 0 0;font-size:.95rem;line-height:var(--row);color:var(--ink-2);max-width:46em}

/* ===== 頁尾（桌面上，不在紙上） ===== */
.colophon{max-width:1280px;margin:0 auto;padding:2.5rem 1.25rem 3rem;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:1.5rem 3rem;font-size:.95rem;line-height:1.8;color:var(--ink)}

/* ===== 404 ===== */
.lost{padding:calc(var(--row) * 1) 2.75rem calc(var(--row) * 2) var(--gut);position:relative}
.lost::before{content:"";position:absolute;left:0;right:0;top:0;bottom:0;z-index:0;pointer-events:none;background:repeating-linear-gradient(to bottom,transparent 0 calc(var(--row) - 1px),var(--line) calc(var(--row) - 1px) var(--row)),linear-gradient(var(--rule),var(--rule)) calc(var(--gut) - 1px) 0/1px 100% no-repeat}

.lost__top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1rem 2rem;align-items:start;padding-left:1.25rem}

.lost__body{padding-left:1.25rem;margin-top:calc(var(--row) * 1)}

.lost__body .items{list-style:none;padding:0;margin:0;counter-reset:k}
.lost__body .items li{position:relative;padding-left:3.1em;counter-increment:k;line-height:var(--row)}
.lost__body .items li::before{content:"（" counter(k,cjk-ideographic) "）";position:absolute;left:0;top:0;width:3.1em;letter-spacing:-.08em}
.lost__body p.lost__note{font-family:var(--f-kai);color:var(--red-ink);margin-top:var(--row)}
.lost__body p.lost__back{margin-top:var(--row);display:flex;flex-wrap:wrap;gap:.2rem 2rem}
.lost .seam-end{position:absolute;right:1.5rem;bottom:-34px;width:64px;height:64px;z-index:1;rotate:var(--rot)}

}
