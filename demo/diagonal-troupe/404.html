  html.js .m.is-on .m-bio{visibility:visible;opacity:1;scale:1;rotate:var(--tilt,0deg);transition:scale .55s var(--card) .08s,opacity .18s .08s,visibility 0s,rotate .55s var(--card)}
  html.js .m[data-side=R] .m-bio{left:calc(var(--u) * .5cqw + 14px);transform-origin:0 100%}
  html.js .m[data-side=L] .m-bio{right:calc(var(--u) * .5cqw + 14px);transform-origin:100% 100%}
  html.js .m-bio .bio-name{font-size:28px}
}

/* ===== 本季：四道燈區 ===== */
.season{position:relative;z-index:1;background-color:var(--paper);padding:120px var(--gut) 140px;clip-path:polygon(0 0,100% 0,100% 100%,0 calc(100% - 64px))}
.season-head{width:var(--wrap);margin-inline:auto;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:20px 64px;align-items:start;margin-bottom:86px}
.season-head h2{font-weight:900;font-size:clamp(40px,5.2vw,76px);line-height:1.1;rotate:-2deg;transform-origin:0 100%}
.season-head h2 small{display:block;font-family:var(--f-grot);font-size:16px;font-weight:700;letter-spacing:.02em;margin-bottom:12px;rotate:2deg;transform-origin:0 0}
.season-head p{margin:0;max-inline-size:38em}
.plays{list-style:none;margin:0 auto;padding:0;width:var(--wrap);display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:0 24px;align-items:start}
.play{position:relative;--sh:12px;padding:56px 5% 60px;isolation:isolate}
.play::before,.play::after{content:"";position:absolute;inset:-14px -10px;z-index:-1;rotate:var(--tilt);-webkit-mask:var(--sheet-mask) 0 0/100% 100% no-repeat;mask:var(--sheet-mask) 0 0/100% 100% no-repeat;transition:rotate .7s var(--lift),translate .7s var(--lift)}
.play::before{background-color:var(--ink);translate:var(--sh) var(--sh)}
.play::after{background-color:var(--sheet)}
.play:hover::after,.play:focus-within::after{rotate:calc(var(--tilt) * .35)}
.play:hover::before,.play:focus-within::before{rotate:calc(var(--tilt) * .35);translate:calc(var(--sh) + 6px) calc(var(--sh) + 8px)}
.play[data-tone=ink]{--sheet:var(--ink);color:var(--paper);--focus-ring:3px dashed var(--mustard)}
.play[data-tone=ink]::before{background-color:var(--coral)}
.play[data-tone=mustard]{--sheet:var(--mustard);color:var(--ink)}
.play[data-tone=peacock]{--sheet:var(--peacock-deep);color:var(--paper);--focus-ring:3px dashed var(--mustard)}
.play[data-tone=script]{--sheet:var(--page);color:var(--ink)}
.poster{margin:0;box-shadow:8px 8px 0 var(--ink);outline:3px solid var(--paper);outline-offset:-1px}
.poster{position:relative}
.poster svg.poster-svg{width:100%;height:auto;display:block}
.ptape{position:absolute;width:32%;height:auto;top:-2%;z-index:1;overflow:visible}
.ptape path{fill:oklch(0.95 0.03 95 / .78)}
.ptape-l{left:-11%}.ptape-r{right:-11%}
.play-title{font-weight:900;font-size:clamp(30px,3.1vw,46px);line-height:1.18;margin:2px 0 14px;letter-spacing:.02em}
.play-title .q:first-child{margin-inline-start:-.5em}
.play-tag{display:inline-block;font-family:var(--f-grot);font-size:13.5px;font-weight:700;padding:3px 9px 4px;background-color:var(--paper);color:var(--ink);line-height:1.3}
.play[data-tone=mustard] .play-tag,.play[data-tone=script] .play-tag{background-color:var(--ink);color:var(--paper)}
.play-run{font-family:var(--f-grot);font-weight:700;font-size:19px;line-height:1.4;margin:0 0 4px;font-variant-numeric:tabular-nums}
.play-run .to{margin-inline:.3em}
.play-meta{font-size:14.5px;line-height:1.7;margin:0 0 12px}
.play-meta .nw{white-space:nowrap}
.play-syn{margin:0 0 14px;font-size:16.5px}
.credits{display:flex;flex-wrap:wrap;gap:4px 16px;margin:0 0 12px;font-size:14.5px}
.credits div{display:flex;gap:6px}.credits dt{font-family:var(--f-grot);font-weight:700}.credits dd{margin:0;font-weight:700}
.credits dt::after{content:"／";font-family:var(--f-serif);margin-inline-start:4px;opacity:.9}
.price{display:flex;flex-wrap:wrap;gap:6px 18px;margin:0;padding-top:12px;border-top:2px solid currentColor;font-size:14.5px}
.price span b{font-family:var(--f-grot);font-weight:800;font-size:18px;margin-inline-start:4px}
.price-note{font-size:13.5px;margin:8px 0 0;line-height:1.6}

/* 一、《夜班》海報破框：紙板只到文字欄，海報從右上角衝出去 */
.p-night{grid-column:1/span 7;grid-row:1;padding:66px 39% 64px 6%}
.p-night .play-in{display:block}
.p-night .play-title{font-size:clamp(58px,6.2vw,96px);line-height:1;margin:10px 0 18px;rotate:-2deg;transform-origin:0 100%}
.p-night .poster{position:absolute!important;right:-17%;top:-36px;width:42%;rotate:6deg;z-index:2;box-shadow:12px 12px 0 var(--coral)}
/* 二、《搬家公司的莎士比亞》直式：劇名直排貼右緣，海報在上、資訊在下，像紙箱上的直式傳單 */
.p-movers{grid-column:9/span 4;grid-row:1/span 2;margin-top:150px;padding:40px 30px 46px 34px}
.p-movers::before,.p-movers::after{inset:-12px -2px}
.p-movers .play-in{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"poster title" "text title";gap:24px 18px;align-items:start}
.p-movers .play-title{grid-area:title;writing-mode:vertical-rl;font-size:clamp(38px,3.4vw,50px);line-height:1.1;margin:0;letter-spacing:.06em}
.p-movers .poster{grid-area:poster;rotate:-2deg}
.p-movers .play-text{grid-area:text}
/* 三、《斜坡》文字沿 28° 斜排：直排劇名順著斜槓躺下，內文左緣貼著同一條斜線（shape-outside） */
.p-slope{grid-column:1/span 8;grid-row:2;margin-top:110px;padding:52px 5% 56px 3%}
.p-slope::before,.p-slope::after{rotate:0deg;inset:0 14% 0 0;transform:skewX(calc(var(--slash) * -1))}
.p-slope:hover::after,.p-slope:focus-within::after,.p-slope:hover::before,.p-slope:focus-within::before{rotate:0deg}
.p-slope .play-in{display:block}
.p-slope .play-text{position:relative;padding-left:96px;display:flow-root}
.slant{float:left;width:191px;height:360px;shape-outside:polygon(0 0,100% 0,0 100%);shape-margin:6px}
.slant-r{float:right;width:191px;height:360px;shape-outside:polygon(100% 0,100% 100%,0 100%);shape-margin:6px}
.p-slope .play-title{position:absolute;left:119px;top:180px;translate:-50% -50%;writing-mode:vertical-rl;font-size:94px;line-height:1;margin:0;rotate:var(--slash);letter-spacing:.02em;white-space:nowrap}
.p-slope .play-title .q:first-child{margin-inline-start:0}
.p-slope .credits,.p-slope .price{display:block}.p-slope .price{border-top:0;padding-top:2px}.p-slope .credits div,.p-slope .price span{display:inline-flex;margin-inline-end:16px}
.p-slope .poster{position:absolute!important;right:0;bottom:-30px;width:178px;rotate:9deg}
/* 四、讀劇會：攤開的劇本頁，對白體 */
.p-reading{grid-column:2/span 10;grid-row:3;margin-top:110px;padding:46px 5% 50px 9%}
.p-reading .play-in{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,7fr) 132px;gap:20px 40px;align-items:start}
.holes{position:absolute;left:3.2%;top:50%;translate:0 -50%;display:grid;gap:44px}
.holes i{display:block;width:15px;height:15px;border-radius:50%;background-color:var(--paper-shadow)}
.script-head .play-title{font-size:clamp(30px,2.7vw,40px)}
.script-body{border-inline-start:0;padding-inline-start:0}
.cue{display:grid;grid-template-columns:4.4em minmax(0,1fr);gap:0 16px;margin:0 0 10px;font-size:16.5px;line-height:1.75}
.cue .who{font-weight:900;letter-spacing:.06em}
.cue .sd{color:var(--ink-2);font-size:15px;margin-inline-end:4px}
.p-reading .credits{margin-top:14px}
.p-reading .poster{rotate:4deg;margin-top:6px}

/* ===== 排練室 ===== */
.studio{position:relative;z-index:0;margin-top:-64px;padding:150px var(--gut);background-color:var(--paper-2)}
.studio::before{content:"";position:absolute;inset:0 0 auto;height:78px;background-color:var(--ink);clip-path:polygon(0 0,100% 64px,100% 78px,0 14px)}
.studio-head{width:var(--wrap);margin-inline:auto;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:20px 64px;align-items:end;margin-bottom:48px}
.studio-head h2{font-weight:900;font-size:clamp(38px,4.6vw,66px);line-height:1.12}
.studio-head h2 small{display:block;font-family:var(--f-grot);font-size:16px;font-weight:700;margin-bottom:10px}
.studio-head p{margin:0;max-width:36em}
.studio-grid{width:var(--wrap);margin-inline:auto;display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);grid-template-areas:"plan facts" "ways facts" "more more" "form form";grid-template-rows:auto 1fr auto auto;gap:40px 56px;align-items:start}
.plan{grid-area:plan;margin:0;position:relative}
.studio-facts{grid-area:facts}
.studio-ways{grid-area:ways;margin-top:-14px}
.studio-more{grid-area:more;padding-top:34px;background:repeating-linear-gradient(90deg,var(--ink) 0 22px,transparent 22px 34px) 0 0/100% 4px no-repeat}
.mini{font-weight:900;font-size:20px;margin:0 0 10px}
.ways{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0;font-size:15.5px}
.ways dt{font-weight:900}.ways dd{margin:0}
.plan-box{position:relative}
.plan-svg{width:100%;height:auto;display:block}
.plan .pl-board{stroke:var(--paper-2);stroke-width:3;fill:none}
.plan .pl-path{fill:none;stroke:var(--coral-text);stroke-width:5;stroke-dasharray:22 14}
.plan .pl-door{fill:none;stroke:var(--ink);stroke-width:4}
.pl-label{position:absolute;font-family:var(--f-grot);font-size:13px;font-weight:600;line-height:1.3;background-color:var(--paper);padding:2px 6px;white-space:nowrap}
.pl-label.on-ink{background-color:var(--ink);color:var(--paper)}
.plan figcaption{font-size:14px;margin-top:14px;line-height:1.7}
.specs{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;margin:0;font-size:15.5px}
.specs dt{font-weight:900}.specs dd{margin:0}
.rates{margin-top:30px}
.clock{position:relative;height:30px;margin-top:6px;background:linear-gradient(var(--ink),var(--ink)) 0 100%/100% 3px no-repeat,repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px calc(100% / 13)) 0 100%/calc(100% + 2px) 9px no-repeat}
.clock span{position:absolute;bottom:12px;white-space:nowrap;left:calc((var(--h) - 1) / 13 * 100%);translate:-50% 0;font-family:var(--f-grot);font-weight:700;font-size:13px;line-height:1}
.tapes{list-style:none;margin:12px 0 0;padding:0;display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:12px 0}
.stape{grid-column:1/-1;display:grid;grid-template-columns:repeat(13,minmax(0,1fr));align-items:center;gap:0;color:var(--ink)}
.stape .stape-bar{grid-column:var(--a)/var(--b);grid-row:1;display:grid;padding:9px 16px 11px 22px;line-height:1.4;clip-path:polygon(18px 0,100% 0,calc(100% - 18px) 100%,0 100%)}
.stape .stape-info{grid-row:1;grid-column:var(--b)/-1;display:flex;flex-wrap:wrap;gap:0 16px;padding-inline:16px}
.stape.t2 .stape-info{grid-column:1/var(--a);justify-content:flex-end}
.stape .stape-bar .tape-time{white-space:nowrap}
.stape.t0 .stape-bar{background-color:var(--mustard);rotate:-1.2deg}.stape.t1 .stape-bar{background-color:var(--coral);rotate:.8deg}.stape.t2 .stape-bar{background-color:var(--peacock-lite);rotate:-.7deg}
.tape-slot{font-weight:900;font-size:19px}
.tape-time{font-size:13.5px;font-weight:600}
.tape-p{font-size:14px;display:flex;gap:6px;align-items:baseline}.tape-p b{font-size:16.5px;font-weight:800}
.rate-note{font-size:14px;margin:10px 0 0}
.rules{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:1fr 1fr;gap:8px 32px}
.studio-more .rules{grid-template-columns:repeat(4,minmax(0,1fr))}
.rules li{position:relative;padding-inline-start:28px;font-size:15.5px}
.rules li::before{content:"";position:absolute;left:2px;top:.55em;width:17px;height:5px;background-color:var(--coral)}
.rules li::after{content:"";position:absolute;left:8px;top:.55em;width:5px;height:12px;background-color:var(--coral)}

.book{grid-area:form;position:relative;padding:48px 9% 50px;isolation:isolate;--focus-ring:3px dashed var(--ink);margin-top:12px}
.book::before,.book::after{content:"";position:absolute;inset:0;z-index:-1;clip-path:polygon(5.5% 0,100% 0,94.5% 100%,0 100%)}
.book::before{background-color:var(--ink);translate:12px 12px}
.book::after{background-color:var(--mustard)}
.book-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 24px;margin-bottom:18px}
.book-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0 22px;align-items:start}
.f-name,.f-phone,.f-team,.f-date{grid-column:span 2}.f-people{grid-column:span 1}.f-use{grid-column:span 3}
.f-slot,.f-note{grid-column:span 3}.f-agree{grid-column:span 4}.f-send{grid-column:span 2;justify-self:end;align-self:end}
.book h3{font-weight:900;font-size:30px;line-height:1.2;margin:0}
.book .lede{font-size:15px;margin:0;line-height:1.7}
.f{display:grid;gap:4px;margin-bottom:14px}
.f label,.f legend{font-weight:900;font-size:15.5px;padding:0}
.f .req{font-family:var(--f-grot);font-size:13px;font-weight:700;margin-inline-start:6px;background-color:var(--ink);color:var(--mustard);padding:0 5px 1px}
.f input[type=text],.f input[type=tel],.f input[type=date],.f input[type=number],.f select,.f textarea{width:100%;border:2px solid var(--ink);background-color:var(--paper);color:var(--ink);padding:9px 11px;font-size:16px;line-height:1.4;border-radius:0;font-family:var(--f-grot)}
.f textarea{min-height:76px;resize:vertical;font-family:var(--f-serif)}
.f input:focus-visible,.f select:focus-visible,.f textarea:focus-visible{outline:3px dashed var(--ink);outline-offset:3px;box-shadow:4px 4px 0 var(--coral)}
.f .hint-s{font-size:13.5px;line-height:1.5}
.slots{display:flex;flex-wrap:wrap;gap:8px}
.slots label{display:flex;align-items:center;gap:6px;font-weight:700;font-size:15px;border:2px solid var(--ink);background-color:var(--paper);padding:6px 11px 7px;cursor:pointer}
.slots label:has(input:checked){background-color:var(--ink);color:var(--paper)}
.slots input,.agree input{accent-color:var(--coral-text);width:18px;height:18px;margin:0}
.agree{display:flex;gap:10px;align-items:flex-start;font-size:15px;font-weight:700;margin:0;line-height:1.6}
.agree input{margin-top:4px;flex:none}
.err{display:block;font-size:14px;font-weight:700;line-height:1.5;min-height:0;color:var(--ink)}
.err:not(:empty){padding:3px 10px 4px 6px;background-color:var(--paper);margin-top:4px}
.err:not(:empty)::before{content:"／";color:var(--coral-text);font-weight:900;margin-inline-end:4px}
[aria-invalid=true]{box-shadow:5px 5px 0 var(--coral-text)!important}
.send{font:inherit;font-weight:900;font-size:18px;letter-spacing:.06em;color:var(--paper);background-color:var(--ink);border:0;padding:12px 30px 13px;box-shadow:6px 6px 0 var(--coral);transition:translate .35s var(--lift),box-shadow .35s var(--lift)}
.send:hover{translate:-2px -2px;box-shadow:9px 9px 0 var(--coral)}
.send:active{translate:4px 4px;box-shadow:2px 2px 0 var(--coral)}
.book-status{margin:16px 0 0;font-weight:700;font-size:15.5px;line-height:1.6}
.book-status:not(:empty){background-color:var(--paper);padding:10px 14px;box-shadow:5px 5px 0 var(--ink)}

/* ===== 頁尾 ===== */
.foot{position:relative;background-color:var(--ink);color:var(--paper);margin-top:-56px;padding:120px var(--gut) 40px;clip-path:polygon(0 56px,100% 0,100% 100%,0 100%);--focus-ring:3px dashed var(--mustard);overflow:hidden}
.foot::before{content:"";position:absolute;inset:0 0 auto;height:66px;background-color:var(--coral);clip-path:polygon(0 56px,100% 0,100% 10px,0 66px)}
.foot-in{width:var(--wrap);margin-inline:auto;display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1.3fr) minmax(0,1.1fr);gap:40px 56px;position:relative}

.foot h2 .grot{display:block;font-size:15px;font-weight:700;margin-top:6px;font-variation-settings:"wdth" 80}
.foot p,.foot dd,.foot li{font-size:15.5px;line-height:1.75}
.foot h3{font-weight:900;font-size:17px;margin:0 0 8px;color:var(--mustard)}
.foot ul{list-style:none;padding:0;margin:0}
.foot dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 14px}.foot dt{font-weight:900}.foot dd{margin:0}
.big-slash{position:absolute;right:-2%;bottom:-18%;font-size:min(46vw,640px);line-height:1;font-weight:900;color:var(--peacock-deep);pointer-events:none;user-select:none;z-index:0}
.colophon{width:var(--wrap);margin:56px auto 0;padding-top:18px;border-top:1.5px solid var(--paper);display:flex;flex-wrap:wrap;gap:6px 28px;font-size:13.5px;position:relative}

/* ===== 平板 ===== */
@media (max-width:1179px){
  .p-slope .play-text{padding-left:40px}
  .slant{width:132px;height:248px}
  .slant-r{display:none}

  .p-slope .play-title{left:63px;top:124px;font-size:56px}
  .p-slope .play-in{display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:24px;align-items:start}
  .p-slope .poster{position:relative!important;right:auto;bottom:auto;width:100%;margin:8px 0 0;rotate:-3deg}
  .hero{padding-bottom:96px}
  .hero-art--wide{clip-path:polygon(-20% -20%,120% -20%,120% 100%,26.6% 100%,0 76.4%)}

}

  .hero-title .ch{text-shadow:0 .024em 0 var(--paper),.024em 0 0 var(--paper),0 -.024em 0 var(--paper),-.024em 0 0 var(--paper),.017em .017em 0 var(--paper),-.017em .017em 0 var(--paper),.017em -.017em 0 var(--paper),-.017em -.017em 0 var(--paper),.05em .055em 0 var(--paper-shadow)}
  .ch1{left:3%;top:2%}.ch2{left:28%;top:25%}.ch3{left:48%;top:49%}.ch4{left:72%;top:72%}
  .sp1{left:16.4%;top:24.6%}.sp2{left:41.5%;top:47.6%}.sp3{left:61.5%;top:71.6%}.sp4{left:85.4%;top:94.6%}
  .spike{font-size:13px}.spike span{display:none}
  .hero-text{grid-template-columns:1fr;gap:14px}
  .tagline{font-size:27px}
  .intro{font-size:16px}
  .cast{padding-top:calc(var(--cut-h) + 36px)}
  .cast-head{grid-template-columns:1fr}
  .cast-head h2{grid-row:auto}
