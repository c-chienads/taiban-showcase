  html.js .dwg .redl.sun{stroke-dasharray:.012 .008;stroke-dashoffset:0;opacity:0;transition:opacity .7s calc(var(--d,0) * var(--tm) * 1ms)}
  html.js .is-drawn .dwg .sun,html.js .is-drawn .dwg .hid,html.js .is-drawn .dwg .f,html.js .is-drawn .dwg .x,html.js .is-drawn .dwg .hand use{opacity:1}
  html.js .is-drawn .dwg .wipe{clip-path:inset(0 0 0 0)}
}

/* ---------- 封面 A-000 ---------- */
.sheet--cover{width:calc(100vw - 20px);min-width:1180px}
.body--cover{grid-template-columns:minmax(0,500px) minmax(0,1fr);grid-template-rows:auto 1fr;column-gap:48px;align-content:start}

.idx{width:100%;font-size:14px;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink)}

.idx a:hover{text-decoration:underline}
.idx .yr{font-family:var(--f-tech);font-variation-settings:"wdth" 85;text-align:right;padding-right:0}

/* ---------- A-101 平面（大圖面） ---------- */
.body--plan{grid-template-columns:300px auto;column-gap:40px;align-items:start}
.body--plan .fig{--fh:calc(var(--th) - 120px);align-self:center}

.walk{margin:26px 0 0;font-size:14px;color:var(--ink-2);display:flex;gap:10px;align-items:center}

.fig.key svg.desk{width:100%;height:auto;max-height:var(--fh)}

/* ---------- A-301 剖面＋材料表 ---------- */
.body--section{grid-template-columns:auto 420px;column-gap:44px;align-items:center}
.body--section .fig{--fh:calc(var(--th) - 96px)}

.hex{display:inline-grid;place-items:center;min-width:34px;height:20px;font-family:var(--f-tech);font-variation-settings:"wdth" 90;font-weight:700;font-size:12px;color:var(--line);clip-path:polygon(18% 0,82% 0,100% 50%,82% 100%,18% 100%,0 50%);background:var(--paper-3)}

@media (hover:none){.spec-hint{display:none}}
.body--section:has(tr[data-k="W1"]:hover) .dwg [data-k="W1"],
.body--section:has(tr[data-k="R1"]:hover) .dwg [data-k="R1"],
.body--section:has(tr[data-k="F1"]:hover) .dwg [data-k="F1"],

/* ---------- N-001 一般說明（三段文字） ---------- */
.body--notes{grid-template-columns:minmax(0,500px) 330px;column-gap:48px;align-items:start}

/* ---------- A-201 立面 ---------- */

.cta{margin:28px 0 0;font-size:17px;font-weight:600}

/* ---------- 圖號比例尺 ---------- */
.ruler{height:var(--ruler-h);display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:20px;padding:0 28px;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);position:relative;background:var(--paper)}

.ruler.on .ru-seg{position:absolute;left:calc(var(--x) * 100%);width:calc(var(--w) * 100%);top:0}
.ru-win{display:none}
.ruler.on .ru-win{display:block;position:absolute;top:1px;height:22px;border:2px solid var(--red);border-top-width:3px;pointer-events:none;
  left:calc(var(--x,0) * 100%);width:calc(var(--w,.2) * 100%)}

/* ---------- 事務所（縱向收尾）：B-001 平面圖＋引出註記＋簽名欄 ---------- */
.office,.contact{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:28px;padding:96px 56px 80px;max-width:1440px;margin:0 auto}

.off-fig{--tm:.55;grid-column:1/13;margin-top:40px;border:2px solid var(--ink);border-bottom:0;padding:18px 18px 10px;box-shadow:inset 0 0 0 4px var(--paper),inset 0 0 0 4.8px var(--ink)}

/* ---------- 委託：表單做成圖籤格線 ---------- */
