.lg{position:relative;flex:none;display:block}

/* ---------- 前言 ---------- */
.pre{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:clamp(.75rem,2vw,2rem);padding:clamp(4rem,8vw,7.5rem) var(--pad) 0;background:var(--white)}
.v-h{grid-column:1 / 3;grid-row:1 / span 3;align-self:start;position:sticky;top:1.5rem;writing-mode:vertical-rl;font-size:clamp(3.2rem,7.4vw,7rem);line-height:1;letter-spacing:.1em}
.pre-lead{grid-column:3 / 12;font-size:clamp(1.45rem,2.5vw,2.3rem);line-height:1.62;font-weight:500;text-wrap:pretty}

.pre-body p + p{margin-top:1.1em}
.pre-cr{grid-column:6 / 12;margin-top:2rem;padding-top:.8rem;border-top:2px solid var(--ink);font-size:.9rem}

/* ---------- 五個時刻 ---------- */
.steps{position:relative;z-index:1;overflow-x:clip;grid-column:1 / -1;margin:clamp(4rem,8vw,7rem) calc(-1 * var(--pad)) 0;background:var(--void);color:var(--white);padding:clamp(4rem,7vw,6.5rem) var(--pad) clamp(2.2rem,3.4vw,3rem);display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-template-rows:auto auto 1fr;column-gap:clamp(.75rem,2vw,2rem)}
.st-h{grid-column:1 / 8;font-size:clamp(1.9rem,3.6vw,3.3rem);line-height:1.2;max-width:12em}
.st-p{grid-column:1 / 8;margin-top:1.2rem;max-width:32em;color:var(--g1);font-size:1.06rem;line-height:1.85}
.st-row{display:contents}
.st-small{grid-column:1 / 8;grid-row:3;display:flex;align-items:flex-end;gap:clamp(1rem,2.4vw,2.4rem);margin-top:3rem}
.st{margin:0;flex:0 0 auto;position:relative;isolation:isolate;--lp:26px}
/* 黑底上的五個畫框：同樣各有一盞畫燈，光錐在黑色上用螢幕混合的琥珀色 */
.st::before{content:"";position:absolute;left:20%;right:20%;top:calc(-1 * var(--lp) - 6px);height:6px;background:linear-gradient(var(--g2) 55%,var(--lamp-core) 55%)}
.st::after{content:"";position:absolute;z-index:-1;left:-12%;right:-12%;top:calc(-1 * var(--lp));height:calc(var(--lp) + 30%);pointer-events:none;mix-blend-mode:screen;clip-path:polygon(32% 0,68% 0,100% 100%,0 100%);background:linear-gradient(oklch(0.7 0.115 76 / .95),oklch(0.7 0.115 76 / .1))}
.st4{--lp:46px}
.st4::before{height:8px;top:calc(-1 * var(--lp) - 8px)}
.st0{width:9%}.st1{width:15%}.st2{width:24%}.st3{width:38%}
.st4{grid-column:8 / 13;grid-row:1 / span 3;align-self:end}
.st svg{display:block;width:100%;height:auto}
.st figcaption{display:flex;align-items:flex-start;gap:.45rem;margin-top:.8rem}
.st-n{font-weight:300;font-size:clamp(1.3rem,2.6vw,2.4rem);line-height:1}
.st4 .st-n{font-size:clamp(2.6rem,6vw,5.6rem)}
.st-c{writing-mode:vertical-rl;font-size:1.05rem;line-height:1.15;color:var(--g1);white-space:nowrap;letter-spacing:.06em}
.st4 .st-c{font-size:1.3rem;color:var(--white)}

/* ---------- 活動：日期軸 ---------- */
.prog{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));background:var(--g2);padding:clamp(3rem,4.6vw,4.2rem) var(--pad) clamp(3rem,5vw,4.5rem)}
.pg-top{grid-column:1 / -1;display:flex;flex-wrap:wrap;align-items:flex-end;gap:1rem 4rem}
.prog h2{font-size:clamp(1.9rem,3.6vw,3.3rem);line-height:1.2}
.pg-p{max-width:30em;line-height:1.85}
.tl{grid-column:1 / -1;position:relative;height:600px;margin:2.5rem 0 0}
.ax{position:absolute;left:0;right:0;top:50%}
.ax-l{position:absolute;left:0;right:0;top:-1px;height:3px;background:var(--ink)}
.ax i{position:absolute;left:calc(var(--p) * 1%);top:-9px;width:2px;height:18px;background:var(--ink)}
.ax-m{position:absolute;left:calc(var(--p) * 1%);top:14px;font-size:.9rem;font-weight:600;padding-left:.35rem;border-left:2px solid var(--ink);line-height:1}

.evs{position:absolute;inset:0}
.ev{position:absolute;left:calc(var(--p) * 1%);width:min(19.5rem,calc(24.7% - 6px));padding-left:.9rem;border-left:2px solid var(--ink)}

.ev.dn{top:calc(50% + 2px);padding-top:2.6rem}
.ev4{transform:translateX(-100%);border-left:0;border-right:2px solid var(--ink);padding-left:0;padding-right:.9rem;text-align:right}
.ev-d{display:flex;align-items:center;gap:.45rem;flex-wrap:wrap}

.ev-t{font-size:.85rem}
.ev h3{font-size:1.08rem;line-height:1.45;margin-top:.45rem}
.ev-p{font-size:.86rem;line-height:1.7;margin-top:.3rem}
.ev-r{display:inline-block;margin-top:.45rem;font-size:.78rem;padding:.05rem .45rem;border:1px solid var(--ink)}
.wk-ev{display:flex;flex-wrap:wrap;gap:.3rem 1rem;align-items:baseline;position:absolute;left:0;right:0;bottom:0;padding-top:.8rem;border-top:2px solid var(--ink);font-size:.9rem}

/* ---------- 參觀 ---------- */
.visit{background:var(--white);padding:clamp(4rem,7vw,6.5rem) var(--pad);display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:clamp(.75rem,2vw,2rem)}
.visit h2{grid-column:1 / -1;font-size:clamp(1.9rem,3.6vw,3.3rem);line-height:1.2}
.hg{grid-column:1 / -1;display:grid;gap:5px;margin-top:2.4rem}
.hr{display:grid;grid-template-columns:4.2rem 1fr;align-items:center}
.hr-d{font-size:.95rem;font-weight:700;writing-mode:vertical-rl;justify-self:start;line-height:1}

.hr-c i{background:var(--g1)}
.hr-c i.on{background:var(--ink)}
.hr.off .hr-c i{background:var(--white);outline:1px solid var(--g1);outline-offset:-1px}
.hr-x{position:absolute;inset:0;display:grid;place-items:center;font-size:.92rem;color:var(--g4)}
.hr-s .hr-c{height:1.6rem}
.hr-s b{position:absolute;left:calc(var(--h) / 24 * 100%);bottom:0;font-size:.85rem;font-weight:500;transform:translateX(-50%)}
.hr-s b:first-child{transform:none}.hr-s b:last-child{transform:translateX(-100%)}
.hg-n{grid-column:1 / -1;margin-top:1rem;font-size:.9rem;color:var(--g4)}
.vs-a{grid-column:1 / 8;grid-row:4;margin-top:4rem}
.vs-free{font-size:clamp(1.5rem,2.6vw,2.3rem);font-weight:900;line-height:1.35}
.vs-a address{font-style:normal;display:flex;flex-direction:column;margin-top:1.6rem}
.vs-ad{font-size:clamp(1.15rem,1.7vw,1.5rem);font-weight:700;line-height:1.5}
.vs-an{font-size:.9rem;color:var(--g4);margin-top:.2rem}
.vs-tel{font-size:clamp(2rem,4.2vw,3.8rem);font-weight:300;line-height:1.1;margin-top:1.4rem;text-decoration:none;width:max-content}
.vs-r{grid-column:8 / -1;grid-row:4 / span 2;margin-top:4rem;display:flex;flex-direction:column;gap:1.4rem}
.vs-r{counter-reset:rl}
.vs-r dt{font-weight:900;font-size:1.02rem;display:flex;align-items:center;gap:.6rem}
/* 守則的編號牌：和展籤上的作品編號牌同一種小黑牌 */
.vs-r dt::before{counter-increment:rl;content:counter(rl);display:grid;place-items:center;width:1.55rem;height:1.55rem;background:var(--ink);color:var(--white);font-family:var(--grot);font-size:.8rem;font-weight:600;flex:none}
.vs-r dd{margin:.25rem 0 0 2.15rem;font-size:.92rem;line-height:1.75}
.vs-not{position:relative;isolation:isolate;grid-column:1 / 7;grid-row:5;align-self:end;margin-top:4.6rem;padding:1.1rem 1.5rem;color:var(--white);font-size:1rem;
  background:radial-gradient(circle at 12px 12px,var(--g4) 0 2.4px,transparent 3px),radial-gradient(circle at calc(100% - 12px) 12px,var(--g4) 0 2.4px,transparent 3px),radial-gradient(circle at 12px calc(100% - 12px),var(--g4) 0 2.4px,transparent 3px),radial-gradient(circle at calc(100% - 12px) calc(100% - 12px),var(--g4) 0 2.4px,transparent 3px),var(--ink)}
/* 牆上的說明牌：上方一盞畫燈，光錐落在白牆上（和畫布裡的畫燈同一種做法） */
.vs-not::before{content:"";position:absolute;left:30%;right:30%;top:-50px;height:7px;background:linear-gradient(var(--ink) 55%,var(--lamp-core) 55%)}
.vs-not::after{content:"";position:absolute;z-index:-1;left:4%;right:4%;top:-43px;height:43px;pointer-events:none;clip-path:polygon(32% 0,68% 0,100% 100%,0 100%);background:linear-gradient(oklch(0.95 0.1 90),oklch(0.95 0.1 90 / .15))}

/* ---------- 過往展覽 ---------- */
.arc{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));background:var(--g1);color:var(--ink);padding:clamp(4rem,7vw,6.5rem) var(--pad)}
.ar-top{grid-column:1 / -1;display:flex;flex-wrap:wrap;align-items:flex-end;gap:1rem 4rem;margin-bottom:2.6rem}

.ar-p{max-width:32em;line-height:1.85;color:var(--g5)}
.ar-m{grid-column:1 / -1;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));margin-left:5rem;font-size:.82rem;color:var(--g5);padding-bottom:.4rem}
.ay{grid-column:1 / -1;display:grid;grid-template-columns:5rem 1fr;align-items:center;border-top:1px solid var(--ink)}
.ay-y{font-size:1.2rem;font-weight:300;writing-mode:vertical-rl;justify-self:start;line-height:1}

.ab{position:absolute;left:calc(var(--a) * 1%);width:calc((var(--b) - var(--a)) * 1%);top:.55rem;bottom:.55rem;background:var(--g4);color:var(--white);padding:.3rem .55rem;overflow:hidden;display:flex;flex-direction:column;justify-content:center}
.ab-t{font-size:.86rem;font-weight:700;line-height:1.35;white-space:nowrap}
.ab-d{font-size:.74rem;color:var(--g1)}
.ab.cont .ab-t,.ab.cont .ab-d{display:none}
.ab.cont{background:var(--g3)}
.ab.cur{background:var(--ink);color:var(--white);border-top:4px solid var(--lamp-core)}
.ab.cur .ab-d{color:var(--g2)}
.ab-now{position:absolute;right:.5rem;top:.3rem;font-size:.74rem;font-weight:700}

/* ---------- 頁尾 ---------- */
.foot{background:var(--g2);color:var(--ink);padding:3.2rem var(--pad) 3.6rem;display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr);gap:1.2rem 4rem;align-items:start}

/* ---------- 404 ---------- */
.e404{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-height:calc(100svh - 60px - 8rem);background:var(--void);color:var(--white)}

.e404 .here::after{top:8.5px;left:0;height:2px;width:19px}
.e4-lbl{position:absolute;left:18%;top:calc(66% + 14px);font-size:.85rem;color:var(--ink);font-weight:500}

/* ---------- 活動時間軸：窄於 1000px 改為縱向清單 ----------
   橫向日期軸上的活動卡是依日期百分比絕對定位的；軸寬不足時，右側的卡會推出視窗（768px 溢出 37px），
   同排的兩張卡也會疊在一起（見 .ev 的寬度算式：兩張同排的卡各占軸寬 24.7%）。軸寬約 900px（視窗約 1000px）以下改縱向。 */
@media (max-width:1000px){
  .tl{height:auto;margin-top:2rem;padding-left:1.6rem;border-left:3px solid var(--ink)}

  .ev::before{content:"";position:absolute;left:calc(-1.6rem - 9px);top:.55rem;width:15px;height:15px;background:var(--ink)}
  .wk-ev{position:static;margin-top:2rem}
}
