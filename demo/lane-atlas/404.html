.leg:last-child{border-bottom:1px solid var(--ink)}
.leg__no{grid-row:1/span 4;width:2.4rem;height:2.4rem;border-radius:50%;display:grid;place-items:center;border:2px solid var(--ink);font-family:var(--f-mono);font-weight:700;font-size:1.05rem;background:var(--bus);color:var(--ink);margin-top:.15rem}
.leg h3{font-size:1.42rem;line-height:1.3;display:flex;flex-wrap:wrap;align-items:baseline;gap:.2rem .7rem}
.leg h3 small{font-size:.86rem;color:var(--ink-2)}
.leg__meta{font-family:var(--f-mono);font-size:.8rem;color:var(--ink-2);font-variant-numeric:tabular-nums;display:flex;flex-wrap:wrap;gap:.1rem .9rem}
.leg__meta a{color:var(--ink);font-weight:700}
.leg__note{max-width:34em;margin-top:.35rem;line-height:1.85}
.leg__order{margin-top:.4rem;font-size:.95rem}
.leg__order b{font-weight:400;display:inline-block;font-size:.78rem;border:1px solid var(--ink);padding:0 .35em;margin-right:.5em;vertical-align:.12em;line-height:1.5}
@media (min-width:1000px){
  .leg{grid-template-columns:3.1rem minmax(0,34em) minmax(13rem,1fr)}
  .leg__no{grid-row:1/span 3}
  .leg h3,.leg__meta,.leg__note{grid-column:2}
  .leg__order{grid-column:3;grid-row:1/span 3;align-self:start;margin-top:.35rem;padding-left:1.2rem;border-left:1px dashed var(--ink-2);font-size:1.02rem;line-height:1.7}
  .leg__order b{display:table;margin:0 0 .4rem}
}

/* ===== 巷弄故事 ===== */
.lanes{max-width:1600px;margin-inline:auto;padding:5rem var(--gut) 3rem}
.legend__mini{margin:0 0 1.6rem}
.mini{display:block;width:100%;height:auto;max-height:46vh;border:1px solid var(--ink);background:var(--paper)}
.mini-st{--on:0}
.mini-st circle{fill:var(--bus);stroke:var(--ink);stroke-width:calc(var(--sw) * (1 + var(--on)))}
.mini-st text{font-family:var(--f-mono);font-weight:700;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
main[data-leg] .mini-st circle{fill:color-mix(in oklch,var(--bus) calc(25% + var(--on) * 75%),var(--paper))}
.mini-lab{display:none}
.mini-lab rect{fill:var(--paper);stroke:var(--ink);stroke-width:var(--sw)}
.mini-lab text{fill:var(--ink);dominant-baseline:central}
.legend__mini .figcap{margin-top:.5rem}
.rail{--on:0}
.rail__cap{font-family:var(--f-mono);font-size:.8rem;color:var(--ink-2);margin-bottom:.8rem}
.rail ol{list-style:none;margin:0;padding:0;position:relative}
.rail ol::before{content:"";position:absolute;background:var(--ink)}
.rail li{--on:0;position:absolute}
.rail a{display:flex;align-items:center;gap:.55rem;text-decoration:none;color:var(--ink-2);font-size:.92rem;white-space:nowrap}
.rail i{font-style:normal;flex:none;width:1.55rem;height:1.55rem;border-radius:50%;display:grid;place-items:center;border:2px solid var(--ink);font-family:var(--f-mono);font-weight:700;font-size:.78rem;color:var(--ink);background:color-mix(in oklch,var(--bus) calc(30% + var(--on) * 70%),var(--paper));scale:calc(1 + var(--on) * .3)}
.rail li:is(.is-story) a{color:var(--ink)}
.rail--lanes li:not(.is-story) a{font-size:.84rem}
.rail--lanes li:not(.is-story) i{width:1.15rem;height:1.15rem;font-size:.66rem;border-width:1.5px}
.rail a span{padding:.05rem .4rem;border:1px solid transparent}
.rail li a span{background:color-mix(in oklch,var(--bus) calc(var(--on) * 30%),var(--paper))}
.rail li a{color:color-mix(in oklch,var(--ink) calc(var(--on) * 100%),var(--ink-2))}
.rail li a span{border-color:color-mix(in oklch,var(--ink) calc(var(--on) * 100%),transparent)}
.lanes__list{display:grid;grid-template-columns:11.5rem minmax(0,1fr);gap:0 clamp(2rem,4vw,3.5rem)}
.lanes__list>.story{grid-column:2}
.rail--lanes{grid-column:1;grid-row:1/span 3;position:sticky;top:2rem;align-self:start;height:min(70vh,36rem);padding-top:2.4rem}
.rail--lanes ol{height:calc(100% - 3rem);margin-left:.78rem}
.rail--lanes ol::before{left:0;top:0;bottom:0;width:3px;translate:-50% 0;background:var(--bus);box-shadow:0 0 0 1.5px var(--ink)}
.rail--lanes li{left:0;top:calc(var(--p) * 100%);translate:-.78rem -50%}
.rail--leg{display:none}
.lanes__head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:1rem 3rem;align-items:end;margin-bottom:clamp(2rem,5vw,3.5rem)}
.lanes__head p{max-width:32em;color:var(--ink-2)}
.story{border-top:1px solid var(--ink);padding:2.4rem 0 3.6rem}
.plate{display:inline-grid;grid-template-columns:auto auto;align-items:center;gap:0 .9rem;background:var(--ink);color:var(--paper);padding:.45rem .9rem .5rem 1rem;border-radius:4px;box-shadow:inset 0 0 0 2px var(--ink),inset 0 0 0 3.5px var(--paper)}
.plate h3{font-size:clamp(1.55rem,2.6vw,2.05rem);letter-spacing:.14em;line-height:1.25}
.plate small{font-family:var(--f-mono);font-size:.74rem;opacity:.95;writing-mode:vertical-rl;text-orientation:upright;letter-spacing:-.05em;line-height:1;max-height:5.4em}
.plate__sub{display:block;font-size:.82rem;line-height:1.4}
.story__kicker{font-size:1.35rem;margin:.9rem 0 1rem;line-height:1.5}
.story p+p{margin-top:.9em}
.story__text{max-width:36em}
.story--lane .inset{display:block;width:100%;height:auto;margin:1.4rem 0 1.4rem}
.story--lane .story__text{columns:2 18em;column-gap:3rem;max-width:62em;margin-top:1.6rem}
.story--lane .story__text p{break-inside:avoid}
.story--canal{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,44rem);gap:1rem 3rem;align-items:start}
.story--canal .story__body{display:flow-root}
.story--canal .story__text{max-width:none}
.story--canal .story__text p{max-inline-size:38em}
.lens{float:left;width:min(300px,58vw);margin:0 1.4rem .4rem 0;shape-outside:circle(50%);shape-margin:.9rem}
.lens svg{display:block;width:100%;height:auto}
.temple{display:grid;grid-template-columns:minmax(0,29rem) minmax(0,1fr);gap:2rem clamp(2rem,5vw,4.5rem);align-items:start}
.temple .story__text{max-width:none;margin-top:.4rem}
.temple .story__text p{max-inline-size:38em}
.plaza{margin:0}
.plaza .figcap{margin-top:.7rem}
.plaza__live{display:none}
.pz--live{border:1px solid var(--ink)}
.plaza__static{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.8rem}
.pz-cap{font-size:.9rem;border-top:1px solid var(--ink);padding-top:.3rem;margin-top:.35rem}
.pz-cap b{font-family:var(--f-mono);font-weight:700;margin-right:.45em}
html.js .plaza__live{display:block}
html.js .plaza__static{display:none}
.pz-l{opacity:0;transition:opacity .32s}
.temple[data-t="0"] .pz-l0,.temple[data-t="1"] .pz-l1,.temple[data-t="2"] .pz-l2{opacity:1}
.plaza__ctl{display:none;margin:1.1rem 0 .4rem}
html.js .plaza__ctl{display:block}
.plaza__ctl label{display:block;font-size:.95rem;margin-bottom:.15rem}
.temple input[type=range]{-webkit-appearance:none;appearance:none;display:block;width:100%;height:30px;margin:0;background:transparent;cursor:pointer}
.temple input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--ink)}
.temple input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-12px;border-radius:50%;background:var(--bus);border:2px solid var(--ink);box-shadow:0 0 0 4px var(--paper)}
.temple input[type=range]::-moz-range-track{height:2px;background:var(--ink)}
.temple input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--bus);border:2px solid var(--ink)}
.plaza__ticks{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:.82rem;margin-top:.05rem}
.plaza__ticks span{cursor:pointer;color:var(--ink-2)}
.temple[data-t="0"] [data-to="0"],.temple[data-t="1"] [data-to="1"],.temple[data-t="2"] [data-to="2"]{color:var(--ink)}
.plaza__states{list-style:none;padding:0;margin:.6rem 0 1rem;display:grid;gap:.15rem}
.plaza__states li{display:grid;grid-template-columns:3.8rem 3.4rem 1fr;gap:0 .5rem;align-items:baseline;padding:.45rem .5rem;border-top:1px dotted color-mix(in oklch,var(--ink) 40%,transparent);color:var(--ink-2)}
.plaza__states li:last-child{border-bottom:1px dotted color-mix(in oklch,var(--ink) 40%,transparent)}
.plaza__states b{font-family:var(--f-mono);font-weight:700}
html.js .plaza__states li{cursor:pointer}
html.js .temple[data-t="0"] li[data-to="0"],html.js .temple[data-t="1"] li[data-to="1"],html.js .temple[data-t="2"] li[data-to="2"]{color:var(--ink);background:color-mix(in oklch,var(--bus) 14%,var(--paper))}
.pz-shade{fill:color-mix(in oklch,var(--ink) 15%,transparent)}
.pz-dusk{fill:color-mix(in oklch,var(--ink) 11%,transparent)}
.pz-wire{fill:none;stroke:var(--ink-2);stroke-width:.8}
.pz-bulb{fill:oklch(0.88 0.12 88);stroke:var(--bus-ink);stroke-width:.7}
.figcap{font-size:.84rem;color:var(--ink-2);display:flex;gap:.6rem;align-items:center}
.figcap::before{content:"";width:1.6rem;border-top:1px solid currentColor}
.inset .in-ring{fill:none;stroke:var(--ink);stroke-width:2}
.inset .in-ring2{fill:none;stroke:var(--ink);stroke-width:.8}
.inset .in-north{fill:var(--ink)}
.inset .in-n{font-size:13px;fill:var(--ink);text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:var(--paper);stroke-width:4px}
.inset .in-frame{fill:none;stroke:var(--ink);stroke-width:1.5}
.pz{display:block;width:100%;height:auto;background:var(--paper)}
.pz-ground{fill:var(--block);stroke:var(--line);stroke-width:.8}
.pz-stip{fill:none;stroke:var(--ink-2);stroke-width:1.3;stroke-linecap:round;opacity:.6}
.pz-bld{fill:var(--block-2);stroke:var(--ink-2)}
.pz-tree{fill:color-mix(in oklch,var(--park) 55%,var(--park-ink));stroke:var(--park-ink)}
.pz-trunk{fill:var(--park-ink)}
.pz-burner{fill:var(--ink-2)}
.pz-car{fill:var(--paper);stroke:var(--ink);stroke-width:1.2}
.pz-car-w{stroke:var(--ink);stroke-width:1}
.pz-table{fill:var(--paper);stroke:var(--ink);stroke-width:1.2}
.pz-stool{fill:var(--ink-2)}
.pz-head{fill:var(--ink)}
.pz-cart{fill:var(--bus);stroke:var(--ink)}
.pz-umb{fill:none;stroke:var(--ink);stroke-dasharray:3 2}

/* ===== 營業時間 ===== */
.hours{max-width:1600px;margin-inline:auto;padding:3.4rem var(--gut) 4.4rem;border-top:1px solid var(--ink)}
.hours__head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:1rem 3rem;align-items:end;margin-bottom:1.6rem}
.hours__head p{max-width:30em;color:var(--ink-2)}
.marey{margin-top:.6rem}
.marey__head{position:relative;height:3.6rem;margin-left:4.2rem}
.mh{position:absolute;bottom:.5rem;left:calc(var(--x) * 1%);translate:-50% 0;display:flex;flex-direction:column;align-items:center;gap:.15rem;font-size:.98rem;line-height:1.2;white-space:nowrap}
.mh i{font-style:normal;width:1.7rem;height:1.7rem;border-radius:50%;border:2px solid var(--ink);background:var(--bus);display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:.85rem}
.marey__plot{position:relative;height:34rem;margin:0 0 2.6rem 4.2rem;border-left:1px solid var(--ink);border-bottom:1px solid var(--ink)}
.mg{position:absolute;left:0;right:0;top:calc(var(--y) * 1%);border-top:1px dotted color-mix(in oklch,var(--ink) 28%,transparent)}
.mg--m{border-top-style:solid;border-top-color:color-mix(in oklch,var(--ink) 34%,transparent)}
.mg b{position:absolute;right:calc(100% + .7rem);top:-.72em;white-space:nowrap;font-family:var(--f-mono);font-weight:400;font-size:.8rem;color:var(--ink-2)}
.mband{position:absolute;left:0;right:0;top:calc(var(--y0) * 1%);height:calc((var(--y1) - var(--y0)) * 1%);background:color-mix(in oklch,var(--bus) 14%,var(--paper))}
.mband b{position:absolute;left:.55rem;top:.2rem;font-weight:400;font-size:.88rem}
.mbar{position:absolute;left:calc(var(--x) * 1%);top:calc(var(--y0) * 1%);height:calc((var(--y1) - var(--y0)) * 1%);width:10px;margin-left:-5px;background:var(--ink)}
.mlab{position:absolute;left:calc(var(--x) * 1%);top:calc(var(--y) * 1%);margin:-.1rem 0 0 12px;font-family:var(--f-mono);font-size:.8rem;line-height:1.3;color:var(--ink-2);white-space:nowrap}
.mlab--l{translate:calc(-100% - 24px) 0}
.moff{position:absolute;left:calc(var(--x) * 1%);top:calc(100% + .45rem);translate:-50% 0;font-size:.86rem;white-space:nowrap;color:var(--ink-2)}
.marey__walk{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.marey__walk polyline{fill:none;stroke:var(--bus);stroke-width:4;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.mdot{position:absolute;left:calc(var(--x) * 1%);top:calc(var(--y) * 1%);width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--bus);border:2px solid var(--ink)}
.mwait{position:absolute;left:calc(var(--x) * 1%);top:calc(var(--y0) * 1%);height:calc((var(--y1) - var(--y0)) * 1%);border-left:3px dotted var(--bus-ink);margin-left:-1.5px}
.mwait b{position:absolute;right:.55rem;top:calc(100% + .45rem);font-weight:400;font-size:.82rem;white-space:nowrap;background:var(--paper);padding:0 .25em;border:1px dotted var(--bus-ink)}
.mtag{position:absolute;left:calc(var(--x) * 1%);top:calc(var(--y) * 1%);translate:14px calc(-100% - 10px);font-size:.86rem;white-space:nowrap;background:var(--paper);border:1px solid var(--ink);padding:.05rem .45rem}
.marey__note{font-size:.9rem;color:var(--ink-2);max-width:38em}
@media (max-width:900px){.marey{display:none}}
.tt{width:100%;font-size:.95rem}
/* 桌機（≥901px）由 Marey 圖負責看，表格只留給讀屏：視覺隱藏必須排在 .tt{width:100%} 之後。先前排在前面，width:1px 被同權重的 width:100% 蓋掉，絕對定位的表格以視窗（初始包含區塊）寬度的 100% 算寬，右緣超出視窗，頁面因此多出一段可橫向捲動的區域 */
@media (min-width:901px){.tt{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}}
.tt th,.tt td{padding:.55rem .6rem .55rem 0;text-align:left;vertical-align:middle;font-weight:400;border-bottom:1px solid color-mix(in oklch,var(--ink) 40%,transparent)}
.tt thead th{font-size:.8rem;color:var(--ink-2);border-bottom:1px solid var(--ink);vertical-align:bottom}
.tt__no{width:2.4rem;font-family:var(--f-mono);font-weight:700}
.tt__name{width:11rem;font-size:1.05rem}
.tt__off{width:5.5rem;white-space:nowrap}
.tt__span{font-family:var(--f-mono);font-size:.8rem;color:var(--ink-2);display:block;margin-top:.15rem}
.track{position:relative;height:16px;background:linear-gradient(90deg,transparent calc(3.5 / 16 * 100%),color-mix(in oklch,var(--bus) 16%,transparent) calc(3.5 / 16 * 100%) calc(5 / 16 * 100%),transparent calc(5 / 16 * 100%) calc(9 / 16 * 100%),color-mix(in oklch,var(--bus) 16%,transparent) calc(9 / 16 * 100%) calc(12.5 / 16 * 100%),transparent calc(12.5 / 16 * 100%)),repeating-linear-gradient(90deg,color-mix(in oklch,var(--ink) 30%,transparent) 0 1px,transparent 1px calc(100% / 16 * 3))}
.bar{position:absolute;top:3px;bottom:3px;left:calc((var(--o) - 6) / 16 * 100%);width:calc((var(--c) - var(--o)) / 16 * 100%);background:var(--ink)}
.axis{position:relative;height:1.2em;font-family:var(--f-mono);font-size:.74rem}
.axis span{position:absolute;transform:translateX(-50%);left:calc((var(--h) - 6) / 16 * 100%)}
.axis span:first-child{transform:none}
.axis span:last-child{transform:translateX(-100%)}
.sess{display:flex;flex-wrap:wrap;gap:.6rem 2.4rem;margin:1.3rem 0 0;font-size:.95rem}
.sess p{display:flex;gap:.6rem;align-items:baseline}
.sess b{font-weight:400;font-size:.86rem;border:1px solid var(--ink);padding:0 .45em;line-height:1.6;white-space:nowrap;background:color-mix(in oklch,var(--bus) 16%,var(--paper))}
.howto{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,4fr);gap:2rem clamp(2rem,6vw,6rem);margin-top:clamp(2.4rem,5vw,3.6rem)}
.howto h3{font-size:1.3rem;margin-bottom:.6rem}
.tips{list-style:none;padding:0;margin:0}
.tips li{position:relative;padding:.35rem 0 .35rem 1.6rem;border-bottom:1px dotted color-mix(in oklch,var(--ink) 45%,transparent)}
.tips li::before{content:"";position:absolute;left:.15rem;top:1.05em;width:.7rem;height:.38rem;border-top:2px dotted var(--bus-ink);border-bottom:2px dotted var(--bus-ink)}

/* ===== 版權頁（footer） ===== */
.colophon{background:var(--ink);color:var(--paper);padding:3rem var(--gut) 2rem}
.colophon__in{max-width:1600px;margin-inline:auto;display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:1.6rem 4rem}
.colophon dl{display:grid;grid-template-columns:auto 1fr;gap:.3rem 1.4rem;margin:0}
.colophon dt{color:var(--dim)}
.colophon dd{margin:0}
.colophon p{font-size:.92rem;max-width:34em}
.colophon p+p{margin-top:.6rem}
.colophon a{color:var(--paper)}
.colophon a:hover{color:oklch(0.86 0.1 62)}
.colophon__sheet{grid-column:1/-1;display:flex;flex-wrap:wrap;justify-content:space-between;gap:.6rem 2rem;border-top:1px solid color-mix(in oklch,var(--paper) 40%,transparent);padding-top:1rem;margin-top:.6rem;font-family:var(--f-mono);font-size:.78rem}
.colophon{--focus-ring:3px dashed oklch(0.82 0.12 62)}

/* ===== 404 ===== */
.lost{max-width:1100px;min-height:calc(100svh - 12rem);margin-inline:auto;padding:4rem var(--gut);display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:2rem clamp(2rem,6vw,5rem);align-items:center}
.lost h1{font-size:clamp(2.2rem,5vw,3.6rem);line-height:1.15;letter-spacing:.03em;margin-bottom:1rem}
.lost p{max-width:28em}
.lost p+p{margin-top:.7rem}
.lost__ref{font-family:var(--f-mono);font-size:.8rem;color:var(--ink-2);margin-bottom:.8rem}
.lost__back{display:inline-block;margin-top:1.4rem;font-size:1.1rem}
.deadend{width:100%;height:auto}
.de-wall{stroke:var(--ink);stroke-width:4}
.de-plate{fill:var(--ink)}
.de-plate-t{font-size:11px;fill:var(--paper);text-anchor:middle;dominant-baseline:central;letter-spacing:.12em}
.de-pot{fill:color-mix(in oklch,var(--park) 55%,var(--park-ink));stroke:var(--park-ink)}
.de-pot-b{fill:var(--block-2);stroke:var(--ink-2)}
.de-walk{fill:none;stroke:var(--bus);stroke-width:3.4;stroke-dasharray:1 8;stroke-linecap:round}
.de-arrow{fill:none;stroke:var(--bus-ink);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.de-here{fill:var(--bus);stroke:var(--ink);stroke-width:2.4}
.de-here-t{font-size:12px;fill:var(--ink);text-anchor:middle;dominant-baseline:central}

/* ===== 手機 ===== */
@media (max-width:760px){
  .sheet{grid-template-columns:1fr auto;padding-block:.5rem}
  .sheet__nav{grid-column:1/-1;grid-row:2;justify-content:space-between;gap:.6rem;font-size:.92rem}
  .sheet__no{display:none}
  .cartouche{grid-template-columns:1fr}
  .legend{grid-template-columns:1fr}
  .key{grid-template-columns:1fr 1fr;column-gap:1rem}
  .key li{grid-template-columns:40px 1fr;gap:.5rem;font-size:.84rem}
  .key svg{width:40px}
  .lanes__head{grid-template-columns:1fr}
  .legend__mini{display:none}
  .lanes__list{display:block}
