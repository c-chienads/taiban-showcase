.fp-lbl{font-family:var(--f-sans);font-size:12.5px;font-weight:500;fill:var(--ink);text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:var(--paper);stroke-width:3px;stroke-linejoin:round}
.fp-small{font-size:11.5px}.fp-west{fill:var(--red-deep);font-weight:700}
.fp-north circle{fill:none;stroke:var(--ink);stroke-width:1}.fp-north path{fill:var(--ink)}
.fp-scale{stroke:var(--ink);stroke-width:2.2}.fp-arrow{fill:none;stroke:var(--red-deep);stroke-width:1.6}
.l-plan figcaption{font-size:12.5px;color:var(--ink-2);margin-top:4px;line-height:1.5}
.l-spec{margin:0 0 14px;display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;font-size:15px;line-height:1.6}
.l-spec div{display:grid;grid-template-columns:4.2em 1fr;gap:8px;border-bottom:1px dotted var(--zinc-lo);padding:3px 0}
.l-spec dt{color:var(--ink-2);font-size:13.5px;padding-top:2px}
.l-spec dd{margin:0;font-weight:600}
.l-spec dd small{display:block;font-weight:400;font-size:12.5px;color:var(--ink-2);line-height:1.4}
.l-spec .wide{grid-column:1/-1}
.l-price{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin:0 0 14px;padding:10px 12px;border:2px solid var(--ink)}
.l-price .k{font-size:13.5px;letter-spacing:.1em;font-weight:700}
.l-price b{font-family:var(--f-cond);font-weight:700;font-size:40px;line-height:1;letter-spacing:.01em;color:var(--red-deep)}
.l-price .unit{font-weight:700;font-size:17px}
.l-price .pp{margin-inline-start:auto;font-size:13.5px;color:var(--ink-2)}
.l-feat{margin:0 0 12px;padding:0;font-size:15px;line-height:1.7}
.l-feat li{position:relative;padding-inline-start:22px;margin-bottom:3px}
.l-feat li::before{content:"";position:absolute;left:0;top:.62em;width:12px;height:7px;background-color:var(--red)}
.l-honest{margin:0 0 16px;padding:10px 12px 10px 0;font-family:var(--f-hand);font-size:17px;line-height:1.65;color:var(--pen);background:linear-gradient(90deg,var(--pen) 0 3px,transparent 3px) no-repeat;padding-left:14px}
.l-honest b{font-weight:400;margin-inline-end:8px;border-bottom:2px solid var(--pen)}
.l-act{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;margin:0}
.l-act a:not(.btn){font-weight:700;font-variant-numeric:tabular-nums}
.l-office p{margin:0 0 12px;font-size:15.5px}
.l-office dl{display:grid;grid-template-columns:5em 1fr;gap:4px 12px;margin:0 0 14px;font-size:15px}
.l-office dt{color:var(--ink-2)}.l-office dd{margin:0;font-weight:600}
.l-sold p{margin:0 0 10px;font-size:15.5px}
.l-empty{padding:22px}
.l-empty p{margin:0 0 8px;font-size:15.5px}

/* ===== 公佈欄 ===== */
.board{width:min(100% - 2*var(--gut),var(--wrap));margin:0 auto;padding:16px 0 72px}
.board-frame{position:relative;background-color:oklch(0.975 0.004 240);box-shadow:0 0 0 12px var(--zinc),0 0 0 13px var(--zinc-lo),0 0 0 14px var(--zinc-hi),6px 8px 0 14px var(--zinc-lo);margin:14px;padding:26px 28px 30px}
.board-title{position:absolute;left:28px;top:-40px;margin:0;font-weight:900;font-size:19px;line-height:1.2;letter-spacing:.08em;background-color:var(--paper);padding:5px 14px 6px;border:1.5px solid var(--ink);box-shadow:2px 2px 0 var(--zinc-lo);display:flex;align-items:baseline;gap:12px}
.board-title small{font-weight:500;font-size:13px;letter-spacing:.04em;color:var(--ink-2)}
.pinboard{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-auto-rows:minmax(56px,auto);gap:22px 16px;align-items:start}
.note{position:relative;padding:22px 18px 16px;font-family:var(--f-hand);line-height:1.6;color:var(--ink);background-color:var(--paper);box-shadow:2px 3px 0 oklch(0 0 0/.18);rotate:var(--rot);grid-column:var(--gc);grid-row:var(--gr);margin-top:var(--mt,0)}
.note.p-yellow{background-color:var(--memo-y)}.note.p-pink{background-color:var(--memo-p)}
.note h3{font-family:var(--f-hand);font-weight:400;font-size:21px;line-height:1.25;margin:0 0 6px;letter-spacing:.04em;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:.2em;text-decoration-color:var(--red)}
.note p{margin:0;font-size:17.5px;hanging-punctuation:allow-end}
.mag{position:absolute;top:-9px;width:20px;height:20px;border-radius:50%;box-shadow:inset -2px -2px 0 oklch(0 0 0/.25),inset 2px 2px 0 oklch(1 0 0/.45),1px 2px 0 oklch(0 0 0/.3);left:var(--mx,14px)}
.mag-red{background-color:var(--red)}.mag-blue{background-color:var(--blue)}.mag-yellow{background-color:var(--yellow)}.mag-black{background-color:var(--ink)}
.print{position:relative;grid-column:9/13;grid-row:1/4;background-color:var(--paper);padding:26px 20px 18px;rotate:var(--rot);box-shadow:2px 3px 0 oklch(0 0 0/.18)}
.print .mag{top:-8px}.print .mag.br,.print .mag.bl{top:auto;bottom:-8px}.print .mag.tr,.print .mag.br{left:auto;right:12px}
.print h3{font-weight:900;font-size:16px;letter-spacing:.06em;margin:0 0 10px;padding-bottom:6px;border-bottom:2px solid var(--ink)}
.print table{width:100%;font-size:14px;line-height:1.5}
.print th{text-align:start;font-weight:500;color:var(--ink-2);font-size:12.5px;padding:2px 0 6px;border-bottom:1px solid var(--zinc-lo)}
.print td{padding:6px 0;border-bottom:1px dotted var(--zinc-lo);vertical-align:top}
.print td+td,.print th+th{text-align:end;white-space:nowrap;padding-inline-start:8px}
.print-foot{font-size:12px;color:var(--ink-2);margin:10px 0 0;line-height:1.5}

/* ===== 服務流程：一封信經過的五站 ===== */
.sorting{width:min(100% - 2*var(--gut),var(--wrap));margin:0 auto;padding:10px 0 72px}
.sort-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px 56px;align-items:end;margin-bottom:34px}
.sort-head h2 .nb{white-space:nowrap}
.sort-head h2{font-family:var(--f-disp);font-weight:400;font-size:clamp(28px,3.2vw,44px);line-height:1.2;letter-spacing:.02em;margin:0}
.sort-head p{margin:0;max-width:36em}
.rack-wrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:40px;align-items:start}
.rack{position:relative;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-template-rows:auto 10px auto 10px;gap:0 18px;padding:34px 26px 14px;background:var(--zinc-img),var(--zinc);box-shadow:inset 2px 2px 0 var(--zinc-hi),inset -2px -2px 0 var(--zinc-lo),4px 5px 0 var(--zinc-lo)}
.rack::before,.rack::after{content:"";grid-column:1/-1;margin-inline:-26px;background-color:var(--zinc-lo);box-shadow:0 1px 0 var(--zinc-hi);pointer-events:none}
.rack::before{grid-row:2}.rack::after{grid-row:4}
.env{position:relative;grid-column:var(--gc);grid-row:var(--gr);align-self:end;margin-bottom:-2px;margin-top:26px;background-color:var(--paper);padding:22px 18px 16px 18px;rotate:var(--tilt);box-shadow:0 0 0 1px var(--paper-2),3px 4px 0 var(--zinc-lo);outline:1.5px solid var(--red);outline-offset:-7px;min-height:150px}
.env::before{content:"";position:absolute;left:14px;top:12px;width:48px;height:12px;background:repeating-linear-gradient(90deg,var(--red) 0 1.5px,transparent 1.5px 15px,var(--red) 15px 16.5px);opacity:.9}
.env::after{content:"";position:absolute;left:14px;top:12px;width:48px;height:12px;border-top:1.5px solid var(--red);border-bottom:1.5px solid var(--red)}
.postmark{position:absolute;right:14px;top:10px;width:58px;height:58px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;align-content:center;gap:0;line-height:1;transform:rotate(-8deg);opacity:.85;color:var(--ink)}
.postmark::before{content:"";position:absolute;inset:4px;border-radius:50%;border:1px solid var(--ink)}
.postmark b{font-family:var(--f-cond);font-weight:700;font-size:22px;line-height:1}
.postmark span{font-size:11px;letter-spacing:.12em;line-height:1.2;margin-top:2px}
.env h3{font-weight:900;font-size:19px;line-height:1.3;margin:28px 0 6px}
.env h3 small{display:block;font-weight:500;font-size:13px;letter-spacing:.1em;color:var(--ink-2);margin-bottom:2px}
.env p{margin:0;font-size:15px;line-height:1.7}
.env-when{margin-top:8px!important;font-size:13.5px!important;color:var(--ink-2);border-top:1px dotted var(--zinc-lo);padding-top:6px}
.fees{background-color:var(--paper);padding:22px 24px 24px;box-shadow:0 0 0 1px var(--paper-2),3px 4px 0 var(--zinc-lo)}
.fees h3{font-weight:900;font-size:17px;letter-spacing:.06em;margin:0 0 10px;padding-bottom:6px;border-bottom:2px solid var(--ink)}
.fees h3+h3{margin-top:22px}
.fees table{width:100%;font-size:15px;margin-bottom:6px}
.fees td{padding:6px 0;border-bottom:1px dotted var(--zinc-lo);vertical-align:top}
.fees td+td{text-align:end;font-weight:700;white-space:nowrap}
.fees .scope-t tr{display:block;padding:7px 0;border-bottom:1px dotted var(--zinc-lo)}
.fees .scope-t td{display:block;padding:0;border:0;line-height:1.5}
.fees .scope-t td:first-child{font-size:13.5px;color:var(--ink-2)}
.fees .scope-t td+td{text-align:start;font-weight:700;white-space:normal;margin-top:1px}
.rtn{display:inline-block;margin-inline-end:8px;padding:0 6px 1px;border:2px double var(--red-deep);color:var(--red-deep);font-weight:800;font-size:13.5px;letter-spacing:.12em;line-height:1.35;rotate:-4deg;vertical-align:1px}
.rtn--free{border-color:var(--blue-deep);color:var(--blue-deep);rotate:3deg}
.fees-note{font-size:13px;color:var(--ink-2);margin:12px 0 0;line-height:1.55}

/* ===== 預約看屋：看屋通知單 ===== */
.visit{width:min(100% - 2*var(--gut),var(--wrap));margin:0 auto;padding:10px 0 80px}
.notice{position:relative;max-width:900px;margin:0 auto;background-color:var(--paper);padding:30px 34px 32px;box-shadow:0 0 0 1px var(--paper-2),4px 5px 0 var(--zinc-lo);outline:1.5px solid var(--red);outline-offset:-10px}
.notice::before{content:"";position:absolute;inset:14px;border:1px solid var(--red);pointer-events:none;opacity:.6}
.stampbox{position:absolute;right:30px;top:26px;width:78px;height:78px;border:1.5px dashed var(--red-deep);color:var(--red-deep);display:grid;place-content:center;justify-items:center;font-size:13px;font-weight:700;letter-spacing:.12em;line-height:1.3;text-align:center;rotate:-2deg}
.stampbox small{font-size:10.5px;letter-spacing:.06em;font-weight:500;margin-top:3px}
.notice-head{display:grid;grid-template-columns:auto 1fr;gap:6px 24px;align-items:end;margin-bottom:22px;padding-bottom:14px;border-bottom:2px solid var(--ink)}
.notice-kind{grid-column:1/-1;margin:0;font-size:12.5px;letter-spacing:.3em;color:var(--red-deep);font-weight:700}
.notice h2{font-family:var(--f-disp);font-weight:400;font-size:36px;line-height:1.15;letter-spacing:.03em;margin:0}
.notice-lede{margin:0;font-size:15px;max-width:34em;line-height:1.7}
.notice-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px 22px;align-items:start}
.f{display:grid;gap:5px;grid-column:span 3}
.f-wide{grid-column:1/-1}.f-send{grid-column:1/-1;display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-top:6px}
.f label,.f legend{font-weight:800;font-size:15px;padding:0}
.req{font-weight:700;font-size:12px;letter-spacing:.08em;margin-inline-start:8px;color:var(--red-deep);border:1px solid var(--red-deep);padding:0 5px 1px;vertical-align:2px}
.f input,.f select,.f textarea{width:100%;border:0;border-bottom:2px solid var(--ink);background-color:transparent;padding:8px 2px;font-size:16px;line-height:1.4;border-radius:0;color:var(--ink)}
.f select{background-color:var(--paper)}
.f textarea{resize:vertical;min-height:72px;border:1.5px solid var(--ink);padding:8px 10px}
.f input:focus-visible,.f select:focus-visible,.f textarea:focus-visible{outline:var(--focus-ring);outline-offset:3px}
.chk{display:flex;flex-wrap:wrap;gap:8px 10px}
.chk label{display:flex;align-items:center;gap:7px;font-weight:600;font-size:15px;border:1.5px solid var(--ink);padding:5px 11px 6px;cursor:pointer;background-color:var(--paper)}
.chk label:has(input:checked){background-color:var(--ink);color:var(--paper)}
.chk input{accent-color:var(--red);width:16px;height:16px;margin:0}
.err{font-size:13.5px;font-weight:700;color:var(--red-deep);line-height:1.5}
[aria-invalid=true]{border-color:var(--red)!important;box-shadow:0 2px 0 var(--red)}
.post{font:inherit;font-weight:900;font-size:18px;letter-spacing:.2em;color:var(--paper);background-color:var(--red);border:0;padding:11px 28px 12px 32px;box-shadow:4px 4px 0 var(--ink);cursor:pointer}
.post:hover{background-color:var(--red-deep)}
.post:active{translate:2px 2px;box-shadow:2px 2px 0 var(--ink)}
.f-fine{margin:0;font-size:13.5px;color:var(--ink-2)}
.notice-status{margin:14px 0 0;font-weight:700;font-size:15.5px;line-height:1.6}
.notice-status span:not([hidden]){display:block;padding:10px 14px;background-color:var(--memo-y);box-shadow:2px 2px 0 var(--zinc-lo)}

/* ===== 頁尾：樓層指示牌 ===== */
.foot{background-color:var(--zinc-deep);color:var(--paper);--focus-ring:3px solid var(--yellow)}
.foot-in{width:min(100% - 2*var(--gut),var(--wrap));margin:0 auto;padding:36px 0 28px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr);gap:24px 48px;align-items:start}
.foot-brand{display:flex;gap:14px;align-items:flex-start}
.foot-brand p{margin:0;font-size:15.5px;line-height:1.7}
.foot-brand b{display:block;font-weight:900;font-size:20px;letter-spacing:.04em}
.foot h3{font-weight:800;font-size:14px;letter-spacing:.14em;margin:0 0 8px;color:oklch(0.82 0.02 240)}
.foot dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:15px;line-height:1.7}
.foot dt{color:oklch(0.82 0.02 240)}.foot dd{margin:0}
.foot a{text-decoration-color:oklch(0.82 0.02 240)}
.colophon{grid-column:1/-1;margin:14px 0 0;padding-top:14px;border-top:1px solid oklch(0.5 0.025 245);font-size:13px;color:oklch(0.86 0.015 240);display:flex;flex-wrap:wrap;gap:4px 24px;line-height:1.6}

/* ===== 動效（招牌：門與信箋；輔助：已成交蓋章） ===== */
.door{transition:transform var(--hinge)}
@keyframes pull-right{from{clip-path:inset(0 100% 0 0);transform:translateX(-26px)}to{clip-path:inset(0 0 0 0);transform:translateX(0)}}
@keyframes pull-down{from{clip-path:inset(0 0 100% 0);transform:translateY(-14px)}to{clip-path:inset(0 0 0 0);transform:translateY(0)}}
@keyframes stamp{from{transform:scale(1.5) rotate(var(--tilt));opacity:0}65%{transform:scale(.96) rotate(var(--tilt));opacity:.9}to{transform:scale(1) rotate(var(--tilt));opacity:.9}}
html.js .st-sold .decal{animation:stamp .5s cubic-bezier(.2,.8,.2,1) .5s both}
@supports not selector(:has(a)){
  .letter{display:block;position:static;grid-column:2/8;grid-row:auto;margin-top:16px;animation:none}
  .letter-empty{display:none}
}

/* ===== 平板／手機：牆重排成 4 欄流動格，信箋插在那一排信箱下面 ===== */
@media (max-width:999px){
  .top{gap:10px 18px}
  .top nav{margin-inline-start:0;order:3;width:100%}
  .top ul{flex-wrap:wrap}
  .top li:first-child a.nav{padding-inline-start:0}
  .hours{margin-inline-start:auto}
  .sign{grid-template-columns:1fr;gap:12px;margin-bottom:20px}
  .lobby{padding-top:16px}
  .sign h1{padding:16px 24px 18px}
  .lede{font-size:15.5px;line-height:1.7;margin-bottom:10px}
  .legend{gap:6px 18px}
  .estate{grid-template-columns:20px repeat(4,minmax(0,1fr));grid-template-rows:auto;gap:0 6px}
  .frame{grid-column:2/6;grid-row:2/17;margin:-10px -8px -8px}
  .rail-top{gap:6px}
  .rail-left{grid-row:2/17;grid-template-rows:none;display:block}
  .rail-left span{display:none}
  .rail{font-size:13px}
  .box{grid-column:var(--mc);grid-row:var(--mr);height:auto;aspect-ratio:6/5;margin-bottom:6px}
  .box::before{inset:5px 5px 5px 7px}
  .door{inset:5px 5px 5px 7px}
  .u{inset:5px 5px 5px 7px}
  .plate{left:5px;bottom:5px;font-size:14px;min-width:30px;padding:1px 4px 0}
  .decal{right:4px;bottom:auto;top:4px;font-size:12.5px;padding:1px 5px 2px;letter-spacing:.04em}
  .st-sold .decal{font-size:12px;padding:0 4px 1px;left:auto;right:6px;top:5px;bottom:auto;translate:none}
  .st-office .decal{font-size:11.5px}
  .noad{display:none}
  .flyer{height:26%}
  .lock{right:7px;width:9px;height:9px;margin-top:-5px}
  .lock::after{left:4px;top:1px;height:6px}
  .slot{height:5px;box-shadow:0 -2px 0 var(--zinc-hi),0 -3px 0 var(--zinc-lo)}
  .hinge{width:4px;height:10px;left:2px}
  .letter{grid-column:2/6;grid-row:var(--lr);position:static;max-width:none;margin:6px 0 16px;animation-name:pull-down}
  .letter-empty{grid-row:16;margin:10px 0 8px}
  .l-body{padding:16px 16px 18px}
  .l-spec{grid-template-columns:1fr}
  .board-frame{margin:14px 10px;padding:22px 16px 24px;box-shadow:0 0 0 9px var(--zinc),0 0 0 10px var(--zinc-lo),0 0 0 11px var(--zinc-hi),5px 6px 0 11px var(--zinc-lo)}
  .board-title{left:12px;top:-36px;font-size:16px;padding:4px 10px 5px}
  .board-title small{display:none}
  .pinboard{grid-template-columns:repeat(6,minmax(0,1fr));gap:20px 12px}
  .note{grid-column:var(--mgc);grid-row:auto;margin-top:0;padding:20px 14px 14px}
  .note h3{font-size:19px}.note p{font-size:16.5px}
  .print{grid-column:1/-1;grid-row:auto}
  .sort-head{grid-template-columns:1fr;gap:8px}
  .rack-wrap{grid-template-columns:1fr;gap:28px}
  .rack{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:none;gap:18px 12px;padding:22px 14px 20px}
  .rack::before,.rack::after{display:none}
  .env{grid-column:var(--mgc);grid-row:auto;align-self:start;margin:0;min-height:0;padding:20px 14px 14px}
  .env h3{margin-top:22px;font-size:17.5px}
  .postmark{width:50px;height:50px;right:10px;top:8px}
  .postmark b{font-size:19px}.postmark span{font-size:10.5px;letter-spacing:.08em}
  .notice{padding:24px 20px 26px}
  .notice::before{inset:10px}
  .notice-head{grid-template-columns:1fr;padding-right:84px}
  .stampbox{right:18px;top:18px;width:66px;height:66px;font-size:12px}
  .notice-grid{grid-template-columns:1fr}
  .f{grid-column:auto}
  .foot-in{grid-template-columns:1fr;gap:18px}
}
@media (max-width:599px){
  body{font-size:16px}
  .brand-zh{font-size:19px}
  .top a.nav{font-size:14.5px;padding:4px 10px}
  .sign h1{font-size:25px}
  .estate{gap:0 5px}
  .box{margin-bottom:5px}
  .plate{font-size:14px;min-width:28px;left:4px;bottom:4px}
  .decal{font-size:12.5px;right:3px;top:3px;padding:1px 4px 2px;letter-spacing:0}
  .st-sold .decal{font-size:12px;letter-spacing:.04em;padding:0 3px 1px}
  .st-office .decal{font-size:12px;padding:1px 3px 2px;letter-spacing:0}
  .top{padding:10px 0 8px}
  .l-head{grid-template-columns:1fr auto;grid-template-areas:"kind close" "no no" "st st";padding:12px 14px}
  .l-no b{font-size:36px}
  .l-st{justify-self:start}
  .l-price b{font-size:34px}
  .fp-lbl{font-size:14.5px}.fp-small{font-size:13px}
  .pinboard{grid-template-columns:1fr 1fr;gap:18px 10px}
  .note{grid-column:var(--sgc)}
  .rack{grid-template-columns:1fr}
  .env{grid-column:1}
  .postmark{position:absolute}
}
@media (min-width:600px) and (max-width:999px){
  .box::before,.door,.u{inset:6px 6px 6px 8px}
}

/* ===== 降級動效：門直接開、信箋直接出現、章直接蓋好 ===== */
@media (prefers-reduced-motion:reduce){
  .door{transition:none}
  .letter{animation:none!important}
  html.js .st-sold .decal{animation:none}
  .box:has(.u:hover:not(:checked)) .door{transform:rotateY(0)}
  .post:active{translate:none}
}

/* ===== 列印：去底、去動效、黑字；全部信箋攤開 ===== */
@media print{
  html,body{background:#fff!important;color:#000!important}
  body{background-image:none!important}
  .frame,.rail,.hinge,.sc,.lock,.slot,.box::before,.box::after,.l-close,.mag,.post,.notice-status,.top nav,.hours,.flyer,.noad,.stampbox{display:none!important}
  .sign h1{background:none!important;box-shadow:none!important;text-shadow:none!important;padding:0!important;color:#000!important}
  .sign h1::before,.sign h1::after{display:none}
  .sign h1 .num{background:none!important;color:#000!important;box-shadow:none!important;transform:none!important}
  .l-st,.legend .decal{background:none!important;color:#000!important;box-shadow:none!important;border:1px solid #000}
  .box{vertical-align:top}
  .estate{display:block!important}
  .box{display:inline-block;width:120px;height:72px;margin:0 6px 6px 0;background:none!important;box-shadow:none!important;border:1px solid #000;perspective:none}
  .door{position:static!important;transform:none!important;background:none!important;box-shadow:none!important;display:block;height:100%}
  .plate,.decal{position:static!important;display:inline-block;transform:none!important;box-shadow:none!important;color:#000!important;background:none!important;border:1px solid #000;margin:6px 4px 0 6px;clip-path:none!important}
  .letter{display:block!important;position:static!important;max-width:none!important;rotate:none!important;box-shadow:none!important;background-image:none!important;animation:none!important;border:1px solid #000;margin:12pt 0;break-inside:avoid}
  .letter-empty{display:none!important}
  .l-head{background:none!important;color:#000!important;border-bottom:1px solid #000}
  .l-st,.l-price b,.l-honest,.fp-west,.fp-arrow{color:#000!important;stroke:#000}
  .note,.print,.env,.fees,.notice,.board-frame,.rack{rotate:none!important;box-shadow:none!important;background:none!important;border:1px solid #000;outline:none!important}
  .board-frame,.rack{margin:0!important}
  .pinboard,.rack,.rack-wrap,.notice-grid,.foot-in{display:block!important}
  .note,.env{margin:0 0 8pt!important;break-inside:avoid}
  .foot{background:none!important;color:#000!important}
  a{text-decoration:underline}
  a[href^="tel:"]::after{content:" (" attr(href) ")"}
}

.lost{width:min(100% - 2*var(--gut),var(--wrap));margin:0 auto;padding:48px 0 96px;min-height:calc(100svh - 92px);display:grid;align-content:center}
.lost-in{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:40px 64px;align-items:center}
.lost-wall{padding:28px;background:var(--zinc-img),var(--zinc);box-shadow:inset 2px 2px 0 var(--zinc-hi),inset -2px -2px 0 var(--zinc-lo),5px 6px 0 var(--zinc-lo);display:grid;place-items:center}
.lost-box{width:min(100%,360px);aspect-ratio:1.4;grid-column:auto;grid-row:auto;height:auto;perspective:1600px}
.lost-box::before{inset:14px 14px 14px 18px}
.lost-box .door{inset:14px 14px 14px 18px}
.lost-box .plate{font-size:30px;left:18px;bottom:18px;padding:2px 12px 0}
.lost-box .slot{height:12px;box-shadow:0 -5px 0 var(--zinc-hi),0 -7px 0 var(--zinc-lo)}
.lost-box .lock{width:20px;height:20px;margin-top:-10px;right:20px}
.lost-box .lock::after{left:9px;top:4px;height:12px;width:2px}
.lost-box .hinge{width:10px;height:26px;left:5px}
.lost-box::after{content:none}
.returned{position:absolute;left:12%;right:10%;top:22%;bottom:12%;background-color:var(--paper);box-shadow:inset 0 0 0 1.5px var(--paper-2),3px 3px 0 var(--zinc-lo);transform:rotate(-4deg);display:grid;place-items:center;z-index:3;outline:1.5px solid var(--red);outline-offset:-8px}
.ret-stamp{display:grid;justify-items:center;padding:8px 14px;border:3px double var(--red-deep);color:var(--red-deep);font-weight:900;font-size:26px;line-height:1.1;letter-spacing:.14em;transform:rotate(-12deg);opacity:.85}
.ret-stamp small{font-size:12px;letter-spacing:.3em;font-weight:700;margin-top:4px}
.lost h1{font-family:var(--f-disp);font-weight:400;font-size:clamp(40px,5.6vw,72px);line-height:1.12;margin:0 0 16px;letter-spacing:.04em}
.lost-text p{margin:0 0 14px;max-width:32em}
.lost-links{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;margin-top:24px!important}
.lost-links a:not(.btn){font-weight:700}
@media (max-width:999px){.lost-in{grid-template-columns:1fr;gap:28px}.lost{padding:28px 0 72px}.lost-box{aspect-ratio:1.3}.lost-box .plate{font-size:24px}.ret-stamp{font-size:22px}}

}
