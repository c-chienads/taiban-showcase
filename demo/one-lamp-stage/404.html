.story__facts dd small{font-family:var(--f-t);font-size:.8125rem;color:var(--porc-2);margin-left:.15rem}
/* 引線：從筆記伸向中央的燈 */
.story::after{content:"";position:absolute;top:50%;width:min(4vw,56px);height:5px;margin-top:-2px;border-top:1px solid var(--porc-3);background:radial-gradient(circle,var(--brass) 0 2.5px,transparent 3px) no-repeat var(--dotx,100%) 0/6px 6px;translate:0 -2px}
.story:nth-child(odd)::after{left:calc(100% + .6rem)}
.story:nth-child(even)::after{right:calc(100% + .6rem);--dotx:0}
.parts__nav{display:none}
.only-m{display:none}

/* 燈（舞台與首屏共用）：色面、材質排線、想像線、光 */
.lampart .c1{fill:var(--c1)}.lampart .c2{fill:var(--c2)}.lampart .c3{fill:var(--c3)}
.lampart .m1{fill:var(--m1)}.lampart .m2{fill:var(--m2)}.lampart .m3{fill:var(--m3)}
.lampart .s1{fill:var(--s1)}.lampart .s2{fill:var(--s2)}.lampart .s3{fill:var(--s3)}
.lampart .c1,.lampart .c2,.lampart .c3{transition:fill .28s}
.lampart .rim{fill:color-mix(in oklch,var(--rim),var(--beam) calc(var(--on) * 85%))}
.lampart .rimShade{fill:var(--s3);opacity:calc(.55 - var(--on) * .3)}
.lampart .rimEdge{fill:none;stroke:var(--c1);stroke-width:1.2;opacity:.45}
.lampart .led{fill:color-mix(in oklch,var(--porc),var(--lit) calc(var(--on) * 100%))}
.lampart .ledHi{fill:#fff;opacity:calc(.55 - var(--on) * .45)}
.lampart .cable{fill:none;stroke:var(--s3);stroke-width:6.5;stroke-linecap:round}
.lampart .tx-c{fill:none;stroke:var(--c3);stroke-width:.9;opacity:.6}
.lampart .tx-m,.lampart .tx-m *{fill:none;stroke:var(--m3);stroke-width:.8;opacity:.7}
.lampart .tx-hi{fill:none;stroke:#fff;stroke-width:1.5;stroke-linecap:round;opacity:.55}
.lampart .tx-spk{fill:none;stroke:var(--c3);stroke-width:1.6;stroke-linecap:round;opacity:.55}
.lampart .tx-seam{fill:none;stroke:var(--s3);stroke-width:1;opacity:.4}
.lampart .tx-tick{fill:none;stroke:var(--c3);stroke-width:1.3;stroke-dasharray:2 4}
.lampart .tx-fuzz{fill:none;stroke:var(--s2);stroke-width:1;stroke-linecap:round}
.lampart .tx-spun *{fill:none;stroke:var(--spun);stroke-width:.85}
.lampart .tx-led{fill:none;stroke:var(--s1);stroke-width:2.4;stroke-linecap:round;opacity:calc(.5 - var(--on) * .4)}
.lampart .tx-braidA,.lampart .tx-braidB{fill:none;stroke-width:3.6;stroke-dasharray:2.6 2.6;stroke-linecap:butt}
.lampart .tx-braidA{stroke:var(--s1);translate:0 -1.1px}
.lampart .tx-braidB{stroke:var(--s2);stroke-dashoffset:2.6;translate:0 1.1px}
.lampart .shd{fill:none;stroke:var(--night-4);stroke-width:1.8}
.scene .shd{stroke:var(--desk-2)}
.lampart .part{transform:translate(calc((1 - var(--r)) * var(--tx) * 1px),calc((1 - var(--r)) * var(--ty) * 1px))}
.lamp{--e:calc(1 - var(--r));--x:calc(max(var(--k1),var(--k2),var(--k3),var(--k4),var(--k5),var(--k6),var(--k7),var(--k8),var(--k9)) * var(--e))}
.lamp .phantom{opacity:calc(var(--x) * .95)}
.lamp .phantom *{fill:none;stroke:var(--porc-2);stroke-width:1.3;stroke-dasharray:16 4 2.5 4 2.5 4;stroke-linecap:round}
.lamp .axis{fill:none;stroke:var(--porc-3);stroke-width:1;stroke-dasharray:2 7;opacity:calc(var(--x) * .8)}
.lamp .disc__floor{fill:color-mix(in oklch,var(--night-3),var(--desk-3) calc(var(--on) * 100%))}
.lamp .disc__dot{fill:none;stroke:color-mix(in oklch,var(--night-3),var(--desk-3) calc(var(--on) * 100%));stroke-linecap:round}
.lamp .light{opacity:var(--on)}
.lamp .cone{fill:var(--beam);opacity:.2}
.lamp .pool{fill:var(--lit);opacity:.85}
.lamp .poolDot{fill:none;stroke:var(--lit);stroke-linecap:round;opacity:.85}
.lamp .lab{opacity:clamp(0,calc((var(--ko) * var(--e) - .7) * 3.4),1)}
.lamp .lab .lead{fill:none;stroke:var(--porc-2);stroke-width:1.2}
.lamp .lab .dot{fill:var(--brass)}
.lamp .lab .bub{fill:var(--night-2);stroke:var(--porc-2);stroke-width:1.5}
.lamp .lab .no{font-family:var(--f-d);font-size:15px;fill:var(--porc);text-anchor:middle;dominant-baseline:central}
.lamp .lab .nm{font-family:var(--f-t);font-size:15px;fill:var(--porc);dominant-baseline:central;paint-order:stroke;stroke:var(--night-2);stroke-width:4px;stroke-linejoin:round}
.nod{transform-box:fill-box;transform-origin:50% 4%}
main:has(#c-green:checked){--c1:oklch(0.62 0.07 165);--c2:oklch(0.47 0.065 165);--c3:oklch(0.33 0.05 165)}
main:has(#c-red:checked){--c1:oklch(0.74 0.14 42);--c2:oklch(0.60 0.135 36);--c3:oklch(0.43 0.1 30)}
html.js .bench:has(#c-white:checked) .nod{animation:f14-nod-a .6s ease-out}
html.js .bench:has(#c-green:checked) .nod{animation:f14-nod-b .6s ease-out}
html.js .bench:has(#c-red:checked) .nod{animation:f14-nod-c .6s ease-out}
@keyframes f14-nod-a{0%{rotate:0deg}28%{rotate:-6deg}58%{rotate:2.5deg}82%{rotate:-1deg}100%{rotate:0deg}}
@keyframes f14-nod-b{0%{rotate:0deg}28%{rotate:-6deg}58%{rotate:2.5deg}82%{rotate:-1deg}100%{rotate:0deg}}
@keyframes f14-nod-c{0%{rotate:0deg}28%{rotate:-6deg}58%{rotate:2.5deg}82%{rotate:-1deg}100%{rotate:0deg}}
.bench__in{background:color-mix(in oklch,var(--night-2),var(--desk) calc(var(--on) * 100%))}

/* 亮燈・挑漆色：燈在中間亮著，左邊說、右邊選 */
.buy{min-height:calc(100dvh - var(--mast-h));display:grid;grid-template-columns:minmax(0,1fr) minmax(0,46%) minmax(0,1fr);column-gap:2rem;align-content:center;padding:3rem var(--gut) 4rem}
.buy__say{grid-column:1;align-self:center}
.buy__do{grid-column:3;align-self:center}
.buy h2{font-size:clamp(2rem,3vw,2.7rem);letter-spacing:.04em}
.buy__lead{color:var(--porc-2);margin:.8rem 0 0}
.buy__price{display:flex;align-items:baseline;gap:.4rem;margin:1.4rem 0 0;font-family:var(--f-d);font-size:1.3rem;color:var(--porc-2)}
.buy__price .num{font-size:2.6rem;color:var(--porc);line-height:1}
.buy__note{font-size:.9rem;color:var(--porc-2);margin:1rem 0 0}
.colors{margin:0;padding:0;border:0}
.colors legend{font-size:.95rem;color:var(--porc-2);padding:0 0 .6rem}
.colors__row{display:flex;flex-wrap:wrap;gap:.6rem 1rem}
.swatch{position:relative;display:grid;justify-items:center;gap:.25rem;width:5.6rem;cursor:pointer;text-align:center}
.swatch input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.swatch__chip{display:grid;place-items:center;width:4.6rem;height:4.6rem;border-radius:50%;background:var(--night-3);box-shadow:0 0 0 2px var(--porc-3)}
.swatch__chip svg{width:62%;height:auto;overflow:visible}
.swatch__chip .mini *{fill:var(--sw);stroke:var(--sw-2);stroke-width:5}
.swatch b{font-family:var(--f-d);font-weight:400;font-size:1.1rem;line-height:1.3}
.swatch small{font-size:.8125rem;color:var(--porc-2);line-height:1.45}
.swatch:has(input:checked) .swatch__chip{box-shadow:0 0 0 3px var(--lit),0 0 0 7px color-mix(in oklch,var(--lit) 25%,transparent)}
.swatch:has(input:focus-visible) .swatch__chip{outline:3px solid var(--brass);outline-offset:6px}
.sw--white{--sw:oklch(0.94 0.012 88);--sw-2:oklch(0.78 0.02 85)}.sw--green{--sw:oklch(0.5 0.065 165);--sw-2:oklch(0.36 0.05 165)}.sw--red{--sw:oklch(0.62 0.135 36);--sw-2:oklch(0.45 0.1 30)}
.qty{display:flex;align-items:center;flex-wrap:wrap;gap:.5rem 1rem;margin:1.4rem 0 0}
.qty label{font-size:.95rem;color:var(--porc-2)}
.stepper{display:inline-grid;grid-template-columns:44px 3.4rem 44px;align-items:center}
.stepper button{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--night-3);font-family:var(--f-d);font-size:1.3rem;cursor:pointer}
.stepper button:hover{background:oklch(0.43 0.06 258)}
.stepper button svg{width:16px;height:16px}
.stepper input,.stepper output{height:44px;line-height:44px;text-align:center;font-family:var(--f-d);font-size:1.3rem;background:transparent;border:0;color:inherit;-moz-appearance:textfield;appearance:textfield;width:100%}
.stepper input{border-bottom:2px solid var(--porc-2)}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.buy__act{display:flex;flex-wrap:wrap;gap:.8rem 1.4rem;align-items:center;margin:1.4rem 0 0}
.buy__act a{color:var(--porc-2)}
.buy__done{margin:.8rem 0 0;color:var(--brass)}
.buy__done a{color:var(--porc)}

/* ===== 白天：量過的數字 ===== */
.day{background:var(--day);color:var(--ink);--focus-ring:3px solid var(--brass-ink);--selection-bg:var(--brass);--selection-fg:var(--ink)}
.day a{text-decoration-color:var(--brass-ink)}
.day h2{font-size:clamp(2.2rem,3.6vw,3.2rem);letter-spacing:.04em}
.spec{padding:clamp(3rem,6vw,5.5rem) var(--gut) clamp(3rem,5vw,4.5rem)}
.spec__head{max-width:40rem}
.spec__head p{margin:.7rem 0 0;color:var(--ink-2)}
.spec__figs{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:2rem clamp(2rem,4vw,4.5rem);margin:2.4rem 0 0;align-items:start}
.elev{margin:0;position:relative}
.elev__svg{width:100%;height:auto;max-height:78vh;display:block}
.linelamp .sil *{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round}
.linelamp .sil ellipse,.linelamp .sil circle{fill:var(--day)}
.linelamp .tex *{fill:none;stroke:var(--ink-2);stroke-width:.9}
.linelamp .tex .tx-hi,.linelamp .tex .rimEdge,.linelamp .tex .rimShade,.linelamp .tex .tx-led{display:none}
.linelamp .tex .tx-spk,.linelamp .tex .tx-led{stroke-width:1.4;stroke-linecap:round}
.linelamp .tex .tx-braidA{stroke-dasharray:2.6 2.6;stroke-width:3}
.linelamp .tex .tx-braidB{display:none}
.linelamp .tex .tx-fuzz{stroke-width:.8}
.linelamp .shd{fill:none;stroke:var(--day-3);stroke-width:1.6}
.linelamp .cl{fill:none;stroke:var(--brass-ink);stroke-width:1;stroke-dasharray:24 5 3 5}
.elev__svg .dim path{fill:none;stroke:var(--ink);stroke-width:1.2}
.elev__svg .dim text{font-family:var(--f-d);font-size:30px;fill:var(--ink);paint-order:stroke;stroke:var(--day);stroke-width:7px;stroke-linejoin:round}
.elev__svg .ext{fill:none;stroke:var(--ink-2);stroke-width:1;stroke-dasharray:3 4}
.elev figcaption,.reach figcaption{font-size:.9rem;color:var(--ink-2);margin-top:.6rem;max-width:30em}
.reach{margin:0;display:grid;grid-template-columns:minmax(0,1fr);gap:.4rem}
.reach h3{font-size:clamp(1.6rem,2.2vw,2rem)}
.reach__svg{width:100%;height:auto;display:block;margin-top:.4rem}
.reach__svg .page{fill:oklch(0.99 0.004 240);stroke:var(--ink);stroke-width:1.5}
.reach__svg .txtline{fill:none;stroke:var(--day-3);stroke-width:3.4;stroke-linecap:round}
.reach__svg .gutter{fill:none;stroke:var(--ink-2);stroke-width:1}
.reach__svg .luxDot{fill:none;stroke:var(--brass);stroke-linecap:round;opacity:.75}
.reach__svg .lux{fill:none;stroke:var(--brass-ink);stroke-width:1.3;stroke-dasharray:5 5}
.reach__svg .luxPin{fill:var(--brass-ink)}
.reach__svg .luxLead{fill:none;stroke:var(--ink);stroke-width:1}
.reach__svg .luxT,.reach__svg .bookT,.reach__svg .scale text{font-family:var(--f-d);font-size:19px;fill:var(--ink);paint-order:stroke;stroke:var(--day);stroke-width:6px;stroke-linejoin:round}
.reach__svg .cross{fill:none;stroke:var(--ink);stroke-width:1.4}
.reach__svg .scale path{fill:none;stroke:var(--ink);stroke-width:1.4}
.reach__facts{display:flex;flex-wrap:wrap;gap:.3rem 1.6rem;margin:.8rem 0 0;font-size:.9375rem}
.reach__facts>div{display:flex;gap:.5rem;align-items:baseline}
.reach__facts dt{color:var(--ink-2)}
.reach__facts dd{margin:0}
.mats{margin:clamp(3rem,6vw,5rem) 0 0}
.mats h3{font-size:clamp(1.6rem,2.2vw,2rem)}
.mats__row{list-style:none;margin:1.6rem 0 0;padding:0;display:flex;flex-wrap:wrap;justify-content:space-between;gap:1.6rem 1.2rem}
.mat{flex:1 1 9rem;max-width:13rem;display:grid;justify-items:start;gap:.1rem}
.mat:nth-child(even){margin-top:2.6rem}
.mat__chip{width:7.4rem;height:7.4rem;margin-bottom:.6rem}
.mat__name{margin:0;font-family:var(--f-d);font-size:1.5rem;line-height:1.2}
.mat__where{margin:0;color:var(--brass-ink);font-size:.9375rem}
.mat__note{margin:.2rem 0 0;font-size:.9375rem;color:var(--ink-2);line-height:1.6}
.mat__rim{fill:none;stroke:var(--ink);stroke-width:1.5}
.mat__base--al{fill:oklch(0.86 0.008 240)}.mat__base--steel{fill:oklch(0.62 0.012 245)}.mat__base--iron{fill:oklch(0.36 0.012 250)}.mat__base--brass{fill:var(--m2)}.mat__base--cotton{fill:oklch(0.33 0.025 255)}
.mat__ln,.mat__ln *{fill:none;stroke:oklch(0.48 0.012 245);stroke-width:.8}
.mat__ln--brass{stroke:var(--m3)}
.mat__hi{fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;opacity:.7}
.mat__spk{fill:none;stroke:oklch(0.55 0.01 250);stroke-width:1.8;stroke-linecap:round}
.mat__kn{fill:none;stroke:var(--m3);stroke-width:1.6}
.mat__glint{fill:var(--m1)}
.mat__weave{fill:none;stroke:oklch(0.55 0.02 250);stroke-width:2.2;stroke-linecap:round}

/* 寄出、保固、退回：一條棉編織線從下單走到保固期滿 */
.service{background:var(--day-2);padding:clamp(3rem,6vw,5rem) var(--gut)}
.service__head{max-width:40rem}
.service__head p{margin:.7rem 0 0;color:var(--ink-2)}
.cord{list-style:none;margin:2rem 0 0;padding:.6rem 2.6rem 5rem;display:grid;grid-template-columns:18px 1fr 18px 1fr 18px 1fr 18px 1fr 18px;grid-template-rows:auto auto 18px auto}
.cord>li{margin:0;position:relative;min-width:0}
.cord__node{grid-row:3/5;z-index:1}
.cord__node::before{content:"";display:block;width:18px;height:18px;border-radius:50%;background:var(--m2);box-shadow:inset 0 0 0 4px var(--m3)}
.cord__node b,.cord__node span{position:absolute;left:50%;translate:-50% 0;white-space:nowrap;line-height:1.35}
.cord__node b{top:calc(18px + .5rem);font-family:var(--f-d);font-weight:400;font-size:1.15rem}
.cord__node span{top:calc(18px + .5rem + 1.6rem);font-size:.875rem;color:var(--ink-2)}
.cord__seg{grid-row:2/4;display:grid;align-content:end;justify-items:center;padding:0 .4rem;text-align:center}
.cord__wire{display:block;width:100%;height:40px;margin-bottom:-22px;overflow:visible}
.cord__wire path{fill:none;vector-effect:non-scaling-stroke}
.cord__wire .w0{stroke:var(--s3);stroke-width:8;stroke-linecap:round}
.cord__wire .w1{stroke:var(--s1);stroke-width:4;stroke-dasharray:3 3;translate:0 -1px}
.cord__wire .w2{stroke:var(--s2);stroke-width:4;stroke-dasharray:3 3;stroke-dashoffset:3;translate:0 1px}
.cord__seg .txt{font-size:1rem;line-height:1.4;padding-bottom:.5rem}
.cord__seg .num{font-size:1.6rem;margin-right:.15rem}
.cord__seg--plain .txt{color:var(--ink-2)}
.cord__seg--cut::after{content:"";width:100%;height:0;margin:8.5px 0;border-top:2px dashed var(--s2)}
.cord__span{grid-row:1;grid-column:5/10;display:flex;align-items:baseline;gap:.4rem;border-top:1.5px solid var(--ink);padding:.5rem 0 0 1.4rem;margin-bottom:3.2rem}
.cord__span::before,.cord__span::after{content:"";position:absolute;top:-2px;width:1.5px;height:14px;background:var(--ink)}
.cord__span::before{left:9px}.cord__span::after{right:9px}
.cord__span .num{font-size:1.6rem}
.service__list{display:grid;gap:.6rem}
.svc{background:var(--day);clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,0 100%)}
.svc summary{display:grid;grid-template-columns:auto minmax(0,1fr) 1.8rem;align-items:center;gap:0 1.4rem;cursor:pointer;list-style:none;padding:1rem 1.4rem;min-height:4.2rem}
.svc summary::-webkit-details-marker{display:none}
.svc summary:hover{background:color-mix(in oklch,var(--m1) 30%,var(--day))}
.svc summary:focus-visible{outline:3px solid var(--brass-ink);outline-offset:-5px}
.svc__k{font-family:var(--f-d);font-size:1.5rem;letter-spacing:.2em;min-width:4.2rem}
.svc__gist{font-size:1.08rem}
.svc__mark{width:1.4rem;height:1.4rem;border-radius:50%;background:var(--m2);box-shadow:inset 0 0 0 2px var(--m3);background-image:linear-gradient(var(--m3),var(--m3));background-size:2px 60%;background-repeat:no-repeat;background-position:center;transition:rotate .25s}
.svc[open] .svc__mark{rotate:90deg}
.svc__body{padding:0 1.6rem 1.4rem calc(1.4rem + 5.6rem);columns:2 22rem;column-gap:3rem}
.svc__body p{margin:0;break-inside:avoid}
.svc__body p+p{margin-top:.7em}

/* 結帳 */
.checkout{padding:clamp(3rem,6vw,5rem) var(--gut);display:grid;grid-template-columns:minmax(0,7fr) minmax(0,4fr);grid-template-areas:"h h" "lead lead" "form order";gap:.6rem clamp(2rem,5vw,5rem);align-items:start}
.checkout h2{grid-area:h}.checkout__lead{grid-area:lead;margin:0 0 1.6rem;color:var(--ink-2);max-width:36em}
.order{grid-area:order;position:sticky;top:calc(var(--mast-h) + 1.2rem);background:var(--day-2);padding:1.4rem 1.4rem 1.2rem;clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,0 100%)}
.co{grid-area:form}
.order h3,.co h3{font-size:1.45rem;margin:0 0 .8rem}
.order__list{list-style:none;margin:0;padding:0}
.order__row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:.3rem 1rem;padding:.6rem 0;border-bottom:1px solid var(--rule);align-items:baseline}
.order__row .num{font-size:1.1rem}
.order__empty{color:var(--ink-2);padding:.4rem 0 .8rem;border-bottom:1px solid var(--rule);margin:0}
.order__sum{margin:.8rem 0 0;display:grid;gap:.3rem}
.order__sum div{display:flex;justify-content:space-between;gap:1rem}
.order__sum dd{margin:0}
.order__sum .total{border-top:1px solid var(--ink);padding-top:.5rem;margin-top:.3rem}
.order__sum .total .num{font-size:1.5rem}
html.js .co__pick{display:none}
html:not(.js) .order{display:none}
.co__pick{display:grid;grid-template-columns:1fr 1fr;gap:.6rem 1.4rem;margin:0 0 .6rem}
.f-grid{display:grid;grid-template-columns:1fr 1fr;gap:.9rem 1.4rem}
.fld{display:grid;align-content:start;gap:.25rem;min-width:0}
.fld--wide{grid-column:1/-1}
.fld label,.fld legend{font-size:.95rem;color:var(--ink-2)}
.fld input,.fld select,.fld textarea{width:100%;min-height:46px;border:0;border-bottom:1.5px solid var(--ink-2);background:var(--day-2);padding:.5rem .7rem;color:var(--ink);border-radius:0;font:inherit}
.fld input:focus-visible,.fld select:focus-visible,.fld textarea:focus-visible{outline:3px solid var(--brass-ink);outline-offset:1px}
.fld textarea{resize:vertical;line-height:1.6}
.fld input[aria-invalid=true]{border-color:oklch(0.5 0.17 28);background:oklch(0.97 0.02 28)}
.fld__err{font-size:.875rem;color:oklch(0.45 0.16 28);margin:0}
.pay{display:grid;gap:.4rem;margin:.2rem 0 0;border:0;padding:0}
.pay label{display:grid;grid-template-columns:auto 1fr;gap:0 .7rem;align-items:center;padding:.55rem .8rem;background:var(--day-2);cursor:pointer;font-size:1rem;color:var(--ink)}
.pay label:has(input:checked){box-shadow:inset 0 0 0 1.5px var(--ink)}
.pay input{grid-row:1/span 2;width:1.1rem;height:1.1rem;accent-color:var(--brass-ink);margin:0}
.pay label b{font-weight:500}.pay label span{font-size:.875rem;color:var(--ink-2);line-height:1.5}
.co__act{display:flex;flex-wrap:wrap;align-items:center;gap:.8rem 1.4rem;margin:1.2rem 0 0}
.co__msg{margin:.8rem 0 0}
.co__msg--bad{color:oklch(0.45 0.16 28)}
.co__msg--ok{background:var(--lit);color:var(--ink);padding:.7rem 1rem;max-width:34em}

/* ===== 版權頁 ===== */
.colophon{background:var(--night);color:var(--porc-2);padding:2.8rem var(--gut) 2rem}
.colophon__in{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:1.2rem 3rem}
.colophon__brand{display:flex;align-items:center;gap:.5rem;font-family:var(--f-d);font-size:1.35rem;letter-spacing:.12em;color:var(--porc);margin:0}
.colophon__brand svg{width:24px;height:24px;color:var(--brass)}
.colophon dl{display:grid;grid-template-columns:auto 1fr;gap:.25rem 1.2rem;margin:0;font-size:.95rem}
.colophon dt{color:var(--porc-2)}
.colophon dd{margin:0;color:var(--porc)}
.colophon__foot{grid-column:1/-1;display:flex;flex-wrap:wrap;justify-content:space-between;gap:.5rem 2rem;padding-top:1rem;margin-top:.4rem;border-top:1px solid var(--night-3);font-size:.875rem}
.colophon a{color:var(--porc)}

/* ===== 購物車抽屜 ===== */
.cart{position:fixed;inset:0 0 0 auto;width:min(460px,100%);height:100dvh;max-height:none;max-width:none;margin:0;border:0;padding:0;background:var(--day);color:var(--ink);--focus-ring:3px solid var(--brass-ink);--selection-bg:var(--brass);--selection-fg:var(--ink)}
.cart::backdrop{background:oklch(0.2 0.05 262 / .6)}
html.js .cart[open]{animation:f14-drawer .32s cubic-bezier(.2,.7,.2,1)}
@keyframes f14-drawer{from{translate:40% 0;opacity:.4}to{translate:0 0;opacity:1}}
.cart__in{display:grid;grid-template-rows:auto 1fr auto;height:100%}
.cart__head{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1.1rem 1.4rem;background:var(--day-2)}
.cart__head h2{font-size:1.6rem;display:flex;align-items:baseline;gap:.6rem}
.cart__head h2 small{font-family:var(--f-t);font-size:.95rem;color:var(--ink-2)}
.cart__close{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--day);cursor:pointer}
.cart__close svg{width:18px;height:18px}
.cart__body{overflow:auto;padding:0 1.4rem}
.cart__empty{padding:1.4rem 0;color:var(--ink-2);margin:0}
.cart:not([data-items="0"]) .cart__empty{display:none}
.cart__list{list-style:none;margin:0;padding:0}
.cart__row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"sw name rm" "sw unit rm" "sw qty line";gap:.2rem 1rem;align-items:center;padding:1rem 0;border-bottom:1px solid var(--rule)}
.cart__row .sw{grid-area:sw;align-self:start;margin-top:.2rem;width:1.7rem;height:1.7rem;border-radius:50%;background:var(--sw);box-shadow:0 0 0 1.5px var(--sw-2)}
.cart__name{grid-area:name;font-family:var(--f-d);font-size:1.1rem;line-height:1.3}
.cart__name small{display:block;font-family:var(--f-t);color:var(--ink-2);font-size:.9rem}
.cart__unit{grid-area:unit;font-size:.9rem;color:var(--ink-2)}
.cart__qty{grid-area:qty;margin-top:.4rem}
.cart__qty .stepper{grid-template-columns:40px 3rem 40px}
.cart__qty .stepper button{width:40px;height:40px;font-size:1.15rem;background:var(--day-2)}
.cart__qty .stepper button:hover{background:var(--day-3)}
.cart__qty .stepper output{height:40px;line-height:40px;font-size:1.15rem}
.cart__line{grid-area:line;justify-self:end;align-self:end;font-family:var(--f-d);font-size:1.3rem}
.cart__rm{grid-area:rm;align-self:start;font-size:.875rem;color:var(--ink-2);text-decoration:underline;text-underline-offset:.2em;cursor:pointer;min-height:44px}
.cart__rm:hover{color:var(--ink)}
.cart__foot{padding:1rem 1.4rem 1.4rem;background:var(--day-2);display:grid;gap:.9rem}
.cart__sum{margin:0;display:grid;gap:.2rem}
.cart__sum div{display:flex;justify-content:space-between;align-items:baseline;gap:1rem}
.cart__sum dd{margin:0}
.cart__sum .num{font-size:1.7rem}
.cart__act{display:flex;flex-wrap:wrap;gap:.6rem 1.2rem;align-items:center;margin:0}
.cart__more{text-decoration:underline;text-underline-offset:.2em;cursor:pointer;min-height:44px;color:var(--ink-2)}
.cart[data-items="0"] .cart__go{opacity:.45;pointer-events:none}

/* ===== 404 ===== */
.lost{min-height:calc(100dvh - var(--mast-h) - 8rem);display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:2rem var(--gut);align-items:center;padding:2rem var(--gut) 4rem;max-width:1200px;margin-inline:auto}
.lost .lamp{max-height:72vh;width:100%;height:auto;--r:1}
.lost h1{font-size:clamp(2.4rem,5vw,3.8rem);line-height:1.15;margin:0 0 1rem}
.lost p{max-width:28em;margin:0}
.lost p+p{margin-top:.7rem}
.lost__code{font-family:var(--f-d);font-size:1.4rem;color:var(--brass);letter-spacing:.1em}
.lost__act{display:flex;flex-wrap:wrap;gap:.8rem 1.4rem;align-items:center;margin-top:1.6rem}

/* ===== 窄螢幕 ===== */
@media (max-width:1180px){
  .spec__figs{grid-template-columns:1fr 1fr}
  .story h3{font-size:1.6rem}
}
@media (max-width:1040px){
  .checkout,.colophon__in{grid-template-columns:1fr;grid-template-areas:none}

@media (min-width:761px) and (max-width:1100px){

}
@media (max-width:1000px){
  .bench{padding-top:2.6rem}
  .bench__head{display:block}
  .bench__head h2{font-size:2.4rem}
  .bench__head p{font-size:.9375rem}
  .bench__in{display:flex;flex-direction:column}
  .bench__track{display:block;order:-1}
  .bench__frame{position:relative;top:0;height:min(50vh,430px);padding:4px 10px 6px}
  .only-d{display:none}.only-m{display:inline}
  .bench__flow{z-index:auto}
  .lamp .lab{display:none;visibility:hidden}
  .parts{display:flex;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;gap:12px;padding:6px 24px 10px;scroll-padding-inline:24px;scrollbar-width:none}
  .parts::-webkit-scrollbar{display:none}
  .story,.story:nth-child(even){flex:0 0 min(84%,420px);min-height:0;grid-column:auto;scroll-snap-align:start;align-content:start;padding:1.2rem 1.1rem 1.3rem;background:var(--night);clip-path:polygon(18px 0,100% 0,100% 100%,0 100%,0 18px)}
  .story::after{display:none}
  .story--outro{display:grid;grid-template-columns:minmax(0,1fr);align-content:center;justify-items:start;gap:.8rem}
  .story--outro p{margin:0;font-family:var(--f-d);font-size:1.7rem;line-height:1.3}
  .story h3{font-size:1.55rem}
  .story__text{font-size:.9375rem;line-height:1.7}
  .story__facts{font-size:.875rem;gap:.2rem 1rem}
  html.js .parts__nav{display:flex;justify-content:center;gap:1rem;margin:.6rem 0 0}
  .parts__nav button{width:48px;height:48px;border-radius:50%;background:var(--night-3);display:grid;place-items:center;cursor:pointer}
  .parts__nav svg{width:20px;height:20px}
  .buy{min-height:0;display:block;padding:1.6rem var(--gut) 2.6rem}
  .buy__do{margin-top:1.2rem}
  .buy h2{font-size:1.9rem}
  .colors__row{gap:.5rem;justify-content:space-between}
  .swatch{width:30%}
  .swatch small{display:none}
}
@media (max-width:760px){
  :root{--mast-h:0px}
  .mast{position:static;height:56px}
  .night{background:var(--desk)}
  .night__frame{width:100%}
  .night__scene{aspect-ratio:390/760}
  .scene--d{display:none}.scene--m{display:block}
  .night__where{left:16px;top:20px;font-size:.8125rem;letter-spacing:.14em}
  .night__lit{left:4%;top:55.4%;width:92%;height:36.4%}
  .night h1{font-size:4.6rem}
  .night h1 small{font-size:1rem;letter-spacing:.24em}
  .night__lead{font-size:.9375rem;line-height:1.65;margin-top:.5rem;max-width:19em}
  .night__buy{margin-top:.6rem;gap:.2rem .9rem}
  .night__price{font-size:1.5rem}
  .night__ship{font-size:.8125rem}
  .night__buy .btn{min-height:44px;padding:.4em 1.1em;font-size:1rem}
  .dial{--R:58px;--dot:30px;--kn:50px;--cy:76px;right:auto;left:6px;top:70px;width:156px;height:150px}
  .dial__pos{font-size:.75rem}
  .dial__pos input{border-width:7px}
  .dial__hint{font-size:.75rem}
  .spec{padding-top:2.6rem}
  .spec__figs{grid-template-columns:1fr;margin-top:1.4rem}
  .elev__svg{max-height:none;width:84%;margin-inline:auto}
  .elev__svg .dim text{font-size:40px}
  .reach__svg .luxT,.reach__svg .bookT,.reach__svg .scale text{font-size:24px}
  .mats{margin-top:2.4rem}
  .mats__row{flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;scroll-snap-type:x mandatory;gap:1.1rem;margin:1rem calc(-1 * var(--gut)) 0;padding:.3rem var(--gut) .8rem;scroll-padding-inline:var(--gut)}
  .mat{flex:0 0 8.6rem;max-width:none;scroll-snap-align:start}
  .mat:nth-child(even){margin-top:0}
  .mat__chip{width:5.6rem;height:5.6rem;margin-bottom:.3rem}
  .mat__name{font-size:1.3rem}
  .mat__note{font-size:.875rem}
  .cord{display:flex;flex-direction:column;padding:.2rem 0 1rem 0;margin:1.4rem 0 0 8px;border-left:9px solid transparent;border-image:repeating-linear-gradient(-58deg,var(--s2) 0 3px,var(--s1) 3px 6px) 9}
  .cord__span{order:1}.cord__end{order:2}
  .cord__node{display:flex;align-items:baseline;flex-wrap:wrap;gap:0 .7rem;padding:.3rem 0 .3rem 1.6rem;min-height:2.3rem}
  .cord__node::before{position:absolute;left:-14px;top:.5rem}
  .cord__node b,.cord__node span{position:static;translate:none;white-space:normal}
  .cord__seg{display:flex;align-items:baseline;gap:.3rem;padding:.2rem 0 .2rem 1.6rem;text-align:left}
  .cord__seg::after,.cord__wire{display:none}
  .cord__seg .txt{padding:0}
  .cord__seg--cut{display:none}
  .cord__span{display:flex;border:0;margin:0;padding:.2rem 0 .2rem 1.6rem}
  .cord__span::before,.cord__span::after{display:none}
  .svc summary{grid-template-columns:auto minmax(0,1fr) 1.5rem;gap:0 .8rem;padding:.8rem 1rem}
  .svc__k{font-size:1.2rem;min-width:0;letter-spacing:.1em}
  .svc__gist{font-size:.95rem;line-height:1.5}
  .svc__body{padding:0 1rem 1.1rem;columns:1;font-size:.9375rem}
  .checkout{padding-block:2.4rem 2.6rem;gap:.4rem}
  .checkout__lead{margin-bottom:.8rem}
  .f-grid{gap:.7rem}
  .fld input,.fld select{min-height:44px}
  .order{padding:1.1rem 1rem}
  .co__pick,.f-grid{grid-template-columns:1fr}
  .colophon{padding-block:2rem 1.4rem}
  .colophon__in{gap:.8rem}
  .colophon dl{font-size:.875rem}
  .cart{width:100%}
  .cart__row{grid-template-areas:"sw name name" "sw unit unit" "qty qty line" "rm rm rm"}
  .cart__rm{justify-self:end}
  .lost{grid-template-columns:1fr;padding-top:1rem}
  .lost .lamp{max-height:46vh}
}

@media screen and (prefers-reduced-motion:no-preference){
@supports (animation-timeline:view()) and (timeline-scope:--a){
  html.js .bench__in{timeline-scope:--s1,--s2,--s3,--s4,--s5,--s6,--s7,--s8,--s9,--buy;animation:f14-k1 linear both,f14-k2 linear both,f14-k3 linear both,f14-k4 linear both,f14-k5 linear both,f14-k6 linear both,f14-k7 linear both,f14-k8 linear both,f14-k9 linear both,f14-r linear both,f14-on linear both;animation-timeline:--s1,--s2,--s3,--s4,--s5,--s6,--s7,--s8,--s9,--buy,--buy;animation-range:entry 12% entry 88%,entry 12% entry 88%,entry 12% entry 88%,entry 12% entry 88%,entry 12% entry 88%,entry 12% entry 88%,entry 12% entry 88%,entry 12% entry 88%,entry 12% entry 88%,entry 0% entry 70%,entry 55% entry 100%}
  @media (min-width:1001px){html.js .story[data-k="1"]{view-timeline:--s1 block}html.js .story[data-k="2"]{view-timeline:--s2 block}html.js .story[data-k="3"]{view-timeline:--s3 block}html.js .story[data-k="4"]{view-timeline:--s4 block}html.js .story[data-k="5"]{view-timeline:--s5 block}html.js .story[data-k="6"]{view-timeline:--s6 block}html.js .story[data-k="7"]{view-timeline:--s7 block}html.js .story[data-k="8"]{view-timeline:--s8 block}html.js .story[data-k="9"]{view-timeline:--s9 block}html.js .buy{view-timeline:--buy block}}
  @media (max-width:1000px){html.js .story[data-k="1"]{view-timeline:--s1 inline}html.js .story[data-k="2"]{view-timeline:--s2 inline}html.js .story[data-k="3"]{view-timeline:--s3 inline}html.js .story[data-k="4"]{view-timeline:--s4 inline}html.js .story[data-k="5"]{view-timeline:--s5 inline}html.js .story[data-k="6"]{view-timeline:--s6 inline}html.js .story[data-k="7"]{view-timeline:--s7 inline}html.js .story[data-k="8"]{view-timeline:--s8 inline}html.js .story[data-k="9"]{view-timeline:--s9 inline}html.js .story--outro{view-timeline:--buy inline}}
}}
@keyframes f14-k1{from{--k1:0}to{--k1:1}}@keyframes f14-k2{from{--k2:0}to{--k2:1}}@keyframes f14-k3{from{--k3:0}to{--k3:1}}@keyframes f14-k4{from{--k4:0}to{--k4:1}}@keyframes f14-k5{from{--k5:0}to{--k5:1}}@keyframes f14-k6{from{--k6:0}to{--k6:1}}@keyframes f14-k7{from{--k7:0}to{--k7:1}}@keyframes f14-k8{from{--k8:0}to{--k8:1}}@keyframes f14-k9{from{--k9:0}to{--k9:1}}
@keyframes f14-r{from{--r:0}to{--r:1}}
@keyframes f14-on{from{--on:0}to{--on:1}}

@media (prefers-reduced-motion:reduce){
  .lampart .c1,.lampart .c2,.lampart .c3,.scene .poolDot,.scene .poolCore,.scene .beam{transition:none}
  .dial__knob i{transition:none}
  .nod,html.js .bench:has(input:checked) .nod{animation:none}
  .badge.is-bump{animation:none}
  html.js .cart[open]{animation:none}
  .svc__mark{transition:none}
}
@media print{
  :root{--night:#fff;--night-2:#fff;--night-3:#eee;--night-4:#000;--desk:#fff;--desk-2:#ccc;--desk-3:#999;--porc:#000;--porc-2:#222;--porc-3:#666;--lit:#f2f2f2;--beam:#ddd;--day:#fff;--day-2:#fff;--day-3:#ccc;--ink:#000;--ink-2:#222;--rule:#999;--c1:#f2f2f2;--c2:#cfcfcf;--c3:#9a9a9a;--m1:#e0e0e0;--m2:#bdbdbd;--m3:#7a7a7a;--s1:#777;--s2:#444;--s3:#111;--rim:#e6e6e6;--brass:#555;--brass-ink:#333}
  .mast,.cart,.night__buy .btn,.buy__act,.co__act,.dial,.parts__nav,.bench__hint{display:none !important}
  .bench__in{display:block;background:#fff}
  .bench__track{display:block}
  .bench__frame{position:static;height:auto;padding:0}
  .bench__frame .lamp{max-height:60vh;height:auto}
  .lamp .light{display:none}
  .parts{display:block}
  .story{min-height:0;padding:.6rem 0;break-inside:avoid}
  .story::after{display:none}
  .buy{min-height:0;display:block;padding:1rem 0}
  .colophon{background:#fff;color:#000}
  a{text-decoration:underline}
}

}
