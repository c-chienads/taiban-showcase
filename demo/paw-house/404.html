/* 狗／貓開關：毛色卡——杏桃色大色塊上站著牠們，底下一條深色標籤列掛兩張吊牌 */
.pets{position:relative;isolation:isolate;display:grid;grid-template-columns:1.45fr 1fr;align-items:end;gap:0 6px;padding:26px 16px 0;margin:4px 0 0;border:0;min-width:0}

.pl{position:relative;display:grid;justify-items:center;gap:8px;cursor:pointer}

.day.co .tag{left:4px}

.cal-foot{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px}
/* 毛色卡：一排色樣，每格上面是色、下面是名字 */
.key{display:flex;flex-wrap:wrap;width:100%;margin:0;padding:0;background:var(--paper);box-shadow:0 2px 0 var(--edge);font-size:.8125rem;font-weight:500}

.kb{display:inline-flex;flex-wrap:wrap;gap:4px 14px;margin:0 0 0 auto;font-size:.8125rem;color:var(--ink-2);max-width:none}
.kb span{display:inline-flex;align-items:center;gap:6px}
.kb kbd{font:800 .75rem/1 var(--f-n);padding:3px 6px 2px;background:var(--paper);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink),0 2px 0 var(--ink)}
.nojs{font-size:.9375rem;margin:6px 0 0;padding:10px 14px;background:var(--paper);box-shadow:0 2px 0 var(--edge);max-width:46em}
html.js .nojs{display:none}

/* 結果：一張住房單——上緣深色標頭加尺標、右上角剪角、左邊打孔；房型是掛在上面的住房牌 */
.res{--pl:clamp(40px,3.6vw,54px);--pr:clamp(14px,2vw,28px);position:relative;margin-top:clamp(14px,1.6vw,24px);padding:0 var(--pr) clamp(16px,2vw,26px) var(--pl);background:var(--paper);box-shadow:0 3px 0 var(--edge);display:grid;grid-template-columns:minmax(0,27rem) minmax(0,1fr);grid-template-areas:"t t" "a r" "b c";gap:16px clamp(28px,3.6vw,56px);align-items:start}
.res::before{content:"";position:absolute;left:0;top:44px;bottom:6px;width:calc(var(--pl) - 4px);background:radial-gradient(circle,var(--bg) 0 5.5px,var(--edge) 6px 7.5px,transparent 8px) 0 0/100% 84px no-repeat space;pointer-events:none}
.res::after{content:"";position:absolute;top:0;right:0;width:30px;height:30px;background:linear-gradient(225deg,var(--bg) 0 46%,transparent 46%);pointer-events:none}
.res-top{grid-area:t;display:flex;align-items:center;gap:16px;max-width:none;margin:0 calc(var(--pr) * -1) 4px calc(var(--pl) * -1);padding:7px calc(var(--pr) + 18px) 5px var(--pl);background:var(--ink);color:var(--paper);font-family:var(--f-d);font-size:1.15rem;line-height:1.3}
.res-top::after{content:"";flex:1;height:9px;background:repeating-linear-gradient(90deg,rgb(255 255 255 / .6) 0 1.5px,transparent 1.5px 8px);opacity:.75}
.res-a{grid-area:a}
.sum{display:flex;flex-wrap:wrap;align-items:flex-end;gap:6px 14px;font-size:clamp(1.15rem,1.5vw,1.4rem);line-height:1.3}
.sum .num{font-size:1.06em}
.sum-a,.sum-b{display:grid;gap:1px;min-width:0}
.f-k{font-family:var(--f-b);font-size:.8125rem;line-height:1.3;font-weight:500;color:var(--ink-2);letter-spacing:.08em}
.f-v{padding-bottom:3px;border-bottom:1.5px solid var(--edge);white-space:nowrap}
.arw{width:36px;height:16px;flex:none;align-self:flex-end;margin-bottom:12px}
.sum-n{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 8px;margin:8px 0 0}
.nn{font-size:2rem;line-height:1.1;font-weight:900}
.nn-u{font-family:var(--f-d);font-size:1.3rem}
.sum-wk{font-size:.9375rem}
.rms{grid-area:r;display:flex;gap:12px;align-items:stretch;align-self:end;margin:0;padding:0;border:0;min-width:0}
/* 住房牌：左上斜角、右上一個吊孔；被選的那張換成杏桃色，左邊多一條深色邊，孔也填滿 */
.rm{position:relative;isolation:isolate;flex:var(--rw) 1 0;min-width:0;display:grid;align-content:space-between;gap:6px;padding:16px 14px 12px 16px;min-height:118px;cursor:pointer;filter:drop-shadow(0 2px 0 rgb(32 44 74 / .32))}
.rm::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--manila);clip-path:polygon(0 16px,16px 0,100% 0,100% 100%,0 100%)}
.rm::after{content:"";position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--paper);box-shadow:0 0 0 1.5px var(--ink);pointer-events:none}
.rm:hover::before{background:var(--manila-2)}
.rm:has(:checked)::before{background:linear-gradient(90deg,var(--ink) 0 7px,var(--apri) 7px)}
.rm:has(:checked)::after{background:var(--ink)}
.rm:has(:checked) .rm-name,.rm:has(:checked) .rm-sum,.rm:has(:checked) .rm-x{padding-left:4px}
.rm[data-sp="cat"]{display:none}
.stay:has(#pet-cat:checked) .rm[data-sp="dog"]{display:none}
.stay:has(#pet-cat:checked) .rm[data-sp="cat"]{display:grid}
.rm-in{position:absolute;inset:0;margin:0;appearance:none;-webkit-appearance:none;border-radius:0;cursor:pointer;background:transparent;z-index:3}
.rm-in:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.rm-name{display:grid;line-height:1.3}
.rm-name b{font-family:var(--f-d);font-weight:400;font-size:1.2rem}
.rm-name small{font-size:.8125rem;color:var(--ink-2)}
.rm-sum{font-size:1.5rem;line-height:1.1;white-space:nowrap}
.rm-sum .cur,.tot .cur{font-family:var(--f-n);font-weight:800;font-size:.75rem;margin-right:4px;vertical-align:.3em}
.rm-x{display:inline-flex;align-items:center;gap:6px;font-size:.8125rem;line-height:1.3}
.rm-x i{display:inline-block;width:16px;height:12px;background:var(--hatch-w),var(--l3)}
.res-b{grid-area:b}
.tot{display:none;gap:10px}
.tot-n{display:flex;align-items:baseline;flex-wrap:wrap;gap:0 4px;margin:0}
.tot-l{font-size:.8125rem;margin-right:8px;align-self:center}
.big{font-size:clamp(4.2rem,7.4vw,6.6rem);line-height:.92;font-weight:900;letter-spacing:-.01em}
.pebs{display:flex;gap:4px;align-items:flex-start;max-width:30rem}
.pb{flex:var(--g) 1 0;display:grid;gap:3px;min-width:0}
.pb[hidden]{display:none}
.pb i{display:block;height:24px;background:var(--pick);box-shadow:inset 0 -3px 0 rgb(32 44 74 / .22);transform-origin:left center;transition:transform .3s cubic-bezier(.3,.7,.25,1) calc(var(--k,0) * 48ms + 80ms)}
.pb.wk i{background:var(--apri-2)}
.pb.x i{background:var(--hatch-w),var(--l3);box-shadow:none}
.pb.ad i{background:var(--ink);box-shadow:none}
.pb small{font-size:.75rem;font-weight:700;line-height:1.2;text-align:center}
.res.grow .pb i{transform:scaleX(0);transition:none}
.rm-full{margin:0;font-size:.875rem;line-height:1.55;max-width:30rem}
.res-c{grid-area:c;display:flex;flex-wrap:wrap;align-items:center;gap:12px 28px}
.adds{display:flex;flex-wrap:wrap;gap:6px 22px;align-items:center;border:0;padding:0;margin:0}
.adds legend{float:left;font-family:var(--f-d);font-size:1.1rem;margin-right:6px;padding:0}
.add{display:inline-flex;align-items:center;gap:10px;cursor:pointer;min-height:44px}
.add input{width:22px;height:22px;margin:0;accent-color:var(--ink);flex:none}
.add b{font-weight:500;font-size:.9375rem}
.add small{display:block;font-size:.8125rem;color:var(--ink-2);line-height:1.3}
html:not(.js) .adds{display:none}
.res-note{font-size:.8125rem;color:var(--ink-2);max-width:28em;line-height:1.6;margin:0}
.cta,.send{--cta:var(--ink);display:inline-flex;align-items:center;gap:12px;background:linear-gradient(135deg,var(--paper) 0 8px,transparent 8px),linear-gradient(315deg,var(--paper) 0 8px,transparent 8px),var(--cta);color:var(--paper);text-decoration:none;font-family:var(--f-d);border:0;border-radius:0;min-height:48px}
.cta{font-size:1.15rem;padding:12px 24px}
.cta:hover,.send:hover{--cta:oklch(0.4 0.09 250)}
.cta .arw{width:30px;margin:0;align-self:center}

/* ---------- 一般區塊 ---------- */
.sec{position:relative;padding:clamp(56px,7vw,108px) var(--gut)}
.sec h2{font-size:clamp(1.9rem,3.2vw,2.9rem);line-height:1.22;max-width:17em}
.sec-lead{margin-top:14px;max-width:34em}
.hs{display:inline-block}

/* 公寓剖面 */
.apt{display:grid;gap:20px;padding-top:clamp(24px,3vw,40px);padding-bottom:0}
.apt-h{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,26em);gap:12px 56px;align-items:end}
.apt-h .sec-lead{margin:0}
.apt-fig{display:grid;grid-template-columns:minmax(0,22rem) minmax(0,54rem);gap:0 clamp(24px,3vw,48px);justify-content:start}
.apt-txt{position:relative}
.fl{position:absolute;left:0;right:0;top:calc(var(--t) * 1%);min-height:calc(var(--h) * 1%);padding:10px 0 0;border-top:2px solid currentColor;display:grid;align-content:start;gap:4px}
.fl-t{display:flex;align-items:baseline;gap:10px;margin:0;font-family:var(--f-d);line-height:1.2}
.fl-t b{font-weight:400;font-size:1.5rem;background:var(--ink);color:var(--paper);padding:0 .42em;line-height:1.3}
.fl-t span{font-size:1.1rem}
.fl-r{display:grid;gap:4px;font-size:.875rem;line-height:1.45}
.fl-r b{font-family:var(--f-d);font-weight:400;font-size:1.05rem;margin-right:8px}
.fl-r .num{font-weight:700}
.fl-p{display:block;color:var(--ink-2)}
.fl-n{margin:2px 0 0;font-size:.8125rem;line-height:1.55;color:var(--ink-2)}
.apt-d{margin:0;display:grid;gap:8px}
.apt-s{display:block;width:100%;height:auto;overflow:visible}
.apt-s .fl1{fill:oklch(0.9 0.04 228)}
.apt-s .fl2{fill:oklch(0.94 0.028 228)}
.apt-s .fl3{fill:var(--apri)}
.apt-s .room{fill:var(--paper)}
.apt-s .hl,.apt-s .hl-thin,.apt-s .sc{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.apt-s .hl-thin{stroke-width:1.2}
.apt-s .hl-st{stroke-width:1.6}
.apt-s .hl-roof{stroke-width:3.2}
.apt-s .hl-g{stroke-width:2.6}
.apt-s .mat{fill:var(--l1)}
.apt-s .bowl,.apt-s .shelf{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round}
.apt-s .pot,.apt-s .door,.apt-s .fx{fill:var(--apri-2);stroke:var(--ink);stroke-width:1.4}
.apt-s .leaf{fill:oklch(0.56 0.08 150)}
.apt-s .win{fill:var(--paper);stroke:var(--ink);stroke-width:2}
.apt-s .p-body,.apt-s .p-tail,.apt-s .p-ear,.apt-s .p-far{fill:var(--ink)}
.apt-s .p-sep{stroke:var(--paper);stroke-width:2.4}
.apt-s .p-shut,.apt-s .p-cut{fill:none;stroke:var(--paper);stroke-width:3;stroke-linecap:round}
.apt-s .p-eye{fill:var(--paper)}
.apt-s .p-nose{fill:var(--ink)}
.apt-s .dimt{font:800 13px var(--f-n);fill:var(--ink)}
.apt-cap{font-size:.8125rem;color:var(--ink-2);display:flex;align-items:center;gap:10px}
.sc-k{display:inline-block;width:calc(50 / 560 * 100%);max-width:78px;min-width:34px;height:8px;border:2px solid var(--ink);border-top:0;flex:none}

/* 從開窗到關燈 */
.rhythm{display:grid;grid-template-columns:3.4em minmax(0,1fr);grid-template-areas:". h" ". lead" "wd evd" ". curve" "wc evc";column-gap:18px;padding-top:clamp(40px,4vw,64px);padding-bottom:clamp(40px,4vw,64px)}
.rhythm h2{grid-area:h}
.rhythm .sec-lead{grid-area:lead;margin-bottom:30px}
.who{display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--f-d);font-size:1.3rem;line-height:1.2;margin:0;justify-self:center}
.who svg{width:26px;height:26px}
.who-d{grid-area:wd;align-self:end;padding-bottom:20px}
.who-c{grid-area:wc;align-self:start;padding-top:14px}
.evs{display:grid;grid-template-columns:repeat(32,minmax(0,1fr));gap:12px 0;align-items:end}
.evs-d{grid-area:evd;padding-bottom:14px}
.evs-c{grid-area:evc;padding-top:14px;align-items:start}
.ev{grid-column:var(--c) / span 6;grid-row:var(--r);display:grid;gap:0;padding:0 14px 0 10px;border-left:2px solid currentColor;font-size:.9375rem;line-height:1.55}
.evs-d .ev{grid-row:calc(3 - var(--r))}
.ev .t{font-size:1rem}
.cv{grid-area:curve;position:relative}
.curve{width:100%;height:auto;aspect-ratio:1600/300;display:block;overflow:visible}
.curve .sk-0{fill:oklch(0.9 0.06 70)}
.curve .sk-1{fill:oklch(0.95 0.03 95)}
.curve .sk-2{fill:oklch(0.97 0.015 220)}
.curve .sk-3{fill:oklch(0.95 0.025 228)}
.curve .sk-4{fill:oklch(0.91 0.045 228)}
.curve .sk-5{fill:oklch(0.85 0.085 62)}
.curve .sk-6{fill:oklch(0.6 0.08 275)}
.curve .sk-7{fill:oklch(0.42 0.085 262)}
.curve .sk-cut{fill:var(--bg)}
.curve .ax{stroke:var(--ink);stroke-width:2}
.curve .tk{stroke:var(--ink);stroke-width:2}
.curve .ln-h{fill:none;stroke:var(--paper);stroke-width:9;stroke-linecap:round;opacity:.9}
.curve .ln{fill:none;stroke:var(--ink);stroke-width:3.5;stroke-linecap:round}
.curve .ln-c{stroke-dasharray:2 9;stroke-width:5}
.curve .dot{stroke:var(--ink);stroke-width:3}
.curve .dot-d{fill:var(--paper)}
.curve .dot-c{fill:var(--apri-2)}
.hours{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);display:flex;justify-content:space-between;font-size:.8125rem;margin:0;pointer-events:none}
.hours li{width:0;display:flex;justify-content:center}
.hours li span{background:var(--ink);color:var(--paper);padding:0 6px;line-height:1.5}

/* 關燈之後：一大片安靜的夜 */
.night{position:relative;margin:clamp(12px,2vw,28px) calc(var(--gut) * -1) 0;background:var(--night);color:var(--paper);min-height:clamp(380px,34vw,480px);padding:clamp(80px,8vw,116px) var(--gut) 60px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-content:start;gap:8px 32px;overflow:hidden}
.edge-n{top:-1px}
.edge-n path{fill:var(--bg)}
.night-t{font-size:1rem;color:var(--paper);display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 18px;max-width:none}
.night-t .num{font-size:clamp(5.6rem,11vw,10rem);line-height:.9;font-weight:900;color:var(--apri);letter-spacing:-.02em}
.night-s{font-size:clamp(1.15rem,1.6vw,1.45rem)}
.night-n{font-size:.9375rem;color:oklch(0.88 0.03 250);margin:0}
.lamp{grid-column:2;grid-row:1 / span 2;width:120px;height:120px;align-self:center;margin-right:clamp(0px,8vw,140px)}
.lamp .lg3{fill:oklch(0.86 0.085 64 / .1)}.lamp .lg2{fill:oklch(0.86 0.085 64 / .2)}.lamp .lg1{fill:oklch(0.86 0.085 64 / .5)}.lamp .lb{fill:var(--apri)}
.sleeper{position:absolute;bottom:34px;height:auto;overflow:visible}
.sleeper .p-body,.sleeper .p-tail,.sleeper .p-ear{fill:oklch(0.46 0.075 262)}
.sleeper .p-sep{stroke:var(--night);stroke-width:3}
.sleeper .p-shut{fill:none;stroke:var(--night);stroke-width:3.4;stroke-linecap:round}
.sleeper .p-nose{fill:oklch(0.46 0.075 262)}
.sleeper-d{width:150px;left:12%}
.sleeper-c{width:84px;right:16%}

/* 美容：杏桃色、上下緣是牙剪剪出來的鋸齒；體型是毛色卡、價錢是吊牌 */
.groom{background:var(--apri);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr) minmax(0,1fr);column-gap:44px;align-items:start;padding-block:clamp(72px,7vw,108px)}
.edge-t{top:-1px}.edge-t path{fill:var(--bg)}
.edge-nb{bottom:-1px;transform:scaleY(-1)}.edge-nb path{fill:var(--bg)}
.edge-b{bottom:-1px;transform:scaleY(-1)}.edge-b path{fill:var(--bg)}
.groom h2{grid-column:1 / 3;grid-row:1;max-width:21em}
.groom .sec-lead{grid-column:3;grid-row:1;align-self:end;margin:0}
.sz{grid-column:1 / -1;grid-row:2;display:flex;flex-wrap:wrap;gap:10px;margin:24px 0 8px;border:0;padding:0;min-width:0}
.sz label{position:relative;display:grid;grid-template-rows:56px auto;width:6.8rem;background:var(--paper);box-shadow:0 3px 0 rgb(32 44 74 / .3);cursor:pointer;font-family:var(--f-d);font-size:1.1rem}
.sz input{position:absolute;inset:0;margin:0;appearance:none;-webkit-appearance:none;cursor:pointer;border-radius:0;z-index:2}
.sz-sw{display:flex;align-items:flex-end;justify-content:center;gap:2px;padding-bottom:7px;background:var(--manila)}
.sz-p{display:block;width:26px;height:26px;fill:var(--ink);flex:none}
.sz-t{padding:5px 8px 6px;text-align:center;line-height:1.3;border-top:2px solid var(--ink)}
.sz label:hover .sz-sw{background:var(--manila-2)}
.sz label:has(:checked) .sz-sw{background:var(--ink)}
.sz label:has(:checked) .sz-p{fill:var(--apri)}
.sz label:has(:checked) .sz-t{background:var(--ink);color:var(--paper)}
.sz input:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.gm-fig{grid-column:2;grid-row:3 / span 3;align-self:center;margin:24px 0 0}
.gm-fig svg{width:100%;height:auto;overflow:visible}
.gm-cat{display:none}
.groom:has(#gsz-c:checked) .gm-dog{display:none}
.groom:has(#gsz-c:checked) .gm-cat{display:block}
.gm-fig .p-body,.gm-fig .p-ear{fill:var(--ink);stroke:var(--apri);stroke-width:3}
.gm-fig .p-tail{fill:var(--ink)}
.gm-fig .p-far{fill:oklch(0.42 0.065 252);stroke:var(--apri);stroke-width:3}
.gm-fig .p-fur{fill:none;stroke:oklch(0.46 0.075 250);stroke-width:2.2;stroke-linecap:round}
.gm-fig .p-cut{fill:none;stroke:var(--apri);stroke-width:3.4}
.gm-fig .p-eye{fill:var(--apri)}
.gm-fig .p-nose{fill:oklch(0.18 0.04 252)}
.mk rect{fill:var(--paper);stroke:var(--ink);stroke-width:2.5;transition:fill .15s}
.mk text{font:800 17px var(--f-n);fill:var(--ink)}
.svc{display:grid;gap:4px;margin-top:22px;padding-top:10px;border-top:2px solid var(--ink)}
.svc-1,.svc-2,.svc-3{grid-column:1}
.svc-4,.svc-5,.svc-6{grid-column:3}
.svc-1,.svc-4{grid-row:3}.svc-2,.svc-5{grid-row:4}.svc-3,.svc-6{grid-row:5}
.svc-n{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;margin:0}
.svc-n b{font-family:var(--f-d);font-weight:400;font-size:1.3rem}
.svc-i{display:inline-grid;place-items:center;width:28px;height:28px;background:var(--ink);color:var(--paper);font-size:.95rem}
.svc-min{font-size:.8125rem}
.svc-min .num{font-weight:700}
.svc-d{font-size:.9375rem;line-height:1.65;margin:0}
.svc-p{margin:6px 0 0;font-size:1.6rem;line-height:1.15}
.pz{display:none;align-items:baseline;gap:5px;position:relative;padding:2px 12px 3px 22px;background:var(--paper);clip-path:polygon(10px 0,100% 0,100% 100%,10px 100%,0 50%)}
.pz::before{content:"";position:absolute;left:10px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--apri)}
.pz .cur{font-family:var(--f-n);font-weight:800;font-size:.75rem}
.pz-no{font-size:.875rem;line-height:1.5;padding-block:4px}
.gm-note{grid-column:1 / -1;grid-row:6;margin-top:32px;font-size:.875rem}

/* 入住那天：腳印步道 */
.notes{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:36px 28px;overflow:hidden}
.walk{display:block;width:100%;height:auto;align-self:start;overflow:visible}
.walk .pp{fill:oklch(0.6 0.1 240)}
.walk-a{grid-column:1 / 6;grid-row:3;margin-top:4px}
.walk-b{grid-column:6 / 9;grid-row:4;margin-top:4px}
.trail-m{display:none}
.notes > :not(svg){position:relative;z-index:1}
.notes h2{grid-column:1 / span 7;grid-row:1}
.ph h3{font-size:1.7rem;display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px}
.ph-k{display:inline-grid;place-items:center;width:44px;height:44px;background:var(--ink);color:var(--paper);font-size:1.3rem;font-weight:900}
.ph h3 small{font-family:var(--f-n);font-size:1rem;font-weight:800;color:var(--ink-2)}
.ph ul{margin-top:10px;display:grid;gap:8px}
.ph li{position:relative;padding-left:22px;line-height:1.7}
.ph li::before{content:"";position:absolute;left:0;top:.5em;width:13px;height:13px;background:var(--ink);-webkit-mask:var(--paw-d) center/contain no-repeat;mask:var(--paw-d) center/contain no-repeat;transform:rotate(90deg)}
.ph-1{grid-column:1 / span 5;grid-row:2}
