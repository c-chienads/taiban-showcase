.ww>div{min-width:0}
.ww dt{font:500 13px/1.6 var(--sans);letter-spacing:.16em;color:var(--fg3)}
.ww dd{margin:1px 0 0;font:400 15px/1.75 var(--sans);color:var(--fg2)}
.who{grid-column:3/5;grid-row:1;display:none;gap:8px;align-self:center;margin:0}
.who>span[aria-hidden]{min-width:3.8em;padding:1px 8px 0;border:1.5px solid var(--fg2);text-align:center;font:500 13px/1.6 var(--sans);color:var(--fg2)}
.who>span.x{border:1.5px dashed var(--edge);color:transparent}
body:has(#who-all:checked) .who{display:flex}
body:has(#who-all:checked) .ww{display:none}
body:has(#who-all:checked) .it-pad{padding-top:12px;padding-bottom:12px}

/* ---------- 茶色玻璃：收尾（進度、列印、連結） ---------- */
.send{margin-top:88px}
.send-in{width:var(--wrap);margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);column-gap:72px;padding:64px 0 72px}
.s-count{grid-column:1}
.s-num{margin:0;font:400 20px/1.4 var(--sans);color:var(--fg2)}
.s-num .num{font-size:var(--d1);line-height:1;color:var(--fg);margin:0 6px}
.s-num .num.k{color:var(--mk)}
.s-num .sep{font:400 var(--d2)/1 var(--disp);color:var(--fg3)}
.s-count .tally{justify-content:flex-start;margin-top:22px;--zl:84px;--zm:62px;--zsm:46px}
.s-count .prog{margin-top:14px}
.tea .tk .sl{fill:var(--teaEdge)}
.s-act{grid-column:2;align-self:end}
.acts{display:flex;flex-wrap:wrap;gap:12px}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 24px;border:2px solid var(--fg);background:none;font:500 15.5px/1.3 var(--sans);letter-spacing:.06em;color:var(--fg);cursor:pointer;text-decoration:none;transition:background-color .2s var(--ease),color .2s var(--ease)}
.btn:hover{background:var(--fg);color:var(--teaDeep)}
.btn.pri{background:var(--fg);color:var(--teaDeep)}
.btn.pri:hover{background:var(--mk);border-color:var(--mk);color:var(--teaDeep)}
.btn:focus-visible{outline:var(--focus-ring);outline-offset:4px}
html:not(.js) .act-print,html:not(.js) .acts .btn{display:none}
.linkbox{flex-basis:100%;min-height:46px;padding:6px 12px;border:2px solid var(--fg2);background:var(--teaDeep);color:var(--fg);font:400 14px/1.4 var(--sans)}
.nojs{margin:0;font:400 15px/1.7 var(--sans);color:var(--fg2)}
html.js .nojs{display:none}
.r-note{margin:20px 0 0;max-width:36em;font:400 14.5px/1.75 var(--sans);color:var(--fg3)}
.disc{margin:14px 0 0;max-width:36em;font:400 14px/1.8 var(--sans);color:var(--fg3)}
.r-done{display:none;margin:20px 0 0;font:500 16px/1.7 var(--sans);color:var(--fg)}
.r-done a{color:var(--mk);font-weight:500}
html[data-complete] .r-done{display:block}

/* ---------- 其他區塊 ---------- */
.sec{padding-top:128px}
.sec-in{width:var(--wrap);margin:0 auto}
.sec h2{margin:0;font:400 var(--d2)/1.15 var(--disp);letter-spacing:.05em;text-shadow:1.5px 1.5px 0 var(--frostHi)}
.tea h2{text-shadow:none}
.lede{max-width:34em;margin:16px 0 0;font:400 16.5px/1.9 var(--sans);color:var(--fg2)}

/* 範圍：左邊茶色玻璃上貼著的五件，右邊霧面玻璃上沒寫的四件（一條膠帶＝不在這裡） */
.panes{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);margin-top:48px}
.in-pane,.out-pane{min-width:0;padding:44px 44px 48px}
.in-pane{background:var(--tea) url(assets/tea.svg) 0 0/240px 240px;color:var(--vinyl)}
.out-pane{background:url(assets/frost.svg) 0 0/240px 240px,var(--frostHi)}
.in-pane{--fg:var(--vinyl);--fg2:var(--vinyl2);--fg3:var(--vinyl3);--mk:var(--mkL)}
.in-pane h3,.out-pane h3{margin:0;font:400 var(--d3)/1.3 var(--disp);letter-spacing:.14em}
.in-pane ul{margin:22px 0 0;padding:0;list-style:none;display:grid;gap:12px}
.in-pane li{position:relative;padding-left:46px;font:500 19px/1.6 var(--sans);color:var(--vinyl)}
.in-pane li .tick{position:absolute;left:0;top:-4px;width:36px;height:36px;stroke-dashoffset:0}
.in-note{margin:22px 0 0;max-width:30em;font:400 14.5px/1.75 var(--sans);color:var(--vinyl2)}
.out-pane .o{margin:26px 0 0;max-width:24em}
.out-pane h3+.o{margin-top:22px}
.o b{display:inline;padding:0 .12em;margin:0 -.12em;font:500 18px/1.7 var(--sans);color:var(--fg);background:var(--sk) no-repeat 0 62%/100% .8em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.o span{display:block;margin-top:4px;font:400 15px/1.75 var(--sans);color:var(--fg2)}
.out-note{margin:26px 0 0;max-width:24em;font:400 14.5px/1.75 var(--sans);color:var(--fg3)}

/* 依身分計價：每一列右邊的方格＝基本文件的份數（一格一份） */
.rates{margin:52px 0 0;padding:0;list-style:none;border-bottom:1px solid var(--edge)}
.rate{--cur:transparent;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1.25fr) minmax(0,1.3fr) minmax(0,1.4fr);column-gap:36px;align-items:center;padding:30px 0 30px 28px;border-top:1px solid var(--edge);box-shadow:inset 8px 0 0 var(--cur)}
.rate-who{margin:0;font:400 var(--d3)/1.2 var(--disp);letter-spacing:.12em}
.fee-cur{display:none;margin-left:12px;padding:1px 9px 0;background:var(--mk);font:500 12.5px/1.7 var(--sans);letter-spacing:.06em;color:var(--vinyl);vertical-align:.5em}
.rate-p{margin:0;font:400 15px/1.3 var(--sans);color:var(--fg);white-space:nowrap}
.rate-p .num{font-size:var(--d2);line-height:1;margin-right:6px}
.rate-per{margin-left:8px;color:var(--fg2)}
.rate-n{margin:0;font:400 14.5px/1.6 var(--sans);color:var(--fg2)}
.sqs{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 10px;padding:0;list-style:none}
.sqs i{display:block;width:15px;height:15px;border:2px solid var(--fg2)}
.rate-n .num{font-size:var(--d3);margin-right:3px;color:var(--fg)}
.rate-note{margin:0;max-width:24em;font:400 14.5px/1.75 var(--sans);color:var(--fg2)}
.fee-foot{max-width:40em;margin:32px 0 0;font:400 15.5px/1.85 var(--sans);color:var(--fg2)}

/* 從清單到送件：兩條泳道，一條膠帶導引線 */
.lanes{display:grid;grid-template-columns:40fr 15fr 26fr 19fr;grid-template-rows:auto 92px auto;column-gap:8px;margin-top:56px;position:relative}
.ln{position:absolute;left:0;margin:0}
.route{grid-column:1/-1;grid-row:2;width:100%;height:100%;overflow:visible}
.route path.tp{fill:none;stroke:var(--tape);stroke-width:11;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.route path.td{fill:none;stroke:var(--tape2);stroke-width:1.4;stroke-opacity:.6;stroke-dasharray:3 5;vector-effect:non-scaling-stroke}
.route-m{display:none}
.flow{display:contents;margin:0;padding:0;list-style:none}
.fl{position:relative;min-width:0;padding-right:20px}
.fl.you{grid-row:1;align-self:end;padding-bottom:14px}
.fl.off{grid-row:3;padding-top:14px}
.fl:nth-child(1){grid-column:1}.fl:nth-child(2){grid-column:2}.fl:nth-child(3){grid-column:3}.fl:nth-child(4){grid-column:4}
.fl::before{content:"";position:absolute;left:0;width:16px;height:16px;background:var(--bz)}
.fl.you::before{bottom:-28px}.fl.off::before{top:-28px;background:var(--clear)}
.fl-who{margin:0 0 8px;font:500 13px/1.4 var(--sans);letter-spacing:.2em;color:var(--fg3)}
.fl-t{margin:0;font:400 var(--d3)/1.3 var(--disp);letter-spacing:.1em}
.fl-time{margin:4px 0 0;font:500 14.5px/1.5 var(--sans);color:var(--mk)}
.fl-d{max-width:21em;margin:6px 0 0;font:400 15px/1.75 var(--sans);color:var(--fg2)}

/* 預約：茶色玻璃上的白色割字，電話是整頁最大的字 */
.contact{margin-top:128px}
.contact-in{width:var(--wrap);margin:0 auto;padding:72px 0 80px}
.contact h2{margin:0;font:400 var(--d2)/1.15 var(--disp);letter-spacing:.05em;color:var(--vinyl)}
.c-lede{max-width:30em;margin:14px 0 0;font:400 16px/1.9 var(--sans);color:var(--fg2)}
.tel-big{margin:40px 0 0}
.tel-big a{display:inline-block;font:400 var(--d1)/1 var(--disp);letter-spacing:.03em;color:var(--fg);text-decoration:none;white-space:nowrap}
.tel-big a:hover{color:var(--mk)}
.tel-big small{display:block;margin-top:14px;font:400 15px/1.7 var(--sans);color:var(--fg3)}
.c-grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);column-gap:64px;align-items:start;margin-top:64px}
.cinfo{display:grid;gap:24px;margin:0;padding:0;list-style:none}
.cinfo li{min-width:0}
.cinfo b{display:block;font:500 13px/1.6 var(--sans);letter-spacing:.2em;color:var(--fg3)}
.cinfo span{display:block;margin-top:4px;font:400 16px/1.75 var(--sans);color:var(--fg)}
.cinfo small{display:block;font-size:14px;color:var(--fg2)}
.cinfo .hours{display:grid;grid-template-columns:auto auto;justify-content:start;gap:0 20px}
.cinfo .hours span{margin-top:0}
.mapfig{margin:0}
.map{width:100%;height:auto;box-shadow:0 0 0 12px var(--bz),0 20px 0 12px var(--teaDeep)}
.map .m-t{font:500 20px/1 var(--sans);fill:var(--clear)}
.map .m-t.s{font-size:17px}
.map .m-w{fill:var(--vinyl)}
.map .m-v{fill:var(--vinyl)}
.map .m-d{fill:var(--clear)}
.map .m-st{letter-spacing:.3em;fill:var(--vinyl)}
.mapfig figcaption{margin-top:34px;font:400 14px/1.7 var(--sans);color:var(--fg3)}

.site-foot{background:var(--teaDeep);color:var(--vinyl2)}
.foot-in{width:var(--wrap);margin:0 auto;padding:28px 0 44px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 32px;font:400 14px/1.75 var(--sans);color:var(--vinyl3)}
.foot-in p{margin:0}
.nw{white-space:nowrap}
.foot-in b{font-weight:500;color:var(--vinyl2)}

/* ---------- 404 ---------- */

.nf h1{margin:0;font:400 var(--d2)/1.2 var(--disp);letter-spacing:.05em}
.nf .gone{margin:44px 0 0;font:400 var(--d3)/1.4 var(--disp);color:var(--fg2)}

.nf p{max-width:34em;margin:28px 0 0;font:400 16.5px/1.85 var(--sans);color:var(--fg2)}
.nf ul{display:flex;flex-wrap:wrap;gap:12px;margin:32px 0 0;padding:0;list-style:none}
.nf .btn{color:var(--fg)}
.nf .btn.pri,.nf .btn:hover{color:var(--frostHi)}
