.pl-node{stroke:var(--husk);stroke-width:1.6;stroke-linecap:round}
.pl-sun{fill:var(--husk-2)}
.pl-sun--key{fill:var(--persimmon)}
.poles__nm{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));list-style:none;margin:.55rem 0 0;padding:0;font-family:var(--term);font-size:15px;color:var(--husk-2)}
.poles__nm li{writing-mode:vertical-rl;text-orientation:upright;margin-inline:auto;letter-spacing:.06em;line-height:1}
.sun__note{position:absolute;font-size:.95rem;line-height:1.55;color:var(--husk);z-index:1}
.sun__note--sum{left:calc(9.5 / 12 * 100%);top:0;translate:-50% 0;white-space:nowrap}
.sun__note--win{right:calc(2.5 / 12 * 100% - 1rem);top:calc(64 / 214 * 100%);translate:0 -100%;text-align:right;max-width:15em}
.sun__fig figcaption{margin-top:1.1rem;font-size:.9rem;color:var(--husk-2)}

/* 訂法：說一句話就是訂單 */
.plan{--bg:var(--deep);background:var(--bg);padding:4.4rem var(--gut) 0}
.yband{--bg:var(--deep);background:var(--bg);padding:3rem var(--gut) 4rem}
.plan h2{font-size:clamp(1.9rem,2.8vw,2.5rem)}
.say{margin-top:1.5rem;font-size:clamp(1.3rem,2.2vw,1.95rem);line-height:2.35;max-width:62rem}
.say__w{white-space:nowrap}
.seg{display:inline-flex;flex-wrap:wrap;gap:.35rem;border:0;margin:0 .25rem;padding:0;vertical-align:baseline;min-inline-size:0}
.seg__o{position:relative;display:inline-flex;align-items:baseline;gap:.4em;padding:0 .6em .05em;line-height:1.55;cursor:pointer;border:1px dashed var(--husk-2);border-radius:1.1em .7em 1em .8em / .9em 1em .7em 1.1em;color:var(--husk)}
.seg__o input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.seg__o small{font-size:.55em}
.seg__o:hover{border-style:solid}
.seg__o:has(input:checked){background:var(--celadon);border:1px solid var(--celadon);color:var(--night)}
.seg__o:has(input:focus-visible){outline:var(--focus-ring);outline-offset:4px}
.say__sel{font:inherit;font-size:.92em;background:transparent;color:var(--husk);border:0;border-bottom:2px solid var(--celadon);padding:0 .15em;border-radius:0;max-width:100%}
.say__sel:focus-visible{outline:var(--focus-ring);outline-offset:4px}
.say__sel option{background:var(--deep);color:var(--husk);font-size:1rem}
.say__fine{margin-top:.4rem;font-size:.95rem;color:var(--husk-2);display:flex;flex-wrap:wrap;gap:0 1em}
.fine{display:none}
.plan:has(input[name=step][value="1"]:checked) .fine[data-fs="1"],.plan:has(input[name=step][value="2"]:checked) .fine[data-fs="2"],.plan:has(input[name=step][value="6"]:checked) .fine[data-fs="6"],
.plan:has(input[name=size][value="480"]:checked) .fine[data-fz="480"],.plan:has(input[name=size][value="760"]:checked) .fine[data-fz="760"]{display:inline}
.slots{display:grid;grid-template-columns:repeat(24,minmax(0,1fr));gap:4px;list-style:none;margin:0;padding:0}
.slot{position:relative;display:flex;flex-direction:column;align-items:center;gap:.4rem;padding:.7rem 0 .8rem;background:var(--night-2);border-radius:46% 46% 5px 5px / 16% 16% 5px 5px}
.slot__g{width:1.6rem;height:1.6rem;color:var(--husk-2)}
.slot__nm{font-family:var(--term);writing-mode:vertical-rl;text-orientation:upright;font-size:15px;letter-spacing:.06em;line-height:1;color:var(--husk-2)}
.slot__bx{width:1.9rem;height:1.9rem;color:var(--husk);visibility:hidden}
.slot.on{background:var(--soil-3)}
.slot.on .slot__bx{visibility:visible}
.slot.on .slot__nm,.slot.on .slot__g{color:var(--husk)}
.slot__sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.slot:not(.on) .slot__sr{display:none}
.slot__1{display:none;position:absolute;bottom:calc(100% + .3rem);font-size:.85rem;line-height:1.3;color:var(--persimmon);white-space:nowrap}
.slot.first .slot__1{display:block}
.slot.first{box-shadow:0 0 0 2px var(--persimmon)}
.plan__sum{margin-top:2rem;font-size:1.2rem;line-height:2.1;max-width:54em}
.plan__sum b{font-weight:400;font-size:1.9em;color:var(--celadon);line-height:1;font-variant-numeric:tabular-nums}

/* 一年裡碰到的天 */
.wx{--bg:var(--night-2);background:var(--bg);padding:4.4rem var(--gut) 0}
.wx h2{font-size:clamp(1.9rem,2.8vw,2.5rem)}
.wx__year{display:grid;grid-template-columns:repeat(24,minmax(0,1fr));margin-top:2.4rem}
.wx__band{grid-column:1 / -1;grid-row:2;display:block;width:100%;height:auto;max-width:none}
.wx__ev{display:contents}
.ev{position:relative;grid-column:var(--gc);padding:0 .9rem;min-width:0}
.ev--up{grid-row:1;align-self:end;padding-bottom:1.3rem}
.ev--dn{grid-row:3;padding-top:1.3rem}
.ev::after{content:"";position:absolute;left:var(--bl);width:var(--bw);height:10px;border:1px solid var(--husk-2)}
.ev--up::after{bottom:0;border-top:0}
.ev--dn::after{top:0;border-bottom:0}
.ev__ic{display:none}
.ev__nm{font-size:1.5rem;line-height:1.3}
.ev__when{font-size:.92rem;color:var(--celadon)}
.ev__txt{margin-top:.3rem;font-size:1rem;line-height:1.75;max-width:22em}
.wx__axis{grid-column:1 / -1;grid-row:4;display:grid;grid-template-columns:repeat(4,1fr);margin-top:1.4rem;color:var(--husk-2);font-size:.95rem}
.wx__axis span{border-left:1px dashed var(--dim);padding-left:.6rem}
.wb-band{fill:var(--soil-3)}
.wb-fur{fill:none;stroke:var(--soil-5);stroke-width:1.5;stroke-linecap:round}
.wb-wx{fill:none;stroke:var(--husk-2);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.wb-rain{stroke:var(--celadon)}
.wb-frost{stroke:var(--husk)}
.wb-bx{color:var(--husk)}
.wx__all{--bg:var(--night-2);background:var(--bg);padding:3.2rem var(--gut) 3.8rem;display:flex;gap:1rem 3rem;align-items:flex-start}
.wx__allh{flex:0 0 12rem}
.wx__all dl{flex:1 1 0}
.wx__allh{font-size:1.45rem;line-height:1.4}
.wx__all dl{margin:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1.1rem 2.4rem}
.wx__all dt{color:var(--celadon);font-size:1.05rem}
.wx__all dd{margin:.1rem 0 0;line-height:1.75;color:var(--husk-2)}

/* 五戶人家：海拔剖面 */
.farms{--bg:var(--night);background:var(--bg);padding:5rem var(--gut) 0;display:grid;grid-template-columns:var(--cols);align-items:stretch}
.farms__head{grid-row:1;grid-column:1 / 4;align-self:start;position:relative;z-index:2;max-width:40rem}
.farms h2{font-size:clamp(1.9rem,2.8vw,2.5rem);max-width:16em}
.farms__lead{max-width:38em;margin-top:.9rem;color:var(--husk-2)}
.slope{display:contents}
.farm{grid-row:1;grid-column:var(--c);position:relative;z-index:1;display:flex;flex-direction:column;padding:calc(210px - var(--h)) 1.1rem var(--h) 0}
.farm__stem{flex:1 1 auto;min-height:28px;margin-top:.9rem;align-self:center;border-left:1px dashed var(--husk-2)}
.farm::after{content:"";position:absolute;left:50%;bottom:calc(var(--h) - 5px);width:10px;height:10px;translate:-50% 0;background:var(--celadon);border-radius:50%}
.farm h3{font-size:1.6rem;line-height:1.2}
.farm__meta{font-size:.88rem;color:var(--husk-2);line-height:1.6;margin-top:.3rem}
.farm__meta .num{color:var(--celadon)}
.farm__tell{margin-top:.6rem;font-size:.98rem;line-height:1.8}
.farm__crops{list-style:none;margin:.8rem 0 0;padding:0}
.farm__crops li{display:grid;grid-template-columns:1.8rem auto;column-gap:.45rem;align-items:center;font-size:.95rem;line-height:1.5;padding:.15rem 0}
.farm__crops svg{width:1.8rem;height:1.8rem;color:var(--husk);grid-row:1 / span 2;--ck-fo:.12;--ck-ho:.5}
.farm__ss{grid-column:2;font-size:.82rem;color:var(--husk-2)}
.ground{position:absolute;left:0;right:0;bottom:0;height:var(--G);pointer-events:none}
.ground svg{position:absolute;inset:0;width:100%;height:100%;max-width:none}
.g-1{fill:var(--soil-4)}.g-2{fill:var(--soil-3)}.g-3{fill:var(--soil-2)}
.g-fur{fill:none;stroke:oklch(0.22 0.045 345 / .5);stroke-width:1.5;vector-effect:non-scaling-stroke;stroke-linecap:round}
.g-top{fill:none;stroke:var(--husk-2);stroke-width:1.4;vector-effect:non-scaling-stroke}
.g-p{fill:none;stroke:var(--celadon);stroke-width:1.4;vector-effect:non-scaling-stroke;stroke-linecap:round;opacity:.75}
.g-river{fill:none;stroke:var(--celadon);stroke-width:2;vector-effect:non-scaling-stroke}
.ground span{position:absolute;font-size:.95rem;color:var(--husk);line-height:1}
.ground__river{left:calc(var(--gut) + 4.4rem);bottom:1.6rem}
.ground__hill{right:var(--gut);bottom:calc(var(--G) - 4px)}

/* 怎麼訂 */
.order{--bg:var(--deep);background:var(--bg);padding:5rem var(--gut) 5rem;display:flex;flex-wrap:wrap;align-items:flex-start;gap:2rem clamp(2rem,6vw,6rem)}
.order h2{font-size:clamp(1.9rem,2.8vw,2.5rem);flex:1 0 100%}
.ways{flex:0 1 24rem}
.ord{flex:1 1 30rem;max-width:40rem}
.ways{list-style:none;margin:0;padding:0}
.ways li{padding:1rem 0 1.1rem;border-top:1px dashed var(--night-4)}
.ways b{display:block;font-weight:400;font-size:1.3rem}
.ways span{display:block;color:var(--husk-2);font-size:.96rem}
.ways a{font-size:1.1rem;color:var(--persimmon);font-variant-numeric:tabular-nums}
.ord{display:grid;grid-template-columns:1fr 1fr;gap:1rem 1.2rem;align-content:start}
.fld{display:flex;flex-direction:column;gap:.3rem}
.fld--w{grid-column:1 / -1}
.fld label{font-size:.95rem}
.fld input{min-width:0;width:100%;font-family:var(--kai);font-size:1rem;background:var(--night-2);color:var(--husk);border:1px solid var(--husk-2);padding:.6rem .7rem;border-radius:.5rem .3rem .45rem .35rem}
.fld input::placeholder{color:var(--husk-2);opacity:1}
.fld input[aria-invalid="true"]{border-color:var(--persimmon);border-width:2px}
.fld__err{font-size:.88rem;color:var(--persimmon);line-height:1.5}
.ord__act{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:1rem;align-items:center}
.ord__msg{grid-column:1 / -1;padding:.8rem 1rem;background:var(--night-2);border:1px solid var(--celadon);font-size:.98rem}

/* 版權頁 */
.foot{--bg:oklch(0.19 0.05 328);background:var(--bg);padding:3rem var(--gut) 2.2rem;display:grid;grid-template-columns:minmax(12rem,20rem) minmax(0,1fr) auto;column-gap:3rem;align-items:start;position:relative}
.foot__brand{display:flex;align-items:center;gap:.6rem;font-size:1.25rem}
.foot__brand svg{width:1.8rem;height:1.8rem;color:var(--celadon)}
.foot dl{display:grid;grid-template-columns:auto 1fr;gap:.25rem 1.2rem;margin:0;font-size:.95rem;max-width:40rem}
.foot dt{color:var(--husk-2)}
.foot dd{margin:0}
.foot__fine{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:.4rem 1.6rem;margin-top:2rem;font-size:.85rem;color:var(--husk-2)}

/* 404 */
.lost{display:grid;grid-template-columns:minmax(0,26rem) minmax(0,30rem);gap:2rem 4rem;align-items:center;padding:3rem var(--gut) 5rem;min-height:calc(100dvh - 15rem)}
.lost__ring{width:100%;height:auto}
.lost__ring .l-sec{fill:var(--night-3)}
.lost__ring .l-miss{fill:none;stroke:var(--persimmon);stroke-width:4;stroke-dasharray:10 9}
.lost__ring use{color:var(--husk-2)}
.lost h1{font-size:clamp(2.2rem,4vw,3.4rem);line-height:1.2}
.lost__code{color:var(--persimmon);font-size:1.4rem}
.lost__txt p{margin-top:1rem;color:var(--husk-2)}
.lost__act{display:flex;flex-wrap:wrap;gap:1.2rem;align-items:center}
@media (max-width:760px){.lost{grid-template-columns:1fr}.lost__ring{max-width:18rem}}

@media (max-width:960px){
  .season{--off:0deg;--D:min(92vw,560px);--nm:clamp(5rem,24vw,8rem)}
  .tool{min-height:0;display:flex;flex-direction:column;padding-bottom:4.4rem}
  .tool__copy{margin:0;padding:.3rem var(--gut) 0}
  .dial{position:relative;left:auto;top:auto;margin:2.3rem auto 0;flex:none}
  .dial__rot{overflow:clip}
  .lab a::after{content:"";position:absolute;left:50%;top:50%;width:45px;height:52px;translate:-50% -50%;rotate:calc(var(--a) + var(--rot) + var(--off))}
  .read{position:relative;left:auto;right:auto;top:auto;padding:1.4rem var(--gut) 0}
  .read::before{display:none}
  .tool__land{height:3.8rem}
  .w-mo{display:none}
  .term{grid-template-columns:1fr;row-gap:.8rem}
  .term__head{grid-row:auto;flex-direction:row;align-items:center;gap:1rem;padding:0}
  .term h3{writing-mode:horizontal-tb;display:block}
  .term__nm{margin-inline-end:.2em}
  .crate,.term__sum{grid-column:1}
  .term__intro{display:block}
  .crate{grid-template-columns:repeat(3,minmax(0,1fr))}
  .sun{flex-direction:column;gap:0}
  .sun__tale{flex:none}
  .sun__now{text-align:left;margin-top:1.8rem}
  .sun__cap{margin-inline-start:0}
  .poles{grid-template-columns:1fr;row-gap:1.4rem}
  .sun__note{position:static;translate:none;white-space:normal;text-align:left;max-width:none;margin-top:.5rem;color:var(--husk-2)}
  .wx__year{display:block}
  .wx__band,.wx__axis{display:none}
  .ev{display:grid;grid-template-columns:3.4rem minmax(0,1fr);column-gap:.9rem;padding:1.1rem 0 0}
  .ev::after{display:none}
  .ev__ic{display:block;grid-row:1 / span 3;width:3.4rem;height:auto;fill:none;stroke:var(--husk-2);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .wx__all{flex-direction:column;gap:.8rem}
  .wx__allh{flex:none}
  .wx__all dl{grid-template-columns:repeat(2,minmax(0,1fr))}
  .order{flex-direction:column}
  .ways,.ord{flex:none;width:100%}
  .farms{grid-template-columns:minmax(0,1fr);padding-bottom:3.4rem}
  .farms__head{grid-row:auto;grid-column:1;max-width:none}
  .farm{grid-row:auto;grid-column:1;display:block;margin-top:1.8rem;padding:0 0 0 1.2rem;border-left:2px dashed var(--night-4)}
  .farm::after,.farm__stem,.ground{display:none}
  .farm__crops{display:flex;flex-wrap:wrap;gap:.1rem 1rem}
  .farm__crops li{grid-template-columns:1.5rem auto}
  .farm__crops svg{width:1.5rem;height:1.5rem}
  .farm__ss{display:none}
}
