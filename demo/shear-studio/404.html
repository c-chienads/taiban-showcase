.wk-t{display:flex;align-items:center;justify-content:flex-end;padding-right:8px;font-family:var(--f-num);font-size:.8125rem;font-weight:600;color:var(--paper);border-right:2.5px solid var(--ink);height:30px}
.c{position:relative;height:30px;border-right:2.5px solid var(--ink);border-bottom:1px solid var(--mag-d);background:transparent}
.wk-r:nth-child(2n+1) .c{border-bottom:2.5px solid var(--ink)}
.c.busy{background:repeating-linear-gradient(135deg,var(--mag-d) 0 2px,transparent 2px 7px)}
.c.off-d{background:var(--mag-d)}
.c.fit{background:var(--paper);cursor:pointer}
.c.fit:hover{background:var(--mag-l)}
.c.pk{background:var(--ink)}
.c:focus-visible{outline:var(--focus-ring);outline-offset:-4px;color:var(--ink);z-index:2}
.c.pk:focus-visible{color:var(--paper)}
.pkb{position:absolute;z-index:3;pointer-events:none;background:var(--ink);color:var(--paper);display:none;padding:4px 8px;font-family:var(--f-num);font-size:.875rem;font-weight:600;line-height:1.35;white-space:pre;overflow:hidden}
.pkb.grow{animation:f26-pull .22s cubic-bezier(.3,.7,.2,1) both}
@keyframes f26-pull{from{clip-path:inset(0 0 calc(100% - var(--c0,26px)) 0)}to{clip-path:inset(0 0 0 0)}}
.wk:has(.c.pk:focus-visible) .pkb{outline:3px dashed var(--paper);outline-offset:-6px}
.pkb.on{display:block}
.wk-key{display:flex;flex-wrap:wrap;gap:8px 20px;margin:14px 0 10px;padding:0;list-style:none;font-size:.875rem;font-weight:600}
.wk-key li{display:flex;align-items:center;gap:8px}
.wk-key i{display:inline-block;width:22px;height:14px;border:2px solid var(--ink)}
.k-fit{background:var(--paper)}.k-busy{background:repeating-linear-gradient(135deg,var(--mag-d) 0 2px,transparent 2px 7px)}.k-free{background:transparent}.k-pk{background:var(--ink)}.k-off{background:var(--mag-d)}
.wk-key i.k-kb{background:var(--paper);border-bottom-width:5px;border-radius:2px}
.bk-form{display:grid;gap:14px;padding:22px 22px 24px;background:var(--ink);color:var(--paper)}
.bk-form h3{color:var(--paper);font-size:1.5rem;line-height:1.25}
.ps{margin:0;padding:10px 12px;border:2px dashed var(--mag-l);font-weight:700;font-size:.9375rem;line-height:1.6}
.ps-on{font-family:var(--f-zh)}
.ps.has .ps-empty{display:none}
.fld{display:grid;gap:4px}
.fld label{font-size:.875rem;font-weight:700;color:var(--mag-l)}
.fld input,.fld textarea{width:100%;min-height:44px;padding:8px 10px;background:var(--paper);color:var(--ink);border:2px solid var(--paper);border-radius:0;font-weight:500}
.fld textarea{min-height:60px;resize:vertical}
.fld input::placeholder,.fld textarea::placeholder{color:oklch(0.45 0.02 355)}
.fld input:focus-visible,.fld textarea:focus-visible{outline:3px dashed var(--mag-l);outline-offset:2px}
.err{display:none;margin:0;font-size:.8125rem;font-weight:700;color:var(--mag-l)}
.tried .fld:has(:invalid) .err{display:block}
.tried .fld:has(:invalid) input{border-color:var(--mag)}
.send{min-height:52px;background:var(--paper);color:var(--ink);border:2.5px solid var(--paper);font-weight:700;font-size:1rem;cursor:pointer}
.send:hover{background:var(--mag-l);border-color:var(--mag-l)}
.send:focus-visible{outline-color:var(--paper)}
.bk-note{margin:0;font-size:.8125rem;line-height:1.65;color:var(--mag-l)}
.done{margin:0;padding:12px 14px;background:var(--paper);color:var(--ink);font-weight:700;font-size:.9375rem}

/* ===== 價目：色階卡 ===== */
.pr{border-bottom:2px solid var(--ink);padding-top:clamp(36px,3.4vw,48px);padding-bottom:clamp(44px,4.4vw,64px)}
.pr-top{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px 40px}
.pr-top .sec-lead{margin:0 0 .4em}
.lv{display:grid;grid-template-columns:minmax(240px,1.25fr) repeat(4,minmax(0,1fr));margin-top:32px;padding:0 0 14px;background:var(--paper);color:var(--ink)}
.lv-h,.lv-r{display:contents}
.lv-h>*{display:flex;align-items:baseline;gap:10px;padding:16px 18px 12px;--pick:0;background:color-mix(in oklch,var(--ink) calc(var(--pick) * 100%),var(--paper));color:color-mix(in oklch,var(--paper) calc(var(--pick) * 100%),var(--ink))}
.lv-h0{font-size:.875rem;font-weight:700;align-self:end}
.lv-mh b{font-family:var(--f-disp);font-size:2.2rem;font-weight:900;line-height:1}
.lv-mh span{font-size:.875rem;font-weight:700}
.lv-r{--sel:0}
.lv-r>*{position:relative;display:flex;align-items:center;min-height:78px;padding:10px 18px;background:var(--bg);color:var(--fg)}
.lv-0{--bg:var(--lv0);--fg:var(--ink)}.lv-1{--bg:var(--lv1);--fg:var(--ink)}.lv-2{--bg:var(--lv2);--fg:var(--ink)}.lv-3{--bg:var(--lv3);--fg:var(--paper)}.lv-4{--bg:var(--lv4);--fg:var(--paper)}
.lv-r>:first-child{margin-left:14px}.lv-r>:last-child{margin-right:14px}
.lv-rh{display:grid!important;grid-template-columns:auto 1fr;align-items:center;column-gap:14px}
.lv-n{display:grid;line-height:1.2}
.lv-n b{font-family:var(--f-disp);font-size:1.6rem;font-weight:900}
.lv-n small{font-size:.8125rem;font-weight:600}
.lock{display:block;width:100%;max-width:210px;height:auto;overflow:visible}
.lk-h{fill:var(--ink)}
.lk-s{fill:none;stroke:var(--bg);stroke-width:1.1;stroke-opacity:.8}
.lk-c{fill:var(--paper);stroke:var(--ink);stroke-width:1.6}
.lv-3 .lk-h,.lv-4 .lk-h{fill:oklch(0.12 0.01 355)}
.lv-you{display:none;position:absolute;right:12px;top:8px;padding:1px 8px;font-size:.75rem;font-weight:700;background:var(--ink);color:var(--paper);line-height:1.6}
.lv-3 .lv-you,.lv-4 .lv-you{background:var(--paper);color:var(--ink)}
.lv-p{font-size:1.5rem;--pick:0}
.lv-p .num{font-weight:calc(500 + var(--pick) * 200);white-space:nowrap;letter-spacing:-.005em}
.lv-p .dash{margin:0 .12em}
.lv-pl{display:none}
/* 你選的長度：上下兩道虛線剪口 */
.lv-r>*::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:var(--sel);background:linear-gradient(90deg,var(--fg) 58%,transparent 0) 0 4px/12px 2.5px repeat-x,linear-gradient(90deg,var(--fg) 58%,transparent 0) 0 calc(100% - 4px)/12px 2.5px repeat-x}
.pr-notes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px clamp(20px,3vw,44px);margin:36px 0 0}
.pr-notes dt{font-family:var(--f-disp);font-size:1.4rem;font-weight:900;color:var(--ink);line-height:1.3}
.pr-notes dd{margin:4px 0 0;font-size:.9375rem;font-weight:500}

/* ===== 設計師：三個形狀 ===== */
.tm{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.95fr) minmax(0,1.05fr);column-gap:clamp(20px,3vw,48px);align-items:start}
.tm>h2,.tm>.sec-lead{grid-column:1/-1}
.tm>.sec-lead{margin-bottom:48px}
/* 卡內隱含欄必須是 minmax(0,1fr)：週格 .days（7×30px＋6×4px＝234px）是 auto 欄的 min-content，768px 時三欄各約 204–247px，auto 欄會被它撐到 234px，整張卡的字與週格溢出欄寬 */
.tm-p{display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.tm-fig{margin:0 0 10px;border-bottom:2.5px solid var(--ink)}
.tm-fig svg{display:block;width:100%;height:auto}
.tm-fig .bust{fill:none;stroke:var(--mag-d);stroke-width:2.5}
.tm-fig .collar{fill:none;stroke:var(--paper);stroke-width:2}
.tm-p h3{font-size:clamp(2rem,3vw,2.8rem);line-height:1.1;display:flex;align-items:baseline;gap:12px}
.tm-p h3 small{font-size:.95rem;font-weight:700;color:var(--paper);letter-spacing:.1em}
.tm-does{margin:0;font-weight:700}
.tm-q{margin:6px 0 0;font-size:1.2rem;line-height:1.65;font-weight:700;color:var(--ink)}
.tm-sig,.tm-no{margin:0;font-size:.9375rem;font-weight:500}
.days{display:flex;gap:4px;margin:10px 0 4px;padding:0;list-style:none}
.days li{display:grid;place-items:center;width:30px;height:auto;aspect-ratio:1;min-width:0;font-size:.8125rem;font-weight:700;border:2px solid var(--ink);color:var(--paper)}
.days li.on{background:var(--ink);color:var(--paper)}
.tm-acts{display:flex;flex-wrap:wrap;gap:6px 22px;margin:8px 0 0}
.tm-go{font-weight:700;text-decoration:none;border-bottom:3px solid var(--ink);padding:4px 0}
.tm-try{border-bottom-style:dashed}
.tm-go:hover{border-bottom-color:var(--paper)}

/* ===== 來之前：run-in ===== */
.bf{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:clamp(28px,5vw,88px);background:var(--ink);color:var(--paper);--slit:var(--ink)}
.bf h2{grid-row:1/span 2;align-self:start;color:var(--paper);writing-mode:vertical-rl;font-size:clamp(4rem,8vw,7.5rem);line-height:1;letter-spacing:.06em;--sd:to left;--lh:1em;--sy:.66em}
.bf-list{display:grid;gap:clamp(22px,2.6vw,34px);align-content:start}
.rl{margin:0;max-width:min(100%,38em);font-size:1.0625rem;line-height:1.65;font-weight:500;color:var(--mag-l)}
.rl b{font-family:var(--f-disp);font-size:clamp(1.6rem,2.7vw,2.4rem);line-height:1.25;font-weight:900;color:var(--paper);margin-right:.35em}
.rl:nth-child(6n+1){margin-left:0}.rl:nth-child(6n+2){margin-left:16%}.rl:nth-child(6n+3){margin-left:5%}.rl:nth-child(6n+4){margin-left:28%}.rl:nth-child(6n+5){margin-left:10%}.rl:nth-child(6n+6){margin-left:22%}
/* 沿虛線剪掉的：剪線框＋一把剪刀停在線上 */
.bf-x{grid-column:2;position:relative;justify-self:start;max-width:46em;margin-top:52px;padding:18px 22px 16px 22px;background:linear-gradient(90deg,var(--mag-l) 55%,transparent 0) 0 0/14px 2px repeat-x,linear-gradient(90deg,var(--mag-l) 55%,transparent 0) 0 100%/14px 2px repeat-x,linear-gradient(0deg,var(--mag-l) 55%,transparent 0) 0 0/2px 14px repeat-y,linear-gradient(0deg,var(--mag-l) 55%,transparent 0) 100% 0/2px 14px repeat-y}
.bf-x p{margin:0;font-size:.9375rem;font-weight:500;color:var(--mag-l);max-width:none}
.bf-x b{display:block;font-family:var(--f-disp);font-size:1.2rem;font-weight:900;color:var(--paper);margin-bottom:4px}
.bf-sc{position:absolute;left:28px;top:0;width:66px;height:auto;translate:0 -50%;fill:var(--paper);stroke:var(--paper);background:var(--ink);padding:0 4px;overflow:visible}
.bf-sc .sc-pin{fill:var(--ink)}

/* ===== 頁尾 ===== */
.foot{display:grid;grid-template-columns:auto 1fr;gap:18px 48px;align-items:end;padding:44px var(--gut) 40px}
.foot .brand b{font-size:2.6rem}
.foot address{font-style:normal;display:grid;gap:2px;font-weight:600;font-size:.9375rem}
.foot address .num{font-size:1.5rem;font-weight:600}
.foot p{grid-column:1/-1;margin:0;font-size:.8125rem;font-weight:500}

/* ===== 404 ===== */

.e404-l a{display:inline-flex;align-items:center;min-height:48px;padding:0 18px;border:2.5px solid var(--ink);font-weight:700;font-size:1.2rem;text-decoration:none;color:var(--ink)}

/* ===== 窄於 390px：價目格的標籤與價格上下排（兩欄格約 134–150px，放不下「標籤＋1,600–2,000」；
   320px 價格被切、360px 仍有 5–7px 超出格子，375px 剛好貼邊）。列頭與格子的左右內縮／內距一起改成同值，邊緣與字首才對得齊 ===== */
@media (max-width:389px){
  .lv-r>.lv-p{flex-direction:column;align-items:flex-start;gap:0;padding-inline:10px}
  .lv-p{font-size:1.0625rem}

}
@media (pointer:coarse){
  .tick{min-block-size:30px}
  .tm-go,.nav a{min-block-size:44px;display:inline-flex;align-items:center}
  /* 看起來不變，可點區往外長到 ≥44px（::after；導覽項與「最早」小條之間的空隙夠放） */
  .nav a,.soon button{position:relative}
  .nav a::after{content:"";position:absolute;inset:0 -7px}
  .soon button::after{content:"";position:absolute;inset:-5px}
}

/* ===== 降級動效：只換狀態，不位移 ===== */
@media (prefers-reduced-motion:reduce){
  .rng i,.mt{transition:none}
  .pkb.grow{animation:none}
}

/* ===== 列印 ===== */
@media print{
  html,body,.out,.bf,.bk-form{background:#fff !important;color:#000 !important}
  h1,h2,h3,.tk-n,.mt-ch,.dz-n,.pm-rh,.rl b,.rl,.out *,.bk-form *{color:#000 !important}
  .slit::after{display:none}
  .grab,.go,.nav,.figbox,.ruler,.bk-who,.wk-key,.send{display:none !important}
  .cmp,.bk,.tm,.bf{display:block}
  .bf h2{writing-mode:horizontal-tb}
  .bk-form{position:static}
  .fig .bust{fill:#ddd}
  a{text-decoration:underline}
  .sec{padding:24px 0}
  .c.busy{background:#ccc}
}

}
