.ti .ti-x{min-height:36px;padding:0 14px;border:0;border-radius:999px;box-shadow:inset 0 0 0 1.5px currentColor;background:transparent;font:500 14px/1 var(--sans);cursor:pointer}
.ti .ti-x:hover{background:var(--ink);color:var(--cream)}
.tr-form{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 20px;margin-top:12px}
.tr-form label.fl{display:grid;gap:2px;font:500 14.5px/1.4 var(--sans);letter-spacing:.06em}
.tr-form input[type=text],.tr-form input[type=tel]{width:min(100%,15em);min-height:46px;padding:0 14px;border:1.5px solid var(--ink);border-radius:999px;background:var(--tang-hi);color:var(--ink);font:400 17px/1 var(--sans)}
.tr-form input::placeholder{color:oklch(0.38 0.05 50)}
.tr-form .ck{display:flex;align-items:center;gap:10px;min-height:46px;font:500 15.5px/1.4 var(--sans);cursor:pointer}
.tr-form .ck input{width:22px;height:22px;margin:0;accent-color:var(--ink)}
.tr-form .err{flex:1 1 100%;margin:0;font:500 14.5px/1.5 var(--sans)}
.tr-form .err::before{content:"";display:inline-block;width:.6em;height:.6em;margin-right:.5em;border-radius:50%;background:var(--ink);vertical-align:.06em}
.tr-form .gen{min-height:48px;padding:0 26px;border:0;border-radius:999px;background:var(--ink);color:var(--cream);font:500 16.5px/1 var(--sans);letter-spacing:.1em;cursor:pointer}
.tr-form .gen:hover{background:var(--night)}
html:not(.js) .tr-form,html:not(.js) .tr-empty{display:none}
.js .tr-nojs{display:none}
.tr-nojs{grid-column:1/-1;margin:0}
.tr-out{grid-column:1/-1;margin-top:14px;padding:16px 20px;border-radius:22px 22px 22px 4px;background:var(--cream);color:var(--ink)}
.msg{font:400 15.5px/1.75 var(--sans)}
.tr-out .copy{margin-top:10px;min-height:42px;padding:0 18px;border:0;border-radius:999px;box-shadow:inset 0 0 0 1.5px currentColor;background:transparent;font:500 14.5px/1 var(--sans);cursor:pointer;letter-spacing:.06em}
.tr-out .copy:hover{background:var(--ink);color:var(--cream)}
.copied{margin-left:10px;font:500 14.5px/1.4 var(--sans)}
.tr-note{grid-column:1/-1;margin:12px 0 0;max-width:46em;font:400 14.5px/1.65 var(--sans)}

/* ---------- 章節：由晨到夜的明度階梯，頂邊是一道弧 ---------- */
.chapters{position:relative}
.ch{--fld:var(--tang);position:relative;margin-top:calc(var(--arc) * -1);padding:calc(var(--arc) + clamp(28px,3.4vw,52px)) var(--pad) calc(var(--arcn,0px) + clamp(40px,4.4vw,64px));min-height:calc(var(--dur) * 5px + 220px);background:var(--fld);color:var(--on);border-radius:50% 50% 0 0 / var(--arc) var(--arc) 0 0;display:grid;gap:18px 40px;align-content:start}
.ch-wake{--fld:oklch(0.93 0.075 95);--on:var(--ink);--arc:46px;--arcn:58px}
.ch-mat{--fld:oklch(0.845 0.095 72);--on:var(--ink);--arc:58px;--arcn:70px}
.ch-reformer{--fld:oklch(0.52 0.155 34);--on:var(--cream);--arc:70px;--arcn:84px}
.ch-flow{--fld:oklch(0.395 0.115 10);--on:var(--cream);--arc:84px;--arcn:100px}
.ch-yin{--fld:var(--night);--on:var(--cream);--arc:100px}
.ch-h{display:grid;gap:10px;align-content:start}
.ch h2{margin:0;font:400 clamp(44px,5.6vw,84px)/1.04 var(--mk);letter-spacing:.005em}
.ch-len{display:flex;align-items:center;gap:14px;margin:0;font:500 15px/1 var(--sans)}
.ch-len .len{flex:none;width:min(100% - 7.5em,calc(var(--dur) / 90 * 600px));height:16px;overflow:visible;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.ch-len>span{flex:none;white-space:nowrap}
.ch-len b{font:400 30px/1 var(--mk);margin-right:3px}
.len.m-mat .ink-x{stroke:var(--fld)}
.ch-lead{margin:0;max-width:30em;font:400 17px/1.8 var(--sans)}
.fx{margin:0;align-self:start}
.fx-in{position:relative}
.fx-art svg{display:block;width:100%;height:auto;overflow:visible}
.ch .fig{color:var(--on)}
.fx-marks{margin:0;padding:0;list-style:none}
.fx-marks li{display:flex;align-items:baseline;gap:10px;font:500 15.5px/1.5 var(--sans)}
.fx-marks b{flex:none;font:400 26px/1 var(--mk);min-width:1.1em;padding-bottom:3px;box-shadow:inset 0 -2px 0 currentColor}
.ch-cue{display:grid;gap:14px;align-content:start}
.cue{margin:0;font:400 clamp(22px,2vw,30px)/1.4 var(--mk);max-width:20em}
.bt{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));column-gap:0;row-gap:6px;margin:0}
.bt .tk{grid-row:2;grid-column:var(--i);padding:2px 0 0 4px;font:400 14px/1.3 var(--mk);box-shadow:inset 1px 0 0 color-mix(in oklch,var(--on) 50%,transparent)}
.bt .tk.on{box-shadow:inset 2px 0 0 var(--on)}
.bt-l{display:contents}
.bt-l li{grid-row:1;grid-column:var(--r) / span var(--s);display:flex;flex-direction:column;justify-content:flex-end;gap:8px;min-width:0;padding:0 3px 0 0}
.bt-l li::after{content:"";display:block;height:10px;background:var(--on);border-radius:999px 2px 2px 999px}
.bt-t{padding-right:8px;font:500 15.5px/1.45 var(--sans)}
.fit{display:flex;flex-wrap:wrap;gap:8px 34px;margin:0;font:400 15.5px/1.65 var(--sans)}
.fit>div{min-width:12em;max-width:22em}
.fit h3{margin:0 0 2px;font:400 20px/1.3 var(--mk);letter-spacing:.04em}
.fit ul{margin:0;padding:0;list-style:none}
.fit li::before{content:"";display:inline-block;width:.9em;height:2px;margin-right:.55em;background:currentColor;vertical-align:.3em}
.fit .swap p{margin:0}
.slots{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:0;font:500 14.5px/1.4 var(--sans)}
.slots .sl-h{margin-right:4px;font:400 18px/1 var(--mk)}
.slots a{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 13px;border-radius:999px;box-shadow:inset 0 0 0 1.5px currentColor;text-decoration:none}
.slots a:hover{background:var(--on);color:var(--fld)}
.slots a .mkn{font-size:17px}
.ch :focus-visible{outline-color:var(--on)}

/* 各章版面（桌機） */
.ch-wake{grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.05fr);grid-template-areas:"h h fx" "lead cue fx" "fit fit fx" "sl sl sl"}
.ch-mat{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-areas:"h h lead" "fx fx fx" "cue cue fit" "sl sl sl"}
.ch-reformer{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);grid-template-areas:"fx h" "fx lead" "cue cue" "fit sl"}
.ch-flow{grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);grid-template-areas:"h fx" "lead fx" "fit fx" "cue cue" "sl sl"}
.ch-yin{grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);grid-template-areas:". . h" ". . lead" "fx fx fx" "cue cue fit" "sl sl sl";row-gap:22px}
.ch-reformer{padding-top:calc(var(--arc) + clamp(48px,5vw,76px))}
.ch-mat{padding-top:calc(var(--arc) + clamp(64px,9vw,130px))}
.ch-h{grid-area:h}.ch-lead{grid-area:lead}.fx{grid-area:fx}.ch-cue{grid-area:cue}.fit{grid-area:fit}.slots{grid-area:sl}
.ch-wake .fx{align-self:center}
.ch-yin .ch-h,.ch-yin .ch-lead{text-align:start}
.ch-yin h2{font-size:clamp(34px,3.4vw,52px)}
.ch-yin .fx{margin-top:clamp(8px,1.6vw,24px)}
@media (min-width:900px){
  .fx-in{padding:0 12.5em}
  .fx-marks li{position:absolute;top:var(--y);width:12em;translate:0 -50%}
  .fx-marks li.l{left:0;flex-direction:row-reverse;text-align:end}
  .fx-marks li.r{right:0}
  .ch-wake .fx-in{padding:0 12.5em 0 0}
  .ch-mat .fx{width:min(100%,calc(560px + 25em));justify-self:center}
  .ch-flow .fx{width:min(100%,calc(330px + 25em));justify-self:center;align-self:center}
  .ch-yin .fx{width:min(100%,calc(440px + 25em));justify-self:start}
}

/* ---------- 教練：一大三小 ---------- */
.coaches{position:relative;padding:clamp(52px,5vw,76px) var(--pad) clamp(52px,4.4vw,64px);background:var(--night-d);color:var(--cream)}
.coaches h2{margin:0;font:400 clamp(26px,2.4vw,34px)/1.3 var(--mk);letter-spacing:.02em}
.cl{margin:26px 0 0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:40px 30px}
.co{display:grid;gap:10px;align-content:start}
.co-cue{margin:0;font:400 clamp(26px,2.5vw,36px)/1.3 var(--mk);text-wrap:balance}
.co-who{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
.co-who h3{margin:0;font:500 14px/1.4 var(--sans);letter-spacing:.12em}
.tchip{display:inline-flex;align-items:center;min-height:30px;padding:0 12px;border-radius:999px;box-shadow:inset 0 0 0 1.5px currentColor;font:400 13.5px/1 var(--sans);text-decoration:none;letter-spacing:.04em}
.tchip:hover{background:var(--cream);color:var(--night-d)}
.co-pts{margin:0;padding:0;list-style:none;font:400 14.5px/1.65 var(--sans)}
.co-pts li::before{content:"";display:inline-block;width:12px;height:2px;margin-right:8px;background:currentColor;vertical-align:.32em}
.co.big{grid-column:1/-1;grid-template-columns:minmax(0,1fr) minmax(0,15em);column-gap:40px;min-height:clamp(200px,20vw,300px);align-content:center;padding:clamp(16px,2.4vw,36px) 0}
.co.big .co-cue{grid-column:1;grid-row:1/4;font-size:clamp(52px,7.6vw,112px);line-height:1.08}
.co.big .co-who,.co.big .co-pts{grid-column:2;align-self:end}
.co.s1{grid-column:1/5}
.co.s2{grid-column:5/9;margin-top:32px}
.co.s3{grid-column:9/13;margin-top:64px}
.co :focus-visible{outline-color:var(--cream)}

/* ---------- 課卡：記日劃記，價格沿效期斜排 ---------- */
.plans{padding:clamp(52px,5vw,76px) var(--pad) clamp(52px,5vw,76px)}
.plans h2{margin:0;font:400 clamp(40px,4.4vw,64px)/1.1 var(--mk)}
.pl-p{margin:10px 0 0;max-width:32em;font:400 16px/1.7 var(--sans)}
.pl-key{display:flex;gap:22px;margin:16px 0 0;font:400 14px/1.4 var(--sans);letter-spacing:.06em}
.pl-key span{display:inline-flex;align-items:center;gap:8px}
.pl-key i{display:inline-block;width:2px;height:16px;background:currentColor;border-radius:2px;rotate:4deg}
.pl-key .k-n{width:7px;height:7px;border-radius:50%;rotate:none}
.pl{--u:calc((100% - 21em - 9em) / 121);margin:34px 0 0;padding:0;list-style:none;display:grid;gap:26px}
.pl li{display:grid;grid-template-columns:19em minmax(0,1fr);align-items:end;column-gap:2em}
.pl .p-t h3{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 12px;margin:0;font:400 26px/1.25 var(--mk)}
.pl .p-t h3 small{font:400 14px/1.4 var(--sans);letter-spacing:.04em}
.pl-note{margin:2px 0 0;font:400 14.5px/1.55 var(--sans)}
.pl .p-v{display:flex;align-items:flex-end;gap:14px;min-width:0}
.tly{flex:none;width:calc(var(--tw) * 1px * var(--tk,1.18));height:40px;max-width:calc(100% - 7.5em);overflow:visible}
.tly *{vector-effect:non-scaling-stroke}
.tl-st{fill:none;stroke:currentColor;stroke-width:1.6px;stroke-linecap:round}
.tl-dot{fill:none;stroke:currentColor;stroke-width:5px;stroke-linecap:round}
.pl-price{flex:none;margin:0;white-space:nowrap;font:500 14px/1 var(--sans)}
.pl-price b{font:400 clamp(36px,3.4vw,50px)/1 var(--mk);margin-left:4px}
.pl-tax{margin:26px 0 0;max-width:44em;font:400 14.5px/1.65 var(--sans)}

/* ---------- 第一次來（瀑布條） ---------- */
.first{padding:clamp(44px,4vw,58px) var(--pad);background:var(--tang-lo)}
.first h2{margin:0;font:400 clamp(34px,3.6vw,52px)/1.15 var(--mk)}
.fv{margin:30px 0 0;padding:0;list-style:none;display:grid;gap:10px}
.fv li{display:grid;grid-template-columns:calc(var(--at0) / 75 * 100%) calc(var(--m) / 75 * 100%) minmax(0,1fr);align-items:center;column-gap:0}
.fv .fv-b{grid-column:2;position:relative;display:flex;align-items:center;min-height:30px}
.fv .rb{position:absolute;inset:0;width:100%;height:100%;fill:var(--ink)}
.fv .fv-b .mkn{position:relative;padding:0 8px;font-size:17px;color:var(--cream);white-space:nowrap}
.fv .fv-x{grid-column:3;display:flex;flex-wrap:wrap;align-items:baseline;gap:0 12px;padding:0 0 0 14px}
.fv .fv-x h3{margin:0;font:400 20px/1.35 var(--mk)}
.fv .fv-x p{margin:0;font:400 15px/1.6 var(--sans)}
.fv li.late{grid-template-columns:minmax(0,1fr) calc(var(--m) / 75 * 100%) calc((75 - var(--at0) - var(--m)) / 75 * 100%)}
.fv li.late .fv-x{grid-column:1;grid-row:1;justify-content:flex-end;text-align:end;padding:0 14px 0 0}
.fv li.main .fv-x{grid-column:2;grid-row:2;padding:6px 0 0}
.fv-ax{position:relative;height:22px;margin:8px 0 0;font:400 14px/22px var(--mk)}
.fv-ax span{position:absolute;left:calc(var(--m) / 75 * 100%);translate:-50% 0;white-space:nowrap}
.fv-ax span:first-child{translate:0}.fv-ax span:last-child{translate:-100% 0}
.bring{display:flex;flex-wrap:wrap;gap:10px 56px;margin:26px 0 0;font:400 15.5px/1.7 var(--sans)}
.bring h3{margin:0;font:400 22px/1.3 var(--mk)}
.bring p{margin:2px 0 0;max-width:26em}

/* ---------- 規矩與怎麼來 ---------- */
.rules{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:26px 56px;padding:clamp(48px,4vw,60px) var(--pad) clamp(52px,4.4vw,64px)}
.rules h2{grid-column:1/-1;margin:0;font:400 clamp(34px,3.6vw,52px)/1.15 var(--mk)}
.rl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px 26px;align-items:baseline}
.rl dt{font:400 28px/1.2 var(--mk)}
.rl dd{margin:0;font:400 16px/1.75 var(--sans);max-width:34em}
.visit{display:grid;gap:14px;align-content:start;padding:28px 28px 30px;border-radius:120px 24px 24px 24px / 90px 24px 24px 24px;background:var(--night);color:var(--cream)}
.visit h3{margin:0;padding-left:40px;font:400 30px/1.2 var(--mk)}
.visit address{font-style:normal;font:400 16px/1.75 var(--sans)}
.visit .tel{font:400 32px/1.1 var(--mk);text-decoration-thickness:1.5px}
.visit dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 16px;font:400 15.5px/1.65 var(--sans)}
.visit dt{font-weight:500}
.visit dd{margin:0}
.visit :focus-visible{outline-color:var(--cream)}

/* ---------- 頁尾 ---------- */
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 24px;padding:22px var(--pad) 32px;background:var(--night-d);color:var(--cream);font:400 14.5px/1.7 var(--sans)}
.foot p{margin:0}
.foot b{font:400 18px/1 var(--mk)}

/* ---------- 404 ---------- */
.nf{min-height:calc(100dvh - 170px);padding:24px var(--pad) 80px}
.nf-top{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:24px 48px;align-items:end}
.nf h1{margin:0;font:400 clamp(44px,6vw,92px)/1.06 var(--mk)}
.nf p{margin:16px 0 0;max-width:30em;font:400 17px/1.75 var(--sans)}
.nf .fx-art{justify-self:end;width:min(100%,520px);color:var(--cream);--fld:var(--night);padding:20px 22px 12px;background:var(--night);border-radius:50% 50% 18px 18px / 70px 70px 18px 18px}
.nf .fx-art svg{width:100%;height:auto;overflow:visible}
.nf-go{display:flex;flex-wrap:wrap;gap:12px;margin:26px 0 0;padding:0;list-style:none}
.nf-go a{display:inline-grid;place-items:center;min-height:48px;padding:0 22px;border-radius:999px;background:var(--ink);color:var(--cream);font:500 16px/1 var(--sans);text-decoration:none;letter-spacing:.08em}
.nf-go a:hover{background:var(--night)}
.nf-tl{position:relative;margin:40px 0 0}
.nf-tl .lane{position:relative;height:44px;background:radial-gradient(circle,oklch(0.22 0.035 40 / .5) 1px,transparent 1.4px) 0 calc(100% - 9px)/calc(100% / 48) 3px repeat-x}
.nf-tl .open{position:absolute;top:0;bottom:0;left:calc(6 / 24 * 100%);width:calc(16 / 24 * 100%);box-shadow:inset 2px 0 0 var(--ink),inset -2px 0 0 var(--ink)}
.nf-tl .ghost{position:absolute;bottom:4px;left:calc(4.0667 / 24 * 100%);display:grid;gap:3px}
.nf-tl .ghost span{font:400 18px/1 var(--mk);white-space:nowrap;padding:0 4px;background:var(--tang)}
.nf-tl .ghost i{display:block;width:62px;height:4px;background:radial-gradient(circle,currentColor 1.6px,transparent 2px) 0 50%/7px 4px repeat-x}
.nf-tl .ax{position:relative;height:24px;border-top:2px solid var(--ink);font:400 15px/24px var(--mk)}
.nf-tl .ax span{position:absolute;left:calc(var(--h) / 24 * 100%);translate:-50% 0;white-space:nowrap}
.nf-tl .ax span:first-child{translate:0}.nf-tl .ax span:last-child{translate:-100% 0}

/* ---------- 平板 ---------- */
@media (max-width:1180px){
  .hero{grid-template-columns:minmax(0,1fr)}
  .flt{justify-self:start}
}
/* ---------- 手機 ---------- */
@media (max-width:899px){
  :root{--lab:50px}
  .bar{padding-top:12px}
  .mark{font-size:24px}
  .nav{width:100%}
  .nav ul{justify-content:space-between;gap:0 4px}
  .nav li:last-child{margin-left:auto}
  .nav a{font-size:14.5px}
  .bar{position:relative}
  .nav .go{position:absolute;top:10px;right:var(--pad)}
  .hero{padding-top:10px;gap:10px}
  .h1{font-size:clamp(34px,10vw,46px);line-height:1.12}
  .sub{font-size:14px}
  .flt{flex-wrap:wrap;gap:6px;justify-self:stretch}
  .chip{width:auto;flex:1 1 0;min-width:48px;min-height:66px}
  .chip .cfig{width:40px;height:26px}
  .stage{display:grid;grid-template-columns:minmax(0,46%) minmax(0,1fr);align-items:end;gap:6px 14px;height:auto;margin-top:14px;padding-bottom:12px;border-bottom:2px solid var(--ink)}
  .st-band,.st-now,.st-eve{display:none}
  .st-fig{position:relative;left:auto;bottom:auto;translate:none;justify-self:center;--sc:var(--scm,1.3);transition:none}
  .st-cap{position:static;width:auto;transition:none}
  .face h2{font-size:30px}
  .face .pk-cue{display:none}
  .pk-act{gap:8px 12px}
  .add{min-height:44px;padding:0 16px;font-size:15px}
  .pk-act a{font-size:14px}
  .sched-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 0 6px}
  .jump{display:flex;gap:6px}
  .jump button{min-width:52px;min-height:44px;padding:0 10px;border:0;border-radius:999px;box-shadow:inset 0 0 0 1.5px var(--ink);background:transparent;font:400 18px/1 var(--mk);cursor:pointer}
  .tl-sc{overflow-x:auto;overscroll-behavior-x:contain;margin:0 calc(var(--pad) * -1);padding:0 var(--pad)}
  .tl{width:calc(960 * 1.8px + var(--lab))}
  .day{height:60px}
  .dn{position:sticky;left:0;z-index:4;align-self:stretch;flex-direction:column;justify-content:center;align-items:flex-start;gap:2px;background:var(--tang);padding-left:0}
  .day.today .dn .dn-w{margin-left:0}
  .axis span:first-child{translate:-50% 0}
  .blk{height:48px;bottom:5px}
  .b-l{font-size:14px}
  .b-t{font-size:17px}
  .tl-foot{padding-left:0}
  .tray{grid-template-columns:minmax(0,1fr);padding-bottom:44px}
  .ti{grid-template-columns:56px auto minmax(0,1fr) auto;font-size:14.5px}
  .ti .ti-k{display:none}
  .tr-form input[type=text],.tr-form input[type=tel]{width:100%}
  .tr-form label.fl{flex:1 1 100%}
  .chapters{display:flex;align-items:stretch;gap:10px;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;scroll-padding-inline:var(--pad);padding:4px var(--pad) 34px;scrollbar-color:var(--ink) transparent}
  .ch{flex:0 0 86%;scroll-snap-align:start;margin-top:0;padding:50px 18px 24px!important;border-radius:50% 50% 20px 20px / 44px 44px 20px 20px;grid-template-columns:minmax(0,1fr)!important;grid-template-areas:"h" "lead" "fx" "cue" "fit"!important;grid-template-rows:none;min-height:0;gap:12px;align-content:start}
  .ch h2,.ch-yin h2{font-size:clamp(34px,10vw,44px)}
  .ch-len .len{width:min(100% - 6.4em,calc(var(--dur) / 90 * 52vw))}
  .ch-len b{font-size:26px}
  .slots{display:none}
  .ch-lead{font-size:15px;line-height:1.7}
  .ch-yin .fx{margin-top:0}

  .fx-art{width:min(100%,calc(190px * var(--ar)));margin:0 auto}
  .fx-marks{display:grid;gap:0;margin-top:6px}
  .fx-marks li{font-size:14px;line-height:1.5}
  .fx-marks b{font-size:19px;padding-bottom:1px}
  .fig .ld{display:none}
  .cue{font-size:19px;line-height:1.45}
  .ch-cue{gap:10px}
  .bt{grid-template-columns:1.5em minmax(0,1fr);grid-auto-rows:minmax(10px,auto);row-gap:0}
  .bt .tk{grid-column:1;grid-row:var(--i);padding:0;box-shadow:none;font-size:12.5px;line-height:10px}
  .bt .tk:not(.on){visibility:hidden}
  .bt .tk.on{box-shadow:inset 0 2px 0 var(--on);padding-top:2px}
  .bt-l li{grid-column:2;grid-row:var(--r) / span var(--s);flex-direction:row;justify-content:flex-start;align-items:center;gap:10px;padding:2px 0}
  .bt-l li::after{order:-1;width:7px;height:auto;align-self:stretch;border-radius:999px}
  .bt-t{font-size:14px;line-height:1.4}
  .fit{gap:6px 18px;font-size:14px;line-height:1.6}
  .fit>div{min-width:0;flex:1 1 100%}
  .fit h3{font-size:17px}
  .coaches{padding:52px var(--pad) 56px}
  .cl{grid-template-columns:minmax(0,1fr);gap:30px}
  .co.big,.co.s1,.co.s2,.co.s3{grid-column:1;margin-top:0}
  .co.big{grid-template-columns:minmax(0,1fr);min-height:0;padding:6px 0 0}
  .co.big .co-cue{grid-row:auto;font-size:clamp(40px,12vw,54px)}
  .co.big .co-who,.co.big .co-pts{grid-column:1}
  .co-cue{font-size:24px}
  .co-pts{display:none}
  .co.big .co-pts{display:block}
  .pl{gap:22px}
  .pl li{grid-template-columns:minmax(0,1fr);row-gap:6px}
  .pl .p-v{gap:10px}
  .tly{--tk:.48;height:30px;max-width:calc(100% - 7.4em)}
  .pl-price b{font-size:32px}
  .pl-price b{font-size:34px}
  .fv li,.fv li.late{grid-template-columns:calc(var(--at0) / 75 * 100%) calc(var(--m) / 75 * 100%) minmax(0,1fr)}
  .fv .fv-x,.fv li.late .fv-x,.fv li.main .fv-x{grid-column:1/-1;grid-row:2;justify-content:flex-start;text-align:start;padding:4px 0 0}
  .fv .fv-b{min-height:26px}
  .fv .fv-b .mkn{font-size:15px;padding:0 4px}
  .fv .fv-x h3{font-size:18px}
  .fv .fv-x p{font-size:14.5px}
  .rules{grid-template-columns:minmax(0,1fr)}
  .rl{grid-template-columns:minmax(0,1fr);gap:0}
  .rl dt{padding-top:12px;font-size:24px}
  .rl dd{font-size:15px}
  .visit{padding:24px 20px 24px;border-radius:80px 20px 20px 20px / 60px 20px 20px 20px}
  .visit h3{padding-left:30px}
  .nf-top{grid-template-columns:minmax(0,1fr)}
  .nf h1{font-size:clamp(36px,10vw,50px)}
}
