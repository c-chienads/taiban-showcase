.r-src,.r-end{position:absolute;left:0;width:96px;text-align:right;font-family:var(--f-d);font-size:.9375rem;line-height:1.3;color:var(--ox-2)}
.r-src{top:calc(var(--y1, 196) * 1px - 11px)}
.r-end{top:calc(var(--y2, 336) * 1px - 11px)}
.r-end::after,.r-src::after{content:"";position:absolute;right:-17px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--lag)}
.r-end::after{background:var(--ox)}
.wkn{position:absolute;inset:0;pointer-events:none}
.wn{position:absolute;left:calc(var(--wx) * 1px);top:calc(var(--wy) * 1px);transform:translate(-50%,-50%) translate(calc(var(--nx) * -36px),calc(var(--ny) * -36px));
  font-family:var(--f-n);font-weight:600;font-size:.8125rem;color:var(--ox-2);font-variant-numeric:tabular-nums}
.wn.v{display:none}
.plan{position:absolute;inset:0;margin:0;padding:0;list-style:none}
.pl{position:absolute;left:calc(var(--px) * 1px);top:calc(var(--py) * 1px);width:max-content;max-width:214px;display:flex;flex-direction:column;gap:2px;--gap:30px;background:var(--sal);padding:2px 6px 3px;margin-left:-6px;z-index:2}
.pl.t1{z-index:1}
.pl.t1{--gap:110px}
.pl.s0{transform:translate(-14px,calc(-100% - var(--gap)))}
.pl.s2{transform:translate(-14px,var(--gap))}
.pl.rt.s0{transform:translate(calc(-100% + 14px),calc(-100% - var(--gap)))}
.pl.rt.s2{transform:translate(calc(-100% + 14px),var(--gap))}
.pl::before{content:"";position:absolute;left:19px;width:2px;height:calc(var(--gap) - 18px);background:var(--ox)}
.pl.rt::before{left:auto;right:7px}
.pl.s0::before{top:calc(100% + 4px)}
.pl.s2::before{bottom:calc(100% + 4px)}
.pl-n{font-family:var(--f-d);font-weight:400;font-size:1.25rem;line-height:1.25}
.pl.tg .pl-n{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:.28em;text-decoration-color:var(--lag)}
.pl-m{font-size:.8125rem;color:var(--ox-2);white-space:nowrap}
.pl-m b{font-size:.9375rem;color:var(--ox)}
.pl-hw{font-size:.875rem;line-height:1.5}
html.js .rvw.anim .pl{transition:left 240ms ease-out,top 240ms ease-out}
.rest{margin:8px 0 0 118px;font-size:.9375rem;color:var(--ox-2)}
.rest b{color:var(--ox)}

/* ---------- 作業怎麼被看（沙洲帶） ---------- */
.rv{position:relative;margin-top:96px;background:var(--shoal);max-width:none!important;padding:64px 0 76px!important}
/* 測量框線：區塊交界的粗基線＋往上長的小刻度（小的每 12px 一格、大的每 60px 一格）；基線壓在交界上 */
.nl{--nb:3px;position:absolute;left:0;width:100%;height:13px;pointer-events:none;color:var(--ox);
  background:linear-gradient(currentColor,currentColor) 0 100%/100% var(--nb) no-repeat,
    repeating-linear-gradient(90deg,currentColor 0 1.5px,transparent 1.5px 12px) 0 calc(100% - var(--nb))/100% 5px no-repeat,
    repeating-linear-gradient(90deg,currentColor 0 2px,transparent 2px 60px) 0 calc(100% - var(--nb))/100% 10px no-repeat}
.nl-band{--nb:2px}
.nl-top,.nl-band{bottom:calc(100% - 1.5px)}
.nl-bot{bottom:-1.5px}
.rv-in{max-width:var(--maxw);margin-inline:auto;padding-inline:var(--gx)}
.rv .lead{margin-top:14px}
.board{position:relative;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:auto auto auto;gap:0 20px;margin-top:34px}
.trail{position:absolute;left:0;right:0;top:50%;height:260px;transform:translateY(-50%);width:100%;pointer-events:none}
.trail path{fill:none;stroke:var(--lag-m);stroke-width:2.2px;stroke-dasharray:1 9;stroke-linecap:round;vector-effect:non-scaling-stroke}
.spec{display:contents}
.sp{grid-row:2;display:flex;flex-direction:column;align-items:center;gap:10px;padding:34px 0 28px;position:relative}
.sp-0{grid-column:1 / 3}.sp-1{grid-column:3 / 5}.sp-2{grid-column:5 / 7}.sp-3{grid-column:7 / 9}
.fb{display:inline-flex;align-items:center;justify-content:center;min-width:10.5rem;padding:13px 26px;font-size:1rem;font-weight:500;color:var(--paper);background:var(--lag);border-radius:7px;
  box-shadow:0 3px 0 oklch(0.30 0.06 210)}
.sp-1 .fb{background:oklch(0.355 0.075 207)}
.sp-2 .fb{transform:translateY(2px);background:oklch(0.33 0.072 208);box-shadow:0 1px 0 oklch(0.30 0.06 210)}
.sp-3 .fb{background:oklch(0.47 0.045 205);box-shadow:none}
.sp .cur{position:absolute;width:20px;height:26px;left:calc(50% + 50px);top:56px}
.sp-3 .cur{width:24px;height:24px}
.sp-l{font-family:var(--f-d);font-size:.9375rem;color:var(--ox-2);letter-spacing:.08em}
.notes{display:contents}
.nt{position:relative;align-self:end;display:flex;flex-direction:column;gap:2px;padding:0 0 12px 16px;font-size:.9375rem;line-height:1.75;border-left:2px solid var(--lag)}
.nt-s{font-family:var(--f-d);font-weight:400;font-size:1rem;color:var(--lag)}
.nt-0{grid-row:1;grid-column:1 / 4}
.nt-2{grid-row:1;grid-column:5 / 8}
.nt-1{grid-row:3;grid-column:3 / 6;align-self:start;padding:12px 0 0 16px}
.nt-3{grid-row:3;grid-column:6 / 9;align-self:start;padding:12px 0 0 16px}
.rv-after{margin-top:26px;font-size:1rem;max-width:44em}

/* ---------- 十二門課（地層帶） ---------- */
.cs{padding-top:52px;max-width:none!important;padding-inline:0!important}
.cs-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,24rem);gap:12px 64px;align-items:end;max-width:var(--maxw);margin-inline:auto;padding-inline:var(--gx)}
.cs-head .lead{font-size:1rem}
.bands{margin-top:40px}
.band{position:relative;background:var(--bc);padding:26px 0 40px}
.band > *{max-width:var(--maxw);margin-inline:auto;padding-inline:var(--gx)}
.band > .nl{position:absolute;max-width:none;padding:0;margin:0}
.b0{--bc:var(--sal-hi)}.b1{--bc:var(--sal)}.b2{--bc:var(--sal-d)}.b3{--bc:var(--clay-l)}
.b4{--bc:var(--ox);color:var(--sal-hi)}
.band-n{display:flex;align-items:baseline;gap:16px;margin-bottom:16px}
.band-n b{font-family:var(--f-d);font-weight:400;font-size:1.625rem;letter-spacing:.06em}
.band-n b::before{content:"";display:inline-block;width:.55em;height:.48em;margin-right:.4em;background:currentColor;clip-path:polygon(50% 0,100% 100%,0 100%)}
.band-n span{font-size:.9375rem;color:var(--ox-2)}
.b4 .band-n span{color:var(--sal-hi)}
.row-c{display:flex;gap:28px;--u:calc((100% - var(--gn) * 28px) / var(--hmax))}
.band > .row-c{padding-inline:var(--gx)}
.c{width:calc(var(--h) * var(--u));flex:none;min-width:0}
/* 時數尺：尺長＝時數、一格＝一小時（background-size 取自塊寬除以 --h）；在路線上的那幾門，尺底填水色 */
.c::before{content:"";display:block;height:11px;margin-bottom:12px;box-sizing:border-box;border-right:1.5px solid var(--tk,var(--ox-2));
  background:linear-gradient(90deg,var(--tk,var(--ox-2)) 0 1.5px,transparent 1.5px) 0 100%/calc(100% / var(--h)) 8px repeat-x,linear-gradient(var(--tk,var(--ox-2)),var(--tk,var(--ox-2))) 0 100%/100% 1.5px no-repeat,linear-gradient(var(--fl,transparent),var(--fl,transparent)) 0 100%/100% 100% no-repeat}
.c.on::before{--tk:var(--ox);--fl:var(--shoal-3)}
.b2 .c.on::before,.b3 .c.on::before{--fl:var(--sal-hi)}
.b4 .c::before{--tk:var(--sal-hi)}
.b4 .c.on::before{--tk:var(--ox);--fl:var(--shoal)}
.c details{padding-top:4px}
.c summary{list-style:none;cursor:pointer;display:flex;flex-direction:column;gap:5px;position:relative;padding-right:30px}
.c summary::after{content:"";position:absolute;right:6px;top:12px;width:9px;height:9px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);transition:transform .2s}
.c details[open] summary::after{transform:rotate(225deg);top:17px}
.c summary:hover h3{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:.22em}
.c-hs{font-size:.9375rem;line-height:1.6;margin-top:2px}
.c summary::-webkit-details-marker{display:none}
.c h3{font-size:1.5rem;line-height:1.25}
.c-meta{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 14px;font-size:.8125rem;color:var(--ox-2)}
.b2 .c-meta,.b3 .c-meta,.b2 .band-n span,.b3 .band-n span{color:var(--ox)}
.b4 .c-meta{color:var(--sal-hi)}
.c-hr b{font-size:1rem;color:var(--ox)}
.b4 .c-hr b{color:var(--paper)}
.c-on{display:none;align-items:center;gap:6px;color:var(--lag);font-weight:500}
.c-on::before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor}
.c.on .c-on{display:inline-flex}
.b2 .c-on,.b3 .c-on{color:var(--ox)}
.b4 .c-on{color:var(--shoal)}
.b4 .c-on::before{background:var(--shoal)}
.c-body{display:flex;flex-direction:column;gap:8px;margin-top:12px;font-size:.9375rem;line-height:1.75}
.c-hw b,.c-tip b{display:inline-block;margin-right:.6em;font-size:.8125rem;font-weight:500;padding:0 8px;line-height:1.6;border-radius:0}
.c-hw b{background:var(--ox);color:var(--sal-hi)}
.b4 .c-hw b{background:var(--sal-hi);color:var(--ox)}
.c-tip b{box-shadow:inset 0 0 0 1.5px currentColor}
.pick{align-self:flex-start;font-size:.875rem;font-weight:500;margin-top:2px}
.row-aside{align-self:center;margin-left:40px;display:flex;flex-direction:column;gap:14px;max-width:36rem}
.row-aside p{font-size:.9375rem}
.chips{display:flex;flex-wrap:wrap;gap:0 26px;margin:0;padding:0;list-style:none}
/* 路線標記：圓環站點＋點線底（和乾河床同一種點），不是膠囊 */
.chip{display:inline-flex;align-items:center;gap:10px;min-height:44px;font-family:var(--f-d);font-size:1.0625rem;color:var(--ox);text-decoration:none}
a.chip::before{content:"";flex:none;width:12px;height:12px;box-sizing:border-box;border:2px solid currentColor;border-radius:50%;background:var(--sal-hi)}
a.chip span{padding-bottom:2px;background:radial-gradient(circle,currentColor 0.8px,transparent 1.2px) 0 100%/6px 3px repeat-x}
@media (hover:hover) and (pointer:fine){a.chip:hover{color:var(--lag)}a.chip:hover::before{background:currentColor}a.chip:hover span{background:linear-gradient(currentColor,currentColor) 0 100%/100% 2px no-repeat}}
.steps{gap:4px 0}
.steps .chip{color:var(--sal-hi)}
.steps .chip::before{content:"";flex:none;width:12px;height:12px;box-sizing:border-box;border:2px solid currentColor;border-radius:50%}
.steps li + li::before{content:"";display:inline-block;width:34px;height:0;border-top:2px dotted currentColor;margin:0 10px 0 6px}
.steps li{display:inline-flex;align-items:center;color:var(--sal-hi)}
html:not(.js) .pick,html:not(.js) .pace,html:not(.js) .share,html:not(.js) .kbd-tip{display:none}

/* ---------- 學費（留白裡一個巨大的單價） ---------- */
.fe{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);grid-template-areas:"h side" "big side";column-gap:72px;padding-block:150px 130px}
.fe h2{grid-area:h;align-self:start}
.fe-big{grid-area:big;position:relative;min-height:440px;margin-top:20px}
/* 圖框：外框粗線、內框細線，兩框之間一圈刻度（地圖圖幅的邊） */
.fe-fr{position:absolute;inset:0;border:2px solid var(--ox);
  background:repeating-linear-gradient(90deg,var(--ox) 0 1px,transparent 1px 14px) 0 0/100% 6px no-repeat,repeating-linear-gradient(90deg,var(--ox) 0 1px,transparent 1px 14px) 0 100%/100% 6px no-repeat,
    repeating-linear-gradient(0deg,var(--ox) 0 1px,transparent 1px 14px) 0 0/6px 100% no-repeat,repeating-linear-gradient(0deg,var(--ox) 0 1px,transparent 1px 14px) 100% 0/6px 100% no-repeat}
.fe-fr::before{content:"";position:absolute;inset:6px;border:1px solid var(--ox)}
.fe-n{position:absolute;left:11%;top:50%;transform:translateY(-54%);display:flex;align-items:baseline;gap:14px;white-space:nowrap}
.fe-n b{font-weight:300;font-size:clamp(9rem,5rem + 10vw,17.5rem);line-height:.8;letter-spacing:-.05em;color:var(--lag)}
.fe-n span{font-family:var(--f-d);font-size:1.125rem}
.fe-side{grid-area:side;align-self:end;display:flex;flex-direction:column;gap:22px;padding-bottom:20px;max-width:30rem}
.fe-rule{font-family:var(--f-d);font-size:1.5rem;line-height:1.5}
.fe-mine{font-size:1.0625rem;line-height:1.7}
.fe-mine b{font-size:1.375rem;color:var(--lag)}
.fe-notes{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;font-size:.9375rem;line-height:1.75}
.fe-notes li{padding-left:22px;position:relative}
.fe-notes li::before{content:"";position:absolute;left:2px;top:.6em;width:8px;height:8px;border:1.6px solid var(--ox);transform:rotate(45deg)}
.fe-more{display:flex;flex-direction:column;gap:14px;margin:6px 0 0}
.fe-more dt{font-family:var(--f-d);font-size:1.125rem}
.fe-more dd{margin:2px 0 0;font-size:.9375rem;line-height:1.75}

/* ---------- 常被問的（深水區） ---------- */
.ask{position:relative;background:var(--lag);color:var(--sal-hi);max-width:none!important;padding:84px 0 70px!important;margin-top:40px;--focus-ring:3px dashed oklch(0.97 0.012 40)}
.ask-in{max-width:var(--maxw);margin-inline:auto;padding-inline:var(--gx);display:grid;grid-template-columns:minmax(0,1fr) minmax(16rem,22rem);gap:0 80px;align-items:start}
.ask h2{grid-column:1 / -1;color:var(--paper)}
.qa{margin-top:26px}
.qa details{border-bottom:1px solid oklch(0.56 0.07 200)}
.qa summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:14px;padding:15px 0;font-family:var(--f-d);font-size:1.25rem;color:var(--paper)}
.qa summary::-webkit-details-marker{display:none}
.qa summary::before{content:"";flex:none;width:12px;height:13px;background:var(--shoal);clip-path:polygon(0 0,100% 50%,0 100%);transition:transform .2s}
.qa details[open] summary::before{transform:rotate(90deg)}
.qa p{padding:0 0 18px 30px;font-size:1rem;line-height:1.8;max-width:38em}
.qa a{color:var(--paper)}
.contact{margin-top:34px}
.ct-lead{font-size:1.0625rem}
.ct-line{display:flex;flex-direction:column;gap:6px;margin-top:14px;font-size:1.0625rem}
.ct-line a{color:var(--paper);font-family:var(--f-d);font-size:1.375rem}
.ct-line a.num{font-family:var(--f-n);font-weight:500}
.ct-line span{font-size:.9375rem}

/* ---------- 頁尾 ---------- */
.foot{background:var(--lag-dd);color:var(--sal-hi);padding:40px var(--gx) 44px;display:flex;flex-wrap:wrap;align-items:flex-start;gap:16px 40px;--focus-ring:3px dashed oklch(0.97 0.012 40)}
.foot .brand{color:var(--sal-hi)}
.foot .brand span{color:var(--shoal)}
.foot address{font-style:normal;display:flex;flex-direction:column;gap:2px;font-size:.9375rem}
.foot .fine{flex-basis:100%;font-size:.8125rem;color:var(--shoal)}

/* ---------- 404 ---------- */
.e404{padding:40px var(--gx) 80px;max-width:var(--maxw);margin-inline:auto}
.e404 h1{font-size:clamp(2rem,1.2rem + 2.4vw,3.2rem);line-height:1.25}
.nf{margin:30px 0 20px;max-width:620px}
.nf-g{width:100%;height:auto}
.nf-w{fill:none;stroke:var(--lag);stroke-width:7;stroke-linecap:round}
.nf-n{fill:var(--sal-hi);stroke:var(--ox);stroke-width:2;stroke-linejoin:miter}
.nf-g text{fill:var(--ox);font-size:17px;font-family:var(--f-d)}
.nf-x{fill:none;stroke:var(--clay);stroke-width:2.2;stroke-dasharray:7 4 2 4;stroke-linejoin:miter}
.nf-g .nf-t{font-family:var(--f-n);font-size:34px;font-weight:300}
.nf figcaption{margin-top:10px;font-size:.9375rem;color:var(--ox-2)}
.nf-l{display:flex;flex-wrap:wrap;gap:10px 28px;margin-top:20px;font-weight:500}

/* ---------- 中寬：首屏改單欄 ---------- */
@media (max-width:1299px){
  :root{--gx:32px}
  .map{grid-template-columns:minmax(0,1fr);grid-template-areas:"say" "tool" "pool";row-gap:18px}
  .say{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,26rem);gap:12px 48px;align-items:end;padding-top:16px}
  .say .lead{margin-top:0}
  .pool{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:16px 36px;align-items:center}
  .pool-a{grid-row:1 / 4}
  .wk-head,.rest{padding-left:0;margin-left:0}
  .fe{grid-template-columns:1fr;grid-template-areas:"h" "big" "side"}
  .ask-in{grid-template-columns:1fr}
}

/* ---------- 窄版（手機） ---------- */
@media (max-width:899px){
  :root{--gx:16px}
  body{font-size:.9375rem}
  .top{gap:10px;padding:12px var(--gx) 4px}
  .brand span{display:none}
  .nav{gap:16px;font-size:.875rem}
  .nav a{min-height:44px;display:inline-flex;align-items:center}
  .nav .nv-x{display:none}
  .say{display:block;padding-top:14px}
  .map h1{font-size:1.875rem;line-height:1.3}
  .say .lead{margin-top:14px;font-size:.9375rem;line-height:1.8}
  .lead2{margin-top:6px}
  .tool-top{padding:6px 0 0;gap:6px 14px}
  .hint{display:none}
  .legend{gap:12px;font-size:.8125rem}
  .cv-wrap{overflow-x:auto;overscroll-behavior-x:contain;margin:0 calc(-1 * var(--gx));padding-inline:var(--gx)}
  .cv{width:calc(var(--mW) * 1px);height:calc(var(--mH) * 1px)}
  .s-w{display:none}.s-n{display:block}
  .nd{left:calc(var(--mx) * 1px);top:calc(var(--my) * 1px);width:80px;height:64px}
  .node{align-items:center;text-align:center;padding:0 5px;gap:2px}
  .node .pb-w{display:none}.node .pb-n{display:block}
  .node .nm{font-size:.9375rem;line-height:1.15;white-space:normal;word-break:keep-all;overflow-wrap:normal;letter-spacing:0}
  .node .hr{font-size:.75rem}
  .node .hr b{font-size:.8125rem}
  .node:focus-visible{outline-offset:4px}
  .pt{left:calc(50% + var(--mo) * 1px - 4px);width:8px;height:8px}
  .tgtag{left:calc(var(--mx) * 1px - 4px);top:calc(var(--my) * 1px - 26px);height:22px;line-height:22px;font-size:.8125rem;padding:0 16px 0 8px}
  .pool{display:grid;grid-template-columns:1fr;gap:12px;margin-top:10px;padding-bottom:0}
  .pool-a{grid-row:auto;max-width:none;aspect-ratio:440 / 215}
  .tot b{font-size:6rem}
  .tot .u{font-size:1.0625rem}
  .who{font-size:.875rem;bottom:13%}
  .pc-g{max-width:none}
  .pc{min-height:58px;padding:6px 4px}
  .dk-go a{min-height:44px}
  .wk{padding-top:56px}
  .wk-head{display:block}
  .wk-head .lead{margin-top:10px;font-size:.9375rem}
  .rvw{height:calc(var(--mrh) * 1px);margin-top:22px}
  .river.h{display:none}
  .river.v{display:block;width:64px;height:calc(var(--mrh) * 1px)}
  .rbk{stroke-width:30px}
  .rs,.rbd{stroke-width:18px}
  .rtk{stroke-width:34px}
  .r-src,.r-end{left:76px;width:auto;text-align:left;font-size:.8125rem}
  .r-src{top:-22px}
  .r-end{top:auto;bottom:-2px}
  .r-src::after,.r-end::after{display:none}
  .wn.h{display:none}
  .wn.v{display:block;transform:translate(-50%,-50%) translateX(-30px);font-size:.75rem}
  .pl,.pl.s0,.pl.s2,.pl.rt.s0,.pl.rt.s2{left:76px;top:calc(var(--mpy) * 1px);transform:none;max-width:calc(100% - 76px);width:auto;padding-top:2px}
  .pl::before,.pl.rt::before{left:-26px;right:auto;top:12px;bottom:auto;width:20px;height:2px}
  .pl{display:grid;grid-template-columns:auto 1fr;column-gap:10px;align-items:baseline;row-gap:0}
  .pl-n{font-size:1.0625rem;line-height:1.35}
  .pl-m{font-size:.75rem}
  .pl-hw{grid-column:1 / -1;font-size:.8125rem;line-height:1.45}
  .rest{margin-top:22px}
  .rv{margin-top:60px;padding:36px 0 56px!important}

  .sp{grid-column:1!important;padding:4px 0 0;gap:6px;align-items:flex-start}
  .sp-0{grid-row:1!important}.sp-1{grid-row:2!important}.sp-2{grid-row:3!important}.sp-3{grid-row:4!important}
  .fb{min-width:0;padding:9px 12px;font-size:.8125rem}
  .sp .cur{left:88px;top:22px;width:16px;height:21px}
  .sp-3 .cur{width:20px;height:20px}
  .sp-l{font-size:.8125rem}
  .nt,.nt-0,.nt-1,.nt-2,.nt-3{grid-column:2!important;padding:0 0 0 12px;align-self:start}
  .nt-0{grid-row:1!important}.nt-1{grid-row:2!important}.nt-2{grid-row:3!important}.nt-3{grid-row:4!important}
  .nt{font-size:.875rem;line-height:1.7}
  .nt-s{display:none}
  .cs{padding-top:52px}

  .cs-head .lead{margin-top:8px;font-size:.9375rem}
  .bands{margin-top:34px}

  .band-n span{font-size:.8125rem}
  .row-c{flex-direction:column;gap:4px}
  .c{width:auto!important}
  .c::before{height:9px;margin:4px 0 2px;width:calc(var(--h) / 12 * 100%)}
  .c summary{flex-direction:row;flex-wrap:wrap;align-items:baseline;gap:0 12px;min-height:44px;padding:2px 26px 6px 0;position:relative}
  .c summary::after{right:4px;top:18px}
  .c details[open] summary::after{top:22px}
  .c-hs{display:none}
  .c h3{font-size:1.1875rem}
  .c-meta{gap:2px 10px}
  .c-body{margin-top:4px;padding-bottom:10px}
  .row-aside{margin:10px 0 0;align-self:stretch}
  .chip{min-height:44px;font-size:1rem}
  .fe{padding-block:60px 44px;row-gap:0}
  .fe-big{min-height:200px;margin:14px 0 18px}
  .fe-n b{font-size:7.5rem}
  .fe-n{left:9%}
  .fe-n span{font-size:1rem}
  .fe-rule{font-size:1.1875rem}
  .fe-side{gap:12px;padding-bottom:0}
  .fe-more{gap:8px}
  .ask{padding:56px 0 48px!important}
  .qa summary{font-size:1.0625rem;min-height:44px;padding:10px 0}
  .qa p{padding-left:0}
  .foot{padding:22px var(--gx) 26px;gap:8px}
  .foot .brand svg{width:24px;height:24px}
  .foot .brand b{font-size:1.25rem}
  .foot address{font-size:.875rem}
}

@media (prefers-reduced-motion:reduce){
  .cv :is(.wb,.wv,.wm,.node,.pb path,.tgtag),.cv .bd use,.rvw :is(.rs,.pl),.qa summary::before,.nav a{transition-property:none!important}
  html.js .cv.anim .node .pb path,html.js .cv.anim .node,html.js .cv.anim .w .wb,html.js .cv.anim .w .wv,html.js .cv.anim .bd use,html.js .cv.anim .tgtag,
  html.js .rvw.anim .rs,html.js .rvw.anim .pl{transition:none!important}
  .w.was .wm{animation:none!important;opacity:0!important}
}

@media print{
  body,html{background:#fff!important;color:#000!important}
  body *{color:#000!important;box-shadow:none!important}
  .top .nav,.tool-top .hint,.pace,.dk-go,.pick,.nojs,.rv .board .trail,.nl,.basin,.pool-g,.fe-fr{display:none!important}
  main > section,.rv,.ask,.cs{padding:12px 0!important;margin:0!important;background:#fff!important}
  .map{display:block}
  .cv{background:none!important}
  .cv-wrap{overflow:visible}
  .node .pp{fill:#fff!important;stroke:#000!important}
  .node .pn,.node .br{display:none}
  .node.on .pp{stroke-width:3px!important}
  .wv{stroke:#000!important}.wb{stroke:#fff!important}.wd{stroke:#888!important}
  .pool-a{aspect-ratio:auto}.tot,.who{position:static}
  .band{background:#fff!important}
  .rvw{height:auto!important}.river,.wkn{display:none}
  .plan{position:static}.pl,.pl.s0,.pl.s2,.pl.rt.s0,.pl.rt.s2{position:static;transform:none;margin:4px 0;max-width:none;background:none!important;padding:0}
  .r-src,.r-end{display:none!important}
  .pl::before{display:none}
  .fe-big{min-height:0}.fe-n{position:static;transform:none}
  .c details > *{display:block}
  a{color:#000!important;text-decoration:underline}
  .foot{background:#fff!important}
}

}
