@font-face{font-family:"Noto Serif TC";src:url("fonts/01-noto-serif-tc.woff2") format("woff2");font-weight:400 700;font-style:normal;font-display:swap}

}
html{background:var(--ground)}
body{background:var(--ground);color:var(--foam);font-family:var(--f-zh);font-size:1.0625rem;line-height:1.85;font-weight:400}
h1,h2,h3{margin:0;color:var(--foam)}
h2,h3{font-weight:600}

.sprite{position:absolute;width:0;height:0;overflow:hidden}
button{font-family:inherit}
section:focus,main:focus,.river:focus{outline:none}

/* ===== 頂列 ===== */
.top{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px 36px;padding:12px var(--gut)}
.brand{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:var(--foam)}
.brand svg{width:40px;height:26px;flex:none}
.brand b{font-size:1.3rem;font-weight:700;letter-spacing:.06em;line-height:1}
.brand span{font-size:.875rem;color:var(--mist);letter-spacing:.04em;white-space:nowrap}
.nav{display:flex;flex-wrap:wrap;gap:4px 24px}
.nav a{font-size:.9375rem;font-weight:600;text-decoration:none;padding:6px 0;border-bottom:2px solid transparent}
.nav a:hover{border-bottom-color:var(--foam)}
.tel{font-size:1.125rem;text-decoration:none;white-space:nowrap;letter-spacing:.02em}
.tel:hover{text-decoration:underline}

/* ===== 首屏：一句隨筆＋一條溪＋沙灘 ===== */
.planner{padding:18px var(--gut) 0}
.h-l h1{font-size:clamp(1.75rem,3.3vw,2.9rem);font-weight:500;line-height:1.4;letter-spacing:.02em;max-width:34em;text-wrap:balance}
.h-l h1 em{font-style:normal;text-decoration:underline wavy var(--apricot) 1.5px;text-underline-offset:.32em;text-decoration-skip-ink:none}
.nojs{margin-top:10px;font-size:.9375rem;color:var(--foam);border-top:2px dashed #ffb572;padding-top:8px;max-width:46em}
html.js .nojs{display:none}

/* --- 溪（手機／平板：直向） --- */
.river{position:relative;display:grid;container-type:inline-size;grid-template-columns:62px minmax(0,1fr) 96px;grid-template-rows:auto 52px calc(17 * var(--hp)) 40px calc(17 * var(--hp)) 40px calc(17 * var(--hp)) auto auto;margin-top:16px}
.load{grid-row:1;grid-column:1/-1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:6px}
.load-l{grid-column:1/-1;font-size:.875rem;font-weight:600;color:var(--mist)}
.ld{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:7px;min-height:44px;padding:3px 10px 3px 9px;background:transparent;color:var(--foam);border:2px solid var(--mist);border-radius:22px;font-size:.9375rem;font-weight:600;line-height:1.3;text-align:left}
.ld:hover{background:var(--ground-2)}
.ld[aria-pressed="true"]{background:var(--foam);color:var(--deep);border-color:var(--foam)}
.ld-w{width:34px;height:14px;overflow:visible}
.ld-w path{fill:none;stroke:currentColor;stroke-width:1.6;vector-effect:non-scaling-stroke}
.ld-x{grid-template-columns:minmax(0,1fr);border-style:dashed;color:var(--mist)}
.stn{display:grid;justify-items:center;gap:2px;font-size:.8125rem;font-weight:600;line-height:1.3;color:var(--mist);white-space:nowrap}
.stn i{display:block;width:16px;height:16px;border:3px solid var(--foam);border-radius:50%;background:var(--ground)}
.stn-a{grid-row:2;grid-column:2;align-self:end;justify-self:center;grid-auto-flow:row;padding-bottom:4px}
.stn-l{display:none}
.cap{display:none}
.rows{grid-column:2;grid-row:3/8;display:grid;grid-template-rows:subgrid;grid-template-columns:minmax(0,1fr)}
.run{position:relative;grid-row:auto}
.run0{grid-row:1}.run1{grid-row:3}.run2{grid-row:5}
.wv{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.wv-h{display:none}
.w-fill{fill:var(--water)}
.w-top{fill:none;stroke:var(--foam);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.w-bot{fill:none;stroke:var(--line);stroke-width:1.5}
.w-c{fill:none;stroke:var(--contour);stroke-width:1.2;stroke-dasharray:2 6;stroke-linecap:round}
.w-c2{stroke-dasharray:1 9}
.bend{position:relative}
.bend0{grid-row:4;grid-column:2}.bend1{grid-row:6;grid-column:2}
.bd-s{display:none}
.bend::before{content:"";position:absolute;inset:-2px 22%;background:var(--night);border-radius:46% 54% 50% 50% / 30% 30% 70% 70%}
.zc{position:absolute;left:50%;top:50%;translate:-50% -50%;display:flex;align-items:center;gap:6px;font-size:.8125rem;font-weight:600;color:var(--mist);white-space:nowrap}
.zc::before{content:"";width:10px;height:10px;border-radius:50%;box-shadow:-3px 0 0 0 var(--mist);translate:3px 0}
.zs{display:none}
.zc[data-z="0"] .zs0,.zc[data-z="1"] .zs1,.zc[data-z="2"] .zs2,.zc[data-z="3"] .zs3,.zc[data-z="4"] .zs4{display:inline}
.dl{grid-column:3;display:grid;align-content:start;justify-items:start;gap:0;padding:4px 0 0 12px;line-height:1.2}
.dl0{grid-row:3}.dl1{grid-row:5}.dl2{grid-row:7}
.dl-n{font-size:.875rem;font-weight:700}
.dl-i{font-size:2.6rem;line-height:1;margin:4px 0 6px;letter-spacing:-.01em;white-space:nowrap}
.dl[data-lv="2"] .dl-i{color:var(--apricot)}
.lv{display:none;padding:0 8px;border:1.5px solid currentColor;border-radius:11px;font-size:.75rem;font-weight:700;line-height:1.55}
.dl[data-lv="0"] .lv0{display:inline-block;color:var(--mist)}
.dl[data-lv="1"] .lv1{display:inline-block;color:var(--foam)}

.fx{grid-row:9;grid-column:1/-1;display:grid;gap:4px;margin-top:10px;max-width:48em}
.fx-f{font-size:1.0625rem;font-weight:700;letter-spacing:.02em}
.fx-n{font-size:.875rem;line-height:1.8;color:var(--mist)}

/* 時段（水裡的一段） */
.cell{position:absolute;left:18px;right:28px;top:calc(var(--x0) * var(--hp));height:calc(var(--len) * var(--hp));cursor:pointer;border-radius:4px}
.cell::after{content:"";position:absolute;left:-10px;top:0;width:8px;height:2px;background:var(--line)}
.cell:focus-visible{outline:var(--focus-ring);outline-offset:1px;z-index:3}
.sl{position:absolute;right:calc(100% + 24px);top:0;display:grid;justify-items:end;width:56px;font-size:.8125rem;line-height:1.25;color:var(--mist);white-space:nowrap}
.sl b{font-weight:700;color:var(--foam)}
.sl .num{font-size:.75rem}
.run1 .sl .num,.run2 .sl .num{display:none}
.cell:not(.has)::before{content:"";position:absolute;inset:3px 4px;border:1.5px dashed var(--line);border-radius:40% 46% 42% 48% / 30% 34% 30% 36%;background:var(--pool)}
.trv{position:absolute;left:0;right:0;top:0;height:calc(var(--t) / var(--len) * 100%);display:flex;align-items:center;justify-content:center;overflow:hidden;background:url(assets/current-v.svg) repeat-y center top;transition:height .22s cubic-bezier(.3,.7,.2,1)}
.cell:not(.has) .trv{display:none}
.trv-t{padding:0 6px;background:var(--deep);color:var(--foam);font-size:.6875rem;font-weight:700;line-height:15px;white-space:nowrap;border-radius:8px}
.trv-t b{font-weight:400}
.cell>.chip{position:absolute;left:0;right:0;top:calc(var(--t) / var(--len) * 100%);width:auto;height:calc(min(var(--h),var(--len) - var(--t)) / var(--len) * 100%);rotate:0deg;transition:top .22s cubic-bezier(.3,.7,.2,1),height .22s cubic-bezier(.3,.7,.2,1)}
.cell>.chip::after{content:"";position:absolute;inset:-5px -9px;border:1px solid oklch(0.965 0.016 195 / .28);border-radius:var(--pb);pointer-events:none}
.cell>.chip.rest::after{border-style:dashed}
/* 觸控目標：1 小時的石頭只有 20px 高（長度＝時間，不能加高）；可點範圍用隱形的 ::before 往上下長，但不超出自己的時段（超出最多 2px）。點石頭與點時段在 JS 裡是同一件事 */
.cell>.chip::before{content:"";position:absolute;left:-9px;right:-9px;top:calc(-1 * min(13px, var(--t) * var(--hp) + 2px));bottom:calc(-1 * min(13px, (var(--len) - var(--t) - min(var(--h), var(--len) - var(--t))) * var(--hp) + 2px))}
.ovf{display:none;position:absolute;right:-6px;bottom:-9px;z-index:2;padding:0 7px;background:var(--apricot);color:var(--deep);font-size:.6875rem;font-weight:700;line-height:17px;white-space:nowrap;border-radius:9px}
.cell.over .ovf{display:block}
.river.placing .cell{cursor:copy}
.river.placing .cell.ok::before{border-color:var(--mist);border-style:solid}
.river.placing .cell.ok:not(.has){outline:2px dashed var(--mist);outline-offset:2px}
.river.placing .cell.no{opacity:.5}
.cell.hov{outline:3px solid var(--apricot) !important;outline-offset:2px}
.cell.fly{z-index:4}

/* 石頭 */
.chip{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto;align-content:center;column-gap:6px;container-type:size;margin:0;padding:3px 12px 3px 10px;border:0;border-radius:var(--pb);background:radial-gradient(ellipse 70% 60% at 28% 22%,oklch(1 0 0 / .38),transparent 70%),url(assets/speckle.svg),var(--zc,var(--stone));color:var(--deep);text-align:left;cursor:grab;touch-action:manipulation;user-select:none;-webkit-user-select:none;box-shadow:inset 0 -2px 0 oklch(0.22 0.045 212 / .14)}
.chip .gl{grid-row:1/span 2;align-self:center;width:17px;height:17px}
.k-n{font-size:.875rem;font-weight:700;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k-m{font-size:.75rem;font-weight:500;line-height:1.35;color:var(--deep-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k-m .num{font-size:.8125rem}
.z1{--zc:var(--rice)}.z2{--zc:var(--tea)}.z3{--zc:var(--sea)}.z4{--zc:var(--terrace)}
.chip.rest{background:var(--water);background-image:none;color:var(--foam);box-shadow:inset 0 0 0 2px var(--mist)}
.chip.rest .k-m{color:var(--mist)}
.cell>.chip{padding-inline:8px}
@container (max-width:92px){.chip .gl{display:none}.chip .k-n{white-space:normal;font-size:.8125rem;line-height:1.2;overflow:visible}.chip .k-m{display:none}}
@container (max-height:34px){.chip .k-m{display:none}.chip .gl{grid-row:1}}
.chip:hover{filter:brightness(1.04)}
.chip[aria-pressed="true"]{outline:3px solid var(--apricot);outline-offset:2px}
.chip.lifted{opacity:.35}
/* 輔助動效 2：放下時從游標位置滑進水裡，順便把沙灘上的斜角扶正 */
.chip.land{animation:f27-land .24s cubic-bezier(.3,.7,.2,1)}
@keyframes f27-land{from{translate:var(--fx,0) var(--fy,0);rotate:var(--rot,-2deg)}to{translate:0 0;rotate:0deg}}
.drag-ghost{position:fixed;z-index:60;left:0;top:0;pointer-events:none;margin:0;outline:3px solid var(--apricot);rotate:var(--rot,-2deg)}
html.dragging,html.dragging *{cursor:grabbing !important;user-select:none}

/* --- 沙灘（籌碼盤） --- */
.beach{position:relative;display:grid;grid-template-columns:minmax(0,1fr);gap:22px;margin:26px calc(var(--gut) * -1) 0;padding:44px var(--gut) 34px;background:var(--sand) url(assets/sand.svg);color:var(--ink)}
.shore{position:absolute;left:0;top:-1px;width:100%;height:40px;pointer-events:none}
.sh-f{fill:var(--ground)}

.bh{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 18px;margin-bottom:14px}

.tray{display:flex;flex-wrap:wrap;gap:16px 30px;align-items:flex-start}
.tg{display:flex;align-items:flex-start;gap:10px}
.tgl{flex:none;display:grid;justify-items:start;width:46px;padding-top:4px;font-size:.9375rem;font-weight:700;line-height:1.25;color:var(--ink)}
.tgl .gl{width:20px;height:20px;color:var(--ink-2)}

.tg-c{display:flex;flex-wrap:wrap;gap:10px 8px}

.ts>.chip::after{content:"";position:absolute;inset:-2.5px 0} /* 觸控目標：沙灘上的石頭手機版只有 40–43px 高，可點範圍上下各多 2.5px，畫面不變 */
.ts>.chip{width:100%;height:100%;rotate:var(--rot);box-shadow:inset 0 -2px 0 oklch(0.22 0.045 212 / .14),0 0 0 1.5px var(--ink)}
.ts>.chip.rest{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink-2)}
.ts>.chip.rest .k-m{color:var(--ink-2)}
.wet{display:none;align-items:center;width:100%;height:100%;padding:0 12px;border-radius:var(--pb);rotate:var(--rot);background:var(--sand-2);box-shadow:inset 0 2px 0 var(--sand-3);font-size:.8125rem;font-weight:600;line-height:1.25;color:var(--ink);cursor:pointer}
.ts:not(:has(.chip)) .wet{display:flex}
.voice{min-height:120px;padding-top:6px;color:var(--ink)}
.vc-k{font-size:.8125rem;font-weight:700;color:var(--ink-2);letter-spacing:.04em}
.vc-n{margin-top:2px;font-size:1.2rem;font-weight:700;line-height:1.4}
.vc-b{margin-top:6px;font-size:.9375rem;line-height:1.85}
.rn,.rb{display:none}
.voice[data-r="draft"] .rn-draft,.voice[data-r="draft"] .rb-draft{display:inline}
.voice[data-r="two"] .rn-two,.voice[data-r="two"] .rb-two{display:inline}
.voice[data-r="coast"] .rn-coast,.voice[data-r="coast"] .rb-coast{display:inline}
.voice[data-r="all"] .rn-all,.voice[data-r="all"] .rb-all{display:inline}
.voice[data-r="custom"] .rn-custom,.voice[data-r="custom"] .rb-custom{display:inline}
.voice[data-r="empty"] .rn-empty,.voice[data-r="empty"] .rb-empty{display:inline}
.nt{display:none}
.nt.on{display:block}
.voice.has-c .vc-r{display:none}
.nt-n{display:flex;align-items:center;gap:8px;font-size:1.2rem;font-weight:700;line-height:1.4}
.nt-n .gl{width:22px;height:22px;color:var(--ink-2)}
.nt-m{margin-top:2px;font-size:.8125rem;font-weight:600;color:var(--ink-2)}
.nt-b{margin-top:6px;font-size:.9375rem;line-height:1.85}
.how{margin:0 calc(var(--gut) * -1);padding:10px var(--gut) 18px;background:var(--sand) url(assets/sand.svg);color:var(--ink)}
html:not(.js) .how{display:none}
.how kbd{font:inherit;font-size:.875em;font-weight:700;padding:0 .4em;margin:0 1px;border:1px solid currentColor;border-bottom-width:2px;border-radius:4px;white-space:nowrap}
.how div{display:grid;gap:6px;max-width:38em;padding-bottom:6px;font-size:.9375rem;line-height:1.8}

/* ===== 一疊錢 ===== */
.cost{padding:clamp(56px,6vw,92px) var(--gut) clamp(48px,5vw,76px);background:var(--ground)}
.cost-h{display:grid;gap:10px;max-width:40em}
.cost-h h2{font-size:clamp(1.75rem,3vw,2.6rem);line-height:1.3}
.cost-lead{font-size:.9375rem;color:var(--mist)}
.cairn-w{position:relative;display:grid;grid-template-columns:minmax(0,1fr);margin-top:30px}
.cairn{display:grid;justify-items:center;margin:0;padding:0 0 4px;list-style:none}
.cs{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:10px;width:calc(150px + var(--w) * (100% - 150px));max-width:340px;min-height:58px;margin-top:-5px;padding:6px 18px;border-radius:var(--pb);rotate:var(--rot);translate:var(--dx) 0;background:var(--stone) url(assets/speckle.svg);color:var(--deep);box-shadow:inset 0 -2px 0 oklch(0.22 0.045 212 / .16);transition:width .3s cubic-bezier(.3,.7,.2,1)}
.cs-plan{background-color:var(--mist)}
.cs-car{background-color:var(--sea)}
.cs-act{background-color:var(--rice)}
.cs-room{background-color:var(--tea)}
.cs-k{font-size:.875rem;font-weight:700}
.cs b{font-size:1.45rem;line-height:1}
.wl{display:block;width:100%;height:20px;margin-top:-6px}
.wl path{fill:none;stroke:var(--foam);stroke-width:2;vector-effect:non-scaling-stroke}
.cn{display:grid;align-content:start;gap:2px;margin-top:18px}
.cn-k{font-size:1.0625rem;font-weight:700}
.cn-v{font-size:.9375rem;color:var(--foam)}
.cn-v b{font-size:1.15rem}
.cn-n{font-size:.875rem;line-height:1.8;color:var(--mist)}
.sum{display:grid;justify-items:start;gap:6px;margin-top:30px}
.sum-k{font-size:1rem;font-weight:700;color:var(--mist)}
.sum-v{display:flex;align-items:baseline;gap:10px;line-height:.9}
.sum-v .cur{font-size:1.5rem;color:var(--mist)}
.sum-v b{font-size:clamp(4rem,9vw,7.5rem);color:var(--apricot);letter-spacing:-.01em}
.sum-a{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;margin-top:14px}
.sum-n{max-width:30em;font-size:.875rem;line-height:1.8;color:var(--mist)}
.ppl{display:flex;align-items:center;gap:8px}
.ppl-l{font-size:.875rem;font-weight:600;color:var(--mist)}
.pb{width:44px;height:44px;display:grid;place-items:center;background:transparent;color:var(--foam);border:2px solid var(--mist);border-radius:50%;font-size:1.25rem;line-height:1}
.pb:hover{background:var(--deep-2)}
.pb:disabled{opacity:.4;cursor:not-allowed}
.ppl-n{min-width:1.4em;text-align:center;font-size:1.9rem;line-height:1}
.cp{min-height:44px;padding:4px 18px;background:var(--foam);color:var(--deep);border:0;border-radius:22px;font-size:.9375rem;font-weight:700}
.cp:hover{background:var(--mist)}
.cp-b{display:none}
.cp.ok .cp-a{display:none}
.cp.ok .cp-b{display:inline}
.cx{display:grid;gap:14px;margin:40px 0 0;padding-top:20px;border-top:2px solid var(--line)}
.cx div{display:grid;gap:2px;max-width:36em}
.cx dt{font-size:1.0625rem;font-weight:700}
.cx dd{margin:0;font-size:.9375rem;color:var(--mist)}

/* ===== 段落共用 ===== */
.sec{padding:clamp(56px,7vw,104px) var(--gut)}
.sec h2{font-size:clamp(1.75rem,3vw,2.6rem);line-height:1.3;letter-spacing:.01em}
.sec-lead{margin-top:12px;font-size:1rem;color:var(--mist);max-width:34em}

/* ===== 三條溪：隨筆沿著河岸繞排 ===== */
.rts{background:var(--water)}
.rts-top{max-width:36em}
.rt{display:flow-root;margin-top:52px}
.mq{position:relative;float:left;width:104px;height:420px;margin:6px 14px 0 0;shape-margin:4px}
.rt-r .mq{float:right;margin:6px 0 0 14px}
.mq svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.mq-f{fill:var(--ground)}
.mq-c{fill:none;stroke:var(--foam);stroke-width:1.6;stroke-dasharray:1 5;stroke-linecap:round;vector-effect:non-scaling-stroke}
.mq-s{position:absolute;width:var(--w);height:calc(var(--w) * .68);translate:-50% -50%;border-radius:var(--pb);background:var(--zc,var(--stone))}
.mq-s.rest{background:transparent;box-shadow:inset 0 0 0 2px var(--mist)}
.mq-d{display:none}
.rt-h{font-size:clamp(1.5rem,2.4vw,2.1rem);font-weight:600;line-height:1.3}
.rt-days{display:flex;flex-wrap:wrap;gap:2px 14px;margin:6px 0 0;padding:0;list-style:none;font-size:.8125rem;font-weight:600;color:var(--mist)}
.rt-days b{font-size:1.1rem;color:var(--foam)}
.rt-days .lvl2,.rt-days .lvl2 b{color:var(--apricot)}
.es{margin-top:14px;font-size:1rem;line-height:1.95}
.rt-f{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;margin-top:16px}
.es-c{font-size:.875rem;color:var(--mist)}
.es-c b{font-size:1.15rem;color:var(--foam)}
.rt-go{min-height:44px;padding:4px 18px;background:transparent;color:var(--foam);border:2px solid var(--foam);border-radius:22px;font-size:.9375rem;font-weight:700}
.rt-go:hover{background:var(--foam);color:var(--deep)}

/* ===== 契約：六顆踏石 ===== */
.ct{background:var(--night)}
.ct-top{display:grid;gap:12px;max-width:40em}
.ct-note{font-size:.9375rem;line-height:1.8;color:var(--mist)}
.steps-w{position:relative}
.path{position:absolute;inset:44px 0 20px;width:100%;height:calc(100% - 64px);overflow:visible;pointer-events:none}
.path path{fill:none;stroke:var(--mist);stroke-opacity:.55;stroke-width:2;stroke-dasharray:1 9;stroke-linecap:round;vector-effect:non-scaling-stroke}
.path-d{display:none}
.steps{position:relative;display:grid;grid-template-columns:minmax(0,1fr);gap:40px;margin:52px 0 16px;padding:0;list-style:none}
.stp{position:relative;isolation:isolate;display:grid;align-content:center;gap:4px;width:84%;margin-left:6%;padding:14px 10px 16px;color:var(--deep)}
.stp::before{content:"";position:absolute;z-index:-1;inset:-16px -22px;border-radius:var(--pm);rotate:var(--r,0deg);background:var(--stone) url(assets/speckle.svg);box-shadow:inset 0 -2px 0 oklch(0.22 0.045 212 / .14)}
.stp:nth-child(even){margin-left:12%}
.tone1::before{background-color:oklch(0.84 0.035 168)}
.tone2::before{background-color:oklch(0.89 0.025 210)}
.stp-k{font-size:1.2rem;line-height:1.35;color:var(--deep)}
.stp-v{font-size:.9375rem;line-height:1.75;color:var(--deep)}

/* ===== 出發前：一段刻意的空白 ===== */
.bf{display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
.bf-gap{position:relative;display:grid;place-items:center;height:200px}
.gap-s{display:block;width:180px;height:64px;border-radius:var(--pb);border:2px dashed var(--mist)}
.gap-k{position:absolute;display:grid;justify-items:center;font-size:.8125rem;font-weight:600;line-height:1.4;color:var(--mist)}
.gap-k b{font-size:1rem;color:var(--foam)}
.coda{font-size:1.15rem;line-height:2;font-weight:500;color:var(--foam);max-width:30em}
.bf-l{display:grid;gap:12px;margin-top:10px}
.ri{font-size:.9375rem;line-height:1.8;color:var(--mist);max-inline-size:38em}
.ri b{margin-right:.7em;font-size:1.05rem;font-weight:700;color:var(--foam)}

/* ===== 頁尾 ===== */
.foot{display:grid;grid-template-columns:auto 1fr;gap:14px 48px;align-items:end;padding:32px var(--gut) 34px;background:var(--deep)}
.foot .brand b{font-size:1.6rem}
.foot address{font-style:normal;display:grid;gap:2px;font-size:.9375rem;color:var(--mist)}
.foot address .num{font-size:1.25rem;color:var(--foam);text-decoration:none}
.foot-n{grid-column:1/-1;font-size:.8125rem;color:var(--mist)}

/* ===== 404 ===== */
.e404{display:grid;grid-template-columns:minmax(0,1fr);gap:clamp(28px,4vw,72px);align-items:center;padding:clamp(40px,6vw,88px) var(--gut)}
.e404 h1{font-size:clamp(1.8rem,3.6vw,3rem);font-weight:500;line-height:1.4}
.e404 .lead{margin-top:16px;font-size:1.0625rem;color:var(--mist);max-width:34em}
.e404-l{display:flex;flex-wrap:wrap;gap:10px;margin:28px 0 0;padding:0;list-style:none}
.e404-l a{display:inline-flex;align-items:center;min-height:46px;padding:0 18px;border:2px solid var(--foam);border-radius:23px;font-weight:700;text-decoration:none}
.e404-l li:first-child a{background:var(--foam);color:var(--deep)}
.e404-f{margin:0}
.mini{position:relative;height:120px}
.mini svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.mini-hole{position:absolute;left:46%;top:30%;width:28%;height:44%;border-radius:var(--pb);border:2px dashed var(--apricot)}
.mini-s{position:absolute;left:12%;top:32%;width:20%;height:42%;border-radius:var(--pb);background:var(--sea) url(assets/speckle.svg)}
.e404-f figcaption{margin-top:12px;font-size:.9375rem;color:var(--mist)}

/* ===== 平板以上 ===== */
@media (min-width:760px){
  :root{--hp:26px}
  .river{grid-template-columns:minmax(0,1fr) minmax(0,420px) minmax(0,1fr);grid-template-rows:auto 58px calc(17 * var(--hp)) 50px calc(17 * var(--hp)) 50px calc(17 * var(--hp)) auto auto}
  .river .dl{justify-self:start}
  .load{grid-template-columns:repeat(4,auto);justify-content:start;align-items:center}
  .load-l{grid-column:auto}
  .ld-w{width:44px;height:16px}
  .beach{grid-template-columns:minmax(0,1fr) minmax(260px,340px);gap:0 44px}
  .tray-w{grid-column:1}
  .cost{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr) minmax(0,1fr);column-gap:28px}
  .cairn-w{grid-column:1/-1;grid-template-columns:subgrid;grid-template-rows:repeat(4,62px) 30px;margin-top:34px}
  .cairn{grid-column:2;grid-row:1/5;grid-template-rows:subgrid;align-self:stretch}
  .cs{align-self:center;margin-top:0}
  .cn{position:relative;margin-top:0;align-self:start}
  .cn-plan{grid-column:1;grid-row:1/3;text-align:right;justify-items:end}
  .cn-car{grid-column:3;grid-row:2/4}
  .cn-act{grid-column:1;grid-row:3/5;text-align:right;justify-items:end}
  .cn-room{grid-column:3;grid-row:4/6}
  .cn-k::after{content:"";display:inline-block;vertical-align:middle;width:44px;height:0;margin:0 0 0 12px;border-top:1.5px solid var(--line)}
  .cn-car .cn-k::before,.cn-room .cn-k::before{content:"";display:inline-block;vertical-align:middle;width:44px;height:0;margin:0 12px 0 0;border-top:1.5px solid var(--line)}
  .cn-car .cn-k::after,.cn-room .cn-k::after{display:none}
  .wl{grid-column:2;grid-row:5;align-self:start;margin-top:2px}
  .cost-h{grid-column:1/3;grid-row:1;align-self:end}
  .sum{grid-column:3;grid-row:1;justify-items:end;text-align:right;margin:0}
  .sum-a{justify-content:end}
  .sum-v b{font-size:clamp(4rem,7vw,6.4rem)}
  .cairn-w{grid-row:2}
  .cx{grid-column:1/-1;grid-row:3;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:clamp(28px,4vw,72px);margin:34px 0 0;padding-top:18px}
  .mq{width:200px;height:440px;margin-right:30px}
  .rt-r .mq{margin-left:30px}
  .rts{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:clamp(16px,2vw,32px);align-items:start}
  .rts-top{grid-column:1/8;grid-row:1}
  .rt{margin-top:44px}
  .rt0{grid-column:1/7;grid-row:2}
  .rt1{grid-column:7/13;grid-row:3;margin-top:-250px}
  .rt2{grid-column:1/7;grid-row:4;margin-top:-200px}
  .es{font-size:1.125rem;line-height:1.95}
  .steps{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr) minmax(0,1.1fr);grid-auto-flow:column;grid-template-rows:auto auto;gap:30px clamp(28px,3vw,52px)}
  .stp,.stp:nth-child(even){width:auto;margin:0;padding:18px 8px 20px}
  .stp::before{inset:-14px -24px}
  .path-d{display:block}.path-m{display:none}
  .steps{padding-inline:20px}
  .stp:nth-child(even){margin:0 0 0 22%}
  .stp0{margin-right:4%}.stp2{margin-right:14%}.stp4{margin-right:2%}
  .stp3{margin-left:30%}.stp5{margin-left:12%}
  .bf{grid-template-columns:repeat(12,minmax(0,1fr));column-gap:clamp(16px,2vw,32px);row-gap:0}
  .bf h2{grid-column:1/6;grid-row:1;align-self:center}
  .bf-gap{grid-column:7/11;grid-row:1;height:200px}
  .coda{margin-top:150px}
  .gap-s{width:220px;height:78px}
  .coda{grid-column:6/13;grid-row:3;font-size:clamp(1.2rem,1.6vw,1.45rem)}
  .bf-l{grid-column:1/13;grid-row:4;display:block;columns:2 22em;column-gap:56px;margin-top:56px}
  .ri{break-inside:avoid;margin-bottom:12px}
  .e404{grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-height:calc(100svh - 170px)}
}

/* ===== 桌機：三天排成來回的蛇形 ===== */
@media (min-width:1180px){
  .river{grid-template-columns:140px minmax(0,1fr) 140px;grid-template-rows:72px 108px 76px 108px 76px 108px auto;margin-top:6px;--hw:calc((100cqw - 280px) / 17)}
  .load{grid-row:1;grid-column:2/4;justify-self:end;align-self:center;display:flex;flex-wrap:nowrap;gap:8px;margin:0}
  .load-l{margin-right:4px}
  .ld{padding:4px 14px 4px 10px}
  .river .dl{padding:0;display:flex;flex-wrap:nowrap;align-items:baseline;gap:4px 12px;align-self:center}
  .river .dl0{grid-row:1;grid-column:2;justify-self:start;align-self:end;padding-bottom:4px}
  .river .dl1{grid-row:3;grid-column:2;justify-self:end}
  .river .dl2{grid-row:5;grid-column:2;justify-self:start}
  .dl-i{font-size:3.6rem;margin:0;line-height:.9}
  .dl-n{font-size:.9375rem}
  .dl-eq{margin:0}
  .dl-lv{align-self:center}
  .stn-a{grid-row:2;grid-column:1;align-self:center;justify-self:end;grid-auto-flow:column;align-items:center;gap:6px;margin-right:54px;padding:0;font-size:.75rem;translate:0 -1px}
  .stn-a span{order:-1}
  .cap{display:block;grid-row:2;grid-column:1;justify-self:end;width:48px;height:108px}
  .cap path{fill:var(--water)}
  .rows{grid-row:2/7;grid-column:2}
  .wv-h{display:block}.wv-v{display:none}
  .bend::before{display:none}
  .bd-s{display:block;width:140px;height:292px;overflow:visible}
  .bd-f{fill:var(--night)}
  .bd-e{fill:none;stroke:var(--foam);stroke-opacity:.6;stroke-width:2.4;stroke-dasharray:1 7;stroke-linecap:round}
  .bend0{grid-row:2/5;grid-column:3}
  .bend1{grid-row:4/7;grid-column:1}
  .zc{left:92px;top:147px;writing-mode:vertical-rl;flex-direction:column;gap:6px;font-size:.9375rem;letter-spacing:.12em}
  .bend1 .zc{left:48px}
  .end{grid-row:6;grid-column:3;display:flex;align-items:center;justify-items:start;gap:0;padding:0;position:relative}
  .tail{width:calc(var(--b) * var(--hw));height:46px;min-height:0;background:var(--water) url(assets/current.svg) repeat-x left center;border-radius:0 24px 24px 0}
  .end .bk{position:absolute;left:0;top:-4px}
  .stn-b{margin-left:6px}
  .fx{grid-row:7;grid-column:2/4;grid-template-columns:auto minmax(0,1fr);align-items:baseline;column-gap:24px;max-width:none;margin-top:14px}
  .fx-n{max-width:52em}
  .cell{left:calc(var(--x0) / 17 * 100%);right:auto;width:calc(var(--len) / 17 * 100%);top:22px;height:78px}
  .rev .cell{left:calc((17 - var(--x0) - var(--len)) / 17 * 100%)}
  .cell::after{left:0;top:3px;width:2px;height:12px}
  .rev .cell::after{left:auto;right:0}
  .sl{right:auto;left:8px;top:0;display:flex;gap:6px;align-items:baseline;width:auto;justify-items:start}
  .rev .sl{left:auto;right:8px}
  .cell:not(.has)::before{inset:20px 5px 2px}
  .trv{left:0;right:auto;top:20px;bottom:2px;height:auto;width:calc(var(--t) / var(--len) * 100%);background:url(assets/current.svg) repeat-x left center}
  .rev .trv{left:auto;right:0}
  .trv-t{position:absolute;bottom:2px;left:4px}
  .rev .trv-t{left:auto;right:4px}
  .cell>.chip{top:20px;bottom:2px;height:auto;left:calc(var(--t) / var(--len) * 100%);right:auto;width:calc(min(var(--h),var(--len) - var(--t)) / var(--len) * 100%);transition:left .22s cubic-bezier(.3,.7,.2,1),right .22s cubic-bezier(.3,.7,.2,1),width .22s cubic-bezier(.3,.7,.2,1)}
  .rev .cell>.chip{left:auto;right:calc(var(--t) / var(--len) * 100%)}
  .cell>.chip::before{display:none}
  .ovf{right:4px;top:-1px;bottom:auto}
  .rev .ovf{right:auto;left:4px}
  .beach{margin-top:30px;grid-template-columns:fit-content(66%) minmax(300px,1fr);column-gap:clamp(40px,5vw,80px);padding-top:50px}
  .voice{max-width:30em;padding-top:42px}
  .ts{width:calc(84px + var(--h) * 22px);height:54px}
  .tray{gap:18px 34px}
}
@media (max-width:759px){
  body{font-size:1rem}
  .top{grid-template-columns:minmax(0,1fr) auto;padding-block:10px}
  .brand span{display:none}
  .nav{grid-column:1/-1;grid-row:2;flex-wrap:nowrap;overflow-x:auto;gap:18px;scrollbar-width:none}
  .nav a{flex:none}
  .h-l h1{font-size:1.7rem;line-height:1.5}
  .ld{font-size:.875rem;padding:3px 8px}
  .ld-w{width:26px}
  .fx-f{font-size:1rem}
  .fx-n{font-size:.8125rem;line-height:1.7}
  .dl-i{font-size:2.3rem}
  .river{grid-template-rows:auto 40px calc(17 * var(--hp)) 34px calc(17 * var(--hp)) 34px calc(17 * var(--hp)) auto auto}
  .stn-a{grid-auto-flow:column;align-items:center;gap:8px;padding-bottom:6px}
  .beach{padding:40px var(--gut) 26px;gap:16px}
  .bh{margin-bottom:10px}
  .tray{gap:8px 7px;align-items:center}
  .tg,.tg-c{display:contents}
  .tgl{width:auto;display:flex;align-items:center;gap:4px;padding:0 4px 0 0;font-size:.875rem}
  .tgl .gl{width:16px;height:16px}
  .tgl small{display:none}
  .ts{width:calc(78px + var(--h) * 12px);height:40px}
  .tray{row-gap:7px}
  .ts>.chip{padding:2px 8px}
  .ts>.chip .gl,.ts>.chip .k-m{display:none}
  .ts>.chip .k-n{font-size:.8125rem;white-space:normal;line-height:1.2}
  .wet{padding:0 8px;font-size:.75rem}
  .voice{min-height:0}
  .vc-n,.nt-n{font-size:1.1rem}
  .vc-b,.nt-b{font-size:.875rem;line-height:1.8}
  .cost{padding:44px var(--gut) 40px}
  .cairn-w{margin-top:22px}
  .cs{min-height:48px;max-width:300px}
  .cs b{font-size:1.25rem}
  .cairn-w{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:16px}
  .cairn,.wl{grid-column:1/-1}
  .cairn{grid-row:1}.wl{grid-row:2}
  .cn{margin-top:12px}
  .cn-k{font-size:1rem}
  .cn-n{font-size:.8125rem;line-height:1.7}
  .sum{margin-top:18px}
  .sum-a{gap:10px 12px;margin-top:10px}
  .cp{padding:4px 14px;font-size:.875rem}
  .ppl{gap:6px}
  .sum-v b{font-size:3.6rem}
  .cx{margin-top:26px;gap:10px}
  .cx dd{font-size:.875rem}
  .sec{padding:38px var(--gut) 40px}
  .sec h2,.cost-h h2{font-size:1.55rem}
  .sec-lead{font-size:.9375rem}
  .rt{margin-top:34px}
  .mq{width:78px;height:400px;margin:4px 10px 0 0}
  .rt-r .mq{margin:4px 0 0 10px}
  .rt-days{gap:0 12px}
  .rd-n,.rd-l{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .es{margin-top:8px;font-size:.9375rem;line-height:1.8}
  .rt-f{margin-top:10px}
  .steps{grid-template-columns:repeat(2,minmax(0,1fr));gap:40px 30px;margin:44px 12px 50px}
  .stp,.stp:nth-child(even){width:auto;margin:0;padding:4px 0 6px}
  .stp:nth-child(even){translate:0 38px}
  .stp::before{inset:-13px -12px;border-radius:var(--ps)}
  .stp-k{font-size:1.1rem}
  .stp-v{font-size:.8125rem;line-height:1.7}
  .stp-k{font-size:1rem}
  .bf{gap:14px}
  .bf-gap{display:none}
  .gap-s{width:150px;height:54px}
  .coda{font-size:.9375rem;line-height:1.9}
  .ri{font-size:.875rem;line-height:1.75}
  .bf-l{gap:8px}
  .foot{grid-template-columns:minmax(0,1fr);padding:26px var(--gut) 28px;gap:10px}
  .foot address{font-size:.875rem}
}
@media (pointer:coarse){
  .nav a{min-block-size:44px;display:inline-flex;align-items:center}
  .cell>.chip,.ts>.chip{min-block-size:0}
}

/* ===== 降級動效：只換狀態，不位移 ===== */
@media (prefers-reduced-motion:reduce){
  .trv,.cell>.chip,.cs{transition:none}
  .chip.land{animation:none}
  .drag-ghost{rotate:none}
}

/* ===== 列印：印出來就是一份行程表 ===== */
@media print{
  html,body,.cost,.ct,.rts,.foot,.beach,.how{background:#fff !important;color:#000 !important}

  .nav,.beach,.how,.load,.wv,.bend svg,.cp,.ppl button,.rt-go,.mq,.cap,.shore{display:none !important}
  .cell::before{border-color:#000 !important;background:#fff !important}
  .cell>.chip,.cs,.stp{background:#fff !important;box-shadow:inset 0 0 0 1px #000 !important}
  .trv{background:repeating-linear-gradient(135deg,#999 0 1px,transparent 1px 6px) !important}
  .trv-t,.bk,.ovf{background:#fff !important}
  .sec{padding:24px 0}
  a{text-decoration:underline}
}

}
