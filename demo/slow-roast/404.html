@font-face{font-family:"Chiron GoRound TC";src:url("fonts/01-chiron-goround-tc.woff2") format("woff2");font-weight:400 700;font-style:normal;font-display:swap}

@layer flagship {

:root{
  --mus:oklch(0.82 0.14 90);--mus-d:oklch(0.765 0.135 86);--mus-l:oklch(0.88 0.105 95);--ink:oklch(0.24 0.04 52);--ink-2:oklch(0.37 0.05 56);--crema:oklch(0.96 0.045 95);
  --sage:oklch(0.71 0.07 128);--sage-d:oklch(0.62 0.075 131);--sage-l:oklch(0.79 0.06 124);

  --num:"Sometype Mono","Chiron GoRound TC",monospace;
  --focus-ring:3px solid var(--ink);--focus-offset:3px;
  --selection-bg:var(--ink);--selection-fg:var(--mus);
  color-scheme:light;
}
html{background:var(--mus)}
body{background:var(--mus);color:var(--ink);font-family:var(--gr);font-weight:450;font-size:17px;line-height:1.75}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;font-weight:500;letter-spacing:-.02em}

button{font:inherit;color:inherit}
:where(p,li,dd,h1,h2,h3){overflow-wrap:anywhere}
h1,h2,h3{font-family:var(--gr);font-weight:580;text-wrap:balance}
.k{font-size:14px;line-height:1.4;font-weight:520;letter-spacing:.04em;margin:0}

/* ---------- 頁首 ---------- */
.mh{display:flex;align-items:center;gap:10px 30px;flex-wrap:wrap;padding:12px var(--gut)}
.mh__brand{display:inline-flex;align-items:center;gap:10px;text-decoration:none;font-size:21px;font-weight:600;line-height:1.3;margin-right:18px}

.mh nav a:hover{border-bottom-color:currentColor}
.mh__tel{font-size:15px;text-decoration:none;margin-left:auto}

/* ---------- 曲線編輯器：線下是量過的地帶，線上是天空 ---------- */
.ed{padding:8px 0 0;overflow-x:clip}
.ed__stage{position:relative;margin-inline:var(--gut);display:grid;grid-template-columns:minmax(0,1fr);grid-template-areas:"bt" "ph" "bean" "x"}
.ed__title{grid-area:bt;align-self:start;justify-self:start;position:relative;z-index:3;margin:5% 0 0 7.5%;max-width:44%;pointer-events:none;transition:opacity .2s}
.ed.is-drag .ed__title{opacity:.18}
.ed__title h1{font-size:clamp(44px,4.9vw,72px);line-height:1.06;letter-spacing:.01em;margin:0 0 .32em}
.ed__title h1 .num{font-weight:600;letter-spacing:-.06em;font-size:1.04em}
.ed__tip{margin:0;font-size:16px;font-weight:520;display:inline-flex;align-items:center;gap:8px}
.ed__tip::before{content:"";width:14px;height:14px;border-radius:50%;border:4px solid var(--ink);background:var(--mus);flex:none}
.trk{position:relative;min-width:0}
.trk--bt{grid-area:bt;height:clamp(400px,calc(100vh - 410px),600px);touch-action:pan-y}
.trk--bt.is-armed{cursor:crosshair}
.plot{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.plot .under{fill:var(--mus-d)}
.plot .base{fill:none;stroke:var(--ink);stroke-width:2;vector-effect:non-scaling-stroke}
.plot .iso{fill:none;stroke:var(--ink);stroke-opacity:.15;stroke-width:1;vector-effect:non-scaling-stroke}
.plot .evl{fill:none;stroke:var(--ink);stroke-opacity:.55;stroke-width:1.6;stroke-dasharray:5 5;vector-effect:non-scaling-stroke}
.plot .ror{fill:none;stroke:var(--ink-2);stroke-width:2;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.plot .ghost{fill:none;stroke:var(--ink);stroke-opacity:.42;stroke-width:2;stroke-dasharray:2 6;stroke-linecap:round;vector-effect:non-scaling-stroke}
.plot .trail{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.plot .trail[data-trail="0"]{stroke-opacity:.34}
.plot .trail[data-trail="1"]{stroke-opacity:.2}
.plot .trail[data-trail="2"]{stroke-opacity:.1}
.plot .bt{fill:none;stroke:var(--ink);stroke-width:5;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.yax{position:absolute;inset:0;margin:0;padding:0;list-style:none;pointer-events:none}
.yax li{position:absolute;right:calc(100% + 9px);transform:translateY(-50%);font:500 12.5px/1 var(--num);white-space:nowrap}
.trk__name{position:absolute;margin:0;font-size:14px;font-weight:520;line-height:1.4;pointer-events:none;white-space:nowrap}
.trk__name--bt{left:10px;top:0}
.trk__name--ror{transform:translate(8px,10px);background:var(--mus-d);padding:0 6px;font-size:13px;color:var(--ink-2)}
.bm{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;pointer-events:none;z-index:1}
.bm::before,.bm::after{content:"";position:absolute;left:4px;top:-1px;width:2px;height:12px;background:var(--ink);opacity:.7;transform:rotate(45deg)}
.bm::after{transform:rotate(-45deg)}
.bm--new::before,.bm--new::after{opacity:.9}
.smoke-at{position:absolute;width:210px;height:118px;margin:-120px 0 0 -4px;pointer-events:none;z-index:1}
.smoke{width:100%;height:100%;overflow:visible;fill:var(--ink-2);opacity:.6;filter:blur(.7px)}
.chaff-at{position:absolute;width:84px;height:52px;margin:-98px 0 0 -12px;pointer-events:none;z-index:1}
.chaff{width:100%;height:100%;overflow:visible;fill:oklch(0.93 0.05 88);stroke:var(--ink-2);stroke-width:.9;stroke-linejoin:round}

/* 控制點：44px 觸控框，視覺 22px 墨圈；無 JS 時只是靜態標記 */
.hd{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;z-index:4;border-radius:50%}
.hd::before{content:"";position:absolute;inset:11px;border-radius:50%;background:var(--mus);border:6px solid var(--ink)}
html.js .hd{cursor:grab;touch-action:none}
html.js .hd:active{cursor:grabbing}
.hd:focus-visible{outline:var(--focus-ring);outline-offset:-2px}
.hd[data-armed]::before{box-shadow:0 0 0 4px var(--mus),0 0 0 7px var(--ink)}
.hd__lab{position:absolute;white-space:nowrap;background:var(--mus);padding:1px 7px;font-size:15px;line-height:1.55;font-weight:560;pointer-events:none}
.hd__lab .num{font-size:13px;font-weight:600}
.hd[data-p=de] .hd__lab{background:var(--mus-d)}
.hd[data-side=r] .hd__lab{left:38px;top:50%;transform:translateY(-50%)}
.hd[data-side=l] .hd__lab{right:38px;top:50%;transform:translateY(-50%)}
.hd[data-side=b] .hd__lab{left:26px;top:34px}
.hd[data-side=t] .hd__lab{right:26px;bottom:34px}
.tp{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--ink);z-index:2;pointer-events:none}
.tp span{position:absolute;left:14px;top:-4px;font-size:13px;font-weight:560;white-space:nowrap;background:var(--mus-d);padding:0 5px;line-height:1.5}

/* 階段括號＋豆色軌道 */
.phs{grid-area:ph;position:relative;height:30px;margin-top:14px}

.ph::before{content:"";position:absolute;left:1px;right:1px;top:50%;border-top:2px solid var(--ink)}
.ph::after{content:"";position:absolute;left:1px;right:1px;top:calc(50% - 6px);height:12px;border-left:2px solid var(--ink);border-right:2px solid var(--ink)}
.ph span{position:relative;z-index:1;background:var(--mus);padding:0 8px;display:inline-flex;gap:.45em;align-items:baseline}

.trk--bean{grid-area:bean;height:44px;margin-top:6px}
.strip{position:absolute;inset:0;width:100%;height:100%}
.after{position:absolute;top:0;bottom:0;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink)}
.cool{position:absolute;inset:0;width:100%;height:100%;max-width:none}
.cool use{stroke:var(--ink);stroke-width:5}
.sweep{position:absolute;top:-6px;bottom:-6px;left:0;width:3px;margin-left:-1.5px;background:var(--ink);opacity:0;pointer-events:none;z-index:3}
html.js .sweep.is-run{animation:sweep .46s linear both}
@keyframes sweep{0%{left:0;opacity:1}92%{left:var(--to);opacity:1}100%{left:var(--to);opacity:0}}
.beanat{position:absolute;top:50%;left:min(var(--x),calc(100% - 70px));width:72px;height:51px;margin:-25px 0 0 -4px;z-index:2;pointer-events:none}
.bean{width:100%;height:100%;overflow:visible}
.bean__body{stroke:var(--ink);stroke-width:2.6}
.bean__crack{fill:none;stroke:var(--crema);stroke-linecap:round}
.xax{grid-area:x;position:relative;height:28px;margin:6px 0 0;padding:0;list-style:none}

.xax .xax__u{right:0;left:auto;transform:none;font-family:var(--gr);font-size:13px}

/* 讀數：巨大的下豆溫，其餘小字 */
.ro{margin:26px var(--gut) 0;display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,.9fr);gap:18px 56px;align-items:end}
.ro__big .k{margin-bottom:2px}
.ro__v{margin:0;font:700 clamp(110px,11.4vw,168px)/.86 var(--num);letter-spacing:-.07em;white-space:nowrap;margin-left:-.06em}
.ro__v small{font-size:.3em;font-weight:600;letter-spacing:0;margin-left:.12em;vertical-align:.95em}
.ro__list{margin:0 0 6px;display:flex;flex-wrap:wrap;gap:14px 34px}
.ro__list dt{font-size:14px;font-weight:520;color:var(--ink-2)}

.ro__list .ro__sub{font-size:15px;font-weight:500;margin-left:.3em}
.ro__deg dd{font-family:var(--gr);font-weight:600;font-size:23px;display:flex;align-items:center;gap:9px}
.sw{display:inline-block;width:24px;height:24px;border:2px solid var(--ink);border-radius:50%;flex:none}
.ro__note{margin:0 0 6px;padding-left:18px;border-left:2px solid currentColor;font-size:16px;line-height:1.6}
.ro__note p{margin:0}

.ro__leg{display:flex;flex-wrap:wrap;gap:2px 16px;margin-top:8px !important;font-size:14px;color:var(--ink-2)}
.ro__leg span{display:inline-flex;align-items:center;gap:6px}
.lg-ghost{display:inline-block;width:26px;border-top:2px dotted var(--ink)}
.lg-x{position:relative;display:inline-block;width:12px;height:12px}
.lg-x::before,.lg-x::after{content:"";position:absolute;left:5px;top:-1px;width:2px;height:14px;background:var(--ink);transform:rotate(45deg)}
.lg-x::after{transform:rotate(-45deg)}

/* 店內三條曲線（無 JS＝三張小圖並排）、重設、分享、說明 */
.ed__bar{margin:26px var(--gut) 0;padding-bottom:56px;display:flex;flex-wrap:wrap;align-items:center;gap:14px 26px}
.ed__bar h2{font-size:17px;font-weight:560;line-height:1.4;margin:0}
.house{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;flex:1 1 100%}
.house__f{margin:0}
.house__f .mini{width:100%;height:96px;border-left:2px solid var(--ink);border-bottom:2px solid var(--ink)}
.house__f figcaption{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 14px;font-size:15px;margin-top:6px}
.house__f b{font-weight:600;font-size:19px}

html.js .house__f{display:none}
.house__b{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:4px 14px 4px 10px;background:transparent;border:2px solid var(--ink);border-radius:22px;font-size:15px;font-weight:560;line-height:1.3}
.house__b .mini{width:50px;height:22px}

}
.msg{margin:0;font-size:15px}

.fl{position:relative;display:grid;grid-template-columns:minmax(220px,24%) minmax(0,1fr) minmax(300px,30%);gap:0 48px;align-items:center;padding:40px var(--gut) 110px 0}

.fan .w.on path{fill:var(--ink)}
.fan .w.on text{fill:var(--mus)}
.fan__hub{fill:var(--ink)}
.fl__fan figcaption{display:flex;flex-wrap:wrap;gap:4px 18px;padding-left:var(--gut);font-size:14px;margin-top:12px}

.fl__notes{margin-top:30px;display:flex;flex-wrap:wrap;gap:4px 30px;font-size:16px}
.fl__notes p{margin:0}
.fl__self{margin:22px 0 0;font-size:19px;font-weight:560;max-width:22em}
.warn{margin:22px 0 0;padding:0;list-style:none}
.warn li{display:inline-block;margin:0 10px 10px 0;padding:6px 16px;background:var(--ink);color:var(--mus);font-size:16px;border-radius:20px}
.warn li[data-f=ok]{background:transparent;color:var(--ink);padding-left:0}
.cup{margin:0;position:relative;display:grid;grid-template-columns:280px minmax(0,1fr);gap:0 18px;align-items:start}
.cup__glass{position:relative;width:280px;height:340px;grid-row:1}
.cup__fill{position:absolute;inset:38px 0 0 0;display:flex;flex-direction:column;clip-path:path("M0 -16H280L262 212C252 274 214 302 140 302C66 302 28 274 18 212Z")}
.cup__fill i{display:block;flex:calc(2 + var(--v)) 1 0;min-height:0}
html.js .cup__fill i,html.js .cup__lab li{transition:flex-grow .18s ease-out}
.cup__line{position:absolute;left:-60px;top:0;width:340px;max-width:none;height:368px;overflow:visible;fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.cup__lab{grid-row:1;grid-column:2;margin:38px 0 0;padding:0;list-style:none;height:302px;display:flex;flex-direction:column}
.cup__lab li{flex:calc(2 + var(--v)) 1 0;min-height:0;display:flex;align-items:center;gap:10px;position:relative;font-size:16px;font-weight:560;line-height:1}
.cup__lab li::before{content:"";position:absolute;right:calc(100% + 4px);top:50%;width:34px;border-top:1.5px solid var(--ink)}
.cup__lab b{font:600 19px/1 var(--num);margin-left:auto}
.cup figcaption{grid-column:1/-1;margin-top:26px;font-size:15px;color:var(--ink-2);padding-left:20px}

/* ---------- 手沖起點：濃縮咖啡色、拱形上緣、斜階大數字 ---------- */
.br{--focus-ring:3px solid var(--mus);--selection-bg:var(--mus);--selection-fg:var(--ink);position:relative;background:var(--ink);color:var(--crema);padding:0 var(--gut) 0}
.br__arc{display:block;width:calc(100% + 2 * var(--gut));max-width:none;height:90px;margin:0 calc(-1 * var(--gut));fill:var(--ink);background:var(--mus)}
.br__in{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:0 30px;padding:20px 0 40px}
.br__foot{display:block;width:calc(100% + 2 * var(--gut));max-width:none;height:70px;margin:0 calc(-1 * var(--gut));fill:var(--ink);background:var(--mus)}
.br__head{grid-column:1/5}
.br__head h2{font-size:clamp(40px,4.2vw,64px);margin:0 0 .3em;color:var(--mus)}
.br__head p{margin:0;font-size:17px}
.rcp{grid-column:5/-1;margin:0;padding:0;list-style:none;display:grid;grid-template-columns:1fr 1.25fr 1fr 1.15fr;gap:0 26px}
.rcp>li{min-width:0}
.rcp>li:nth-child(2){margin-top:64px}
.rcp>li:nth-child(3){margin-top:128px}
.rcp>li:nth-child(4){margin-top:192px}
.rcp .k{color:var(--crema);margin-bottom:4px}
.rcp__v{margin:0;font:700 clamp(46px,4.6vw,72px)/1 var(--num);letter-spacing:-.05em;color:var(--mus);white-space:nowrap}
.rcp__v small{font-size:.38em;font-weight:600;letter-spacing:0;margin-left:.08em}
.rcp__v--zh{font-family:var(--gr);font-weight:640;letter-spacing:0;font-size:clamp(40px,3.8vw,58px)}
.rcp__n{margin:8px 0 0;font-size:15px;line-height:1.55}
.grind{width:100%;max-width:270px;height:auto;margin-top:10px}
.grind .gr{fill:var(--crema);opacity:.4}
.grind .gr.on{fill:var(--mus);opacity:1}
.grind__lab{display:flex;justify-content:space-around;max-width:270px;margin:2px 0 0;font-size:13px}
.pour{grid-column:1/-1;position:relative;height:88px;margin:58px 0 0;padding:0;list-style:none}
.pour li{position:absolute;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;gap:1px;padding:0 12px;font-size:15px;line-height:1.35;white-space:nowrap;overflow:hidden;border-radius:44px 6px 6px 44px;box-shadow:inset 0 0 0 2px var(--mus)}
.pour li+li{border-radius:6px}
.pour li:last-child{border-radius:6px 44px 44px 6px}
.pour li:nth-child(odd){background:var(--mus);color:var(--ink)}
.pour li b{font-weight:600;font-size:13px}
.pour .num{font-size:13px}
.pour__sc{grid-column:1/-1;display:flex;justify-content:space-between;margin:8px 0 0;font:500 12.5px/1 var(--num);color:var(--crema)}
.br__note{margin:150px 0 0;padding-top:16px;border-top:2px solid var(--mus);max-width:17em;font-size:17px;line-height:1.7}
.br__note p{margin:0}
.br__note b{color:var(--mus);font-weight:600}
.ridge{position:relative;height:170px;margin-top:-10px}
.ridge svg{position:absolute;inset:0;width:100%;height:100%;fill:var(--sage)}
.ridge__pk{position:absolute;transform:translate(-50%,-100%);margin-top:-12px;text-align:center;font-size:14px;font-weight:560;line-height:1.3;white-space:nowrap}
.ridge__pk .num{display:block;font-size:13px;font-weight:600}
.ridge__pk::after{content:"";display:block;width:2px;height:9px;margin:4px auto 0;background:var(--ink)}

/* ---------- 生豆：生豆綠底；每支豆一列 ---------- */
.shop{display:block}
.lt{background:var(--sage);padding:10px var(--gut) 120px;clip-path:polygon(0 0,100% 0,100% 100%,0 calc(100% - 70px));--altw:clamp(150px,17vw,250px)}
.lt__head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 48px;margin-bottom:34px}
.lt__head h2{font-size:clamp(40px,4.2vw,64px);margin:0}
.lt__head p{margin:0;font-size:16px}
.lt__leg{display:flex;flex-wrap:wrap;gap:4px 22px;font-size:15px}
.lt__leg span{display:inline-flex;align-items:center;gap:8px}
.lt__leg .lb{width:30px;height:14px;background:var(--mus);border:2px solid var(--ink)}
.lt__leg .ln{width:3px;height:18px;background:var(--ink)}
.lots{margin:0;padding:0;min-width:0;border:0}
.lots__scale{position:relative;margin-left:var(--altw);margin-right:150px;height:66px;border-bottom:2px solid var(--ink)}
.lots__deg{position:absolute;top:8px;height:28px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:560}
.lots__deg:nth-child(odd){background:var(--sage-l)}
.lots__tick{position:absolute;z-index:1;bottom:4px;transform:translateX(-50%);font:500 12.5px/1 var(--num);white-space:nowrap}
.lots__now{position:absolute;z-index:0;left:var(--x);top:-14px;bottom:-2px;width:3px;margin-left:-1.5px;background:var(--ink)}
.lots__now span{position:absolute;top:-6px;left:8px;white-space:nowrap;font-size:14px;font-weight:560;line-height:1.4;background:var(--sage);padding-right:4px}
.lots__now b{font:600 13px var(--num)}
.is-hi .lots__now span{left:auto;right:8px;padding:0 0 0 4px}
.lot{position:relative}
.lot+.lot{border-top:2px solid oklch(0.24 0.04 52 / .22)}
.lot__pick{display:grid;grid-template-columns:var(--altw) minmax(0,1fr) 150px;padding:18px 0 20px;cursor:pointer;align-items:start}
.lot__pick input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.lot__pick:has(input:checked){background:var(--sage-l);box-shadow:-12px 0 0 var(--sage-l),12px 0 0 var(--sage-l)}
.lot__pick:has(input:focus-visible){outline:var(--focus-ring);outline-offset:3px}
.lot__id{grid-column:1;grid-row:1/3;display:flex;flex-direction:column;gap:2px;padding-right:12px}
.lot__code{font-size:clamp(26px,2.3vw,34px);font-weight:640;line-height:1.15}
.lot__alt{font:600 15px/1.3 var(--num)}
.lot__alt small{font:500 13px var(--gr);margin-left:2px}
.lot__track{grid-column:2;position:relative;display:block;height:40px}
.lot__track::after{content:"";position:absolute;z-index:0;left:var(--x);top:-18px;bottom:-14px;width:3px;margin-left:-1.5px;background:var(--ink)}
.lot__bar{position:absolute;z-index:1;top:4px;height:30px;background:var(--mus);border:2px solid var(--ink);border-radius:15px}
.lot__dot{position:absolute;z-index:1;bottom:-2px;width:0;height:0;margin-left:-7px;border:7px solid transparent;border-top:0;border-bottom:10px solid var(--ink)}
.lot.fit .lot__bar{background:var(--ink)}
.lot__info{grid-column:2;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 22px;margin-top:10px;font-size:15px}
.lot__w{font-size:21px;font-weight:600;flex:1 1 100%}
.lot__fit,.lot__sel{padding:1px 12px;font-size:14px;border-radius:14px}
.lot__fit{background:var(--ink);color:var(--sage-l)}
.lot__sel{display:none !important;box-shadow:inset 0 0 0 2px var(--ink)}
.lot__pick:has(input:checked) .lot__sel{display:block !important}
.lot__pile{grid-column:3;grid-row:1/3;width:150px;height:60px;align-self:center}
.pile{width:100%;height:100%;overflow:visible}
.pile__b{stroke:var(--ink);stroke-width:5}
.pile__c{fill:none;stroke:var(--ink);stroke-width:4;stroke-linecap:round;opacity:.55}
.lot__load{position:absolute;right:0;bottom:16px;z-index:2;min-height:40px;font-size:14px;padding:2px 14px}

/* ---------- 訂購（芥黃，斜切上緣） ---------- */
.ord{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:34px 30px;padding:56px var(--gut) 96px;border-top:2px solid var(--ink)}
.ord__head{grid-column:1/4}
.ord__head h2{font-size:clamp(40px,4.2vw,64px);margin:0 0 .25em}
.ord__head p{margin:0;font-size:16px}
.og{margin:0;padding:0;border:0;min-width:0}
.og legend{font-size:15px;font-weight:560;padding:0;margin-bottom:10px}
.og__opts{display:flex;flex-wrap:wrap;gap:8px}
.og label{position:relative;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;padding:10px 16px 10px 14px;border:2px solid var(--ink);border-radius:14px;cursor:pointer;min-height:44px}
.og input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.og label:has(input:checked){background:var(--ink);color:var(--mus)}
.og label:has(input:focus-visible){outline:var(--focus-ring);outline-offset:3px}
.og__name{font-size:20px;font-weight:600;line-height:1.25}
.og__sub{font-size:14px;line-height:1.3}
.og--w{grid-column:4/9}
.og--w label{flex-direction:row;align-items:flex-end;gap:12px}
.og--w .wsq{display:block;width:calc(var(--s) * var(--k,1px));height:calc(var(--s) * var(--k,1px));border:2px solid currentColor;border-radius:6px 6px 3px 3px;flex:none}
.og--w .og__name{font-family:var(--num);font-size:18px}
.og--g{grid-column:9/-1}
.og--g .gdot{display:block;height:12px;width:44px;background:radial-gradient(circle,currentColor calc(var(--g) * 1px),transparent calc(var(--g) * 1px + .6px)) 0 50%/calc(var(--g) * 3px + 4px) 12px repeat-x;margin-bottom:4px}
.ord__sum{grid-column:1/6;margin:0}
.ord__sum div{display:flex;align-items:baseline;gap:14px}
.ord__sum dt{font-size:15px;font-weight:560;min-width:3em}
.ord__sum dd{margin:0;font:600 22px/1.3 var(--num)}
.ord__sum .tot dd{font-size:clamp(54px,6vw,90px);font-weight:700;letter-spacing:-.05em;line-height:1.05}
.ord__note{margin:6px 0 0;font-size:15px}
.ord__text{grid-column:6/-1;min-width:0}
.ord__out{display:block;margin:6px 0 12px;padding:14px 18px;border:2px solid var(--ink);border-radius:14px;font-size:18px;line-height:1.6;overflow-wrap:anywhere}
.ord__text .msg{margin-top:8px}
.ord__how{margin:12px 0 0;font-size:15px;display:flex;flex-wrap:wrap;gap:2px 26px}
.ord__how p{margin:0}
.ord__fine{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 30px;padding-top:26px;border-top:2px solid var(--ink);font-size:15px}
.ord__fine p{margin:0}
.ord__fine h3{font-size:17px;margin:0 0 4px}

/* ---------- 週二與週五開火：週帶＋一包豆子的 21 天 ---------- */
.dy{padding:30px var(--gut) 90px}
.dy__head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 48px;margin-bottom:22px}
.dy__head h2{font-size:clamp(40px,4.2vw,64px);margin:0}
.dy__head div{display:flex;flex-wrap:wrap;gap:2px 26px;font-size:17px}
.dy__head p{margin:0}
.wk{position:relative;margin:110px 0 0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:2px solid var(--ink)}
.wk__d{position:relative;padding:12px 10px 0;min-height:150px}
.wk__d+.wk__d{border-left:1px solid oklch(0.24 0.04 52 / .3)}
.wk__n{display:block;font-size:44px;font-weight:620;line-height:1.1}
.wk__e{display:block;margin-top:8px;font-size:16px;font-weight:560;line-height:1.45}
.wk__e .num{font-size:15px;font-weight:600}
.wk__d--off .wk__n{color:var(--ink-2)}
.wk__d--off .wk__e{display:inline-block;border:2px dashed var(--ink-2);border-radius:14px;padding:0 10px;color:var(--ink-2)}
.wk__d--roast .wk__e:first-of-type{display:inline-block;background:var(--ink);color:var(--mus);padding:2px 12px;border-radius:14px}
.wk__smoke{position:absolute;left:60px;top:-104px;width:170px;height:150px;pointer-events:none}
.wk__smoke .smoke{opacity:.5}
.wk__bar{grid-column:3/-1;margin:16px 0 0;background:var(--mus-d);border-radius:22px;padding:8px 18px;font-size:16px;font-weight:560}
.wk__bar .num{font-weight:600}
.dy__warm{position:relative;margin:30px 0 0 calc(100% / 7);padding:14px 0 0 22px;font-size:clamp(22px,2vw,28px);font-weight:560;line-height:1.5;max-width:22em}
.dy__warm::before{content:"";position:absolute;left:0;top:-30px;bottom:8px;border-left:2px solid var(--ink)}
.dy__warm p{margin:0}
.life{margin-top:76px}
.life h3{font-size:clamp(28px,2.6vw,38px);margin:0 0 30px}
.life__ax{position:relative;height:150px;margin:0 6px;list-style:none;padding:0}
.life__ax::before{content:"";position:absolute;left:0;right:0;top:70px;border-top:2px solid var(--ink)}
.life__t{position:absolute;top:64px;width:2px;height:14px;margin-left:-1px;background:var(--ink)}
.life__t span{position:absolute;top:18px;left:50%;transform:translateX(-50%);font:500 12.5px/1 var(--num);white-space:nowrap}
.life__win{position:absolute;top:58px;height:26px;background:var(--sage);border:2px solid var(--ink);border-radius:13px}
html.js .life__win{transition:left .18s ease-out,width .18s ease-out}
.life__m{position:absolute;bottom:92px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;font-size:15px;font-weight:560;line-height:1.35;white-space:nowrap}
.life__m::after{content:"";width:2px;height:14px;margin-top:4px;background:var(--ink)}
.life__m--b{bottom:auto;top:96px;flex-direction:column-reverse}
.life__m--b::after{margin:0 0 4px}
.life__m--s{transform:translateX(-1px);align-items:flex-start}
.life__m--e{transform:translateX(calc(-100% + 1px));align-items:flex-end}
.life__m .num{font-weight:600}
.life__notes{display:flex;flex-wrap:wrap;gap:4px 34px;margin-top:22px;font-size:16px}
.life__notes p{margin:0}

/* ---------- 頁尾 ---------- */
.ft{background:var(--ink);color:var(--crema);padding:44px var(--gut) 46px;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:20px 30px;--focus-ring:3px solid var(--mus);--selection-bg:var(--mus);--selection-fg:var(--ink)}
.ft__brand{grid-column:1/5;display:flex;align-items:center;gap:12px;margin:0;font-size:26px;font-weight:600;color:var(--mus)}
.ft__brand .mark{width:44px;height:32px}
.ft dl{grid-column:5/-1;margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 22px;font-size:16px}
.ft dd{margin:0}
.ft__fine{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 30px;margin:0;font-size:14px}

/* ---------- 404 ---------- */
.lost{min-height:calc(100svh - 190px);padding:30px var(--gut) 80px;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:24px 30px;align-items:end}
.lost__plot{grid-column:1/-1;position:relative;height:300px}
.lost__plot svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.lost__plot .under{fill:var(--mus-d)}
.lost__plot .bt{fill:none;stroke:var(--ink);stroke-width:5;stroke-linecap:round;vector-effect:non-scaling-stroke}
.lost__plot .gap{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-dasharray:2 9;stroke-linecap:round;vector-effect:non-scaling-stroke}
.lost__plot .base{fill:none;stroke:var(--ink);stroke-width:2;vector-effect:non-scaling-stroke}
.lost__smoke{position:absolute;width:300px;height:120px;margin:-122px 0 0 -6px}
.lost__code{grid-column:1/6;margin:0;font:700 clamp(90px,12vw,170px)/1 var(--num);letter-spacing:-.07em;white-space:nowrap}
.lost__txt{grid-column:6/-1}
.lost h1{font-size:clamp(36px,4.4vw,62px);line-height:1.2;margin-bottom:.3em}
.lost__txt p{margin:0;font-size:18px}
.lost__act{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px !important}

/* ---------- 平板 ---------- */
@media (max-width:1100px){
  .ro{grid-template-columns:auto minmax(0,1fr)}
  .ro__note{grid-column:1/-1}
  .fl{grid-template-columns:minmax(200px,30%) minmax(0,1fr);padding-right:var(--gut)}
  .cup{grid-column:1/-1;justify-self:center;margin-top:40px}
  .br__head{grid-column:1/-1;margin-bottom:30px}
  .rcp{grid-column:1/-1}
  .og--w{grid-column:1/7}
  .og--g{grid-column:7/-1}
  .ord__head{grid-column:1/-1}
}
/* ---------- 手機 ---------- */
@media (max-width:760px){
  body{font-size:16px}
  .mh{padding-block:10px;gap:6px 18px}
  .mh nav{gap:0 16px;order:3;flex:1 1 100%}
  .mh nav a{position:relative;font-size:15px;min-height:0;padding:6px 0}
  .mh nav a::after{content:"";position:absolute;inset:-2.5px -7px} /* 觸控目標：畫面不變，可點範圍上下各 2.5px、左右各 7px */
  .mh__tel{font-size:14px}
  .ed{padding-top:6px}
  .ed__stage{grid-template-areas:"title" "bt" "ph" "bean" "x"}
  .ed__title{grid-area:title;margin:0 0 20px;max-width:none}
  .ed__title h1{font-size:clamp(38px,11vw,46px);margin-bottom:.3em}
  .trk--bt{height:min(92vw,360px)}
  .yax li{right:auto;left:4px;background:var(--mus-d);padding:0 3px;font-size:12px}
  .trk--bt .yax li:nth-child(even),.trk--bt .yax li:nth-child(7){display:none}
  .trk__name--ror{display:none}
  .trk__name{font-size:13px}
  .ph{font-size:12.5px}
  .ph span{padding:0 4px}
  .ph .num{display:none}
  .xax li:nth-child(3n+2),.xax li:nth-child(3n+3){display:none}
  .beanat{width:56px;height:40px;margin-top:-20px}
  .smoke-at{width:120px;height:70px;margin-top:-72px}
  .chaff-at{width:84px;height:46px;margin:-64px 0 0 14px}
  .tp span{display:none}
  .hd__lab{font-size:13px;padding:0 5px}
  .hd__lab .num{display:none}
  .hd[data-side=b] .hd__lab{left:22px;top:28px}
  .hd[data-side=t] .hd__lab{right:22px;bottom:28px}
  .hd[data-side=r] .hd__lab{left:30px}
  .hd[data-side=l] .hd__lab{right:30px}
  .bm{transform:scale(.8)}
  .ro{grid-template-columns:minmax(0,1fr);gap:12px;margin-top:18px}
  .ro__v{font-size:88px}
  .ro__list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 12px}
  .ro__list dd{font-size:19px}
  .ro__list .ro__sub{display:block;margin:0;font-size:13px}
  .ro__deg dd{font-size:20px}
  .ro__note{font-size:15px}
  .house{grid-template-columns:minmax(0,1fr);gap:14px}
  html.js .house{gap:6px}
  .house__b .mini{display:none}
  .house__b{padding:4px 12px}
  .ed__bar{gap:10px 12px}
  .ed__bar h2{flex:1 1 100%}
  .house__f .mini{height:76px}
  .ed__bar{padding-bottom:30px}
  .fl{grid-template-columns:minmax(0,1fr);padding:10px var(--gut) 70px}
  .fl__fan{display:none}
  .fl__main{padding-left:0}
  .fl__main h2{font-size:24px;margin-bottom:14px}
  .words{font-size:clamp(40px,11.5vw,50px)}
  .fl__notes{margin-top:20px;font-size:15px}
  .fl__self{font-size:17px}
  .cup{grid-template-columns:210px minmax(0,1fr);gap:0 12px;margin-top:36px;justify-self:stretch}
  .cup__glass{width:210px;height:255px}
  .cup__fill{inset:28.5px 0 0 0;clip-path:path("M0 -12H210L196.5 159C189 205.5 160.5 226.5 105 226.5C49.5 226.5 21 205.5 13.5 159Z")}
  .cup__line{left:-45px;width:255px;height:276px}
  .cup__lab{margin-top:28.5px;height:226.5px}
  .cup__lab li{font-size:14px}
  .cup__lab li::before{width:16px}
  .cup__lab b{font-size:16px}
  .cup figcaption{padding-left:0;margin-top:18px}
  .br__arc{height:48px}
  .br__foot{height:36px}
  .br__in{grid-template-columns:minmax(0,1fr);padding:10px 0 46px}
  .br__head{grid-column:1/-1;margin-bottom:24px}
  .br__head h2{font-size:38px}
  .rcp{grid-column:1/-1;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px 18px}
  .rcp>li:nth-child(n){margin-top:0}
  .rcp>li:nth-child(even){margin-top:26px}
  .rcp__v{font-size:44px}
  .rcp__v--zh{font-size:36px}
  .pour{height:80px;margin-top:34px}
  .pour li{padding:0 7px;font-size:13px}
  .pour li span:not(.num){font-size:13px}
  .br__note{margin-top:22px;font-size:16px;max-width:none}
  .ridge{height:96px}
  .ridge__pk{display:none}
  .lt{padding:0 var(--gut) 96px;--altw:0px;clip-path:polygon(0 0,100% 0,100% 100%,0 calc(100% - 40px))}
  .lt__head{margin-bottom:22px}
  .lt__head h2{font-size:38px}
  .lots__scale{margin-right:0;height:60px}
  .lots__deg{font-size:12.5px}
  .lots__tick--o{display:none}
  .lot__pick{grid-template-columns:minmax(0,1fr) 92px;padding:12px 0 56px}
  .lot__id{grid-column:1;grid-row:1;flex-direction:row;align-items:baseline;gap:12px;padding:0}
  .lot__code{font-size:22px}
  .lot__track{grid-column:1/-1;grid-row:2;margin-top:10px;height:36px}
  .lot__track::after{top:-8px;bottom:-4px}
  .lot__info{grid-column:1/-1;grid-row:3;gap:0 14px;font-size:14px;line-height:1.6;margin-top:6px}
  .lot__w{font-size:18px}
  .lot__pile{grid-column:2;grid-row:1;width:92px;height:38px}
  .lot__load{right:auto;left:0;bottom:12px;min-height:40px}
  .lot__load::after{content:"";position:absolute;inset:-4px 0} /* 觸控目標：按鈕畫面維持 40px，可點範圍 48px（上下鄰接的選豆標籤會吃掉一部分，實測要 4px 才過 44） */
  .ord,.ft,.lost{grid-template-columns:minmax(0,1fr)}
  .ord>*,.ft>*,.lost>*{grid-column:1/-1 !important}
  .ord{padding:0 var(--gut) 56px;gap:20px}
  .ord__head h2{font-size:38px}
  .og--w{--k:.62px}
  .og--w label{padding:8px 10px;gap:8px}
  .og--w .og__name{font-size:15px}
  .og--g label{padding:8px 9px;flex:1 1 0}
  .og--g .og__name{font-size:17px}
  .og--g .gdot{width:30px}
  .ord__fine{grid-template-columns:minmax(0,1fr);font-size:14px;padding-top:18px}
  .ord__sum .tot dd{font-size:56px}
  .og label{padding:6px 10px}
  .ord__out{font-size:16px;padding:10px 14px}
  .dy{padding:0 var(--gut) 56px}
  .wk{margin-top:70px}
  .dy__head h2{font-size:38px}
  .dy__head div{font-size:15px;gap:0 16px}
  .wk__d{padding:8px 3px 0;min-height:128px}
  .wk__n{font-size:26px}
  .wk__e{font-size:12.5px;line-height:1.35;margin-top:6px}
  .wk__e .num{display:block;font-size:12.5px}
  .wk__d--roast .wk__e:first-of-type{padding:2px 5px;border-radius:8px}
  .wk__smoke{left:20px;top:-56px;width:74px;height:84px}
  .wk__bar{grid-column:3/-1;font-size:13px;padding:6px 10px}
  .dy__warm{font-size:17px;margin:22px 0 0 calc(100% / 7);padding:8px 0 0 14px}
  .dy__warm::before{top:-22px}
  .life{margin-top:40px}
  .life h3{font-size:26px;margin-bottom:20px}
  .life__ax{height:146px;margin:0 4px}
  .life__m{font-size:12.5px}
  .life__t:nth-child(even) span{display:none}
  .life__notes{font-size:15px;gap:2px 20px}
  .ft{padding:30px var(--gut) 34px;gap:14px}
  .ft dl{grid-template-columns:auto minmax(0,1fr);font-size:15px}
  .ft__brand{font-size:22px}
  .lost__plot{height:220px}
}
/* ---------- 降級動效：只有狀態變化，沒有過渡 ---------- */
@media (prefers-reduced-motion:reduce){
  html.js .strip rect,html.js .cup__fill i,html.js .cup__lab li,html.js .life__win,html.js .bean__body,.ed__title{transition:none !important}
  html.js .sweep.is-run{animation:none}
}
html.js .strip rect{transition:fill .16s linear;transition-delay:calc(var(--i) * 4ms)}
html.js .ed.is-drag .strip rect{transition-delay:0s}
html.js .bean__body{transition:fill .2s linear .3s}

/* ---------- 列印：白底黑線 ---------- */
@media print{
  :root{--mus:#fff;--mus-d:#eee;--mus-l:#f6f6f6;--ink:#000;--ink-2:#333;--crema:#fff;--sage:#e6e6e6;--sage-l:#f2f2f2;--sage-d:#ccc}

  .rcp__v,.br__head h2,.ft__brand{color:#000 !important}
  .mh nav,.ed__acts,.house__b,[data-copy-order],.how,.lot__load{display:none !important}
  .ed__stage{break-inside:avoid}
  .br,.shop,.dy{break-before:page;padding-top:20px}
  .pour li{box-shadow:inset 0 0 0 1px #000 !important}
  .grind .gr{fill:#000}
  a{text-decoration:underline;overflow-wrap:anywhere}
  html.js .house{display:grid}
  html.js .house__f{display:block}
}
