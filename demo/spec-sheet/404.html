.sub>ul.plain li{position:relative;padding-left:1.2rem;border-bottom:1px solid var(--rule-2);padding-block:.35rem;margin:0}
.sub>ul.plain li::before{content:"";position:absolute;left:0;top:1.05em;width:.6rem;height:1px;background:var(--ink)}
.sub>ul.plain li.cross::before{width:.6rem;height:.6rem;top:.78em;left:.05rem;background:none;border-top:1px solid var(--ink-3);border-bottom:1px solid var(--ink-3)}
.xref{font-family:var(--f-mono);font-size:.84em;white-space:nowrap}
/* 定位十字：由目錄跳到章節時閃現一次（≤300ms，steps），降級＝靜態底線 */
.sn::before,.sn::after,.sc::before,.sc::after{content:"";position:absolute;background:var(--sig-2);opacity:0;pointer-events:none}
.sn::before,.sc::before{left:-100vw;right:-100vw;top:50%;height:2px}
.sn::after,.sc::after{top:-100vh;bottom:-100vh;left:50%;width:2px}
@media screen and (prefers-reduced-motion:no-preference){
  :target>.sh .sn::before,:target>.sh .sn::after,:target>h3 .sc::before,:target>h3 .sc::after{animation:hb-xhair .3s steps(3,end) .2s both}
  :target>.sh .sn::before,:target>h3 .sc::before{animation-name:hb-xhair-h}
}
@keyframes hb-xhair{0%{opacity:1;scale:1 0}50%{opacity:1;scale:1 1}100%{opacity:0;scale:1 1}}
@keyframes hb-xhair-h{0%{opacity:1;scale:0 1}50%{opacity:1;scale:1 1}100%{opacity:0;scale:1 1}}
@media (prefers-reduced-motion:reduce){:target>.sh .sn,:target>h3 .sc{box-shadow:inset 0 -3px var(--sig-t2)}}
.sec,.sub,.toc{scroll-margin-top:3.4rem}
.sh,.sub h3{overflow:clip}
.sh+.band{border-top:0}
.twin{display:grid;grid-template-columns:1fr 1fr;column-gap:var(--gap);row-gap:1rem;margin-top:1rem}
.twin--31{grid-template-columns:3fr 1fr}
.twin>*{min-width:0}

/* ===== 表格（規格書細線表） ===== */
.tbl{width:100%;font-size:.92rem;line-height:1.5;border-top:1.5px solid var(--ink);border-bottom:1px solid var(--ink)}
.tbl th,.tbl td{text-align:left;vertical-align:top;padding:.5rem .7rem .5rem 0;border-bottom:1px solid var(--rule);font-weight:400}
.tbl thead th{font-size:.78rem;color:var(--ink-2);letter-spacing:.06em;vertical-align:bottom;border-bottom:1px solid var(--ink);padding-top:.4rem}
.tbl tbody tr:last-child>*{border-bottom:0}
.tbl .r{text-align:right}
.tbl .num{white-space:nowrap}
.tbl .c{text-align:center}
.tbl caption{text-align:left;font-size:.86rem;color:var(--ink-2);padding:0 0 .45rem}
.tbl .grp th{padding-top:1.1rem;font-size:.84rem;color:var(--ink-2);font-weight:500;border-bottom:1px solid var(--rule)}
.tbl .unit{color:var(--ink-2);font-size:.86em}
.tbl .sym{font-family:var(--f-mono);font-size:.9em;white-space:nowrap;color:var(--ink)}
.tbl .cond{color:var(--ink-2);font-size:.86em}
.tbl .ok{color:var(--sig);font-weight:700}
.tbl .dash{color:var(--ink-3)}
.sc-tbl col.cr{width:6rem}.sc-tbl col.cs{width:38%}.col-cd .sc-tbl col.cs{width:46%}
.tbl td,.tbl th{text-wrap:pretty}
.sc-tbl .in{color:var(--sig);font-weight:500;white-space:nowrap}
.sc-tbl .out{color:var(--ink-2);white-space:nowrap}
.sc-tbl .in::before,.sc-tbl .out::before{content:"";display:inline-block;width:.5rem;height:.5rem;margin-right:.45rem;vertical-align:.02em}
.sc-tbl .in::before{border:1.5px solid var(--sig-2);transform:rotate(45deg) scale(.85)}
.sc-tbl .out::before{height:1px;background:var(--ink-3);vertical-align:.3em}
.rev{display:inline-block;font-family:var(--f-mono);font-size:.86em;color:var(--sig);margin-left:.35em;white-space:nowrap}
.rev::before{content:"△"}
.fn{display:inline-block;font-size:1em;color:var(--sig);margin-left:.1em;text-decoration:none}
/* 參數表欄寬 */
.p-tbl col.cs{width:auto}.p-tbl col.cn{width:5.6rem}.p-tbl col.cu{width:5.5rem}.p-tbl col.cv{width:4rem}
.pw{display:grid;grid-template-columns:6.4rem 10.5rem 1fr;gap:0 .9rem;align-items:baseline}
.pw>span{display:block;min-width:0}
.p-tbl td.r{padding-right:1.2rem}
.p-tbl .sym sub{font-size:.8em}
/* 註腳 */
.notes{margin:0;padding:0;list-style:none;font-size:.86rem;color:var(--ink-2);line-height:1.6}
.notes li{display:grid;grid-template-columns:1.6rem 1fr;gap:.3rem;padding:.3rem 0;border-bottom:1px solid var(--rule-2)}
.notes li b{color:var(--sig);font-weight:500}
/* 修訂紀錄 */
.rev-tbl col.cv{width:4rem}.rev-tbl col.cd{width:7.5rem}.rev-tbl col.cm{width:5rem}
.rev-tbl td.mark{color:var(--sig);font-family:var(--f-mono)}
/* 型號表 */
.m-tbl th[scope=col]{font-family:var(--f-mono);font-size:.92rem;color:var(--ink);letter-spacing:0;font-weight:700}
.m-tbl th[scope=col] small{display:block;font-family:var(--f-body);font-weight:400;font-size:.76rem;color:var(--ink-2);letter-spacing:0}
.m-tbl th[scope=row]{color:var(--ink-2);font-size:.9rem}
.m-tbl tr.money th,.m-tbl tr.money td{border-top:1px solid var(--ink);padding-top:.7rem}
.m-tbl td .num{font-size:1.02em}
/* 端點表 */
.api-tbl col.cm{width:4.6rem}.api-tbl col.cp{width:19.5rem}.api-tbl col.cl{width:6rem}
.api-tbl .method{font-family:var(--f-mono);font-weight:700;font-size:.82rem}
.api-tbl .path{font-family:var(--f-mono);font-size:.86rem;overflow-wrap:anywhere}
.api-tbl .path i{font-style:normal;color:var(--sig)}
/* Webhook 表 */
.wh-tbl col.ce{width:11rem}.wh-tbl .ev{font-family:var(--f-mono);font-size:.84rem;overflow-wrap:anywhere}
.wh-tbl .fields{font-family:var(--f-mono);font-size:.8rem;color:var(--ink-2);overflow-wrap:anywhere}
/* 針腳表 */
.pin-tbl col.cn{width:2.6rem}.pin-tbl col.cs{width:5.6rem}.pin-tbl .pname{font-family:var(--f-mono);font-size:.86rem;font-weight:700}
.pin-tbl td:first-child{font-family:var(--f-mono);font-weight:700}

/* ===== 程式片段 ===== */
pre{margin:0;padding:.9rem 1rem;font-size:.84rem;line-height:1.6;background:var(--paper-2);border-left:2px solid var(--ink);white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink)}
pre b{color:var(--sig);font-weight:700}
.pre-cap{font-size:.8rem;color:var(--ink-2);margin:.7rem 0 .35rem;font-family:var(--f-mono)}
.kv{margin:.9rem 0 0;display:grid;grid-template-columns:auto 1fr;gap:.2rem 1rem;font-size:.9rem;max-width:40em}
.kv dt{color:var(--ink-2);white-space:nowrap}
.kv dd{margin:0}
.dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:0 1.2rem;font-size:.95rem;border-top:1px solid var(--ink)}
.dl dt{padding:.5rem .4rem .5rem 0;border-bottom:1px solid var(--rule);color:var(--ink-2);white-space:nowrap}
.dl dd{margin:0;padding:.5rem 0;border-bottom:1px solid var(--rule)}
.dl .num{font-weight:700}
.hw{grid-template-columns:auto 1fr auto}
.hw dd.price{text-align:right;white-space:nowrap}
.hw dd.price .num,.hw .num{font-weight:500}

/* ===== 系統組成（方塊圖，HTML） ===== */
.sys{display:grid;grid-template-columns:1fr;gap:0;margin-top:.2rem}
.sys__node{border:1px solid var(--ink);padding:.7rem .9rem;display:grid;grid-template-columns:auto 1fr;gap:.1rem .9rem;align-items:baseline}
.sys__node b{font-weight:500;font-size:1rem;white-space:nowrap}
.sys__node span{font-size:.86rem;color:var(--ink-2)}
.sys__node small{grid-column:1/-1;font-size:.8rem;color:var(--ink-2);font-family:var(--f-mono)}
.sys__link{position:relative;padding:.55rem 0 .55rem 2.2rem;font-size:.84rem;color:var(--ink-2);margin-left:1.4rem;border-left:1px solid var(--ink)}
.sys__link::after{content:"";position:absolute;left:-4.5px;bottom:-1px;width:0;height:0;border:4.5px solid transparent;border-top:7px solid var(--ink);border-bottom:0}
.sys__link .mono{color:var(--ink);font-size:.8rem}

/* ===== 型號編碼 ===== */
.code{display:flex;flex-wrap:wrap;gap:.9rem 1.1rem;font-family:var(--f-mono);font-stretch:112.5%;font-size:clamp(1.6rem,2.6vw,2.2rem);font-weight:700;letter-spacing:.02em;margin:.5rem 0 .2rem;align-items:end}
.code span{position:relative;padding-bottom:.35rem;border-bottom:2px solid var(--ink)}
.code span::after{content:"";position:absolute;left:50%;bottom:-.95rem;width:1px;height:.95rem;background:var(--ink)}
.code-key{margin:1.3rem 0 0;padding:0;list-style:none;display:grid;gap:.4rem;font-size:.94rem}
.code-key li{display:grid;grid-template-columns:4.2rem 1fr;gap:.6rem;align-items:baseline}
.code-key b{font-family:var(--f-mono);font-weight:700;font-stretch:112.5%}
.code-key li span{color:var(--ink-2)}

/* ===== 附錄 A：時序圖 ===== */
.tdg{position:relative;margin-top:3.4rem}
.tdg__wrap{display:grid;grid-template-columns:7.6rem 1fr;gap:0 .6rem;position:relative}
.tdg__labels{position:relative;height:var(--tdg-h,300px);font-size:.82rem;line-height:1.3}
.tdg__labels span{position:absolute;left:0;right:0;translate:0 -50%;text-align:right;color:var(--ink)}
.tdg__labels small{display:block;font-family:var(--f-mono);font-size:.7rem;color:var(--ink-2)}
.tdg__plot{position:relative;border-left:1px solid var(--ink);border-bottom:1px solid var(--ink);height:var(--tdg-h,300px);touch-action:pan-y}
.tdg__plot svg{display:block;width:100%;height:100%}
.tg-cell{fill:var(--sig-t)}.tg-sat{fill:var(--rule-2)}
.tg-rpt{stroke:var(--ink);stroke-width:1.2;vector-effect:non-scaling-stroke}
.tg-door{fill:none;stroke:var(--ink);stroke-width:1.4;vector-effect:non-scaling-stroke}
.tg-doorfill{fill:var(--ink);opacity:.12}
.tg-band{fill:var(--sig-t)}.tg-off{fill:var(--ink);opacity:.07}
.tg-temp{fill:none;stroke:var(--ink);stroke-width:1.6;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.tg-thr{stroke:var(--ink);stroke-width:1;stroke-dasharray:4 3;vector-effect:non-scaling-stroke}
.tg-base{stroke:var(--rule);stroke-width:1;vector-effect:non-scaling-stroke}
.tg-shk{stroke:var(--ink);stroke-width:1.4;vector-effect:non-scaling-stroke}
.tg-shk--over{stroke:var(--sig-2);stroke-width:2.4}
.tg-bat{fill:none;stroke:var(--ink);stroke-width:1.4;vector-effect:non-scaling-stroke}
.tg-sep{stroke:var(--rule);stroke-width:1;vector-effect:non-scaling-stroke}
.tg-mk rect{fill:transparent;cursor:pointer}
.tg-mk path{stroke:var(--ink-2);stroke-width:1;stroke-dasharray:2 3;vector-effect:non-scaling-stroke;pointer-events:none}
.tg-mk:hover path{stroke:var(--sig);stroke-dasharray:none}
.tg-cur path{stroke:var(--sig-2);stroke-width:2;vector-effect:non-scaling-stroke}
.tdg__marks{position:absolute;left:0;right:0;top:-1.5rem;height:1.4rem;font-family:var(--f-mono);font-size:.78rem;color:var(--ink-2)}
.tdg__marks span{position:absolute;translate:-50% 0;white-space:nowrap}
.tdg__axis{position:relative;height:1.6rem;font-family:var(--f-mono);font-size:.74rem;color:var(--ink-2)}
.tdg__axis span{position:absolute;top:.25rem;translate:-50% 0;white-space:nowrap;padding-top:.3rem}
.tdg__axis span::before{content:"";position:absolute;left:50%;top:-.05rem;width:1px;height:.35rem;background:var(--ink)}
.tdg__time{position:absolute;top:-3.1rem;translate:-50% 0;font-family:var(--f-mono);font-size:.8rem;font-weight:700;color:var(--sheet);background:var(--sig);padding:0 .4rem;line-height:1.5;white-space:nowrap;pointer-events:none}
.tdg__ctl{display:grid;grid-template-columns:7.6rem 1fr;gap:0 .6rem;align-items:center;margin-top:.6rem}
.tdg__ctl label{font-size:.84rem;color:var(--ink-2);text-align:right}
.tdg input[type=range]{-webkit-appearance:none;appearance:none;display:block;width:100%;height:28px;margin:0;background:transparent;cursor:ew-resize}
.tdg input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--ink)}
.tdg input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:22px;margin-top:-11px;background:var(--sheet);border:2px solid var(--sig-2)}
.tdg input[type=range]::-moz-range-track{height:1px;background:var(--ink)}
.tdg input[type=range]::-moz-range-thumb{width:12px;height:20px;border-radius:0;background:var(--sheet);border:2px solid var(--sig-2)}
.tdg__hint{font-size:.82rem;color:var(--ink-2);margin-top:.35rem}
html:not(.js) .tdg__ctl,html:not(.js) .tdg__hint{display:none}
/* 讀值表 */
.rd{margin-top:1.6rem}
.rd-tbl{font-size:.92rem}
.rd-tbl col.cs{width:9rem}.rd-tbl col.cv{width:auto}.rd-tbl col.cl{width:6.4rem}.rd-tbl col.cj{width:6rem}
.rd-tbl .lbl{display:none}
.rd-tbl .v{font-family:var(--f-mono);font-weight:700;font-size:.95rem}
.rd-tbl .v small{font-family:var(--f-body);font-weight:400;font-size:.82rem;color:var(--ink-2);margin-left:.3rem}
.rd-tbl .j{display:none;font-size:.82rem;padding:.05rem .45rem;white-space:nowrap}
.rd-tbl tr[data-j=ok] .j-ok,.rd-tbl tr[data-j=over] .j-over,.rd-tbl tr[data-j=na] .j-na{display:inline-block}
.rd-tbl .j-ok{color:var(--sig);border:1px solid var(--sig-2)}
.rd-tbl .j-over{background:var(--ink);color:var(--sheet)}
.rd-tbl .j-na{color:var(--ink-2)}
.rd-tbl tr[data-j=over] .v{background:var(--ink);color:var(--sheet);padding:0 .3rem}
.rd-tbl tr[data-j=over] .v small{color:var(--sheet-2)}
.rd-tbl [data-v]>span{display:none}
.rd-tbl [data-v=cell]>.o-cell,.rd-tbl [data-v=sat]>.o-sat,.rd-tbl [data-v=none]>.o-none,.rd-tbl [data-v=open]>.o-open,.rd-tbl [data-v=closed]>.o-closed,.rd-tbl [data-v="0"]>.o-0,.rd-tbl [data-v="1"]>.o-1,.rd-tbl [data-v="2"]>.o-2,.rd-tbl [data-v="3"]>.o-3,.rd-tbl [data-v="4"]>.o-4,.rd-tbl [data-v="5"]>.o-5{display:inline}
.rd__at{font-size:.94rem;margin-bottom:.5rem;display:flex;flex-wrap:wrap;gap:.3rem 1rem;align-items:baseline}
.rd__at .num{font-weight:700;font-size:1.05rem}
.evs{margin:1.6rem 0 0;padding:0;list-style:none;font-size:.94rem}
.evs li{display:grid;grid-template-columns:2.2rem 5.6rem 1fr;gap:.4rem;padding:.4rem 0;border-bottom:1px solid var(--rule-2);line-height:1.5}
.evs li b{font-family:var(--f-mono);font-weight:700}
.evs li .num{color:var(--ink-2);font-size:.84rem}
.evs-h{font-size:.8rem;letter-spacing:.12em;color:var(--ink-2);margin:1.6rem 0 .2rem;font-weight:500}

/* ===== 附錄 B：埠口圖 ===== */
.port{width:100%;height:auto;max-width:520px}
.pt-ring{fill:var(--sheet-2);stroke:var(--ink);stroke-width:1.5}
.pt-ring2{fill:var(--sheet);stroke:var(--ink);stroke-width:.8}
.pt-key{fill:var(--ink)}
.pt-pin{fill:var(--sheet);stroke:var(--ink);stroke-width:1.2}
.pt-n{font-family:var(--f-mono);font-size:10.5px;font-weight:700;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.pt-body{fill:var(--sheet-2);stroke:var(--ink);stroke-width:1.5}
.pt-lid{fill:none;stroke:var(--ink);stroke-width:.7;stroke-dasharray:3 2}
.pt-screw{fill:var(--sheet);stroke:var(--ink);stroke-width:1}
.pt-slot{stroke:var(--ink);stroke-width:1}
.pt-slot2{fill:var(--sheet);stroke:var(--ink);stroke-width:1}
.pt-port{fill:var(--sheet);stroke:var(--ink);stroke-width:1.5}
.pt-port2{fill:var(--ink)}
.pt-led{fill:var(--sig-t2);stroke:var(--ink);stroke-width:.8}
.pt-dim{fill:none;stroke:var(--ink-2);stroke-width:.8}
.pt-d{font-family:var(--f-mono);font-size:12.5px;fill:var(--ink-2);text-anchor:middle}
.pt-d--v{writing-mode:vertical-rl;text-anchor:middle;dominant-baseline:central}
.pt-lead{fill:none;stroke:var(--ink-2);stroke-width:.8;stroke-dasharray:3 3}
.port-cap{font-size:.86rem;color:var(--ink-2);margin-top:.6rem;max-width:34em}

/* ===== §7 流程與表單 ===== */
.steps{margin:0;padding:0;list-style:none;counter-reset:st}
.steps li{counter-increment:st;display:grid;grid-template-columns:2.2rem 1fr;gap:.4rem;padding:.6rem 0;border-bottom:1px solid var(--rule)}
.steps li::before{content:counter(st,decimal-leading-zero);font-family:var(--f-mono);font-weight:700;font-size:.95rem;color:var(--ink);padding-top:.15rem}
.steps b{display:block;font-weight:500;grid-column:2}
.steps li>span{grid-column:2}
.steps span{font-size:.9rem;color:var(--ink-2)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:1rem 1.6rem;border-top:1.5px solid var(--ink);padding-top:1.2rem}
.fld{display:grid;gap:.25rem;min-width:0}
.fld--w{grid-column:1/-1}
.fld label,.fld legend{font-size:.86rem;color:var(--ink-2);padding:0}
.fld label b,.fld legend b{color:var(--ink);font-weight:500;margin-right:.4rem}
.fld input,.fld select,.fld textarea{width:100%;padding:.5rem .6rem;border:1px solid var(--ink);border-radius:0;background:var(--sheet);font-size:.98rem;line-height:1.4;min-height:2.6rem}
.fld input:focus-visible,.fld select:focus-visible,.fld textarea:focus-visible{outline:var(--focus-ring);outline-offset:0;border-color:var(--sig-2)}
.fld textarea{min-height:6rem;resize:vertical}
.fld select{appearance:none;-webkit-appearance:none;background:var(--sheet) no-repeat right .6rem center/10px 6px;background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(-45deg,transparent 50%,var(--ink) 50%);background-size:6px 6px;background-position:calc(100% - 16px) 55%,calc(100% - 10px) 55%}
.fld .err{font-size:.84rem;color:var(--ink);margin:0;padding:.2rem .55rem;background:var(--sig-t)}
.fld .err::before{content:"!";font-family:var(--f-mono);font-weight:700;color:var(--sig);margin-right:.45em}
.fld [aria-invalid=true]{border-color:var(--sig-2);border-width:2px}
.choices{display:flex;flex-wrap:wrap;gap:.4rem 1.2rem;margin-top:.2rem}
.choices label{display:inline-flex;align-items:center;gap:.4rem;font-size:.95rem;color:var(--ink)}
.choices input{width:1.05rem;height:1.05rem;min-height:0;margin:0;accent-color:var(--sig)}
.form__send{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:.8rem 1.4rem;padding-top:.4rem}
.form__send button{background:var(--ink);color:var(--sheet);border:1px solid var(--ink);padding:.7rem 1.6rem;font-size:1rem;font-weight:500;cursor:pointer}
.form__send button:hover{background:var(--sig);border-color:var(--sig)}
.form__send p{font-size:.86rem;color:var(--ink-2);max-width:30em;margin:0}
.done{grid-column:1/-1;margin:0;padding:.8rem 1rem;border:1px solid var(--sig-2);background:var(--sig-t);font-size:.95rem}

/* ===== 版權頁（列 18） ===== */
.colophon{max-width:1360px;margin-inline:auto;padding:0 var(--pad) 3rem;font-size:.86rem;color:var(--ink-2)}
.band--foot{border-top:1.5px solid var(--ink)}
.colophon .bno{color:var(--ink)}
.colophon dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:.15rem 1rem}
.colophon dt{white-space:nowrap}
.colophon dd{margin:0;color:var(--ink)}
.colophon .mark{width:22px;height:22px;display:inline-block;vertical-align:-6px;margin-right:.4rem;color:var(--ink)}
.colophon p{max-width:34em}
.colophon p+p{margin-top:.6rem}
.colophon .legal{grid-column:c/span 2}
.colophon .sig{grid-column:a/span 2}

/* ===== 404 ===== */
.lost{max-width:1100px;margin-inline:auto;padding:4rem var(--pad);display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:2rem clamp(2rem,6vw,5rem);align-items:center;min-height:calc(100svh - 10rem)}
.lost h1{font-size:clamp(2.4rem,5vw,3.6rem);line-height:1.15;margin:.4rem 0 1rem}
.lost p{max-width:30em}
.lost p+p{margin-top:.7rem}
.lost__ref{font-family:var(--f-mono);font-size:.86rem;color:var(--ink-2)}
.lost__ref b{color:var(--ink);font-size:1.3rem;font-stretch:112.5%}
.lost__back{display:inline-block;margin-top:1.4rem;font-size:1.05rem}
.lost-grid{width:100%;height:auto}
.lg-cell{fill:var(--rule-2)}.lg-cell--on{fill:var(--ink-3)}
.lg-ghost{fill:none;stroke:var(--sig-2);stroke-width:1.5;stroke-dasharray:3 2}
.lg-t{font-family:var(--f-mono);font-size:10px;fill:var(--ink-2);text-anchor:middle}
.lg-t--ghost{fill:var(--sig);font-weight:700}
.lg-x{fill:none;stroke:var(--sig-2);stroke-width:1.2}

/* ===== 列印 ===== */
@media print{
  :root{--paper:#fff;--paper-2:#f2f2f2;--sheet:#fff;--sheet-2:#f2f2f2;--ink:#000;--ink-2:#222;--ink-3:#555;--rule:#888;--rule-2:#bbb;--sig:#000;--sig-2:#000;--sig-t:#e8e8e8;--sig-t2:#ddd}
  .run{position:static;border-bottom:2px solid #000}
  .run__nav,.keymap,.cmap,.tdg__ctl,.tdg__hint,.form__send,.cols{display:none}
  .band,.sh{break-inside:avoid}
  .tbl tr{break-inside:avoid}
  a{text-decoration:underline}
  .tdg{--tdg-h:260px}
  .twin--31{grid-template-columns:1fr}
  .rd-tbl .j-over,.rd-tbl tr[data-j=over] .v{background:#000;color:#fff}
}

/* ===== 手機與窄螢幕 ===== */
@media (max-width:1100px){
  .band--head{grid-template-columns:1fr;grid-template-rows:none;row-gap:1rem;padding-top:1.2rem}
  .band--head .bno{position:static;width:auto;grid-column:1;display:flex;align-items:center;gap:.6rem;background:none;font-size:.95rem;padding:0}
  .band--head .bno::after{margin:0;width:2rem;order:-1}
  .tb-brand,.tb-no,.tb-title,.tb-fields,.hero{grid-column:1;grid-row:auto}
  .tb-brand{order:1}.tb-title{order:2;padding:.4rem 0 .2rem}.hero{order:3}.tb-no{order:4;margin-top:.6rem}.tb-fields{order:5;margin-top:.4rem}
  .tb-title h1{font-size:clamp(3.4rem,13vw,5.2rem)}
  .hero .fg-d{display:none}
  .hero .fg-m{display:block;max-width:440px;margin-inline:auto}
  .toc>ol{columns:1}
  .twin--31{grid-template-columns:1fr}
  .p-tbl col.cp{width:9rem}.p-tbl col.cs{width:6.5rem}
}
@media (max-width:860px){
  :root{--g:3.2rem;--gap:1.4rem}
  .run{grid-template-columns:auto 1fr auto;font-size:.8rem;gap:.3rem 1rem}
  .run__doc{display:none}
  .keymap{display:none}
  .run__here{gap:.5rem}
  .band{grid-template-columns:1fr;row-gap:1.8rem;padding-top:1.1rem}
  .bno{position:static;width:auto;grid-column:1;grid-row:auto;display:flex;align-items:center;gap:.6rem;background:none;font-size:.95rem;padding:0}
  .bno::after{margin:0;width:2rem;order:-1}
  .col-a,.col-b,.col-c,.col-d,.col-ab,.col-cd,.col-ad,.col-ac,.col-bd{grid-column:1}
  .band--head{row-gap:1rem}
  .abs,.feat,.toc__head,.toc>ol{grid-column:1;grid-row:auto}
  .feat li{padding-right:.5rem} /* 句尾全形括號靠 Chromium 的行尾半形化才擠得進去，那半個字寬會算成橫向溢出（I32）；右側留一點呼吸 */
  .cmap{display:none}
  .tb-no b{font-size:1.4rem}
  .sh{grid-template-columns:1fr;padding-top:2.4rem;row-gap:.5rem}
  .sh h2{grid-column:1;grid-row:auto;font-size:2.3rem}
  .sh{row-gap:.4rem}
  .sh .sn{width:auto;margin-right:.8rem;font-size:1.6rem}
  .cols{display:none}
  .colophon .legal,.colophon .sig{grid-column:1}
  .lost{grid-template-columns:1fr}
  .lost .lost-grid{max-width:200px}
  .form{grid-template-columns:1fr}
  .twin,.twin--31{grid-template-columns:1fr}
}
/* 手機章節折疊（JS 加上 .is-closed 與標題按鈕；沒有 JS 就是全部展開） */
@media screen and (max-width:600px){
  .sec.is-closed>:not(.sh){display:none}
  .sh{padding-top:1.1rem;padding-bottom:.35rem;row-gap:0}
  .sh h2{font-size:1.75rem}
  .sh .sn{font-size:1.25rem;margin-right:.7rem}
  .sec-t{display:flex;align-items:baseline;flex:1;min-width:0;min-height:2.9rem;padding:0 2.4rem 0 0;font:inherit;letter-spacing:inherit;color:inherit;background:none;border:0;border-radius:0;text-align:left;cursor:pointer;position:relative;align-items:center}
  .sec-t::after{content:"";position:absolute;right:.15rem;top:50%;width:1rem;height:1rem;margin-top:-.5rem;background:linear-gradient(var(--ink),var(--ink)) center/100% 2px no-repeat,linear-gradient(var(--ink),var(--ink)) center/2px 100% no-repeat}
  .sec-t[aria-expanded=true]::after{background:linear-gradient(var(--ink),var(--ink)) center/100% 2px no-repeat}
  .sec-t:focus-visible{outline:var(--focus-ring);outline-offset:2px}
}
@media (max-width:600px){
  html{font-size:15px}
  .tbl{font-size:.88rem}
  .tbl th,.tbl td{padding-right:.45rem}
  /* 參數表：符號＋條件收進參數欄之下，數字四欄維持真正的表格欄 */
  .p-tbl{table-layout:fixed}
  .p-tbl col.cs{width:39%}.p-tbl col.cn{width:11.5%}.p-tbl col.cu{width:14%}.p-tbl col.cv{width:7.5%}
  .p-tbl .sym{font-size:1em}.p-tbl .sym sub{font-size:.82em}
  .p-tbl td.r{font-size:.86em}
  .pw{display:block}
  .p-tbl td.r,.p-tbl th.r{padding-right:.3rem}
  .p-tbl .cond{font-size:.88em}
  .p-tbl td.r{padding-right:.6rem;font-size:.9em}
  .p-tbl .ok{font-size:.9em}
  /* 以 grid 重排的表：方法與路徑同列、說明換行 */
  .g-tbl,.g-tbl thead,.g-tbl tbody,.g-tbl tr,.g-tbl th,.g-tbl td,.g-tbl caption{display:block}
  .g-tbl thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .g-tbl tr{display:grid;grid-template-columns:auto 1fr;gap:.1rem .7rem;padding:.55rem 0;border-bottom:1px solid var(--rule)}
  .g-tbl th,.g-tbl td{padding:0;border:0}
  .g-tbl tbody tr:last-child{border-bottom:0}
  .api-tbl .method{grid-row:1}.api-tbl .path{grid-row:1}.api-tbl .desc,.api-tbl .lvl{grid-column:1/-1}
  .api-tbl .lvl{font-size:.8rem;color:var(--ink-2)}
  .wh-tbl tr{grid-template-columns:1fr}
  .rev-tbl tr{grid-template-columns:auto auto 1fr}.rev-tbl .chg{grid-column:1/-1}
  .pin-tbl tr{grid-template-columns:2.2rem 1fr}.pin-tbl .pfn,.pin-tbl .pel{grid-column:2}.pin-tbl .pel{font-size:.84rem;color:var(--ink-2)}
  .m-tbl th[scope=col] small{display:none}
  .m-tbl th,.m-tbl td{padding:.35rem .25rem .35rem 0;font-size:.84rem}
  .m-tbl th[scope=col]{font-size:.78rem}
  .m-tbl th[scope=row]{font-size:.82rem}
  .m-tbl td .num{font-size:.98em}
  .rd-tbl,.rd-tbl tbody,.rd-tbl tr,.rd-tbl th,.rd-tbl td{display:block}
  .rd-tbl thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .rd-tbl tr{display:grid;grid-template-columns:5.4rem 1fr auto;gap:.1rem .6rem;padding:.5rem 0;border-bottom:1px solid var(--rule);align-items:baseline}
  .rd-tbl th,.rd-tbl td{padding:0;border:0}
  .rd-tbl tbody tr:last-child{border-bottom:0}
  .rd-tbl th{grid-row:1;grid-column:1}
  .rd-tbl td:nth-child(2){grid-row:1;grid-column:2}
  .rd-tbl td:nth-child(5){grid-row:1;grid-column:3}
  .rd-tbl td:nth-child(3){grid-row:2;grid-column:2;text-align:left}
  .rd-tbl td:nth-child(4){grid-row:2;grid-column:3;text-align:left}
  .rd-tbl td:nth-child(3),.rd-tbl td:nth-child(4){font-size:.8rem;color:var(--ink-2)}
  .rd-tbl .lbl{display:inline;margin-right:.3em;color:var(--ink-2);font-family:var(--f-body)}
  .rd-tbl .v{font-size:.9rem}
  .rd-tbl .j{padding:.05rem .3rem;font-size:.78rem}
  .tdg__wrap,.tdg__ctl{grid-template-columns:4.6rem 1fr}
  .tdg__labels{font-size:.74rem}
  .tdg__labels small{display:none}
  .tdg{--tdg-h:260px}
  .tdg__axis span:nth-child(odd){display:none}
  .tdg__marks{font-size:.76rem}
  .evs li{grid-template-columns:2rem 1fr}.evs li .num{grid-column:2}.evs li span:last-child{grid-column:2}
  .code{font-size:1.5rem;gap:.8rem .7rem}
  .code-key li{grid-template-columns:3.4rem 1fr}
  .sys__node{grid-template-columns:1fr}
  .dl,.hw{grid-template-columns:1fr}
  .dl dt{border-bottom:0;padding-bottom:0}
  .dl dd{padding-top:.1rem}
  .hw dt{border:0;padding-bottom:0}
  .hw dd:not(.price){border:0;padding:0}
  .hw dd.price{text-align:left;padding-top:.1rem}
  pre{font-size:.78rem;padding:.7rem .8rem}
  .steps li{grid-template-columns:1.8rem 1fr}
  .tb-models{font-size:.88rem}
}

}
