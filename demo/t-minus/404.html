.leads{display:block;width:100%;height:34px;overflow:visible}
.leads path{fill:none;stroke:var(--ink);stroke-width:1.5;vector-effect:non-scaling-stroke}
.leads-v{display:none}
.calls{position:relative;height:168px;margin:0;padding:0;list-style:none}
.call{--c:.5;position:absolute;top:0;left:calc(var(--c) * 100%);translate:-50% 0;width:190px;display:grid;gap:2px;padding:10px 12px;border-top:2px solid currentColor}
.call .cn{font:400 18px/1.3 var(--disp);letter-spacing:.04em}
.call .ca{font:500 15px/1.3 var(--sans)}
.call .ca .n{font-size:22px;font-weight:700;margin-right:3px}
.call .cnote{font:400 13.5px/1.5 var(--sans);color:var(--ink2)}
.step{display:flex;gap:6px;margin-top:6px}
.step button{width:44px;height:36px;border:1.5px solid #072820;border-radius:18px;background:none;color:var(--ink);font:700 19px/1 var(--num);cursor:pointer}
.step button:hover{background:var(--ink);color:var(--hi)}
.msum{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;margin-top:18px;padding-top:14px;border-top:2px solid #072820}
.msum p{margin:0}
.msum .tot{font:600 17px/1.4 var(--sans)}
.msum .tot .n{font-size:30px;font-weight:800;margin:0 4px}
.msum .eq{font:700 15px/1.4 var(--sans);color:var(--clay-d)}
.msum .bl{flex:1 1 320px;font:400 15px/1.6 var(--sans);color:var(--ink2);text-align:right}
.bnote{margin:4px 0 0;max-width:56em;font-size:15px;color:var(--ink2)}
.bnote{grid-column:1/-1;margin-top:14px}

/* ---------- 接手方式：同一把尺上的三條線 ---------- */
.plans{width:var(--wrap);margin:96px auto 0;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:24px}
.plans>.ph,.plans>.stair{grid-column:1/-1}
.plans>.pay{grid-column:1/7}
.plans>.once{grid-column:7/-1;margin-top:28px}
.ph{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px 72px;align-items:end}
.ph h2{margin:0;font-size:clamp(34px,3.5vw,50px);line-height:1.18;letter-spacing:.04em}
.ph p{margin:0;max-width:34em;color:var(--ink2)}
.stair{--x:0;position:relative;margin-top:44px}
.srule{position:relative;height:34px;border-bottom:2px solid #072820}
.srule span{position:absolute;bottom:0;left:calc(var(--x) * 100%);height:28px;padding-left:6px;border-left:1.5px solid #072820;font:700 13px/1.2 var(--num);white-space:nowrap}
.srule span.end{translate:-100% 0;border-left:0;border-right:1.5px solid #072820;padding:0 6px 0 0}
.pls{margin:0;padding:0;list-style:none}
.pl{position:relative;padding:18px 0 24px}
.pl+.pl{border-top:1px dotted #274a40}
.pt{position:relative;z-index:2;margin-left:calc(var(--px) * 100%);width:fit-content;max-width:min(520px,100%);padding:0 10px 12px 0;background:var(--bg)}
.pl.far .pt{margin-left:auto;text-align:right;padding:0 0 12px 10px}
.pt h3{margin:0;font-size:25px;line-height:1.25;letter-spacing:.06em}
.pp{margin:4px 0 0;font:600 15px/1.3 var(--sans)}
.pp .n{font-size:31px;font-weight:800;margin-right:4px;letter-spacing:-.01em}
.pi{display:flex;flex-wrap:wrap;gap:2px 16px;margin:8px 0 0;padding:0;list-style:none;font:400 14.5px/1.55 var(--sans);color:var(--ink2)}
.pl.far .pi{justify-content:flex-end}
.pi li::before{content:"";display:inline-block;width:7px;height:7px;margin:0 7px 2px 0;border-radius:50%;border:1.5px solid currentColor}
.pb{position:relative;height:16px;margin-left:calc(var(--px) * 100%);border-radius:8px;background:url(assets/cloth-stripe.svg) 0 0/48px 48px,var(--teal)}
.pb i{position:absolute;top:-6px;left:calc(var(--p) * 100%);width:2px;height:28px;margin-left:-1px;background:var(--ink)}
.pb b{position:absolute;top:-5px;bottom:-5px;right:-4px;width:26px;border-radius:13px;background:var(--clay);border:2px solid #072820}
.pl.gone .pb{background:linear-gradient(90deg,transparent 0 calc(var(--cut) * 100%),var(--teal) 0),url(assets/hatch-past.svg) 0 0/48px 48px,var(--bg3)}
.pl .late{position:relative;z-index:2;width:fit-content;margin:12px 0 0 calc(var(--px) * 100%);padding-right:8px;background:var(--bg);font:700 14.5px/1.5 var(--sans);color:var(--clay-d)}
.pl.far .late{margin-left:auto;text-align:right}
.sneedle{position:absolute;z-index:1;top:-34px;bottom:0;left:calc(var(--x) * 100%);width:3px;margin-left:-1.5px;background:var(--clay);pointer-events:none}
.sneedle>span{position:absolute;top:0;left:8px;font:700 14px/1.2 var(--sans);color:var(--clay-d);white-space:nowrap;background:var(--bg);padding:2px 4px}
.stair[data-side=l] .sneedle>span{left:auto;right:8px}
html:not(.js) .sneedle{display:none}
.pay{margin:28px 0 0;max-width:60em;font-size:15.5px}
.pay b{font:700 1em/1 var(--num)}
.once{margin:10px 0 0;max-width:60em;font-size:15.5px;color:var(--ink2)}

/* ---------- 當天：四個角色 ---------- */
.day0{width:var(--wrap);margin:84px auto 0;display:flex;flex-direction:column}
.dh h2{margin:0;font-size:clamp(34px,3.5vw,50px);line-height:1.18;letter-spacing:.04em}
.dh p{margin:14px 0 0;max-width:40em;color:var(--ink2)}
.tape-wrap{margin-top:24px;overflow-x:auto;overscroll-behavior-x:contain}
.tape{min-width:1000px}
.hrs{position:relative;height:30px;margin:0 0 0 130px;padding:0;list-style:none;border-bottom:2px solid #072820}
.hrs li{position:absolute;bottom:0;left:calc((var(--h) - 6) / 12 * 100%);height:24px;padding-left:5px;border-left:1.5px solid #072820;font:700 13px/1.2 var(--num);white-space:nowrap}
.hrs li:last-child{translate:-100% 0;border-left:0;border-right:1.5px solid #072820;padding:0 5px 0 0}
.dls{margin:0;padding:0;list-style:none}
.dln{display:grid;grid-template-columns:130px minmax(0,1fr);align-items:center;padding:6px 0;background:repeating-linear-gradient(90deg,transparent 0 calc((100% - 130px) / 12 - 1px),#9cd7b8 0 calc((100% - 130px) / 12)) 130px 0/calc(100% - 130px) 100% no-repeat}
.dln+.dln{border-top:1px dotted #274a40}
.who-h{display:flex;align-items:center;gap:10px;margin:0;padding-right:12px}
.who-h h3{margin:0;font-size:22px;line-height:1.3;letter-spacing:.1em}
.dbs{position:relative;margin:0;padding:0;list-style:none;min-height:calc(var(--rows) * 62px)}
.db{position:absolute;top:calc(var(--r) * 62px + 4px);left:calc((var(--a) - 6) / 12 * 100%);width:calc((var(--b) - var(--a)) / 12 * 100% - 4px);min-height:54px;padding:6px 12px;border-radius:27px;background:var(--hi);color:var(--ink);border:1.5px solid #072820}
.db time{display:block;font:700 12.5px/1.2 var(--num)}
.db .dt{display:block;font:500 13.5px/1.35 var(--sans);overflow-wrap:anywhere}
.db .who{display:none}
.dln.fam .db{background:var(--clay-l)}
.dln.us .db{background:var(--clay);color:var(--hi);border-color:#7e321e}
.dln.ven .db{background:url(assets/cloth-cross.svg) 0 0/48px 48px,var(--mid)}
.dln.ven .db time,.dln.ven .db .dt{display:inline-block;background:var(--hi);padding:0 4px;border-radius:3px}
.dln.ven .db time{margin-bottom:2px}

/* ---------- 每件事交到誰手上 ---------- */
.whom{width:var(--wrap);margin:88px auto 0;display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);column-gap:60px;align-items:end}
.whom>.tables{grid-column:1/-1;grid-row:2}
.whom>h2{grid-column:1;grid-row:1;margin:0;max-width:12em;font-size:clamp(34px,3.5vw,50px);line-height:1.18;letter-spacing:.04em}
.tables{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.2fr) minmax(0,1fr);column-gap:56px;align-items:start;margin:14px 0 0;padding:0;list-style:none}
.grp:nth-child(2){margin-top:96px}
.grp:nth-child(3){margin-top:36px}
.grp img{width:var(--sz,230px);max-width:100%;height:auto;margin:0 0 6px -10px}
.grp h3{margin:0;font-size:25px;line-height:1.3;letter-spacing:.08em}
.grp h3 .n{font:700 15px/1 var(--num);color:var(--ink2);margin-left:8px;letter-spacing:0}
.gi{margin:10px 0 0;padding:0;list-style:none}
.gi li{padding:6px 0;border-top:1px dotted #274a40}
.gi b{display:block;font:700 15.5px/1.5 var(--sans)}
.gi span{display:block;font:400 14.5px/1.6 var(--sans);color:var(--ink2)}
.grp.us h3{color:var(--clay-d)}
.reg{grid-column:2;grid-row:1;margin:0;max-width:34em;padding:4px 0 4px 22px;border-left:2px solid #a5492b;font:500 16px/1.8 var(--sans)}

/* ---------- 常被問的 ---------- */
.faq{width:var(--wrap);margin:84px auto 0;display:grid;grid-template-columns:minmax(0,3fr) minmax(0,9fr);column-gap:60px;align-items:start}
.faq h2{margin:0;font-size:clamp(28px,2.7vw,38px);line-height:1.2;letter-spacing:.04em}
.qa{margin:6px 0 0;column-count:2;column-gap:56px;column-rule:1px dotted #274a40}
.qa>div{break-inside:avoid;padding:0 0 22px}
.qa dt{display:inline;font:400 19px/1.7 var(--disp);letter-spacing:.03em}
.qa dt::after{content:"";display:inline-block;width:20px;height:2px;margin:0 10px 6px;background:var(--clay)}
.qa dd{display:inline;margin:0;font:400 16px/1.8 var(--sans);color:var(--ink)}

/* ---------- 帶三個數字來 ---------- */
.come{width:var(--wrap);margin:84px auto 0;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);column-gap:72px;padding:34px 0 0;border-top:2px solid #072820}
.come h2{margin:0;font-size:clamp(34px,3.5vw,50px);line-height:1.18;letter-spacing:.04em}
.three{display:flex;flex-wrap:wrap;gap:18px 0;margin:30px 0 0}
.three>div{padding:0 30px 0 0;margin-right:30px;border-right:2px solid #072820}
.three>div:last-child{border-right:0}
.three dt{font:400 16px/1.4 var(--disp);letter-spacing:.1em;color:var(--ink2)}
.three dd{margin:4px 0 0;font:600 17px/1.2 var(--sans)}
.three .v{font:800 clamp(28px,2.7vw,42px)/1.1 var(--num);letter-spacing:-.01em;margin-right:4px;white-space:nowrap}
.three small{display:block;margin-top:6px;font:600 15px/1.3 var(--num);color:var(--clay-d)}
.acts{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;margin-top:26px}
.acts .ok{font:600 15px/1.4 var(--sans);color:var(--clay-d)}
html:not(.js) .acts button{display:none}
.where{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;margin:6px 0 0;padding-left:28px;border-left:2px solid #072820}
.where dt{font:400 15px/1.4 var(--disp);letter-spacing:.08em;color:var(--ink2)}
.where dd{margin:4px 0 0;font:500 16px/1.65 var(--sans)}
.where .n{font-size:18px;font-weight:700}
.foot{width:var(--wrap);margin:64px auto 0;padding:20px 0 32px;border-top:2px solid #072820;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 30px;font:400 14px/1.6 var(--sans);color:var(--ink2)}
.foot .fb{font:400 17px/1.6 var(--disp);letter-spacing:.08em;color:var(--ink)}
.foot p{margin:0}

/* ---------- 404 ---------- */
.nf{position:relative;overflow:hidden;min-height:640px;border-top:2px solid #072820}
.nf .say{padding:72px 0 96px}
.nf h1{font-size:clamp(40px,5vw,68px)}
.nf p{margin:16px 0 0;max-width:30em;font-size:17px;color:var(--ink2)}
.nf .tbl{width:900px;height:900px;right:-200px;bottom:-520px}
.nf a.back{display:inline-flex;align-items:center;min-height:48px;margin-top:36px;padding:0 24px;border:2px solid #072820;border-radius:24px;font:700 16px/1 var(--sans);text-decoration:none;background:var(--bg)}
.nf a.back:hover{background:var(--ink);color:var(--hi)}

/* ---------- 平板 ---------- */
@media (max-width:1099px){
  :root{--gut:120px}
  .top{gap:12px 24px}
  .top ul{gap:2px 16px}
  .top nav a{font-size:14px}
  .tel{font-size:16px}
  .hero{display:block;min-height:0}
  .say{padding-bottom:10px}
  .dome{position:relative;inset:auto;height:430px;overflow-x:clip}
  .tbl{width:1160px;height:1160px;right:auto;left:58%;translate:-50% 0;bottom:-680px}
  .count{right:auto;left:58%;translate:-50% 0;bottom:16px}
  .cn{font-size:130px}
  .rule .tl.mo,.srule .mo{display:none}
  .key{justify-content:flex-start}
  .money{grid-template-columns:minmax(0,1fr)}
  .hall{margin-top:30px}
  .ph{grid-template-columns:minmax(0,1fr)}
  .plans>.pay,.plans>.once{grid-column:1/-1}
  .plans>.once{margin-top:10px}
  .whom{grid-template-columns:minmax(0,1fr)}
  .whom>.tables{grid-row:auto}
  .whom>h2,.reg{grid-column:1;grid-row:auto}
  .reg{margin-top:18px}
  .faq{grid-template-columns:minmax(0,1fr)}
  .qa{margin-top:20px}
  .come{grid-template-columns:minmax(0,1fr)}
  .where{grid-template-columns:repeat(2,minmax(0,1fr));padding-left:0;border-left:0;margin-top:36px}
  .call{width:150px;padding:8px}
  .call .cnote{display:none}
  .tables{grid-template-columns:minmax(0,1fr)}
  .grp{display:grid;grid-template-columns:200px minmax(0,1fr);column-gap:28px;align-items:center;margin:0 0 20px!important}

}

  .db{position:static;order:var(--o);width:auto;height:auto;min-height:0;display:grid;grid-template-columns:3.2em 3.8em minmax(0,1fr);align-items:baseline;column-gap:8px;padding:2px 12px;border-radius:16px}

  .where{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px 18px;margin-top:28px}

}

/* ---------- 降級動效：直接換位置、沒有位移動畫 ---------- */
html.js .tk,html.js .gh{transition:--x0 .6s var(--ease),--x1 .6s var(--ease),--r .3s var(--ease),--mr .3s var(--ease)}
html.js .chart{transition:--x .6s var(--ease),--xw .6s var(--ease)}
html.js .stair{transition:--x .6s var(--ease)}
html.js .bins i{transition:--n .32s steps(4,end)}
html.js .seg.anim{transition:--w .18s var(--ease)}
@media (prefers-reduced-motion:reduce){
  html.js .tk,html.js .gh,html.js .chart,html.js .stair,html.js .bins i,html.js .seg.anim{transition:none}
}
