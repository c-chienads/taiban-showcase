.die-title span{ font-size: 13.5px; font-weight: 600; }

.steps{ counter-reset: step; margin: 0; }
.step{ counter-increment: step; display: grid; grid-template-columns: 112px 118px minmax(0, 1fr); column-gap: 22px; align-items: last baseline; padding: 22px 0 24px; position: relative; }
.step + .step{ box-shadow: inset 0 1.5px 0 var(--hair); }
.step::before{ content: counter(step); font-family: var(--sans); font-size: 150px; font-weight: 900; line-height: .74; letter-spacing: -.05em; color: var(--ink-2); text-align: center; }
.step-art{ align-self: center; transform: rotate(var(--r)); }
.cutout{ width: 118px; height: 118px; display: block; }
.cp-bg{ fill: var(--paper); } .cp-i{ fill: var(--ink); } .cp-a{ fill: var(--amber); } .cp-t{ fill: var(--bag-2); } .cp-p{ fill: var(--paper); }
.cp-cut{ fill: none; stroke: var(--paper); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.cp-tx{ font-size: 16px; font-weight: 900; fill: var(--ink); text-anchor: middle; dominant-baseline: central; }
.cp-tx-p{ font-family: var(--mono); font-size: 13px; font-weight: 700; fill: var(--paper); text-anchor: middle; dominant-baseline: central; }
.step-text h3{ font-size: clamp(21px, 1.8vw, 25px); font-weight: 800; line-height: 1.35; margin: 0 0 6px; display: flex; align-items: center; gap: 12px; }
.verb{ flex: none; display: grid; place-items: center; width: 1.65em; height: 1.65em; border: 2.5px solid var(--ink-2); background: var(--paper); font-weight: 900; color: var(--ink); font-size: 1.02em; }
.step-meta{ display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; margin: 0; font-size: 14px; }
.dur{ font-weight: 700; white-space: nowrap; }
.dur b{ font-family: var(--mono); font-size: 20px; margin: 0 3px; color: var(--ink-2); }
.clock{ font-size: 13.5px; }
.clock .mono{ margin-left: 2px; }
.desc{ font-size: 17px; line-height: 1.8; margin: 6px 0 0; max-width: 31em; }

.db-h{ font-size: 19px; font-weight: 900; margin: 0 0 10px; padding-bottom: 12px; position: relative; display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.db-h small{ font-size: 12.5px; font-weight: 600; }
.tips{ margin: 0 0 30px; }
.tips li{ display: grid; grid-template-columns: 28px 1fr; column-gap: 10px; font-size: 15px; line-height: 1.75; padding: 9px 0; }
.tips li + li{ box-shadow: inset 0 1px 0 var(--hair); }
.tn{ width: 24px; height: 24px; margin-top: 2px; display: grid; place-items: center; font-family: var(--mono); font-weight: 700; font-size: 14px; color: var(--paper); background: var(--ink-2); }
.diff{ margin: 0 0 26px; display: grid; }
.diff div{ display: grid; grid-template-columns: 4.4em 1fr; gap: 10px; padding: 7px 0; font-size: 14.5px; line-height: 1.6; }
.diff div + div{ box-shadow: inset 0 1px 0 var(--hair); }
.diff dt{ font-weight: 800; }
.diff dd{ margin: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.dd-am::before, .dd-pm::before{ content: ""; display: inline-block; width: 10px; height: 10px; margin-right: 6px; vertical-align: 0; }
.dd-am::before{ background: var(--amber); } .dd-pm::before{ background: var(--ink-2); }
.actual{ margin: 0 0 26px; }
.act-pair{ display: grid; grid-template-columns: 1fr 1fr; gap: 14px 18px; margin: 4px 0 10px; }
.act{ margin: 0; display: grid; justify-items: start; gap: 8px; }
.act-disc{ width: 20mm; height: 20mm; max-width: none; display: block; overflow: visible; }
.ad-ring{ fill: var(--paper); stroke: var(--ink-2); stroke-width: .22; stroke-dasharray: .7 .55; }
.ad-am{ fill: var(--amber); }
.ad-cr{ fill: var(--cream); stroke: var(--ink-2); stroke-width: .25; stroke-linejoin: round; }
.ad-rg{ fill: none; stroke: var(--ink-2); stroke-width: .22; stroke-linecap: round; opacity: .55; }
.ad-hi{ fill: var(--paper); opacity: .78; }
.act-t{ font-size: 14px; line-height: 1.55; display: block; }
.act-t b{ display: block; font-size: 15px; font-weight: 800; }
.act-note{ margin: 0; font-size: 14px; line-height: 1.7; }
.return{ margin: 0; font-size: 14.5px; line-height: 1.75; padding: 12px 14px; background: var(--paper); box-shadow: inset 0 0 0 1.5px var(--ink-2); }

/* 招牌時刻：字重軸 100→900（捲動驅動） */
@keyframes dose-fill{ from{ font-weight: 100; } to{ font-weight: 900; } }
@supports (animation-timeline: view()){
  .step{ view-timeline: --dose block; }
  .step::before{ animation: dose-fill linear both; animation-timeline: --dose; animation-range: entry 10% cover 55%; }
}

/* ---- 七日帖子格 ---- */
.week-scroll{ margin-top: 4px; }
.blister{ width: 100%; table-layout: fixed; border-collapse: separate; border-spacing: 0; }
.blister thead th{ font-size: 22px; font-weight: 900; text-align: left; padding: 0 12px 10px; }
.blister .wk{ font-size: 13px; font-weight: 600; margin-right: 2px; }
.blister thead th:first-child{ width: 120px; }
.blister tbody th{ text-align: left; font-size: 19px; font-weight: 900; vertical-align: middle; line-height: 1.3; padding-right: 10px; }
.blister tbody th small{ display: block; font-size: 13px; font-weight: 600; }
.blister td{ padding: 8px 0; border-left: 2px dashed var(--hair); vertical-align: top; }
.blister tr.pm td{ border-top: 2px dashed var(--hair); }
.pk{ display: grid; align-content: start; margin: 0 10px; min-height: 140px; padding: 22px 12px 18px; background: var(--paper); border: var(--rule) solid var(--ink-2); position: relative;
  clip-path: polygon(0 0, calc(100% - 18px) 0, calc(100% - 12px) 7px, calc(100% - 6px) 0, 100% 0, 100% 100%, 0 100%); }
.pk::before, .pk::after{ content: ""; position: absolute; left: 0; right: 0; height: 7px; background: repeating-linear-gradient(90deg, var(--hair) 0 1px, transparent 1px 4px); }
.pk::before{ top: 0; height: 12px; background: repeating-linear-gradient(90deg, var(--band) 0 2px, transparent 2px 4.5px) 0 5px / 100% 7px no-repeat, linear-gradient(var(--band), var(--band)) 0 0 / 100% 5px no-repeat; }
.pk::after{ bottom: 0; }
.am .pk{ --band: var(--amber); }
.pm .pk{ --band: var(--ink-2); background: var(--bag); }
.pk-n{ font-family: var(--mono); font-size: 26px; font-weight: 700; line-height: 1; color: var(--ink-2); letter-spacing: -.02em; }
.pk-d{ font-size: 13px; font-weight: 700; margin-top: 6px; }
.pk-p{ font-family: var(--mono); font-size: 12px; margin-top: 2px; }
.pk-c{ font-size: 12.5px; line-height: 1.5; margin-top: 8px; padding-top: 6px; border-top: 1px dotted var(--ink-2); font-weight: 500; }
.pk.now{ outline: 3px solid var(--amber); outline-offset: 5px; clip-path: none; }
.now-tag{ position: absolute; right: -6px; top: -16px; background: var(--amber); color: var(--deep); font-size: 12px; font-weight: 800; padding: 1px 6px; z-index: 1; }

/* ---- 成分：中藥行百子櫃 ---- */
.cabinet{ display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 9px; padding: 14px; background: var(--ink); margin: 0; }
.drawer{ background: var(--ink-2); padding: 10px 10px 30px; display: grid; position: relative; }
.drawer::after{ content: ""; position: absolute; left: 50%; bottom: 11px; width: 34px; height: 8px; margin-left: -17px; background: var(--amber); border-radius: 4px; }
.drawer::before{ content: ""; position: absolute; left: 50%; bottom: 14px; width: 54px; margin-left: -27px; border-top: 1.5px solid var(--deep); }
.d-card{ background: var(--paper); padding: 10px 11px 11px; display: flex; flex-direction: column; gap: 3px; box-shadow: inset 0 0 0 1px var(--hair); }
.d-zh{ font-size: 18px; font-weight: 900; line-height: 1.3; }
.d-inci{ font-family: var(--mono); font-size: 12px; line-height: 1.45; overflow-wrap: anywhere; }
.d-use{ font-size: 13px; font-weight: 600; }
.d-mk{ display: flex; gap: 6px; margin-top: auto; padding-top: 6px; }
.m{ font-size: 12.5px; font-weight: 800; line-height: 1; padding: 4px 5px; border: 1.5px solid var(--ink-2); color: var(--ink); background: var(--paper); }
.m.am.on{ background: var(--amber); border-color: var(--amber); color: var(--deep); }
.m.pm.on{ background: var(--ink-2); color: var(--paper); }
.m.off{ border-style: dashed; text-decoration: line-through; text-decoration-thickness: 1.5px; }
.d-none .d-card{ background: var(--cream); }
.d-none .d-zh{ letter-spacing: .3em; }
.ing-notes{ display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px; margin-top: 26px; padding-top: 14px; border-top: 2px solid var(--ink-2); }
.micro{ font-size: 13.5px; line-height: 1.8; }
.micro h3{ font-size: 14.5px; font-weight: 900; margin: 18px 0 2px; text-indent: -.64em; line-height: 1.5; }
.micro h3:first-child{ margin-top: 0; }
.micro p{ margin: 0; }

/* ---- 注意事項：粗外框（描邊一次） ---- */
@property --draw{ syntax: "<number>"; inherits: false; initial-value: 1; }
.cbox{ --bw: 5px; --draw: 1; position: relative; padding: 30px clamp(18px, 3vw, 44px) 34px;
  background:
    linear-gradient(var(--ink), var(--ink)) left top / calc(clamp(0, var(--draw) * 4, 1) * 100%) var(--bw) no-repeat,
    linear-gradient(var(--ink), var(--ink)) right top / var(--bw) calc(clamp(0, var(--draw) * 4 - 1, 1) * 100%) no-repeat,
    linear-gradient(var(--ink), var(--ink)) right bottom / calc(clamp(0, var(--draw) * 4 - 2, 1) * 100%) var(--bw) no-repeat,
    linear-gradient(var(--ink), var(--ink)) left bottom / var(--bw) calc(clamp(0, var(--draw) * 4 - 3, 1) * 100%) no-repeat,
    var(--paper);
  transition: --draw 1.5s linear; }
.cbox::before{ content: ""; position: absolute; inset: 10px; border: 1px solid var(--ink-2); pointer-events: none; }
.chead{ display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; background: var(--amber); color: var(--deep); margin: 0 0 22px; padding: 10px 16px; position: relative; }
.chead .tri{ width: 30px; height: 27px; color: var(--deep); flex: none; }
.chead h2{ font-size: clamp(24px, 2.4vw, 32px); font-weight: 900; line-height: 1.2; margin: 0; letter-spacing: .04em; }
.chead p{ margin: 0; font-size: 15px; font-weight: 700; }
.clist{ columns: 2; column-gap: 56px; column-rule: 1px dotted var(--ink-2); font-size: 16px; line-height: 1.8; position: relative; }
.clist li{ break-inside: avoid; padding-left: 2.2em; text-indent: -2.2em; margin-bottom: 10px; }
.cn{ font-weight: 900; display: inline-block; width: 2.2em; text-indent: 0; }
.clist li:last-child{ font-weight: 700; }
.sticker{ position: absolute; right: clamp(14px, 3vw, 46px); top: -34px; width: 92px; height: 92px; border-radius: 50%; background: var(--amber); color: var(--deep); display: grid; place-content: center; text-align: center; line-height: 1.1; margin: 0; transform: rotate(var(--r)); box-shadow: inset 0 0 0 4px var(--amber), inset 0 0 0 6px var(--deep); }
.sticker b{ font-size: 26px; font-weight: 900; letter-spacing: .12em; padding-left: .12em; }
.sticker span{ font-size: 12px; font-weight: 800; letter-spacing: .1em; margin-top: 3px; }

/* ---- 適用／先停一帖 ---- */
.split{ display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); position: relative; border-top: 2px solid var(--ink-2); }
.split::after{ content: ""; position: absolute; top: 22px; bottom: 6px; left: calc(7 / 12 * 100%); border-left: 2px dashed var(--ink-2); }
.split > div{ padding: 22px 0 6px; }
.split .yes{ padding-right: clamp(20px, 4vw, 64px); }
.split .no{ padding-left: clamp(20px, 4vw, 64px); }
.split h3{ font-size: 21px; font-weight: 900; margin: 0 0 14px; display: flex; align-items: center; gap: 12px; }
.mk-o, .mk-x{ width: 26px; height: 26px; flex: none; position: relative; }
.mk-o::before{ content: ""; position: absolute; inset: 1px; border: 3.5px solid var(--ink-2); border-radius: 50%; }
.mk-x::before, .mk-x::after{ content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 3.5px; margin-left: -1.75px; background: var(--ink); transform: rotate(45deg); }
.mk-x::after{ transform: rotate(-45deg); }
.split li{ padding: 9px 0 9px 1.6em; border-bottom: 1px solid var(--hair); position: relative; font-size: 16px; line-height: 1.7; }
.yes li::before{ content: ""; position: absolute; left: 2px; top: 1.05em; width: 9px; height: 9px; border: 2px solid var(--ink-2); border-radius: 50%; }
.no li::before, .no li::after{ content: ""; position: absolute; left: 6px; top: 1.05em; width: 2px; height: 12px; background: var(--ink); transform: rotate(45deg); margin-top: -2px; }
.no li::after{ transform: rotate(-45deg); }

/* ---- 保存・客服 ---- */
.care-grid{ display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 3fr) minmax(0, 6fr); gap: 40px; align-items: start; border-top: 2px solid var(--ink-2); padding-top: 18px; }
.bulk{ border: 2.5px solid var(--ink-2); padding: 18px clamp(16px, 2vw, 28px) 22px; background: var(--bag); }
.bulk h3{ font-size: 21px; font-weight: 900; margin: 0 0 4px; }
.bulk-lead{ font-size: 14px; margin: 0 0 14px; }
.f-grid{ display: grid; grid-template-columns: 1fr 1fr; gap: 6px 22px; }
.fld{ display: grid; align-content: start; min-width: 0; }
.fld-wide{ grid-column: 1 / -1; }
.fld label{ font-size: 13px; font-weight: 800; letter-spacing: .06em; }
.fld label small{ font-weight: 500; letter-spacing: 0; font-size: 12.5px; }
.fld input, .fld select, .fld textarea{ width: 100%; min-width: 0; border: 0; border-bottom: 2px solid var(--ink-2); background: var(--paper); padding: 8px 10px; font-size: 16px; color: var(--ink); border-radius: 0; min-height: 44px; }
.fld textarea{ resize: vertical; line-height: 1.6; }
.fld input:focus-visible, .fld select:focus-visible, .fld textarea:focus-visible{ outline-offset: 2px; }
.fld input[aria-invalid="true"]{ border-bottom-color: var(--deep); background: var(--cream); }
.hint{ font-size: 12.5px; margin: 4px 0 0; }
.err{ font-size: 13px; font-weight: 700; color: var(--deep); margin: 4px 0 0; min-height: 1.4em; }
.err:not(:empty)::before{ content: ""; display: inline-block; width: 4px; height: 1em; background: var(--amber); margin-right: 7px; vertical-align: -2px; }
.f-act{ display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; margin: 12px 0 0; }
.bulk button{ font-size: 16px; font-weight: 900; letter-spacing: .2em; padding: 10px 18px 10px 22px; background: var(--ink-2); color: var(--paper); border: 0; box-shadow: 4px 4px 0 var(--amber); min-height: 44px; }
.bulk button:hover{ background: var(--ink); }
.bulk button:active{ transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--amber); }
.f-done{ font-size: 14px; font-weight: 700; flex: 1 1 16em; }

/* ============ 藥袋背面 ============ */
.bag-back{ background: var(--ink); color: var(--paper); padding: 56px var(--gut) 34px; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: 24px; row-gap: 26px; }
.bb-mark{ grid-column: 1 / span 4; display: flex; align-items: center; gap: 16px; }
.mark.big{ width: 64px; height: 64px; color: var(--paper); }
.mark.big .mk-b{ fill: var(--ink); } .mark.big .mk-f{ fill: var(--ink-2); }
.bb-name{ font-size: 30px; font-weight: 900; letter-spacing: .06em; margin: 0; line-height: 1.1; }
.bb-name small{ font-size: 15px; font-weight: 600; margin-left: .5em; }
.bb-say{ grid-column: 5 / span 5; font-size: 16px; margin: 0; }
.bb-info{ grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px 40px; margin: 0; padding-top: 18px; border-top: 1px dashed oklch(0.993 0.004 355 / .5); font-size: 14px; }
.bb-info div{ display: flex; gap: 10px; }
.bb-info dt{ font-weight: 800; } .bb-info dd{ margin: 0; }
.bb-end{ grid-column: 1 / -1; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px 24px; margin: 0; font-size: 13.5px; }
.bag-back a{ color: var(--paper); font-weight: 700; }
.bag-back :focus-visible{ outline-color: var(--amber); }

/* ============ 404 ============ */
.nf-front{ grid-template-areas: "name name name name name name name empty empty empty empty empty" "how how how how how how how empty empty empty empty empty" "rx rx rx rx back back back back back back back back"; margin-bottom: 64px; }
.c-empty{ grid-area: empty; display: grid; place-items: center; align-content: center; gap: 10px; }
.c-back{ grid-area: back; }
.empty{ width: 168px; height: auto; color: var(--ink-2); }
.empty .es-b{ fill: var(--paper); }
.empty-cap{ font-size: 13px; font-weight: 700; margin: 0; }
.back{ font-size: 22px; font-weight: 900; margin: 12px 0 0; }
.back2{ font-size: 15px; margin: 4px 0 0; }
.nf-lot{ margin-top: 14px; }
.nf .lead{ margin-top: 14px; }
.nf-foot{ padding-top: 22px; }

/* ============ 響應式 ============ */
@media (max-width: 1099px){
  .front{ grid-template-columns: repeat(6, minmax(0, 1fr));
    grid-template-areas: "name name name name name name" "dial dial dial how how how" "dial dial dial qty qty to" "use use use use look look" "rx rx rx rx rx rx"; }
  .c-to .to{ font-size: 21px; }
  .toc ol{ gap: 2px 16px; }
  .sec-row .sec-h{ grid-column: 1 / -1; }
  .sec-row .sec-lead{ grid-column: 1 / -1; margin-top: 8px; }
  .die{ grid-template-columns: 30px minmax(0, 1fr) 48px; }
  .die-top{ grid-column: 2 / 4; }
  .die-back{ grid-column: 2 / 4; grid-row: 4; border-left: 0; box-shadow: inset -2px 0 0 var(--ink), inset 2px 0 0 var(--ink); border-top: 1.5px dashed var(--ink-2); display: grid; grid-template-columns: 1fr 1fr; column-gap: 32px; }
  .die-back .tips{ grid-row: 2 / span 3; }
  .die-back .db-h:first-child{ grid-column: 1; } .die-back .db-h:nth-of-type(2){ grid-column: 2; grid-row: 1; }
  .die-back .diff{ grid-column: 2; grid-row: 2; } .die-back .actual{ grid-column: 2; grid-row: 3; margin-bottom: 22px; } .die-back .return{ grid-column: 2; grid-row: 4; align-self: start; }
  .die-gusset{ box-shadow: inset -2px 0 0 var(--ink); }
  .die-bot{ grid-column: 2 / 4; grid-row: 5; grid-template-columns: 1fr; }
  .die-bot span:nth-child(n+2){ display: none; }
  .cabinet{ grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .ing-notes{ grid-template-columns: 1fr 1fr; }
  .care-grid{ grid-template-columns: 1fr 1fr; }
  .bulk{ grid-column: 1 / -1; }
  .bb-mark{ grid-column: 1 / -1; } .bb-say{ grid-column: 1 / -1; }
  .nf-front{ grid-template-areas: "name name name name empty empty" "how how how how empty empty" "rx rx back back back back"; }
}
/* ≤899px：七日帖子格由「橫排七天」轉成「一天一列、早晚並排」——七天全部看得到，不靠左右滑 */
@media (max-width: 899px){
  .blister{ display: grid; grid-template-columns: 56px minmax(0, 1fr) minmax(0, 1fr); width: 100%; max-width: 640px; table-layout: auto; }
  .blister thead, .blister tbody, .blister tr{ display: contents; }
  .blister thead th:first-child{ grid-column: 1; grid-row: 1; padding: 0; }
  .blister tbody th{ grid-row: 1; padding: 0 0 10px 8px; align-self: end; font-size: 19px; }
  .blister tr.am th{ grid-column: 2; } .blister tr.pm th{ grid-column: 3; }
  .blister thead th:not(:first-child){ grid-column: 1; grid-row: calc(var(--d) + 2); padding: 26px 0 0; font-size: 24px; white-space: nowrap; border-bottom: 2px dashed var(--hair); }
  .blister td{ display: flex; padding: 10px 8px; border: 0; border-bottom: 2px dashed var(--hair); grid-row: calc(var(--d) + 2); }
  .blister tr.am td{ grid-column: 2; }
  .blister tr.pm td{ grid-column: 3; border-top: 0; border-left: 2px dashed var(--hair); }
  .blister thead th:nth-child(8), .blister td[style*="--d:6"]{ border-bottom: 0; }
  .pk{ flex: 1; min-width: 0; margin: 0; min-height: 0; padding: 22px 12px 16px; }
  .pk.now{ outline-offset: 3px; }
}
@media (max-width: 719px){
  body{ font-size: 16px; }
  .strip{ grid-template-columns: 1fr auto; gap: 6px 12px; }
  .toc{ grid-column: 1 / -1; grid-row: 2; overflow-x: auto; margin: -2px calc(var(--gut) * -1); padding: 2px var(--gut); scrollbar-width: thin; }
  .toc ol{ flex-wrap: nowrap; justify-content: space-between; gap: 0 12px; min-width: max-content; }
  .toc a{ font-size: 14px; min-height: 44px; margin-block: -2px; align-items: center; gap: 4px; }
  .toc .lg{ display: none; }
  .strip-tel{ font-size: 12.5px; }
  .front{ grid-template-columns: 1fr 1fr; grid-template-areas: "name name" "dial dial" "how how" "qty to" "use use" "look look" "rx rx"; }
  .c-name h1{ font-size: min(21vw, 92px); margin-top: 14px; }
  .name-foot{ grid-template-columns: 1fr; gap: 10px; }
  .lead{ font-size: 16px; }
  .dose{ gap: 10px 22px; }
  .dose li{ font-size: 19px; }
  .ext{ padding: 10px 14px; font-size: 14px; }
  .ext-b{ margin-left: 0; }
  .tear-l{ font-size: 12px; }
  .ifu-head{ grid-template-columns: 1fr auto; row-gap: 10px; }
  .ifu-title{ grid-column: 1 / -1; }
  .ifu-keep{ grid-column: 1; } .ifu-fold{ grid-column: 2; }
  .die{ grid-template-columns: minmax(0, 1fr); margin: 0 calc(var(--gut) * -1 + 6px); }
  .die-top, .die-front, .die-back, .die-bot{ grid-column: 1; }
  .die-glue{ display: none; }
  .die-top{ padding: 30px 12px 8px; }
  .die-front{ border-left: 0; box-shadow: inset 2px 0 0 var(--ink), inset -2px 0 0 var(--ink); padding: 18px 14px 10px; }
  .die-gusset{ grid-column: 1; grid-row: 3; border-left: 0; border-top: 1.5px dashed var(--ink-2); padding: 8px 14px; box-shadow: inset 2px 0 0 var(--ink), inset -2px 0 0 var(--ink); justify-content: flex-start; }
  .die-gusset span{ writing-mode: horizontal-tb; letter-spacing: .2em; font-size: 12.5px; }
  .die-back{ grid-row: 4; display: block; padding: 18px 14px 20px; box-shadow: inset 2px 0 0 var(--ink), inset -2px 0 0 var(--ink); }
  .die-bot{ grid-row: 5; }
  .die-legend{ margin-left: 0; }
  .die-title b{ font-size: 22px; }
  .step{ grid-template-columns: 70px minmax(0, 1fr); grid-template-areas: "num art" "text text"; column-gap: 12px; align-items: end; padding: 18px 0 20px; }
  .step::before{ grid-area: num; font-size: 100px; text-align: left; }
  .step-art{ grid-area: art; justify-self: start; }
  .cutout{ width: 88px; height: 88px; }
  .step-text{ grid-area: text; margin-top: 10px; }
  .desc{ font-size: 16.5px; }
  .cabinet{ grid-template-columns: 1fr 1fr; gap: 7px; padding: 10px; margin: 0 calc(var(--gut) * -1 + 6px); }
  .drawer{ padding: 8px 8px 28px; }
  .d-zh{ font-size: 17px; }
  .ing-notes{ grid-template-columns: 1fr; gap: 14px; }
  .clist{ columns: 1; }
  .sticker{ width: 76px; height: 76px; top: -40px; }
  .sticker b{ font-size: 22px; }
  .chead{ padding-right: 74px; }
  .split{ grid-template-columns: 1fr; }
  .split::after{ display: none; }
  .split .yes{ padding-right: 0; }
  .split .no{ padding-left: 0; position: relative; margin-top: 14px; }
  .split .no::before{ content: ""; position: absolute; left: 0; right: 0; top: 0; border-top: 2px dashed var(--ink-2); }
  .care-grid{ grid-template-columns: 1fr; gap: 26px; }
  .f-grid{ grid-template-columns: 1fr; }
  .bag-back{ grid-template-columns: 1fr; padding-top: 40px; }
  .bb-info{ flex-direction: column; gap: 6px; }
  .nf-front{ grid-template-areas: "name name" "empty empty" "how how" "rx rx" "back back"; }
}
/* ≤600px：說明書摺痕在窄螢幕上會密到每 100px 一道，改成不畫 */
@media (max-width: 600px){
  .insert{ background-image: none; }
}

/* ============ 降級動效 ============ */
html.js .dial .hand{ transition: transform 1.6s cubic-bezier(.22, .8, .24, 1); }
html.js .dial:not([data-go]) .hand{ transform: rotate(0deg); }
html.js .cbox[data-frame]:not(.drawn){ --draw: 0; }
@media (prefers-reduced-motion: reduce){
  .step::before{ animation: none !important; font-weight: 900; }
  html.js .dial .hand{ transition: none; }
  html.js .dial:not([data-go]) .hand{ transform: rotate(var(--deg)); }
  .cbox{ transition: none; }
  html.js .cbox[data-frame]:not(.drawn){ --draw: 1; }
  html{ scroll-behavior: auto; }
}

/* ============ 列印：單色黑、去底色、去動效 ============ */
@media print{
  *, *::before, *::after{ color: #000 !important; box-shadow: none !important; text-shadow: none !important; }
  *{ background-color: transparent !important; }
  html, body{ background: #fff !important; }
  .insert, .cbox, .pk::before, .die-glue{ background-image: none !important; }
  .dose .on .box{ background: #000 !important; }
  .front::before{ border-color: #000; }
  .cell{ box-shadow: inset -1px -1px 0 #000 !important; }
  .tear-top, .tear, .toc, .dial .hand, .dial-now, .f-act, .sticker, .now-tag, .die-legend{ display: none !important; }
  .tag, .ext, .chead{ outline: 1.5px solid #000; }
  .cbox{ border: 4px solid #000; }
  .step::before{ animation: none !important; font-weight: 900; }
  .week-scroll{ overflow: visible !important; margin: 0 !important; }
  .blister{ width: 100% !important; }
  .blister th{ position: static !important; }
  .drawer{ outline: 1px solid #000; }
  a{ text-decoration: underline; }
  .ifu-sec, .cbox, .step, .bulk, .front, .drawer{ break-inside: avoid; }
}

}
