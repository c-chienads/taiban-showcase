#main:is([data-filter="poster"],:not([data-filter]):has(#cat-poster:checked)) .work:not(.vacant):not([data-cat="poster"]){display:none}
#main:is([data-filter="poster"],:not([data-filter]):has(#cat-poster:checked)) .tally [data-c="poster"]{display:inline}

#main:is([data-filter="pack"],:not([data-filter]):has(#cat-pack:checked)) .tally [data-c="pack"]{display:inline}

/* 校樣備註：印刷廠看樣時邊角寫的小字。線規放大鏡只在有游標又有 JS 時存在，備註也只在那時出現 */
.pnote{display:flex;flex-wrap:wrap;gap:2px 28px;margin:-8px var(--g) clamp(28px,3.4vw,48px);color:var(--mute);max-inline-size:60em}

@media (pointer:fine){html.js .pnote .ln-lens{display:inline-flex;align-items:baseline;gap:.5em}}
.pnote svg{inline-size:12px;block-size:12px;flex:none;align-self:center}

/* ---------- 失效距離：檸檬黃整面＋對數尺，作品近大遠小掛上去 ---------- */
.reach{position:relative;background-color:var(--lemon);color:var(--on-lemon);padding:clamp(56px,7vw,104px) var(--g) clamp(44px,5vw,72px)}

.rc-head p{grid-column:7/-1;max-inline-size:34em}
.rc-head .rc-note{color:var(--on-lemon-2);font-size:.9375rem}
.tape{position:relative;margin:0;aspect-ratio:var(--cw) / var(--ch)}

.hung{margin:0;padding:0;list-style:none}
.hung li{position:absolute;inset-inline-start:calc(var(--x) * 100%);inset-block-start:calc(var(--y) * 100%);inline-size:calc(var(--w) * 100%);translate:-50% 0}
.hung .th{display:block;transform:rotate(var(--t));transform-origin:50% 0;box-shadow:0 0 0 1.5px var(--on-lemon)}
.hung .th svg{display:block;inline-size:100%;block-size:auto}
.hung .lb{position:absolute;inset-block-start:calc(100% + 12px);inset-inline-start:50%;translate:-50% 0;display:grid;justify-items:center;line-height:1.25;white-space:nowrap}
.hung .lb b{font-weight:400;font-family:var(--f-mono);font-size:1.0625rem;font-variant-numeric:tabular-nums}
.hung .lb span{font-size:.8125rem;color:var(--on-lemon-2)}
.hung .lb .nt{display:none}
.rc-end{margin-top:clamp(8px,1.4vw,20px);text-align:end;color:var(--on-lemon-2);font-size:.9375rem}

/* ---------- 合作：四顆由粗到細的網點放大鏡，斜斜往下走 ---------- */
.walk{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:24px;row-gap:14px;padding:clamp(72px,9vw,128px) var(--g) clamp(64px,8vw,112px)}

.steps{grid-column:1/-1;display:grid;grid-template-columns:1.3fr 1.15fr 1fr .92fr;column-gap:clamp(20px,3vw,52px);align-items:start;margin:clamp(40px,5vw,72px) 0 0;padding:0;list-style:none}

.steps p{color:var(--mist);font-size:1rem;line-height:1.75;margin-top:4px;max-inline-size:20em}

/* ---------- 接案狀態：等壓線背景＋巨大的月份 ---------- */
.status{position:relative;isolation:isolate;overflow:hidden;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:24px;row-gap:clamp(44px,6vw,84px);padding:clamp(72px,9vw,124px) var(--g) clamp(64px,8vw,112px);background-color:var(--deep)}
.iso{position:absolute;inset:0;z-index:-1;inline-size:100%;block-size:100%;pointer-events:none}
.st-head{grid-column:1/span 7}
.st-head h2{display:flex;align-items:center;gap:12px;font-family:var(--f-body);font-size:1.125rem;letter-spacing:.16em;color:var(--mist);margin-bottom:18px}

.facts dd{margin:0;color:var(--mist)}
.cal{grid-column:1/-1;margin:0}
.cal figcaption{color:var(--mute);font-size:.875rem;margin-bottom:26px;display:flex;flex-wrap:wrap;gap:4px 22px}
.cal figcaption .lg svg{display:inline-block;inline-size:10px;block-size:14px;vertical-align:-2px;margin-inline-end:6px}
.seasons,.months{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:clamp(6px,1.2vw,20px)}
.seasons{margin-bottom:18px}
.seasons span{border-top:2px dotted var(--line);padding-top:8px;color:var(--mist);font-size:.9375rem;letter-spacing:.2em}

.months li{display:grid;justify-items:start;align-content:start;gap:8px}
.months li svg{inline-size:clamp(18px,2.4vw,34px);block-size:auto}
.months .mo{font-size:1rem;color:var(--paper)}
.months .st{font-size:.8125rem;color:var(--mute);line-height:1.35}
.months li.has .st{color:var(--lemon)}

/* ---------- 頁尾 ---------- */
.foot{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:24px;row-gap:14px;padding:32px var(--g) 40px;border-top:1px solid var(--line);color:var(--mute);background-color:var(--deep)}
.foot .sig{grid-column:1/span 4;display:flex;gap:12px;align-items:center}
.foot .sig svg{inline-size:22px;block-size:22px}
.foot .colo{grid-column:5/span 6;font-size:.875rem;line-height:1.8}
.foot .up{grid-column:11/-1;justify-self:end;align-self:start;padding-block:4px}

::view-transition-old(t01),::view-transition-old(t02),::view-transition-old(t03),::view-transition-old(t04),::view-transition-old(t05),::view-transition-old(t06),::view-transition-old(t07),::view-transition-old(t08),::view-transition-old(t09),::view-transition-old(t10),::view-transition-old(t11),::view-transition-old(t12),::view-transition-old(t13){animation:vt-out .2s ease-out both}

}
