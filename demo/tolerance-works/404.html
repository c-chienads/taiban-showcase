.qty .u{font-size:13px;margin:0 6px 0 4px}
.st{width:40px;height:44px;border:0;background:none;font-size:22px;font-weight:500;line-height:1}
.st:hover{background:var(--con-ll)}
.qty input:focus-visible{outline:var(--focus-ring);outline-offset:2px}
.ro-l{display:flex;flex-wrap:wrap;gap:8px 34px;margin:0}
.ro dd{margin:0;display:flex;align-items:baseline;white-space:nowrap}
.ro .n{font-size:26px;font-weight:600;line-height:1.15}
.ro-p .n{font-size:33px}
.ro .n-m{font-size:24px}
.ro .n-s{font-size:22px;font-weight:400;margin:0 1px}
.ro .u{font-size:13px;margin-left:3px}
.ro .u-l{margin:0 3px 0 0}
.ro-go{display:flex;align-items:center;gap:16px}
.add{min-height:54px;padding:0 26px;background:var(--yel);color:var(--ink);border:2px solid var(--ink);font:600 17px/1 var(--sans);letter-spacing:.06em;transition:background-color .12s,color .12s}
.add:hover{background:var(--ink);color:var(--yel)}
.cnt{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:500;text-decoration:none;white-space:nowrap}
.cnt .n{font-size:20px;font-weight:600}
.cnt-th{display:inline-flex;align-items:center;justify-content:center;width:56px;height:40px;background:var(--gra);overflow:hidden}
.cnt-th .th{max-width:48px;max-height:32px;width:auto;height:auto}
.nojs{margin-top:12px;font-size:13.5px;font-weight:500;max-width:60em}
html.js .nojs{display:none}

/* ---------- 詢價單 ---------- */
.rfq{padding:84px var(--pad) 0;display:grid;grid-template-columns:auto minmax(0,1fr) auto;column-gap:40px;align-items:center}
.rfq>.buyer-d,.rfq>.msg,.rfq>.doc{grid-column:1/-1}
.rfq-h{display:flex;align-items:baseline;gap:16px;padding-right:40px;border-right:2px solid var(--ink)}
.rfq-n{font-size:15px;white-space:nowrap}
.rfq-n .n{font-size:30px;font-weight:600;margin-right:4px}
.rfq-lead{max-width:39em;font-size:15px;line-height:1.65}
.rfq>.buyer-d{margin-top:22px}
.buyer-d summary{display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:0 16px 0 12px;border:2px solid var(--ink);font-weight:600;font-size:15px;cursor:pointer;list-style:none;background:var(--con-l)}
.buyer-d summary::-webkit-details-marker{display:none}
.buyer-d summary::before{content:"+";font-family:var(--num);font-size:22px;line-height:1;width:14px;text-align:center}
.buyer-d[open] summary::before{content:"−"}
.buyer-d summary:hover{background:var(--con-ll)}
.buyer-d summary:focus-visible{outline:var(--focus-ring);outline-offset:3px}
.buyer{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) minmax(0,1.6fr);gap:12px 14px;align-items:end;margin-top:12px}
.by-n{grid-column:1/-1;font-size:13.5px}
.bf{display:grid;gap:4px}
.bf label{font-size:13px;font-weight:500}
.bf input{height:44px;border:2px solid var(--ink);background:var(--con-l);padding:0 10px;font-size:15px;min-width:0;width:100%}
.bf input::placeholder{color:oklch(0.36 0.01 75)}
.bf input:focus-visible{outline:var(--focus-ring);outline-offset:2px;background:var(--con-ll)}
.acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ac{min-height:44px;padding:0 18px;border:2px solid var(--ink);background:var(--ink);color:var(--yel);font:600 15px/1 var(--sans);letter-spacing:.04em}
.ac:hover{background:var(--gra-3)}
.ac-x{background:none;color:var(--ink)}
.ac-x:hover{background:var(--con-l)}
html:not(.js) .acts,html:not(.js) .rm{display:none}
.msg{font-size:14px;font-weight:500;min-height:1.5em;margin:8px 0 6px}
.doc{background:var(--gra);color:var(--line);padding:6px 28px 14px;font:400 13.5px/1.75 var(--mono)}
.doc{display:grid;grid-template-columns:minmax(0,.92fr) minmax(0,2fr);grid-template-rows:auto 1fr;column-gap:30px}
.r-hd{grid-column:1;grid-row:1}
.r-ft{grid-column:1;grid-row:2;border-top:1px dashed var(--gra-3)}
.items,.empty{grid-column:2;grid-row:1/3}
.row{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;padding:16px 0}
.items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:30px;align-content:start;border-left:1px dashed var(--gra-3);padding-left:30px}
.items .row:nth-child(n+3){border-top:1px dashed var(--gra-3)}
.gut{display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:10px;font-family:var(--sans);min-height:34px}
.gt{font-size:12px;color:var(--line-2);line-height:1.4}
.th{display:block;overflow:visible}
.th-p{fill:var(--gra-2);stroke:var(--yel);stroke-width:1.2}
.th-h{fill:var(--gra);stroke:var(--yel);stroke-width:.9}
.rm{min-height:32px;padding:0 10px;border:1px solid var(--line-2);background:none;color:var(--line);font-size:13px}
.rm:hover{border-color:var(--yel);color:var(--yel)}
.rm:focus-visible,.ac:focus-visible,.add:focus-visible,.st:focus-visible{outline:2px dashed var(--yel);outline-offset:3px}
.ac:focus-visible,.add:focus-visible,.st:focus-visible{outline-color:var(--ink)}
.txt{margin:0;font:inherit;white-space:pre-wrap;overflow-wrap:anywhere;word-break:normal}
.txt .k{color:var(--line-2)}
.empty{padding:22px 0 22px 30px;font-family:var(--sans);font-size:14px;border-left:1px dashed var(--gra-3)}

/* ---------- 加工範圍（行程圖｜範圍外） ---------- */
.rng{padding:96px var(--pad) 0}
.rng-hd{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:40px;align-items:end;margin-bottom:22px}
.rng-hd h2{padding-right:40px;border-right:2px solid var(--ink)}
.rng .sec-lead{margin:0;max-width:52em;font-size:15.5px;font-weight:500;line-height:1.7}
.env{margin:0;display:grid;grid-template-columns:minmax(0,62fr) minmax(0,38fr)}
.env-in{position:relative;background:var(--con-ll)}
.env-fig{position:relative}
.env-svg{display:block;width:100%;height:auto}
.eg{fill:none;stroke:oklch(0.72 0.010 80);stroke-width:1}
.ecfg{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-dasharray:8 5}
.eo{fill:none;stroke:var(--ink);stroke-width:3.5}
.ept{fill:var(--yel);stroke:var(--ink);stroke-width:2}
.eph{fill:var(--con-ll);stroke:var(--ink);stroke-width:1.5}
.edm{fill:none;stroke:var(--ink);stroke-width:1.2}
.eah{fill:var(--ink)}
.el{position:absolute;margin:0;font-size:13.5px;line-height:1.35}
.el-x{left:50%;top:calc(560 / 570 * 100%);transform:translate(-50%,-100%);background:var(--con-ll);padding:0 6px}
.el-y{right:4px;top:50%;transform:translateY(-50%);background:var(--con-ll);padding:2px 0;writing-mode:vertical-rl}
.el-t{left:calc(54 / 880 * 100%);top:calc(30 / 570 * 100%);font-family:var(--sans);font-weight:600;font-size:15px}
.el-g{display:block;font-weight:500;font-size:12.5px}
.el-c{left:calc(52 / 880 * 100%);top:calc(var(--y) + 8px);font-family:var(--sans)}
.el-p{left:var(--x);top:var(--y);transform:translateY(calc(-100% - 6px));font-family:var(--sans);font-weight:600;white-space:nowrap}
.env-spec{position:absolute;right:calc(64 / 880 * 100%);top:calc(36 / 570 * 100%);margin:0;display:grid;gap:4px;font-size:13.5px;line-height:1.4;max-width:46%}
.env-spec div{display:grid;grid-template-columns:5.2em minmax(0,1fr);gap:8px}
.env-spec dt{font-weight:600}
.env-spec dd{margin:0}
/* 範圍外：斜線欄（斜線＝範圍外，與公差尺右端同一個記號），高度與行程圖相同，項目平均分布 */
.env-out{position:relative;padding:22px 24px 22px 26px;display:flex;flex-direction:column;gap:10px;background:repeating-linear-gradient(-45deg,var(--con-d) 0 2px,var(--con) 2px 11px);border-left:2px solid currentColor}
.eo-h{align-self:flex-start;background:var(--ink);color:var(--con-ll);font-size:19px;font-weight:600;padding:4px 14px;letter-spacing:.18em}
.eo-l{margin:0;padding:0;flex:1;display:flex;flex-direction:column;justify-content:space-between;gap:8px}
.eo-l li{background:var(--con-ll);padding:7px 12px 8px;display:grid;gap:1px;border-left:2px solid var(--ink)}
.eo-a{font-size:15px;font-weight:600;line-height:1.4}
.eo-t{display:inline-block;margin-right:9px;padding:0 7px;background:var(--ink);color:var(--con-ll);font-size:12px;font-weight:600;letter-spacing:.1em;line-height:1.55;vertical-align:.08em}
.eo-b{font-size:13.5px;line-height:1.45}

/* ---------- 公差等級 ---------- */
.gr{margin-top:96px;padding:72px var(--pad) 64px;background:var(--gra);color:var(--line);display:flex;gap:36px;align-items:flex-start}
.gr-v{writing-mode:vertical-rl;font-size:46px;line-height:1;letter-spacing:.14em;margin:0;padding:0 20px 0 0;border-right:2px solid var(--yel);color:var(--line)}
.gr-main{flex:1 1 auto;min-width:0}
.gr-sub{font-size:26px;font-weight:600;line-height:1.3}
.gr .sec-lead{color:var(--line)}
.ruler{position:relative;height:410px;margin-top:30px}
.refs{position:absolute;inset:0 0 auto 0;height:100px;margin:0;padding:0}
.rf{position:absolute;left:var(--a);top:calc(var(--r, 0) * 38px);height:calc(100px - var(--r, 0) * 38px);width:max(3px,calc(var(--b) - var(--a)))}
.rf:nth-child(2){--r:1}
.rf-bar{position:absolute;left:0;right:0;bottom:4px;height:7px;background:var(--line-2);min-width:3px}
.rf::before{content:"";position:absolute;left:0;top:34px;bottom:11px;border-left:1px solid var(--line-2)}
.rf-t,.rf-v{position:absolute;left:0;white-space:nowrap;font-size:13px;line-height:1.3}
.rf-t{top:0}
.rf:nth-child(2) .rf-t,.rf:nth-child(2) .rf-v{left:8px}
.rf-v{top:17px;color:var(--line-2);font-family:var(--num);font-stretch:87.5%}
.axis{position:absolute;left:0;right:0;top:104px;height:52px;z-index:1}
.ax-svg{position:absolute;inset:0 0 auto 0;width:100%;height:22px}
.ax-svg path{fill:none;stroke:var(--line);stroke-width:1.4;vector-effect:non-scaling-stroke}
.ax-l{position:absolute;left:var(--x);top:27px;transform:translateX(calc(-100% - 5px));font-size:14px;line-height:1;white-space:nowrap}
.ax-l:first-of-type{transform:translateX(5px)}
.ax-u{position:absolute;right:0;top:-22px;font-size:13px;color:var(--line-2);background:var(--gra);padding:0 4px}
.gms{position:absolute;left:0;right:0;top:176px;margin:0;padding:0}
.gm{position:absolute;left:var(--x);top:0;width:min(170px,12.4%);padding:0 0 0 12px;border-left:2px solid var(--line-2);line-height:1.4}
.gm::before{content:"";position:absolute;left:-2px;top:-44px;height:44px;border-left:2px solid var(--line-2)}
.gm.on,.gm.on::before{border-color:var(--yel)}
.gm-c{font-size:30px;font-weight:600;line-height:1}
.gm.on .gm-c{color:var(--yel)}
.gm-v{font-size:22px;margin:2px 0 6px}
.gm-k{font-size:14px;font-weight:600}
.gm-d{font-size:12.5px;color:var(--line-2);margin-top:4px}
.zone{position:absolute;top:176px}
.zone p{font-size:13.5px;line-height:1.5}
.zl{left:0;width:calc(var(--b) - 24px);padding-top:4px}
.zl p{max-width:15em;color:var(--line-2)}
.zr{left:var(--a);right:0;top:0;bottom:0;background:repeating-linear-gradient(-45deg,var(--gra-3) 0 1.5px,transparent 1.5px 10px);border-left:2px solid var(--line-2)}
.zr p{position:absolute;left:14px;right:10px;top:176px;background:var(--gra);padding:6px 8px;font-weight:500}
.gr-note{margin-top:8px;max-width:50em;font-size:15px;color:var(--line)}

/* ---------- 報價與交期：兩條尺寸鏈 ---------- */
.calc{padding:64px var(--pad) 56px;background:var(--yel);color:var(--ink);display:grid;grid-template-columns:minmax(0,280px) minmax(0,1fr);column-gap:56px;align-items:start}
.calc-n{padding-top:4px}
.calc .sec-lead{margin:14px 0 0;font-size:15px;font-weight:500}
.chain{display:flex;align-items:flex-start;gap:0;margin-top:30px}
.ch-p{display:block;margin-top:0}
.ch-m{position:relative;flex:1 1 auto;min-width:0}
/* 總尺寸：線＋兩端箭頭，數字在線上方；兩端延伸線往下接到條 */
.ch-all{position:relative;display:flex;justify-content:center;align-items:flex-end;gap:12px;height:72px;margin:0;border-bottom:1.5px solid currentColor}
.ch-all::before,.ch-all::after{content:"";position:absolute;bottom:-5.75px;width:15px;height:10px;background:currentColor}
.ch-all::before{left:0;clip-path:polygon(0 50%,100% 0,100% 100%)}
.ch-all::after{right:0;clip-path:polygon(100% 50%,0 0,0 100%)}
.ch-m::before,.ch-m::after{content:"";position:absolute;top:56px;height:64px;border-left:1px solid currentColor}
.ch-m::before{left:0}.ch-m::after{right:0}
.ch-k{font-size:14px;font-weight:600;padding-bottom:9px}
.ch-v{display:flex;align-items:baseline;gap:6px;line-height:1;padding-bottom:5px}
.ch-v b{font-family:var(--num);font-stretch:87.5%;font-size:66px;font-weight:600}
.ch-v small{font-size:15px;font-weight:500}
.ch-v .dev{font-size:17px;vertical-align:baseline;align-self:center;margin-left:2px}
/* 鏈式尺寸＋比例條 */
.ch-row{display:flex;gap:2px}
.sg{position:relative;flex:var(--v) 1 0;min-width:0;display:grid;grid-template-rows:40px 52px auto;row-gap:8px;transition:flex-grow .24s ease-out}
.ch-p .sg{min-width:9.5rem}
.sg::before{content:"";position:absolute;left:0;top:30px;height:18px;border-left:1px solid currentColor}
.sg:last-child::after{content:"";position:absolute;right:0;top:30px;height:18px;border-left:1px solid currentColor}
.sg-dim{position:relative;margin:0;display:flex;justify-content:center;align-items:flex-end;gap:3px;border-bottom:1px solid currentColor;padding-bottom:3px;line-height:1;white-space:nowrap}
.sg-dim::before,.sg-dim::after{content:"";position:absolute;bottom:-4.5px;width:11px;height:8px;background:currentColor}
.sg-dim::before{left:0;clip-path:polygon(0 50%,100% 0,100% 100%)}
.sg-dim::after{right:0;clip-path:polygon(100% 50%,0 0,0 100%)}
.sg-dim b{font-family:var(--num);font-stretch:87.5%;font-size:30px;font-weight:600}
.sg-dim small{font-size:13px;font-weight:500}
.sg-bar{margin:0;background:var(--ink);color:var(--yel);display:flex;align-items:center;padding:0 12px;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;min-width:0}
.sg-d{margin:0;font-size:13px;line-height:1.5;padding-right:10px}
.ch-lim{margin:10px 0 0;font-size:14px;font-weight:500}
.eq-sub{margin:22px 0 0;padding:12px 0 0;border-top:2px solid var(--ink);font-size:14px;line-height:1.7}
.eq-sub b{font-family:var(--num);font-stretch:87.5%;font-weight:600}
/* 交期：確認訂單之前是參考尺寸（括號、虛線框），之後是基準起算的鏈 */
.ch-l{margin-top:26px}
.ch-pre{flex:3 1 0;min-width:0;padding:120px 14px 0 0}
.ch-pk{font-size:13px;font-weight:500;margin:8px 0 0}
.ch-refs{display:flex;gap:2px}
.rf2{flex:var(--v) 1 0;min-width:0;height:52px;display:flex;align-items:center;justify-content:space-between;gap:6px;padding:0 10px;border:2px dashed var(--ink);font-size:13.5px;font-weight:500;white-space:nowrap}
.ch-l .ch-m{flex:var(--tot,6) 1 0;transition:flex-grow .24s ease-out;border-left:3px solid currentColor;padding-left:0}
.ch-l .ch-m::before{display:none}
.ch-l .sg{min-width:4.5rem}
.ch-dat{position:absolute;top:0;right:calc(100% + 3px);display:flex;align-items:center;gap:6px;margin:0;font-size:13.5px;font-weight:600;white-space:nowrap}
.ch-dt{width:0;height:0;border-top:7px solid transparent;border-bottom:7px solid transparent;border-left:12px solid currentColor}
.days-k{margin:6px 0 0;font-size:13px;line-height:1.55;max-width:26em}
.ch-l .ch-all{height:62px}
.ch-l .ch-v b{font-size:54px}
.ch-l .ch-m::after{top:46px}
.ch-l .ch-pre{padding-top:110px}

/* ---------- 材質與係數 ---------- */
.mat{padding:52px var(--pad) 0}
.mt-t{width:100%;margin-top:18px;border-top:3px solid var(--ink);font-size:15px}
.mt-t th,.mt-t td{text-align:left;padding:7px 14px 7px 0;vertical-align:baseline;border-bottom:1px solid var(--con-d)}
.mt-t thead th{font-size:13px;font-weight:600;padding-top:10px;line-height:1.3;vertical-align:bottom}
.mt-t thead small{display:block;font-family:var(--num);font-stretch:87.5%;font-weight:500;font-size:12.5px}
.mt-t tbody th{font-weight:500;white-space:nowrap}
.mt-c{font-family:var(--num);font-stretch:87.5%;font-size:22px;font-weight:600;margin-right:10px}
.mt-t td.tnum,.mt-t td .tnum{font-size:20px;font-weight:600}
.mt-bar{display:inline-block;vertical-align:middle;height:8px;width:calc(var(--r) * 90px);background:var(--ink);margin-left:10px}
.mt-x{font-size:14px;max-width:16em}
.mt-t tbody tr.on{background:var(--yel)}
.mt-t tbody tr.on th{box-shadow:inset 6px 0 0 var(--ink)}
.mt-t tbody tr.on th .mt-c{padding-left:16px}

/* ---------- 送圖 ---------- */
.send{padding:60px var(--pad) 64px;display:flex;gap:44px;align-items:flex-start}
.send-v{writing-mode:vertical-rl;font-size:46px;line-height:1;letter-spacing:.14em;margin:0;padding:0 20px 0 0;border-right:2px solid var(--ink)}
.send-l{flex:0 0 230px;margin-top:0;font-size:15px}
.fmt{display:grid;grid-template-columns:repeat(2,auto);gap:22px 40px;margin:6px 0 0;padding:0;flex:0 0 auto}
.fmt li{display:grid;line-height:1.3}
.fm-a{font-size:66px;font-weight:600;line-height:1;font-stretch:80%;letter-spacing:.01em}
.fm-b{font-family:var(--num);font-size:14px;margin-top:6px}
.fm-c{font-size:13.5px}
.ct{margin:6px 0 0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:28px;flex:1 1 auto;border-top:2px solid var(--ink)}
.ct div{display:grid;grid-template-columns:5.5em minmax(0,1fr);gap:10px;padding:9px 0;border-bottom:1px solid var(--con-d)}
.ct div:nth-child(3){grid-column:1/-1}
.ct dt{font-size:13px;font-weight:600}
.ct dt{padding-top:3px}
.ct dd{margin:0;display:grid}
.ct-v{font-size:19px;font-weight:600;line-height:1.35}
.ct-v a{text-decoration:none}
.ct-n{font-size:13px}

/* ---------- 頁尾 ---------- */
.foot{background:var(--gra);color:var(--line);padding:26px var(--pad) 28px;display:grid;gap:6px;font-size:13.5px}
.ft-b{display:flex;align-items:center;gap:10px;font-size:17px}
.foot .mk-d{stroke:var(--yel)}
.ft-n{color:var(--line-2)}

/* ---------- 404 ---------- */
.e404{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,560px);gap:40px;align-items:center;padding:72px var(--pad) 96px;min-height:calc(100dvh - 150px)}
.e404 .lead{margin-top:14px;font-size:16px}
.e4-l{margin-top:22px;padding:0;display:flex;gap:10px;flex-wrap:wrap}
.e4-l a{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border:2px solid var(--ink);text-decoration:none;font-weight:600}
.e4-l li:first-child a{background:var(--yel)}
.e4-f{margin:0;background:var(--gra);color:var(--line);padding:18px 18px 14px}
.e4-f svg{width:100%;height:auto;font-family:var(--num);font-stretch:87.5%}
.e4-f .ph{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:22 4 3 4 3 4}
.e4-f .dm{fill:none;stroke:var(--yel);stroke-width:1.2}
.e4-f .ah{fill:var(--yel)}
.e4-f .dt{fill:var(--yel);font-size:24px;font-weight:600}
.e4-f .cl{fill:none;stroke:var(--line-2);stroke-width:1;stroke-dasharray:16 3 2.5 3}

/* ---------- 平板：橫排放不下的兩段，收成上下堆疊／換行（第九輪 X08：768 曾溢出 170px） ----------
