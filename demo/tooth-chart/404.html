  body:has(input[name="tooth"][value="13"]:checked) .tn-13,
  body:has(input[name="tooth"][value="14"]:checked) .tn-14,
  body:has(input[name="tooth"][value="15"]:checked) .tn-15,
  body:has(input[name="tooth"][value="16"]:checked) .tn-16,
  body:has(input[name="tooth"][value="17"]:checked) .tn-17,
  body:has(input[name="tooth"][value="18"]:checked) .tn-18,
  body:has(input[name="tooth"][value="21"]:checked) .tn-21,
  body:has(input[name="tooth"][value="22"]:checked) .tn-22,
  body:has(input[name="tooth"][value="23"]:checked) .tn-23,
  body:has(input[name="tooth"][value="24"]:checked) .tn-24,
  body:has(input[name="tooth"][value="25"]:checked) .tn-25,
  body:has(input[name="tooth"][value="26"]:checked) .tn-26,
  body:has(input[name="tooth"][value="27"]:checked) .tn-27,
  body:has(input[name="tooth"][value="28"]:checked) .tn-28,
  body:has(input[name="tooth"][value="31"]:checked) .tn-31,
  body:has(input[name="tooth"][value="32"]:checked) .tn-32,
  body:has(input[name="tooth"][value="33"]:checked) .tn-33,
  body:has(input[name="tooth"][value="34"]:checked) .tn-34,
  body:has(input[name="tooth"][value="35"]:checked) .tn-35,
  body:has(input[name="tooth"][value="36"]:checked) .tn-36,
  body:has(input[name="tooth"][value="37"]:checked) .tn-37,
  body:has(input[name="tooth"][value="38"]:checked) .tn-38,
  body:has(input[name="tooth"][value="41"]:checked) .tn-41,
  body:has(input[name="tooth"][value="42"]:checked) .tn-42,
  body:has(input[name="tooth"][value="43"]:checked) .tn-43,
  body:has(input[name="tooth"][value="44"]:checked) .tn-44,
  body:has(input[name="tooth"][value="45"]:checked) .tn-45,
  body:has(input[name="tooth"][value="46"]:checked) .tn-46,
  body:has(input[name="tooth"][value="47"]:checked) .tn-47,
  body:has(input[name="tooth"][value="48"]:checked) .tn-48{display:block}
}
@supports not selector(:has(a)){
  .tn,.tb{display:block}
  .tb{border-top:1px solid var(--ink)}
}
/* 輔助動效：換牙時面板內文做 120ms 的內容換位（@starting-style；不支援的瀏覽器直接切換） */
@media (prefers-reduced-motion:no-preference){
  .tb,.tn{transition:translate .12s ease-out,opacity .12s ease-out;translate:0 0;opacity:1}
  @starting-style{.tb,.tn{translate:0 8px;opacity:.2}}
}

/* ---------- 區段共用：左欄標題 ---------- */
.sec{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:28px;padding:calc(var(--u) * 1.5) var(--gut) calc(var(--u) * 2);max-width:1440px;margin:0 auto;border-top:1px solid var(--ink)}
.sec-cap{grid-column:1/4}
.sec-cap h2{margin:0 0 6px}
.sec-cap p{font-size:15px;color:var(--ink-2);line-height:24px;margin:0;max-width:18em}
.sec-body{grid-column:4/13;min-width:0}

/* 看診時段 */
.shift{width:100%;border-top:1.5px solid var(--ink);font-size:15px;line-height:22px}
.shift th,.shift td{border-bottom:1px solid var(--grid-2);padding:10px 8px;text-align:center;vertical-align:middle}
.shift thead th{font-size:14px;letter-spacing:.08em;font-weight:500;color:var(--ink-2);padding:8px 4px;border-bottom:1px solid var(--ink)}
.shift thead th.today{color:var(--red-ink);font-weight:700}
.shift tbody th{text-align:left;font-weight:700;white-space:nowrap;padding-left:0}
.shift tbody th .mono{display:block;font-weight:400;font-size:13px;color:var(--ink-2);letter-spacing:.02em}
.shift td{position:relative;font-weight:500}
.shift .who{display:inline-block;padding:4px 10px;min-width:38px;border:1.6px solid var(--blue);border-radius:50% 46% 50% 48%/48% 50% 46% 50%;rotate:-3deg;line-height:22px;white-space:nowrap}
.shift .who b{font-weight:500}
.shift .who b+b::before{content:"・";color:var(--ink-2);font-weight:400}
.shift tr:nth-child(2n) .who{rotate:2.5deg;border-radius:46% 50% 48% 50%/50% 48% 50% 46%}
.shift td.off{color:var(--ink-2)}
.shift td.off::before{content:"";position:absolute;left:50%;top:50%;width:26px;height:1.6px;background:var(--red);translate:-50% -50%;rotate:-38deg;opacity:.75}
.shift td.off::after{content:"";position:absolute;left:50%;top:50%;width:26px;height:1.6px;background:var(--red);translate:-50% -50%;rotate:38deg;opacity:.75}
.shift td.today{background:oklch(0.9 0.05 88 / .7)}
.shift-note{display:flex;flex-wrap:wrap;gap:4px 28px;margin:12px 0 0;font-size:15px;color:var(--ink-2);line-height:22px}
.fees{margin:calc(var(--u) * 1.25) 0 0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 28px;border-top:1.5px solid var(--ink)}
.fees>div{display:grid;grid-template-columns:7em 1fr;gap:0 12px;padding:9px 0;border-bottom:1px solid var(--grid-2);font-size:14.5px;line-height:24px}
.fees dt{font-weight:700}
.fees dd{margin:0}

/* 醫師與設備 */
.sec-team .sec-cap{grid-column:1/-1;display:flex;align-items:baseline;gap:8px 28px;flex-wrap:wrap;margin-bottom:14px}
.sec-team .sec-cap h2{margin:0}
.sec-team .sec-cap p{max-width:none}
.sec-team .sec-body{grid-column:1/-1}
.team-grid{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:0 56px}
.roster{width:100%;border-top:1.5px solid var(--ink);font-size:14.5px;line-height:24px}
.roster th,.roster td{text-align:left;vertical-align:top;padding:12px 10px 12px 0;border-bottom:1px solid var(--grid-2)}
.roster thead th{font-size:12.5px;letter-spacing:.12em;color:var(--ink-2);font-weight:500;padding:6px 10px 4px 0;border-bottom:1px solid var(--ink);white-space:nowrap}
.roster tbody th{font-weight:700;white-space:nowrap;font-size:17px}
.roster tbody th small{display:block;font-size:12.5px;font-weight:400;color:var(--ink-2);letter-spacing:.06em}
.roster q{quotes:"「" "」";font-size:14px;color:var(--ink);display:block;line-height:23px}
.roster .rl{display:none}
.equip{list-style:none;margin:0;padding:0;border-top:1.5px solid var(--ink);font-size:14.5px;line-height:24px}
.equip li{display:grid;grid-template-columns:28px 1fr;gap:0 8px;padding:7px 0;border-bottom:1px solid var(--grid-2)}
.equip li::before{content:"";grid-column:1;grid-row:1;width:16px;height:16px;margin-top:4px;border:1.2px solid var(--line);background:var(--enamel)}
.equip li::after{content:"";grid-column:1;grid-row:1;width:13px;height:7px;margin:7px 0 0 3px;border-left:1.8px solid var(--blue);border-bottom:1.8px solid var(--blue);transform:rotate(-48deg) skewX(-8deg);transform-origin:left bottom}
.equip li span{grid-column:2;grid-row:1}
.equip-h{font-size:12.5px;letter-spacing:.14em;color:var(--ink-2);font-weight:500;margin:0 0 6px;line-height:22px}

/* 預約 */
.book{--bp:24px;--grid-2:var(--sheet-rule);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 36px;border:1px solid var(--line);padding:0 var(--bp) 22px;background:var(--sheet);box-shadow:5px 6px 0 var(--sheet-shadow);max-width:880px}
.book-h{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin:0 calc(-1 * var(--bp)) 8px;padding:8px var(--bp);border-bottom:1px solid var(--line);font-size:13px;letter-spacing:.16em;font-weight:600;color:var(--ink)}
.book-h span{font-weight:400;letter-spacing:.02em;color:var(--ink-2)}
.fld{display:flex;flex-direction:column;gap:2px;min-width:0}
.fld label,.fld .lab{font-size:13px;letter-spacing:.1em;font-weight:600;color:var(--ink);line-height:22px}
.fld label span,.fld .lab span{font-weight:400;color:var(--ink-2);letter-spacing:.02em;margin-left:8px}
.fld input,.fld select,.fld textarea{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);padding:5px 2px;font-size:16px;line-height:24px;color:var(--ink)}
.fld input::placeholder,.fld textarea::placeholder{color:var(--ink-2);opacity:1}
.fld textarea{border:1px solid var(--line);padding:6px 10px;background-image:repeating-linear-gradient(transparent 0 27px,var(--grid-2) 27px 28px);background-attachment:local;background-origin:content-box}
.fld select{appearance:none;-webkit-appearance:none;padding-right:34px;background-image:linear-gradient(45deg,transparent 48%,var(--ink) 48% 60%,transparent 60%),linear-gradient(-45deg,transparent 48%,var(--ink) 48% 60%,transparent 60%);background-repeat:no-repeat;background-size:9px 9px;background-position:right 14px center,right 8px center}
.fld textarea{min-height:calc(var(--u) * 3);resize:vertical;line-height:28px}
.fld input:focus-visible,.fld select:focus-visible,.fld textarea:focus-visible{outline:var(--focus-ring);outline-offset:1px}
.fld .err{display:none;margin:0;font-size:13px;color:var(--red-ink);font-weight:500;line-height:20px}
.fld:has(:user-invalid) .err,.tried .fld:has(:invalid) .err{display:block}
.fld:has(:user-invalid) input,.tried .fld:has(:invalid) input,.fld:has(:user-invalid) select,.tried .fld:has(:invalid) select{border-color:var(--red);box-shadow:inset 0 -1px 0 var(--red)}
.fld-wide{grid-column:1/-1}
.chk{display:flex;flex-wrap:wrap;gap:6px 18px;margin:2px 0 0}
.chk label{display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:400;letter-spacing:0;cursor:pointer;line-height:24px;color:var(--ink)}
.chk input{appearance:none;-webkit-appearance:none;width:18px;height:18px;margin:0;border:1.2px solid var(--line);background:var(--enamel);position:relative;flex:none;cursor:pointer}
.chk input:checked::after{content:"";position:absolute;left:3px;top:1px;width:9px;height:5px;border-left:1.8px solid var(--blue);border-bottom:1.8px solid var(--blue);transform:rotate(-48deg)}
.book-foot{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;margin-top:6px}
.book button{font:inherit;font-size:16px;font-weight:700;letter-spacing:.14em;background:var(--ink);color:var(--paper);border:0;padding:9px 26px;cursor:pointer;box-shadow:3px 3px 0 var(--red)}
.book button:hover{background:var(--line)}
.book button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--red)}
.book-foot p{margin:0;font-size:15px;color:var(--ink-2);line-height:20px;max-width:34em}
.done{grid-column:1/-1;margin:0;padding:10px 14px;border:1.5px solid var(--blue);font-size:15px;line-height:24px}

/* 診前須知 */
.pre-list{margin:0;padding:0;list-style:none;counter-reset:pc;border-top:1.5px solid var(--ink)}
.pre-list li{counter-increment:pc;display:grid;grid-template-columns:30px 22px 1fr;gap:0 10px;padding:9px 0;border-bottom:1px solid var(--grid-2);font-size:15.5px;line-height:26px}
.pre-list li::before{content:counter(pc,decimal-leading-zero);font-family:var(--mono);font-size:13px;color:var(--ink-2);line-height:26px}
.pre-list li::after{content:"";grid-column:2;grid-row:1;width:16px;height:16px;margin-top:5px;border:1.2px solid var(--line);background:var(--enamel)}
.pre-list li span{grid-column:3;grid-row:1}
.sec-cap .scope{margin:var(--u) 0 0;font-size:15px;line-height:22px;color:var(--ink);padding:12px 14px;border:1px solid var(--line);background:var(--sheet);max-width:22em;box-shadow:4px 5px 0 var(--sheet-shadow)}
.scope b{display:block;font-size:12.5px;letter-spacing:.14em;color:var(--ink-2);font-weight:500;margin-bottom:4px}
.pre .sec-body{grid-column:4/11}

/* ---------- 頁尾 ---------- */
.foot{border-top:1.5px solid var(--ink);padding:calc(var(--u) * 1) var(--gut) calc(var(--u) * 1.5);display:grid;grid-template-columns:auto 1fr auto;gap:8px 32px;align-items:baseline;font-size:13px;color:var(--ink-2);line-height:22px;max-width:1440px;margin:0 auto}
.foot p{margin:0}
.foot .brand{font-size:15px}
.foot .brand svg{width:22px;height:22px}
.foot address{font-style:normal}

/* ---------- 404 ---------- */
.e404{max-width:1100px;margin:0 auto;padding:calc(var(--u) * 1.5) var(--gut) calc(var(--u) * 3);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:var(--u) 48px;align-items:center;min-height:calc(100svh - 190px)}
.e404 h1{font-size:44px;line-height:56px}
.e404 .lead{max-width:28em}
.e404-links{display:flex;flex-wrap:wrap;gap:8px 24px;margin:0;padding:0;list-style:none;font-size:15px}
.e404-links a:first-child{font-weight:700;text-decoration:none;border-bottom:2px solid var(--red)}
.e404-fig{margin:0;border:1.5px solid var(--ink);background:var(--sheet);box-shadow:5px 6px 0 var(--sheet-shadow);background-image:linear-gradient(var(--sheet-grid) 1px, transparent 1px),linear-gradient(90deg, var(--sheet-grid) 1px, transparent 1px);background-size:var(--u) var(--u);padding:12px}
.e404-fig svg{width:100%;height:auto;display:block;overflow:visible}
.e404-fig figcaption{font-size:13px;color:var(--ink-2);margin-top:8px;line-height:20px}
.e404-fig .tf{fill:var(--enamel);stroke:var(--line);stroke-width:.3}
.e404-fig .ghost{fill:none;stroke:var(--blue);stroke-width:.4;stroke-dasharray:1.1 .8}
.e404-fig .x{stroke:var(--blue);stroke-width:.55;stroke-linecap:round}
.e404-fig .num{font-family:var(--mono);font-size:3px;fill:var(--ink);text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:var(--sheet);stroke-width:.8}
.e404-fig .num.b{fill:var(--blue-ink);font-weight:600}

/* ---------- 響應 ---------- */
@media (max-width:1100px){
  .hero{grid-template-columns:minmax(0,420px) minmax(0,1fr);column-gap:28px}
  h1{font-size:44px;line-height:54px}
  /* 欄與欄首都改成整列（1/-1）之後就不需要 12 欄：留著的話 11 道 28px 欄距（308px）會比 320 手機的內容寬（288px）還寬，整段被撐出視窗右緣 */
  .sec{grid-template-columns:minmax(0,1fr)}
  .sec-cap{grid-column:1/-1;margin-bottom:12px}
  .sec-body{grid-column:1/-1}
  .pre .sec-body{grid-column:1/-1}
  .sec-cap .scope{margin:12px 0 0}
  .team-grid{grid-template-columns:1fr}
  .equip-col{margin-top:var(--u)}
}
@media (max-width:1100px){
  .head{grid-template-columns:1fr auto;padding:10px var(--gut) 0;gap:6px 16px}
  .head-f{grid-column:1/-1;justify-content:flex-start;border-top:1px solid var(--grid-2);margin:4px calc(-1 * var(--gut)) 0;padding:2px var(--gut)}
  .head-f>div{padding:3px 14px 3px 0;border-left:0}
  .nav{justify-content:flex-end;order:0}
}
@media (max-width:900px){
  .hero{display:flex;flex-direction:column}
  .chart-col,.text-col{display:contents}
  h1{order:1}.lead{order:2}.chart-cap{order:3}.odont-f{order:4}.legend{order:5}.rec{order:6}
  .lead-cta{display:none}
  .lead{margin-bottom:12px}
  .odont-f{max-width:560px}
  .rec{margin-top:var(--u);max-width:none}
}
@media (max-width:760px){
  :root{--gut:16px}
  .odont-f{max-width:none}
  /* 抬頭欄壓成四條：品牌＋電話（一鍵撥號）／導覽／看診時段／地址，從約 226px 縮到約 150px，標題與牙位圖留在首屏 */
  .head{grid-template-columns:minmax(0,1fr) auto;padding-top:4px;gap:0 12px}
  .brand{grid-column:1;grid-row:1}
  .nav{grid-column:1/-1;grid-row:2;order:0;justify-content:flex-start;gap:0 10px;margin:0 -8px}
  .nav a{font-size:14px;padding:6px 8px}
  .head-f{display:contents}
  .head-f>div{padding:0;border:0}
  .head-f .hf-t{grid-column:2;grid-row:1;justify-self:end}
  .head-f .hf-t dt{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .head-f .hf-t dd .mono{font-size:15px}
  .head-f .hf-h,.head-f .hf-a{grid-column:1/-1;margin:0 calc(-1 * var(--gut));padding:3px var(--gut)}
  .head-f .hf-h{grid-row:3;border-top:1px solid var(--grid-2);padding-top:5px}
  .head-f .hf-a{grid-row:4;padding-bottom:7px}
  .head-f .hf-t{padding:0}
  .head-f dd{white-space:normal}
  h1{font-size:38px;line-height:46px}
  .lead{font-size:16px;line-height:27px}
  .hero{padding-top:calc(var(--u) * .5)}
  .odont-f{margin:0 calc(-1 * var(--gut) + 4px)}
  .chart-cap{line-height:20px;gap:4px 12px;margin-bottom:10px}
  .tooth .fdi{font-size:13px}
  .qlab{font-size:12.5px}
  .qlab .mono{font-size:15px}
  .rec-id{padding:10px 14px}
  .tb{padding:8px 14px 14px}
  .tx thead{display:none}
  .tx,.tx tbody,.tx tr,.tx td{display:block}
  .tx tr{padding:8px 0;border-bottom:1px solid var(--grid-2);display:grid;grid-template-columns:auto auto 1fr;gap:0 16px}
  .tx td{border:0;padding:0;width:auto}
  .tx td.w{grid-column:1/-1;grid-row:1}
  .tx td.n{padding-right:0;grid-row:2}
  .tx td.n:nth-child(2){grid-column:1}
  .tx td.n:nth-child(3){grid-column:2}
  .tx td.pc{grid-column:3;grid-row:2;justify-self:end}
  .tx td.n,.tx td.pc{margin-top:6px}
  .flow{grid-template-columns:1fr;grid-template-rows:none;grid-auto-flow:row}
  .flow li:nth-child(3)::after{display:block}
  .signs{columns:1}
  .flow li:not(:last-child)::after{width:12px;margin:0 4px}
  .shift{font-size:14px;table-layout:fixed}
  .shift thead th:first-child{width:96px}
  .shift thead th{padding:8px 0;letter-spacing:0;white-space:nowrap}
  .shift th,.shift td{padding:8px 0}
  .shift tbody th{font-size:14px}
  .shift tbody th .mono{font-size:12.5px}
  .shift td.off::before,.shift td.off::after{width:18px}
  .shift-note{display:block}
  .shift-note span{display:block}
  .fees{grid-template-columns:1fr}
  .fees>div{grid-template-columns:6em 1fr}
  .roster thead{display:none}
  .roster,.roster tbody,.roster tr,.roster th,.roster td{display:block}
  .roster tr{padding:10px 0;border-bottom:1px solid var(--grid-2)}
  .roster th,.roster td{border:0;padding:0}
  .roster tbody th{padding-bottom:2px}
  .roster .rl{display:inline;font-size:12.5px;color:var(--ink-2);letter-spacing:.08em;margin-right:8px}
  .book{--bp:14px;grid-template-columns:1fr;padding:0 var(--bp) 16px;gap:10px}
  /* 兩位醫師同診時，各自一顆圈、上下疊起來；不合併成「林陳」這種像人名的字串 */
  .shift .who{display:flex;flex-direction:column;align-items:center;gap:3px;padding:0;min-width:0;border:0;border-radius:0;rotate:0}
  .shift .who b{display:grid;place-items:center;box-sizing:border-box;width:30px;height:30px;font-size:14px;line-height:1;border:1.6px solid var(--blue);border-radius:48% 52% 50% 50%/50% 48% 52% 50%;rotate:-3deg}
  .shift tr:nth-child(2n) .who b{rotate:2.5deg}
  .shift .who b+b::before{content:none}
  .pre-list li{font-size:15px;grid-template-columns:26px 20px 1fr;gap:0 8px}
  .foot{grid-template-columns:1fr;gap:6px}
  .e404{grid-template-columns:1fr}
  .e404 h1{font-size:30px;line-height:40px}
}
/* 320 級手機：內容寬 288px，診次欄 96px 讓七個星期欄各只剩 27px，容不下 30px 的圈與「週一」兩字；診次欄收到剛好放得下時間（85px），圈縮到 26px、星期字 13px */
@media (max-width:359.98px){
  .shift thead th:first-child{width:88px}
  .shift thead th{font-size:13px}
  .shift .who b{width:26px;height:26px;font-size:13px}
}
@media print{
  :root{--paper:#fff;--paper-2:#fff;--grid:#fff;--grid-2:#fff;--ink:#000;--ink-2:#333;--line:#222;--red:#b00;--red-ink:#900;--blue:#124;--blue-ink:#124;--enamel:#fff;--red-tint:#fff;--sheet:#fff;--sheet-grid:#fff;--sheet-rule:#ddd;--sheet-shadow:transparent}
  body,html{background:#fff;color:#000}
  body,.odont,.e404-fig{background-image:none}
  .nav,.skip,.book,.legend,.rec-cta,.chart-cap .mono{display:none!important}
